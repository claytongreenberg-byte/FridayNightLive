function renderClients() {
    var html = '<div class="panel"><div class="panel-header">';
    html += '<h3>👥 CLIENTS</h3>';
    html += '<div class="panel-actions">';
    html += '<button class="hdr-btn" onclick="fnlCloudLoadClientsOnly()" data-tooltip="Load clients from cloud (merges)">📥 LOAD CLIENTS</button>';
    html += '</div></div>';
    var keys = Object.keys(S.cp);
    if (keys.length === 0) {
        html += '<p style="opacity:0.6;font-size:0.7rem;margin-top:4px;">No clients yet. Add one below.</p>';
    } else {
        keys.forEach(function(pin) {
            var client = S.cp[pin];
            var isActive = (pin === S.ap);
            // FIX: Ensures clear white text on a dark grey background
            html += '<div class="client-item" style="background:#334155;border:1px solid #475569;color:#ffffff;display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;margin-bottom:6px;' + (isActive ? 'border-color:#facc15; background:#374151;' : '') + '">';
            html += '<div style="position:relative;flex-shrink:0;">';
            if (client.logo) {
                html += '<img src="' + client.logo + '" class="client-logo" alt="' + client.n + '" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.2);">';
            } else {
                html += '<div class="client-logo" style="background:' + (isActive ? '#facc15' : '#475569') + ';display:flex;align-items:center;justify-content:center;font-weight:700;color:' + (isActive ? '#000' : '#fff') + ';font-size:1.2rem;width:32px;height:32px;border-radius:50%;">' + (client.n ? client.n[0].toUpperCase() : '?') + '</div>';
            }
            html += '<button class="sb-btn" onclick="uploadClientLogo(\'' + pin + '\')" style="position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;font-size:8px;" data-tooltip="Upload logo">📷</button>';
            html += '</div>';
            html += '<span style="font-weight:700;font-size:0.7rem;flex:1;color:#ffffff;">' + pin + '</span>';
            html += '<span style="flex:2;font-size:0.7rem;color:#ffffff;">' + (client.n || 'Unnamed') + '</span>';
            html += '<button class="hdr-btn" onclick="selectClient(\'' + pin + '\')" data-tooltip="Select this client" style="font-size:0.5rem;padding:2px 6px;' + (isActive ? 'background:#facc15;color:#000;border-color:#facc15;' : 'background:#475569;color:#fff;border-color:#64748b;') + '">' + (isActive ? '✅' : 'Select') + '</button>';
            html += '<button class="hdr-btn" onclick="editClient(\'' + pin + '\')" data-tooltip="Edit client" style="font-size:0.5rem;padding:2px 6px;background:#475569;color:#fff;">✏️</button>';
            html += '<button class="hdr-btn" style="background:#dc2626;font-size:0.5rem;padding:2px 6px;color:#fff;" onclick="deleteClient(\'' + pin + '\')" data-tooltip="Delete client">🗑️</button>';
            html += '</div>';
        });
    }
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">';
    html += '<button class="hdr-btn" onclick="addClient()" data-tooltip="Add new client">➕ Add Client</button> ';
    html += '<button class="hdr-btn" onclick="showAllPINs()" data-tooltip="Show all client PINs">🔑 Show PINs</button>';
    html += '</div></div>';
    document.getElementById('main').innerHTML = html;
}
function uploadClientLogo(pin) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        var f = input.files[0];
        if (!f || !f.type.startsWith('image/')) return toast('📷 Image required');
        var r = new FileReader();
        r.onload = function(ev) {
            if (S.cp[pin]) {
                S.cp[pin].logo = ev.target.result;
                if (S.ap === pin) updateHeaderBranding();
                saveState();
                renderClients();
                toast('✅ Client logo uploaded');
            }
        };
        r.readAsDataURL(f);
    };
    input.click();
}

function addClient() {
    var pin = prompt('Enter PIN (4-6 characters):');
    if (!pin || pin.length < 4) return toast('PIN must be at least 4 characters');
    var name = prompt('Client name:');
    if (!name) return;
    S.cp[pin.toUpperCase()] = { n: name, l: '', logo: '' };
    S.ap = pin.toUpperCase();
    saveState();
    renderClients();
    updateHeaderBranding();
    toast('✅ Client added');
}

function editClient(pin) {
    var c = S.cp[pin];
    if (!c) return;
    var name = prompt('Client name:', c.n);
    if (name) {
        c.n = name;
        if (S.ap === pin) updateHeaderBranding();
        saveState();
        renderClients();
    }
}

function deleteClient(pin) {
    if (!confirm('Delete client?')) return;
    delete S.cp[pin];
    if (S.ap === pin) { S.ap = ''; updateHeaderBranding(); }
    saveState();
    renderClients();
}

function showAllPINs() {
    var ks = Object.keys(S.cp);
    if (!ks.length) return toast('No clients');
    var msg = 'Client PINs:\n';
    ks.forEach(function(p) { msg += p + ' → ' + S.cp[p].n + '\n'; });
    alert(msg);
}

function selectClient(pin) {
    if (!S.cp[pin]) return toast('Client not found');
    S.ap = pin;
    saveState();
    updateHeaderBranding();
    renderClients();
    toast('✅ ' + S.cp[pin].n + ' is now active');
}

function updateHeaderBranding() {
    var brandContainer = document.getElementById('brandContainer');
    var brandLogo = document.getElementById('brandLogo');
    var brandSubtitle = document.getElementById('brandSubtitle');
    
    // Determine active client
    var activeClient = null;
    var activePin = S.ap;
    if (!activePin || !S.cp[activePin]) {
        var keys = Object.keys(S.cp);
        if (keys.length > 0) {
            activePin = keys[0];
            S.ap = activePin;
        }
    }
    if (activePin && S.cp[activePin]) {
        activeClient = S.cp[activePin];
    }

    // Remove old wrapper if it exists
    var existingWrap = document.getElementById('clientHeaderWrap');
    if (existingWrap) existingWrap.remove();

    // Reset brand subtitle if no client
    if (!activeClient) {
        brandSubtitle.textContent = 'PA CONSOLE';
        brandSubtitle.style.color = 'var(--accent)';
        brandLogo.style.display = 'inline-block';
        return;
    }

    // Update subtitle
    brandSubtitle.textContent = activeClient.n || 'PA CONSOLE';
    brandSubtitle.style.color = 'var(--accent)';

    // Create a dedicated wrapper right next to the logo
    var wrap = document.createElement('div');
    wrap.id = 'clientHeaderWrap';
    // Force it to be a flex item, small size, and aligned
    wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-left:10px;max-width:180px;white-space:nowrap;overflow:hidden;flex-shrink:0;';

    // Add Logo
    if (activeClient.logo) {
        var logoImg = document.createElement('img');
        logoImg.src = activeClient.logo;
        logoImg.alt = activeClient.n || 'Client';
        logoImg.style.cssText = 'width:36px !important;height:36px !important;max-width:36px !important;max-height:36px !important;object-fit:contain;border-radius:50%;border:2px solid var(--accent);background:#fff;flex-shrink:0;';
        wrap.appendChild(logoImg);
    } else {
        var initial = document.createElement('div');
        initial.textContent = activeClient.n ? activeClient.n[0].toUpperCase() : '?';
        initial.style.cssText = 'background:' + (S.colors.accent || '#facc15') + ';display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#000;width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0;';
        wrap.appendChild(initial);
    }

    // Add Client Name (White and readable)
    var nameSpan = document.createElement('span');
    nameSpan.textContent = activeClient.n || '';
    nameSpan.style.cssText = 'color:#ffffff;font-size:0.65rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;';
    wrap.appendChild(nameSpan);

    brandContainer.appendChild(wrap);
}

function renderLog() {
    var html = '<div class="panel"><div class="panel-header">';
    html += '<h3>📜 GAME LOG</h3>';
    html += '<div class="panel-actions">';
    html += '<button class="hdr-btn" onclick="fnlCloudLoadLogsOnly()" data-tooltip="Load logs from cloud (appends)">📥 LOAD LOGS</button>';
    html += '<button class="hdr-btn" onclick="clearLogs()" data-tooltip="Clear logs" style="background:#dc2626;">🗑️ Clear</button>';
    html += '</div></div>';
    var events = S.scoringLog.map(function(e) { return { ...e, type: 'score' }; }).concat(S.penaltyLog.map(function(e) { return { ...e, type: 'penalty' }; }));
    if (events.length === 0) { html += '<p style="opacity:0.6;font-size:0.75rem;">No events in current game.</p>'; } else {
        html += '<h4 style="font-size:0.7rem;margin-bottom:4px;">Current Game</h4><table style="width:100%;border-collapse:collapse;font-size:0.65rem;">';
        html += '<tr style="border-bottom:2px solid var(--border);"><th style="text-align:left;padding:3px;">Time</th><th style="text-align:left;padding:3px;">Team</th><th style="text-align:left;padding:3px;">Event</th><th style="text-align:left;padding:3px;">Details</th></tr>';
        events.sort(function(a, b) { return (b.time || 0) - (a.time || 0); });
        events.forEach(function(ev) {
            var timeStr = ev.time !== undefined ? Math.floor(ev.time/60) + ':' + String(ev.time%60).padStart(2,'0') : '--:--';
            var teamLabel = ev.team === 'home' ? 'Home' : ev.team === 'away' ? 'Away' : '';
            var desc = ev.type === 'score' ? ev.player + ' +' + ev.points : ev.type === 'note' ? '📢 ' + ev.player : ev.player || '';
            var emoji = ev.type === 'td' ? '🏈' : ev.type === 'fg' ? '🎯' : ev.type === 'twopt' ? '➕' : ev.type === 'pat' ? '🎯' : ev.type === 'safety' ? '⚡' : ev.type === 'penalty' ? '🚩' : ev.type === 'note' ? '📢' : '';
            html += '<tr style="border-bottom:1px solid var(--border);"><td style="padding:3px;">' + timeStr + '</td><td style="padding:3px;">' + teamLabel + '</td><td style="padding:3px;">' + emoji + ' ' + ev.type.toUpperCase() + '</td><td style="padding:3px;">' + desc + '</td></tr>';
        });
        html += '</table>';
    }
    if (S.gameHistory.length > 0) {
        html += '<hr style="border-color:var(--border);margin:8px 0;"><h4 style="font-size:0.7rem;margin-bottom:4px;">Game History</h4>';
        S.gameHistory.slice().reverse().forEach(function(game, idx) {
            var d = new Date(game.date).toLocaleDateString();
            var realIdx = S.gameHistory.length - 1 - idx;
            html += '<div style="padding:4px;border-bottom:1px solid var(--border);font-size:0.65rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">';
            html += '<span>' + d + ' - ' + game.away + ' vs ' + game.home + ' - ' + game.awayScore + '-' + game.homeScore;
            if (game.sessionId) html += ' <span style="opacity:0.4;font-size:0.5rem;">ID:' + game.sessionId + '</span>';
            html += '</span>';
            html += '<button class="hdr-btn" onclick="printGameLog(' + realIdx + ')" data-tooltip="Print" style="font-size:0.5rem;padding:2px 6px;">🖨️</button>';
            html += '</div>';
        });
    }
    html += '</div>';
    document.getElementById('main').innerHTML = html;
}

function clearLogs() {
    if (!confirm('Clear current game logs?')) return;
    S.scoringLog = []; S.penaltyLog = [];
    saveState();
    renderLog();
    toast('🗑️ Logs cleared');
}

function printGameLog(idx) {
    var game = S.gameHistory[idx];
    if (!game) return;
    var html = '<html><head><title>Game Log</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>';
    html += '<h2>' + game.away + ' vs ' + game.home + '</h2><p>Final Score: ' + game.awayScore + ' - ' + game.homeScore + '</p>';
    if (game.sessionId) html += '<p style="opacity:0.5;font-size:0.8rem;">Session ID: ' + game.sessionId + '</p>';
    html += '<table><tr><th>Time</th><th>Team</th><th>Event</th><th>Details</th></tr>';
    game.log.forEach(function(ev) {
        var timeStr = ev.time !== undefined ? Math.floor(ev.time/60) + ':' + String(ev.time%60).padStart(2,'0') : '--:--';
        html += '<tr><td>' + timeStr + '</td><td>' + (ev.team === 'home' ? 'Home' : ev.team === 'away' ? 'Away' : '') + '</td><td>' + ev.type.toUpperCase() + '</td><td>' + (ev.player || '') + '</td></tr>';
    });
    html += '</table></body></html>';
    safePrint(html);
}

function fnlCloudLoadLogsOnly() {
    if (!confirm('Load logs from cloud? (appends)')) return;
    fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync')
        .then(function(resp) {
            if (!resp.ok) throw new Error('Load failed');
            return resp.json();
        })
        .then(function(data) {
            if (data.scoringLog) {
                data.scoringLog.forEach(function(log) {
                    var exists = S.scoringLog.some(function(l) { return l.id === log.id; });
                    if (!exists) S.scoringLog.push(log);
                });
            }
            if (data.penaltyLog) {
                data.penaltyLog.forEach(function(log) {
                    var exists = S.penaltyLog.some(function(l) { return l.id === log.id; });
                    if (!exists) S.penaltyLog.push(log);
                });
            }
            if (data.gameHistory) {
                data.gameHistory.forEach(function(cloudGame) {
                    var exists = S.gameHistory.some(function(localGame) {
                        return localGame.date === cloudGame.date || (localGame.sessionId && localGame.sessionId === cloudGame.sessionId);
                    });
                    if (!exists) S.gameHistory.push(cloudGame);
                });
            }
            saveState();
            renderAll();
            toast('✅ Logs loaded');
        })
        .catch(function(e) {
            toast('❌ Load failed: ' + e.message);
        });
}

function saveScript() { S.script = document.getElementById('scriptEditor').innerHTML; saveState(); toast('✅ Script saved'); }
function printScript() { safePrint('<html><head><title>Script</title></head><body>' + S.script + '</body></html>'); }
function clearScript() { if (!confirm('Clear script?')) return; S.script = ''; document.getElementById('scriptEditor').innerHTML = ''; saveState(); toast('🗑️ Cleared'); }
function uploadScriptFile(input) { var f = input.files[0]; if (!f) return; if (f.name.endsWith('.docx')) { toast('⚠️ .docx not supported. Use .txt or .md'); return; } var r = new FileReader(); r.onload = function(ev) { var ed = document.getElementById('scriptEditor'); if (ed) ed.innerText = ev.target.result; toast('✅ Script uploaded'); }; r.readAsText(f); }

function printLU() {
    var html = '<html><head><title>Starting Lineups</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{border:1px solid #000;padding:4px}</style></head><body>';
    ['away','home'].forEach(function(side) {
        var t = getTeam(side);
        html += '<h2>' + (side === 'away' ? 'Away' : 'Home') + ': ' + t.name + '</h2><table><tr><th>#</th><th>Name</th><th>Pos</th></tr>';
        t.players.filter(function(p) { return p.st; }).forEach(function(p) { html += '<tr><td>' + p.n + '</td><td>' + p.na + '</td><td>' + (p.posFull || p.po) + '</td></tr>'; });
        html += '</table>';
    });
    html += '</body></html>';
    safePrint(html);
}

function updateWallClock() {
    var n = new Date();
    var h = n.getHours();
    var m = String(n.getMinutes()).padStart(2, '0');
    var s = String(n.getSeconds()).padStart(2, '0');
    var x = '';
    if (S.cf === '12h') { var a = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; x = h + ':' + m + (S.cs ? ':' + s : '') + ' ' + a; }
    else { h = String(h).padStart(2, '0'); x = h + ':' + m + (S.cs ? ':' + s : ''); }
    var el = document.getElementById('wallClock');
    if (el) el.textContent = x;
}
setInterval(updateWallClock, 1000);

    fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph')
        .then(function(r) { return r.json(); })

        })
        .catch(function() {});
}

document.addEventListener('keydown', function(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable;
    if (e.code === 'Space' && !typing) {
        e.preventDefault();
        if (S.gc.run) pauseGC();
        else startGC();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && !typing) {
        e.preventDefault();
        if (S.v === 'roster') {
            saveTeam();
        } else {
            fnlCloudSaveAll();
        }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) {
        e.preventDefault();
        if (S.v === 'roster') {
            rosterUndo();
        } else {
            undoLastEvent();
        }
    }
});

            toast('⏰ Clock expired!'); 
            setLastEvent('⏰ Clock expired', 'info');

}, 1000);
