<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – PA Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #facc15;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --green: #2d6a1e;
        }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: linear-gradient(180deg, #2d6a1e, #1f4d14);
            padding: 8px 12px;
            border-bottom: 3px solid var(--accent);
            flex-shrink: 0;
        }
        .hdr-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hdr-top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo {
            height: 40px;
            width: auto;
            max-width: 100px;
            object-fit: contain;
        }
        .brand-text h1 {
            font-size: 1.2rem;
            color: #fff;
        }
        .brand-text p {
            font-size: 0.7rem;
            color: var(--accent);
        }
        .hdr-top-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .wall-clock, .weather-pill {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 4px 10px;
        }
        .hdr-btn {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .hdr-btn:hover {
            background: #475569;
        }
        .scorebug {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #0f172a;
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 10px 15px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .sb-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
        }
        .sb-abbr {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 4px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sb-logo-sm {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .sb-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sb-val {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            min-width: 35px;
            text-align: center;
        }
        .sb-qtr {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
        }
        .game-clock {
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }
        .sb-btn {
            background: #334155;
            border: 1px solid #475569;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .sb-btn:hover {
            background: var(--accent);
            color: #000;
        }
        .sb-game-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sb-game-btns button {
            background: #334155;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 15px;
            padding: 4px 10px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .sb-game-btns button:hover {
            background: var(--accent);
            color: #000;
        }
        nav {
            background: #1a1a1a;
            display: flex;
            gap: 4px;
            padding: 0 10px;
            flex-shrink: 0;
        }
        .nav-link {
            background: none;
            border: none;
            color: #ccc;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .nav-link.active {
            background: var(--accent);
            color: #000;
            border-radius: 6px 6px 0 0;
        }
        main {
            flex: 1;
            overflow: auto;
            padding: 10px;
        }
        .game-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .game-controls button {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 18px;
            padding: 8px 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .game-controls button.active {
            background: var(--accent);
            color: #000;
        }
        .game-controls button.td { background: #dc2626; }
        .game-controls button.fg { background: #2563eb; }
        .game-controls button.pat { background: #16a34a; }
        .game-controls button.safety { background: #f59e0b; color: #000; }
        .game-controls button.flag-btn { background: var(--accent); color: #000; border-color: var(--accent); }
        .game-controls button.first-down { background: #22c55e; }
        .team-cards {
            display: flex;
            gap: 10px;
            height: calc(100% - 60px);
        }
        .team-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-head {
            padding: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }
        .card-head select {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            background: #fff;
            color: #000;
            font-size: 0.9rem;
        }
        .unit-tabs {
            display: flex;
            gap: 4px;
            padding: 5px 10px;
            border-bottom: 1px solid var(--border);
        }
        .unit-tab {
            background: none;
            border: none;
            color: #ccc;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: 700;
        }
        .unit-tab.active {
            background: var(--accent);
            color: #000;
            border-radius: 5px;
        }
        .player-list-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .player-row {
            display: grid;
            grid-template-columns: 35px 1fr 70px 35px 35px 30px;
            gap: 8px;
            align-items: center;
            padding: 6px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .player-row input, .player-row select {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            padding: 4px;
            width: 100%;
            font-size: 0.85rem;
        }
        .player-row input:focus, .player-row select:focus {
            border-color: var(--accent);
            outline: none;
        }
        .player-row.starter {
            background: rgba(251,191,36,0.2);
            border-left: 3px solid var(--accent);
        }
        .st-toggle, .pin-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .st-toggle.active {
            background: var(--accent);
            color: #000;
        }
        footer {
            background: #1a1a1a;
            padding: 6px 12px;
            text-align: center;
            font-size: 0.65rem;
            flex-shrink: 0;
            border-top: 1px solid var(--accent);
        }
        .tooltip-js {
            position: fixed;
            z-index: 10000;
            background: #1e293b;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            pointer-events: none;
            display: none;
            max-width: 200px;
            border: 1px solid #475569;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
    </style>
</head>
<body>
<div class="tooltip-js" id="tooltip"></div>

<header>
    <div class="hdr-top">
        <div class="hdr-top-left">
            <img src="FNL.jpg" alt="FNL" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>🏈 FRIDAY NIGHT LIVE</h1>
                <p>PA CONSOLE</p>
            </div>
        </div>
        <div class="hdr-top-right">
            <span class="wall-clock" id="wallClock">12:00 AM</span>
            <span class="weather-pill" id="weatherHeader">--°F</span>
            <button class="hdr-btn" onclick="fnlCloudSaveAll()">💾 SAVE</button>
            <button class="hdr-btn" onclick="fnlCloudLoadAll()">📥 LOAD</button>
            <button class="hdr-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
            <button class="hdr-btn" onclick="toggleOutdoor()">🌤</button>
            <button class="hdr-btn" onclick="printLU()">🖨️</button>
            <button class="hdr-btn" id="resetBtn" onclick="resetGame()" style="background:#dc2626;">RESET</button>
            <button class="hdr-btn" onclick="logoutAndShowPIN()">🔓</button>
        </div>
    </div>
    <div class="scorebug" id="scorebug">
        <div class="sb-block">
            <span class="sb-abbr" id="sbAwayAbbr">AWAY</span>
            <div class="sb-row">
                <button class="sb-btn" onclick="chScore('away',-1)">−</button>
                <span class="sb-val" id="sbAwayScore">0</span>
                <button class="sb-btn" onclick="chScore('away',1)">+</button>
            </div>
        </div>
        <div class="sb-block">
            <span class="sb-abbr">QUARTER</span>
            <span class="sb-qtr" id="sbQuarter">Q1</span>
            <div class="sb-row">
                <button class="sb-btn" onclick="chQuarter(-1)">◀</button>
                <button class="sb-btn" onclick="chQuarter(1)">▶</button>
            </div>
        </div>
        <div class="sb-block">
            <span class="sb-abbr" id="sbHomeAbbr">HOME</span>
            <div class="sb-row">
                <button class="sb-btn" onclick="chScore('home',-1)">−</button>
                <span class="sb-val" id="sbHomeScore">0</span>
                <button class="sb-btn" onclick="chScore('home',1)">+</button>
            </div>
        </div>
        <div class="sb-block">
            <span class="sb-abbr">CLOCK</span>
            <span class="game-clock" id="gameClockDisplay">8:00</span>
            <div class="sb-row">
                <button class="sb-btn" onclick="startGC()">▶</button>
                <button class="sb-btn" onclick="pauseGC()">⏸</button>
                <button class="sb-btn" onclick="resetGC()">↺</button>
            </div>
        </div>
        <div class="sb-block">
            <span class="sb-abbr">GAME</span>
            <div class="sb-game-btns">
                <button onclick="startGame()">▶ Start</button>
                <button onclick="setHalftime()">⏸ Half</button>
                <button onclick="startSecondHalf()">⏭ 2nd</button>
                <button onclick="setOvertime()">⏱ OT</button>
                <button onclick="endGame()">🏁 Final</button>
            </div>
        </div>
    </div>
</header>

<nav id="mainNav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<footer>
    © 2026 Clayton E. Greenberg | <a href="https://voiceofdfw.com" style="color:#ef4444;">VoiceofDFW.com</a> | 🏈 Digital Pressbox Command Center 🏈
</footer>

<script>
// Full state
let S = {
    v: 'sport',
    md: 'dark',
    outdoor: false,
    as: 0,
    hs: 0,
    q: 1,
    down: 1,
    dist: 10,
    poss: 'home',
    gameState: 'READY',
    gc: { rem: 480, run: false },
    teams: [
        { id: 'h', name: 'Texas Hawks', color: '#1e3a5f', logo: '', players: [
            { id: 'h1', n: '7', na: 'Marcus Johnson', po: 'QB', st: true, nt: '', pinned: false },
            { id: 'h2', n: '55', na: 'Chris Williams', po: 'Center', st: true, nt: '', pinned: false },
            { id: 'h3', n: '11', na: 'Jalen Smith', po: 'WR', st: true, nt: '', pinned: false },
            { id: 'h4', n: '88', na: 'Ty Washington', po: 'WR', st: true, nt: '', pinned: false },
            { id: 'h5', n: '15', na: 'Jordan Davis', po: 'WR', st: true, nt: '', pinned: false }
        ]},
        { id: 's', name: 'Dallas Cowboys', color: '#7f1d1d', logo: '', players: [
            { id: 's1', n: '12', na: 'Caleb White', po: 'QB', st: true, nt: '', pinned: false },
            { id: 's2', n: '72', na: 'Mason Lee', po: 'Center', st: true, nt: '', pinned: false },
            { id: 's3', n: '1', na: 'Adrian Flores', po: 'WR', st: true, nt: '', pinned: false },
            { id: 's4', n: '5', na: 'Xavier Reed', po: 'WR', st: true, nt: '', pinned: false },
            { id: 's5', n: '18', na: 'Karter Hill', po: 'WR', st: true, nt: '', pinned: false }
        ]}
    ],
    scoringLog: [],
    penaltyLog: [],
    gameHistory: [],
    script: '',
    cp: {},
    ap: ''
};

function g() { return S; }
function toast(m) { 
    const x = document.getElementById('toast'); 
    x.textContent = m; 
    x.classList.add('show'); 
    setTimeout(() => x.classList.remove('show'), 2000); 
}
function saveState() { 
    localStorage.setItem('fnl_v21', JSON.stringify(S)); 
}
function loadState() {
    const raw = localStorage.getItem('fnl_v21');
    if (raw) {
        try { S = { ...S, ...JSON.parse(raw) }; } catch(e) {}
    }
}
function getTeam(side) { return side === 'away' ? S.teams[0] : S.teams[1]; }

// Tooltips
const tooltipEl = document.getElementById('tooltip');
document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-tooltip]');
    if (t) {
        tooltipEl.textContent = t.getAttribute('data-tooltip');
        tooltipEl.style.display = 'block';
        tooltipEl.style.left = (e.clientX + 15) + 'px';
        tooltipEl.style.top = (e.clientY + 15) + 'px';
    }
});
document.addEventListener('mousemove', e => {
    if (tooltipEl.style.display === 'block') {
        tooltipEl.style.left = (e.clientX + 15) + 'px';
        tooltipEl.style.top = (e.clientY + 15) + 'px';
    }
});
document.addEventListener('mouseout', () => { tooltipEl.style.display = 'none'; });

// Theme
function toggleTheme() {
    S.md = S.md === 'dark' ? 'light' : 'dark';
    if (S.md === 'dark') {
        document.documentElement.style.setProperty('--bg', '#0f172a');
        document.documentElement.style.setProperty('--surface', '#1e293b');
        document.documentElement.style.setProperty('--text', '#f1f5f9');
    } else {
        document.documentElement.style.setProperty('--bg', '#f1f5f9');
        document.documentElement.style.setProperty('--surface', '#e2e8f0');
        document.documentElement.style.setProperty('--text', '#0f172a');
    }
    document.getElementById('themeBtn').textContent = S.md === 'dark' ? '☀️ Light' : '🌙 Dark';
    saveState();
    renderAll();
}
function toggleOutdoor() {
    S.outdoor = !S.outdoor;
    document.body.style.fontSize = S.outdoor ? '18px' : '16px';
    toast(S.outdoor ? 'Outdoor ON' : 'Outdoor OFF');
    saveState();
}

// Clock
function updateWallClock() {
    const n = new Date();
    let h = n.getHours();
    const m = String(n.getMinutes()).padStart(2, '0');
    const s = String(n.getSeconds()).padStart(2, '0');
    const a = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('wallClock').textContent = `${h}:${m}:${s} ${a}`;
}
setInterval(updateWallClock, 1000);
updateWallClock();

// Weather
function updateWeather() {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph')
        .then(r => r.json())
        .then(d => {
            if (d.current) {
                document.getElementById('weatherHeader').textContent = `🌤 ${Math.round(d.current.temperature_2m)}°F | 💨 ${Math.round(d.current.wind_speed_10m)}mph`;
            }
        })
        .catch(() => {});
}
updateWeather();

// Scorebug
function chScore(side, delta) {
    if (side === 'away') S.as = Math.max(0, S.as + delta);
    else S.hs = Math.max(0, S.hs + delta);
    updateScorebug();
    saveState();
}
function chQuarter(delta) {
    S.q = Math.min(4, Math.max(1, S.q + delta));
    if (S.q <= 2) S.gameState = 'FIRST_HALF';
    else if (S.q <= 4) S.gameState = 'SECOND_HALF';
    updateScorebug();
    saveState();
}
function updateScorebug() {
    document.getElementById('sbAwayAbbr').textContent = S.teams[0].name;
    document.getElementById('sbHomeAbbr').textContent = S.teams[1].name;
    document.getElementById('sbAwayScore').textContent = S.as;
    document.getElementById('sbHomeScore').textContent = S.hs;
    document.getElementById('sbQuarter').textContent = `Q${S.q}`;
}
function updateGameClockDisplay() {
    const m = Math.floor(S.gc.rem / 60);
    const s = S.gc.rem % 60;
    document.getElementById('gameClockDisplay').textContent = `${m}:${String(s).padStart(2, '0')}`;
}
setInterval(() => {
    if (S.gc.run && S.gc.rem > 0) {
        S.gc.rem--;
        updateGameClockDisplay();
        if (S.gc.rem === 0) {
            S.gc.run = false;
            toast('Clock expired!');
        }
    }
}, 1000);

// Game state
function startGame() {
    if (S.gameState !== 'READY' && !confirm('Game already started. Reset?')) return;
    S.gameState = 'FIRST_HALF';
    S.gc.rem = 480;
    S.gc.run = false;
    S.q = 1;
    S.as = 0;
    S.hs = 0;
    S.scoringLog = [];
    S.penaltyLog = [];
    updateScorebug();
    updateGameClockDisplay();
    saveState();
    toast('🏈 Game started!');
}
function setHalftime() {
    S.gameState = 'HALFTIME';
    S.gc.run = false;
    saveState();
    toast('⏸️ Halftime');
}
function startSecondHalf() {
    S.gameState = 'SECOND_HALF';
    S.gc.rem = 480;
    S.gc.run = false;
    S.q = 3;
    updateScorebug();
    updateGameClockDisplay();
    saveState();
    toast('⏭️ 2nd Half started');
}
function setOvertime() {
    S.gameState = 'OVERTIME';
    S.gc.rem = 360;
    S.gc.run = false;
    S.q = 5;
    updateScorebug();
    updateGameClockDisplay();
    saveState();
    toast('⏱️ Overtime');
}
function endGame() {
    if (!confirm('End game?')) return;
    S.gameState = 'FINAL';
    S.gc.run = false;
    S.gameHistory.push({
        date: new Date().toISOString(),
        away: S.teams[0].name,
        home: S.teams[1].name,
        awayScore: S.as,
        homeScore: S.hs,
        log: [...S.scoringLog, ...S.penaltyLog]
    });
    saveState();
    toast('🏁 Game ended');
}
function startGC() { S.gc.run = true; saveState(); }
function pauseGC() { S.gc.run = false; saveState(); }
function resetGC() { S.gc.run = false; S.gc.rem = 480; updateGameClockDisplay(); saveState(); }
function resetGame() {
    if (confirm('Reset game?')) {
        S.as = 0; S.hs = 0; S.q = 1;
        S.gameState = 'READY';
        S.gc.rem = 480;
        S.gc.run = false;
        updateScorebug();
        updateGameClockDisplay();
        saveState();
        toast('Game reset');
    }
}

// Game controls
function setPossession(side) {
    S.poss = side;
    renderGame();
    saveState();
}
function firstDown() {
    S.down = 1;
    S.dist = 10;
    renderGame();
    toast('1st & 10');
}
function setDown(v) { S.down = parseInt(v) || 1; saveState(); }
function setDist(v) { S.dist = parseInt(v) || 1; saveState(); }
function quickScore(type) {
    if (S.gameState === 'FINAL') { toast('Game is final'); return; }
    let pts = 0;
    if (type === 'td') pts = 6;
    else if (type === 'fg') pts = 3;
    else if (type === 'pat') pts = 1;
    else if (type === 'safety') pts = 2;
    if (S.poss === 'home') S.hs += pts;
    else S.as += pts;
    S.scoringLog.push({ type, team: S.poss, points: pts, time: S.gc.rem, quarter: S.q });
    updateScorebug();
    saveState();
    toast(`${type.toUpperCase()} +${pts}`);
}
function quickPenalty() {
    if (S.gameState === 'FINAL') { toast('Game is final'); return; }
    S.penaltyLog.push({ type: 'flag', team: S.poss, time: S.gc.rem, quarter: S.q });
    saveState();
    toast('🚩 Penalty');
}

// Navigation
function renderNav() {
    const views = [
        { id: 'sport', label: '🏈 GAME' },
        { id: 'roster', label: '📋 ROSTERS' },
        { id: 'log', label: '📜 LOG' },
        { id: 'script', label: '🎙️ SCRIPT' }
    ];
    let html = '';
    views.forEach(v => {
        html += `<button class="nav-link ${S.v === v.id ? 'active' : ''}" onclick="switchView('${v.id}')">${v.label}</button>`;
    });
    document.getElementById('mainNav').innerHTML = html;
}
function switchView(v) {
    S.v = v;
    renderNav();
    renderView();
}
function renderView() {
    if (S.v === 'roster') renderRoster();
    else if (S.v === 'log') renderLog();
    else if (S.v === 'script') renderScript();
    else renderGame();
}

function toggleStarter(side, pid) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (p) { p.st = !p.st; saveState(); renderGame(); }
}
function togglePin(side, pid) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (p) { p.pinned = !p.pinned; saveState(); renderGame(); }
}
function deletePlayer(side, pid) {
    const team = getTeam(side);
    team.players = team.players.filter(x => x.id !== pid);
    saveState();
    renderGame();
}
