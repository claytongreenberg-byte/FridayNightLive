<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – Football PA Console</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial, sans-serif; background:#0f172a; color:#fff; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        header { background:#2d6a1e; padding:8px 12px; display:flex; flex-direction:column; gap:8px; border-bottom:3px solid #facc15; flex-shrink:0; }
        .hdr-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
        .hdr-top-left { display:flex; align-items:center; gap:10px; }
        .brand-logo { height:40px !important; width:auto !important; max-width:80px; object-fit:contain; }
        .brand-text h1 { font-size:1.2rem; color:#fff; }
        .brand-text p { font-size:0.7rem; color:#facc15; }
        .hdr-top-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .hdr-btn { background:#334155; color:#fff; border:1px solid #475569; border-radius:20px; padding:6px 12px; font-size:0.7rem; cursor:pointer; }
        .scorebug { display:flex; align-items:center; gap:10px; background:#0f172a; border:2px solid #facc15; border-radius:12px; padding:8px 16px; flex-wrap:wrap; justify-content:center; }
        .sb-block { display:flex; flex-direction:column; align-items:center; padding:0 10px; }
        .sb-abbr { font-size:14px; font-weight:800; color:#facc15; margin-bottom:4px; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sb-row { display:flex; align-items:center; gap:6px; }
        .sb-val { font-size:1.8rem; font-weight:900; color:#fff; }
        .sb-qtr { font-size:1.2rem; font-weight:800; color:#facc15; }
        .game-clock { font-family:monospace; font-size:1.2rem; font-weight:800; color:#fff; }
        button { cursor:pointer; }
        nav { background:#1a1a1a; display:flex; gap:4px; padding:0 10px; flex-shrink:0; }
        .nav-link { background:none; border:none; color:#ccc; padding:8px 16px; font-weight:600; }
        .nav-link.active { background:#facc15; color:#000; }
        main { flex:1; overflow:auto; padding:8px; }
        footer { background:#0f172a; color:#fff; padding:4px 12px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #facc15; font-size:0.6rem; flex-shrink:0; }
        .game-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:8px 12px; margin-bottom:8px; }
        .team-cards { display:flex; gap:4px; }
        .team-card { flex:1; background:#1e293b; border:1px solid #334155; border-radius:8px; display:flex; flex-direction:column; overflow:hidden; }
        .card-head { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#1e3a5f; color:#fff; font-weight:700; }
        .card-head select { flex:1; font-size:1rem; padding:4px 8px; border-radius:4px; background:#fff; color:#000; }
        .unit-tabs { display:flex; gap:4px; padding:4px 10px; }
        .unit-tab { background:none; border:none; color:#fff; opacity:0.7; padding:4px 10px; font-weight:700; }
        .unit-tab.active { opacity:1; background:#facc15; color:#000; border-radius:6px; }
        .player-list-body { flex:1; overflow-y:auto; }
        .player-row, .player-list-header { display:grid; grid-template-columns:30px 40px 1fr 80px 60px 35px 35px 30px; gap:4px; align-items:center; padding:4px 10px; }
        .player-list-header { font-size:0.6rem; text-transform:uppercase; opacity:0.6; border-bottom:1px solid #334155; }
        .player-row { border-bottom:1px solid #334155; min-height:36px; }
        .tooltip-js { position:fixed; z-index:10000; background:#1e293b; color:#fff; padding:6px 12px; border-radius:6px; font-size:0.8rem; pointer-events:none; display:none; }
        .pin-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 20px; border-radius:20px; z-index:9999; }
    </style>
</head>
<body>
<div class="tooltip-js" id="tooltip"></div>
<header>
    <div class="hdr-top">
        <div class="hdr-top-left">
            <img src="FNL.jpg" alt="FNL" class="brand-logo" style="height:40px; width:auto; object-fit:contain;" onerror="this.style.display='none'">
            <div class="brand-text"><h1>🏈 FRIDAY NIGHT LIVE</h1><p>PA CONSOLE</p></div>
        </div>
        <div class="hdr-top-right">
            <div id="wallClock" style="color:#facc15;font-weight:700;">12:00 AM</div>

    </div>
    <div class="scorebug" id="scorebug">
        <div class="sb-block">
            <span class="sb-abbr" id="sbAwayAbbr">AWAY</span>
            <div class="sb-row">
                <button onclick="chScore('away',-1)">−</button>
                <span class="sb-val" id="sbAwayScore">0</span>
                <button onclick="chScore('away',1)">+</button>
            </div>
            <button onclick="uploadScorebugLogo('away')" style="width:24px;height:24px;">📷</button>
        </div>
        <div class="sb-block">
            <span class="sb-abbr" id="sbHomeAbbr">HOME</span>
            <div class="sb-row">
                <button onclick="chScore('home',-1)">−</button>
                <span class="sb-val" id="sbHomeScore">0</span>
                <button onclick="chScore('home',1)">+</button>
            </div>
            <button onclick="uploadScorebugLogo('home')" style="width:24px;height:24px;">📷</button>
        </div>
        <div class="sb-block">
            <span class="sb-abbr" id="sbQLabel">QTR</span>
            <span class="sb-qtr" id="sbQuarter">Q1</span>
            <div class="sb-row">
                <button onclick="chQuarter(-1)">◀</button>
                <button onclick="chQuarter(1)">▶</button>
            </div>
        </div>
        <div class="sb-block">
            <span class="sb-abbr">GAME</span>
            <div>
                <button onclick="startGame()">▶ Start</button>
                <button onclick="startSecondHalf()">⏭ 2nd</button>
                <button onclick="setHalftime()">⏸ Half</button>
                <button onclick="setOvertime()">⏱ OT</button>
                <button onclick="endGame()">🏁 Final</button>
            </div>
        </div>
        <div class="sb-block">
            <span class="sb-abbr">CLOCK</span>
            <span class="game-clock" id="gameClockDisplay">--:--</span>
            <div>
                <button onclick="setGC()">⏳</button>
                <button onclick="startGC()">▶</button>
                <button onclick="pauseGC()">⏸</button>
                <button onclick="resetGC()">↺</button>
            </div>
        </div>
    </div>
</header>
<nav id="mainNav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<footer>
    <div>© 2026 Clayton E. Greenberg | <a href="https://voiceofdfw.com" style="color:#ef4444;">VoiceofDFW.com</a></div>
    <div><span id="ftTicker">v22.0</span> · <span id="ftSaved">Never saved</span></div>
</footer>

<script>
// ─── FULL SCRIPT (same as before but with added logo constraint) ───
"use strict";
const CLOUD = "https://lineup-api.claytongreenberg.workers.dev/api/lineup";
const FNL_NS = "fnl_";
const TACKLE = {
    off: ['QB','RB','FB','WR','TE','OL','C','G','T'],
    def: ['DL','DE','DT','LB','OLB','ILB','CB','S','SS','FS','DB'],
    st: ['K','P','LS','KR','PR']
};
const D7 = ['QB','Center','WR','WR','WR','DB','DB'];

function makePlayer(id,n,na,po,st,nt,ph,pron,pinned) {
    return { id: id || 'p' + Date.now() + Math.random().toString(36).slice(2,5), n: n || '', na: na || 'Player', po: po || 'QB', st: !!st, nt: nt || '', ph: ph || '', pron: pron || '', pinned: !!pinned };
}
function makeTeam(id,name,color,logo,mascot,coach,players) {
    return { id: id || 't' + Date.now().toString(36), name: name || 'Team', color: color || '#1e3a5f', c2: '#fff', logo: logo || '', mascot: mascot || '', coach: coach || '', pl: players || [] };
}
function dummyTeams() {
    return [
        makeTeam('h','Texas Hawks','#1e3a5f','','Hawks','',[
            makePlayer('h1','7','Marcus Johnson','QB',true,"6'2\" Sr",'','',false),
            makePlayer('h2','55','Chris Williams','Center',true,"6'0\" Jr",'','',false),
            makePlayer('h3','11','Jalen Smith','WR',true,"5'11\" Sr",'','',false),
            makePlayer('h4','88','Ty Washington','WR',true,"6'1\" So",'','',false),
            makePlayer('h5','15','Jordan Davis','WR',true,"5'10\" Jr",'','',false),
            makePlayer('h6','21','Noah Brown','DB',true,"6'0\" Sr",'','',false),
            makePlayer('h7','33','Elijah Jones','DB',true,"5'9\" Jr",'','',false),
            makePlayer('h8','44','Isaiah Taylor','LB',false,"6'0\" So",'','',false)
        ]),
        makeTeam('s','Dallas Cowboys','#7f1d1d','','Cowboys','',[
            makePlayer('s1','12','Caleb White','QB',true,"6'3\" Sr",'','',false),
            makePlayer('s2','72','Mason Lee','Center',true,"6'1\" Jr",'','',false),
            makePlayer('s3','1','Adrian Flores','WR',true,"5'10\" Sr",'','',false),
            makePlayer('s4','5','Xavier Reed','WR',true,"6'0\" Jr",'','',false),
            makePlayer('s5','18','Karter Hill','WR',true,"6'2\" So",'','',false),
            makePlayer('s6','23','Malik Green','DB',true,"5'11\" Sr",'','',false),
            makePlayer('s7','27','Tyler Wright','DB',true,"6'0\" Jr",'','',false),
            makePlayer('s8','9','Brayden Scott','LB',false,"5'9\" Fr",'','',false)
        ])
    ];
}
function defGS() {
    const teams = dummyTeams();
    return {
        aid: 'h', hid: 's', as: 0, hs: 0, q: 1, md: 'tackle',
        gameState: 'READY', down: 1, dist: 10, poss: 'home',
        scoringLog: [], penaltyLog: [], playerStats: {},
        tms: teams, cid: 'h', sc: '', gc: { rem: 480, run: false },
        us: [], rs: [], sb: true, gameHistory: []
    };
}
let S = {
    v: 'sport', at: 'branding', md: 'dark', ua: 'all', uh: 'all',
    br: { t: 'FRIDAY NIGHT LIVE', st: 'PA CONSOLE', cl: '', cn: '', wlat: '', wlon: '', wgps: true },
    fn: "'Inter',sans-serif", cf: '12h', cs: true,
    sp: { fb: defGS() }, cp: {}, wd: null, lw: 0, ap: '', im: true, outdoor: false,
    colors: {
        scorebugBg: '#0f172a', scorebugText: '#ffffff',
        teamCardBgAway: '#1e293b', teamCardBgHome: '#1e293b',
        teamNameColorAway: '#ffffff', teamNameColorHome: '#ffffff'
    }
};
function g() { return S.sp.fb; }
const K = 'fnl_v21';

function toast(m) { const x = document.getElementById('toast'); x.textContent = m; x.style.opacity = 1; setTimeout(() => x.style.opacity = 0, 2000); }
function esc(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 6); }

// ─── TOOLTIP SYSTEM ───
const tooltipEl = document.getElementById('tooltip');
document.addEventListener('mouseover', e => {
    const target = e.target.closest('[data-tooltip]');
    if (target) {
        tooltipEl.textContent = target.getAttribute('data-tooltip');
        tooltipEl.style.display = 'block';
        positionTooltip(e.clientX, e.clientY);
    }
});
document.addEventListener('mousemove', e => {
    if (tooltipEl.style.display === 'block') positionTooltip(e.clientX, e.clientY);
});
document.addEventListener('mouseout', e => {
    if (!e.target.closest('[data-tooltip]')) tooltipEl.style.display = 'none';
});
document.addEventListener('click', e => {
    const target = e.target.closest('[data-tooltip]');
    if (target) {
        tooltipEl.textContent = target.getAttribute('data-tooltip');
        tooltipEl.style.display = 'block';
        positionTooltip(e.clientX, e.clientY);
        setTimeout(() => tooltipEl.style.display = 'none', 2000);
    } else {
        tooltipEl.style.display = 'none';
    }
});
function positionTooltip(x, y) {
    tooltipEl.style.left = (x + 15) + 'px';
    tooltipEl.style.top = (y + 15) + 'px';
    const rect = tooltipEl.getBoundingClientRect();
    if (rect.right > window.innerWidth) tooltipEl.style.left = (x - rect.width - 15) + 'px';
    if (rect.bottom > window.innerHeight) tooltipEl.style.top = (y - rect.height - 15) + 'px';
}

// ─── THEME ───
function applyTheme() {
    document.body.classList.remove('light-mode', 'dark-mode', 'seven-mode', 'outdoor-mode');
    if (S.md === 'light') document.body.style.background = '#f1f5f9';
    else document.body.style.background = '#0f172a';
    document.getElementById('themeBtn').innerHTML = S.md === 'dark' ? '🌙 Dark' : '☀️ Light';
    saveState();
}
function toggleTheme() { S.md = (S.md === 'dark' ? 'light' : 'dark'); applyTheme(); toast('Theme: ' + S.md); }
function toggleOutdoor() { S.outdoor = !S.outdoor; applyTheme(); toast(S.outdoor ? 'Outdoor ON' : 'Outdoor OFF'); }
function toggleScorebugDisplay() {
    const sb = document.getElementById('scorebug');
    if (sb) { sb.style.display = sb.style.display === 'none' ? 'flex' : 'none'; g().sb = sb.style.display !== 'none'; saveState(); }
}

// ─── CLOCK ───
function updateWallClock() {
    const n = new Date(); let h = n.getHours(); const m = String(n.getMinutes()).padStart(2,'0'), s = String(n.getSeconds()).padStart(2,'0');
    let x = '';
    if (S.cf === '12h') { const a = h>=12?'PM':'AM'; h = h%12||12; x = `${h}:${m}`; if(S.cs)x+=`:${s}`; x+=` ${a}`; }
    else { h = String(h).padStart(2,'0'); x = `${h}:${m}`; if(S.cs)x+=`:${s}`; }
    document.getElementById('wallClock').textContent = x;
}
setInterval(updateWallClock,1000); updateWallClock();
function setGameClockMinutes(){ const m = parseInt(prompt('Minutes:','8')); if(isNaN(m)||m<1)return; g().gc.rem = m*60; updateGameClockDisplay(); saveState(); }
function startGameClock(){ g().gc.run = true; saveState(); }
function pauseGameClock(){ g().gc.run = false; saveState(); }
function resetGameClock(){ g().gc.run = false; g().gc.rem = 480; updateGameClockDisplay(); saveState(); }
function updateGameClockDisplay(){
    const r = g().gc.rem||0; const m = Math.floor(r/60), s = r%60;
    const el = document.getElementById('gameClockDisplay');
    if(el){ el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
}
setInterval(()=>{ const gc = g().gc; if(gc.run && gc.rem>0){ gc.rem--; updateGameClockDisplay(); if(gc.rem===0){ gc.run=false; toast('Clock expired!'); } if(gc.rem%5===0)saveState(); } },1000);

// ─── WEATHER ───
function getWeatherEmoji(c){ if(c<=0)return'☀️'; if(c<=3)return'⛅'; if(c<=48)return'🌫️'; if(c<=57)return'🌧️'; if(c<=67)return'🌨️'; if(c<=77)return'❄️'; if(c<=82)return'🌧️'; if(c<=86)return'🌨️'; return'🌩️'; }
async function fetchWeather(lat,lon,loc,fallback){
    try{
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph`);
        const d = await r.json();
        if(d.current){ S.wd = {...d.current, location: loc||'Custom', fallback:!!fallback}; S.lw = Date.now(); updateWeatherDisplay(); saveState(); }
    }catch(e){}
}
function updateWeatherDisplay(){
    const el = document.getElementById('weatherHeader'); if(!el)return;
    if(S.wd){
        const temp = Math.round(S.wd.temperature_2m), wind = Math.round(S.wd.wind_speed_10m), hum = S.wd.relative_humidity_2m;
        const icon = getWeatherEmoji(S.wd.weather_code);
        el.innerHTML = `${icon} ${temp}°F | 💨 ${wind}mph | 💧 ${hum}%`;
    } else { el.innerHTML = '--°F | 💨 -- | 💧 --'; }
}
async function getWeather(){
    if(S.br.wlat && S.br.wlon){ await fetchWeather(S.br.wlat,S.br.wlon,'Custom Location',false); return; }
    if(!navigator.geolocation){ await fetchWeather(32.7767,-96.7970,'Dallas,TX',true); return; }
    navigator.geolocation.getCurrentPosition(async p=>{
        await fetchWeather(p.coords.latitude,p.coords.longitude,'GPS',false);
        S.br.wlat = p.coords.latitude; S.br.wlon = p.coords.longitude; saveState();
    }, async()=>{ await fetchWeather(32.7767,-96.7970,'Dallas,TX',true); toast('Using Dallas weather'); });
}
setInterval(()=>{ if(!S.wd || Date.now()-S.lw>900000) getWeather(); },900000);

// ─── PIN ENTRY ───
function showPINEntry(){
    const o = document.createElement('div'); o.className = 'pin-overlay';
    o.innerHTML = `<h2 style="color:#fff">Enter PIN</h2><input id="pi" placeholder="PIN" autofocus><div><button class="hdr-btn" id="ps">Enter</button><button class="hdr-btn" id="pc">Cancel</button></div>`;
    document.body.appendChild(o);
    const cancel = ()=>{ if(o.parentNode)o.remove(); S.im=true; renderAll(); toast('Admin'); };
    document.getElementById('pc').onclick = cancel;
    document.getElementById('ps').onclick = ()=>{
        const p = document.getElementById('pi').value.trim().toUpperCase();
        if(S.cp[p]){ applyClient(S.cp[p],p); cancel(); toast('Welcome!'); } else toast('Invalid PIN');
    };
}
function applyClient(pr,p){ S.ap=p; S.im=false; S.br.cl=pr.l||''; S.br.cn=pr.n||''; S.br.t=pr.n||'Friday Night Live'; if(pr.wlat&&pr.wlon){ S.br.wlat=pr.wlat; S.br.wlon=pr.wlon; fetchWeather(pr.wlat,pr.wlon,pr.n||'Client',false); } updateClientLogo(); saveState(); renderAll(); }
function logoutAndShowPIN(){ S.ap=''; S.br.cl=''; S.br.cn=''; updateClientLogo(); showPINEntry(); toast('Logged out'); }
function updateClientLogo(){ /* no-op for now */ }

// ─── SAVE / LOAD ───
async function saveState(){ try{ localStorage.setItem(K,JSON.stringify(S)); document.getElementById('ftSaved').textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }catch(e){} }
async function loadState(){
    try{
        const raw = localStorage.getItem(K);
        if(raw){
            const p = JSON.parse(raw);
            S = {...S,...p};
            if(p.sp?.fb){
                const sp = S.sp.fb;
                const def = defGS();
                for(const k of Object.keys(def)){ if(sp[k]===undefined) sp[k]=def[k]; }
                sp.tms.forEach(t=>{ t.pl.forEach(p=>{ if(!sp.playerStats)sp.playerStats={}; if(!sp.playerStats[p.id])sp.playerStats[p.id]={}; if(p.pinned===undefined)p.pinned=false; if(p.pron===undefined)p.pron=''; }); });
                if(!sp.p7)sp.p7=[...D7];
                if(!sp.gc)sp.gc={rem:480,run:false};
                if(sp.sb===undefined)sp.sb=true;
                if(!sp.scoringLog)sp.scoringLog=[];
                if(!sp.penaltyLog)sp.penaltyLog=[];
                if(!sp.gameState)sp.gameState='READY';
                if(sp.down===undefined)sp.down=1;
                if(sp.dist===undefined)sp.dist=10;
                if(!sp.gameHistory)sp.gameHistory=[];
            }
            if(!S.colors) S.colors = { scorebugBg:'#0f172a', scorebugText:'#ffffff', teamCardBgAway:'#1e293b', teamCardBgHome:'#1e293b', teamNameColorAway:'#ffffff', teamNameColorHome:'#ffffff' };
            if(!S.cp)S.cp={};
            if(!S.ap)S.ap='';
            if(S.im===undefined)S.im=true;
            if(!S.br.wlat)S.br.wlat='';
            if(!S.br.wlon)S.br.wlon='';
            if(!S.br.cn)S.br.cn='';
            if(S.outdoor===undefined)S.outdoor=false;
        }
    }catch(e){ console.warn('Load error:',e); }
    applyTheme();
    try{ renderAll(); }catch(e){ console.error('Render error:',e); }
}

// ─── NAVIGATION ───
function renderNav(){
    let html='';
    html+='<button class="nav-link '+(S.v==='sport'?'active':'')+'" data-view="sport">🏈 GAME</button>';
    html+='<button class="nav-link '+(S.v==='roster'?'active':'')+'" data-view="roster">📋 ROSTERS</button>';
    html+='<button class="nav-link '+(S.v==='script'?'active':'')+'" data-view="script">🎙️ SCRIPT</button>';
    html+='<button class="nav-link '+(S.v==='log'?'active':'')+'" data-view="log">📜 LOG</button>';
    html+='<button class="nav-link '+(S.v==='admin'?'active':'')+'" data-view="admin">⚙️ ADMIN</button>';
    if(S.im)html+='<button class="nav-link '+(S.v==='clients'?'active':'')+'" data-view="clients">👥 CLIENTS</button>';
    document.getElementById('mainNav').innerHTML=html;
    document.getElementById('mainNav').onclick=e=>{
        const b=e.target.closest('button'); if(!b)return;
        S.v=b.dataset.view; renderNav(); renderView();
    };
}
function renderView(){
    if(S.v==='roster')renderRoster();
    else if(S.v==='script')renderScript();
    else if(S.v==='admin')renderAdmin();
    else if(S.v==='clients')renderClients();
    else if(S.v==='log')renderLog();
    else renderGame();
}
function renderAll(){
    if(!S.v||S.v==='')S.v='sport';
    renderNav(); renderView(); updateScorebug(); updateGameClockDisplay(); getWeather(); updateClientLogo();
    const sb=document.getElementById('scorebug');
    if(sb && g().sb===false)sb.style.display='none'; else if(sb)sb.style.display='flex';
}

// ─── SCOREBOARD ───
function chScore(side,delta){ const sp=g(); if(side==='away')sp.as=Math.max(0,sp.as+delta); else sp.hs=Math.max(0,sp.hs+delta); updateScorebug(); saveState(); }
function chQuarter(delta){
    const sp=g(); const max=sp.md==='7v7'?2:6;
    sp.q=Math.min(max,Math.max(1,sp.q+delta));
    if(sp.q>=1&&sp.q<=2)sp.gameState='FIRST_HALF';
    else if(sp.q>=3&&sp.q<=4)sp.gameState='SECOND_HALF';
    else if(sp.q>=5)sp.gameState='OVERTIME';
    updateScorebug(); saveState();
}
function updateScorebug(){
    const sp=g(); const at=sp.tms.find(t=>t.id===sp.aid), ht=sp.tms.find(t=>t.id===sp.hid);
    document.getElementById('sbAwayAbbr').innerHTML=(at?.logo?'<img class="sb-logo-sm" src="'+esc(at.logo)+'" style="width:20px;height:20px;"> ':'')+(at?esc(at.name):'AWAY');
    document.getElementById('sbHomeAbbr').innerHTML=(ht?.logo?'<img class="sb-logo-sm" src="'+esc(ht.logo)+'" style="width:20px;height:20px;"> ':'')+(ht?esc(ht.name):'HOME');
    document.getElementById('sbAwayScore').textContent=sp.as||0;
    document.getElementById('sbHomeScore').textContent=sp.hs||0;
    const ls=sp.md==='7v7'?['1st Half','2nd Half']:['Q1','Q2','Q3','Q4'];
    document.getElementById('sbQuarter').textContent=ls[(sp.q||1)-1]||'Q1';
    document.getElementById('sbQLabel').textContent=sp.md==='7v7'?'HALF':'QTR';
    document.getElementById('ftTicker').textContent='v22.0 • '+(at?at.name:'')+' vs. '+(ht?ht.name:'');
}

function uploadScorebugLogo(side){
    const team=getTeam(side); if(!team)return toast('No team selected');
    const input=document.createElement('input'); input.type='file'; input.accept='image/*';
    input.onchange=function(){
        const f=input.files[0]; if(!f||!f.type.startsWith('image/'))return toast('Image required');
        if(f.size>2*1024*1024)return toast('Max 2MB');
        const r=new FileReader(); r.onload=ev=>{ team.logo=ev.target.result; saveState(); updateScorebug(); toast('Logo updated'); };
        r.readAsDataURL(f);
    };
    input.click();
}

// ─── HELPERS ───
function getTeam(side){ return g().tms.find(t=>t.id===(side==='away'?g().aid:g().hid))||null; }
function getPositions(){ return g().md==='7v7'?(g().p7||D7):[...TACKLE.off,...TACKLE.def,...TACKLE.st]; }
function getPlayers(side,filter){
    const t=getTeam(side); if(!t?.pl)return[];
    let list;
    if(filter==='all')list=[...t.pl];
    else if(filter==='offense')list=t.pl.filter(p=>TACKLE.off.includes(p.po));
    else if(filter==='defense')list=t.pl.filter(p=>TACKLE.def.includes(p.po));
    else if(filter==='special')list=t.pl.filter(p=>TACKLE.st.includes(p.po));
    else list=[...t.pl];
    list.sort((a,b)=>(parseInt(a.n)||999)-(parseInt(b.n)||999));
    return list;
}
function pushUndo(){ const sp=g(); if(!sp.us)sp.us=[]; sp.us.push(JSON.parse(JSON.stringify(sp))); if(sp.us.length>50)sp.us.shift(); if(sp.rs)sp.rs=[]; }
function undoGame(){ const sp=g(); if(!sp.us?.length){toast('Nothing to undo');return;} const snap=sp.us.pop(); sp.rs.push(JSON.parse(JSON.stringify(sp))); Object.assign(sp,snap); saveState(); renderAll(); toast('Undo'); }
function redoGame(){ const sp=g(); if(!sp.rs?.length){toast('Nothing to redo');return;} const snap=sp.rs.pop(); sp.us.push(JSON.parse(JSON.stringify(sp))); Object.assign(sp,snap); saveState(); renderAll(); toast('Redo'); }

// ─── GAME STATE ───
function startGame(){
    const sp=g();
    if(sp.gameState!=='READY'&&!confirm('Game already started. Reset?'))return;
    sp.gameState='FIRST_HALF'; sp.gc.rem=480; sp.gc.run=false; sp.q=1; sp.as=0; sp.hs=0;
    sp.down=1; sp.dist=10; sp.scoringLog=[]; sp.penaltyLog=[]; sp.playerStats={};
    sp.tms.forEach(t=>t.pl.forEach(p=>{sp.playerStats[p.id]={};}));
    if(!sp.gameHistory)sp.gameHistory=[];
    pushUndo(); saveState(); updateScorebug(); updateGameClockDisplay(); toast('🏈 Game started!');
}
function startSecondHalf(){
    const sp=g();
    if(sp.gameState==='FINAL'){toast('Game is final');return;}
    if(sp.gameState!=='HALFTIME'&&!confirm('Switch to second half?'))return;
    sp.gameState='SECOND_HALF'; sp.gc.rem=480; sp.gc.run=false; sp.q=3;
    pushUndo(); saveState(); updateScorebug(); updateGameClockDisplay(); toast('⏭️ 2nd Half started');
}
function setHalftime(){
    const sp=g();
    if(sp.gameState==='FINAL'){toast('Game is final');return;}
    sp.gameState='HALFTIME'; sp.gc.run=false;
    pushUndo(); saveState(); updateScorebug(); updateGameClockDisplay(); toast('⏸️ Halftime');
}
function setOvertime(){
    const sp=g();
    if(sp.gameState==='FINAL'){toast('Game is final');return;}
    if(!confirm('Enter OVERTIME?'))return;
    sp.gameState='OVERTIME'; sp.gc.rem=360; sp.gc.run=false; sp.q=5;
    pushUndo(); saveState(); updateScorebug(); updateGameClockDisplay(); toast('⏱️ Overtime ready');
}
function endGame(){
    if(!confirm('End game?'))return;
    const sp=g(); sp.gameState='FINAL'; sp.gc.run=false;
    if(!sp.gameHistory)sp.gameHistory=[];
    sp.gameHistory.push({
        date:new Date().toISOString(),
        away:sp.tms.find(t=>t.id===sp.aid)?.name||'Away',
        home:sp.tms.find(t=>t.id===sp.hid)?.name||'Home',
        awayScore:sp.as, homeScore:sp.hs,
        log:[...sp.scoringLog,...sp.penaltyLog].sort((a,b)=>a.timestamp-b.timestamp)
    });
    pushUndo(); saveState(); updateScorebug(); updateGameClockDisplay(); toast('🏁 Game ended – archived');
    fnlCloudSaveAll(true);
}

// ─── POSSESSION / DOWN ───
function setPossession(side){
    const sp=g(); if(sp.poss===side)return;
    sp.poss=side; pushUndo(); saveState();
    const buttons=document.querySelectorAll('.possession button');
    buttons.forEach(b=>b.classList.remove('active'));
    document.querySelector(`.possession button[onclick="setPossession('${side}')"]`).classList.add('active');
    toast('Possession: '+(side==='home'?'HOME':'AWAY'));
}
function firstDown(){
    const sp=g(); sp.down=1; sp.dist=10;
    document.getElementById('downSelect').value='1';
    document.getElementById('distInput').value='10';
    pushUndo(); saveState(); toast('1st & 10');
}
function setDown(v){ const sp=g(); sp.down=parseInt(v)||1; pushUndo(); saveState(); }
function setDist(v){ const sp=g(); sp.dist=parseInt(v)||1; pushUndo(); saveState(); }

// ─── QUICK SCORE ───
function quickScore(type){
    const sp=g();
    if(sp.gameState==='FINAL'){toast('Game is final');return;}
    const side=sp.poss; const team=getTeam(side);
    if(!team){toast('No team');return;}
    let pts=0; if(type==='td')pts=6; else if(type==='fg')pts=3; else if(type==='pat')pts=1; else if(type==='safety')pts=2;
    const input=prompt(`Enter player # for ${type.toUpperCase()} (e.g., 7) or leave blank:`);
    let playerName=team.name; let player=null;
    if(input&&input.trim()){
        const num=input.trim();
        player=team.pl.find(p=>p.n===num);
        if(player)playerName=player.na;
        else { player=team.pl.find(p=>p.na.toLowerCase()===num.toLowerCase()); if(player)playerName=player.na; else playerName=num; }
    }
    if(side==='home')sp.hs+=pts; else sp.as+=pts;
    sp.scoringLog.push({type,team:side,player:playerName,points:pts,time:sp.gc.rem,quarter:sp.q,timestamp:Date.now()});
    if(player){ if(!sp.playerStats[player.id])sp.playerStats[player.id]={}; const st=sp.playerStats[player.id]; if(type==='td')st.tds=(st.tds||0)+1; else if(type==='fg')st.fgs=(st.fgs||0)+1; else if(type==='pat')st.pats=(st.pats||0)+1; else if(type==='safety')st.safeties=(st.safeties||0)+1; toast(`${playerName} (#${player.n}) scored!`); }
    else if(input&&input.trim())toast(`${playerName} scored!`); else toast(`${team.name} scored!`);
    pushUndo(); saveState(); updateScorebug();
}

// ─── QUICK PENALTY ───
function quickPenalty(){
    const sp=g();
    if(sp.gameState==='FINAL'){toast('Game is final');return;}
    const team=getTeam(sp.poss); if(!team){toast('No team');return;}
    const input=prompt(`Enter player # for penalty (optional):`);
    let playerName=team.name; let player=null;
    if(input&&input.trim()){
        const num=input.trim();
        player=team.pl.find(p=>p.n===num);
        if(player)playerName=player.na; else playerName=num;
    }
    sp.penaltyLog.push({type:'flag',team:sp.poss,player:playerName,time:sp.gc.rem,quarter:sp.q,timestamp:Date.now()});
    if(player){ if(!sp.playerStats[player.id])sp.playerStats[player.id]={}; sp.playerStats[player.id].penalties=(sp.playerStats[player.id].penalties||0)+1; toast(`Penalty on ${playerName} (#${player.n})`); }
    else if(input&&input.trim())toast(`Penalty on ${playerName}`); else toast(`Penalty on ${team.name}`);
    pushUndo(); saveState(); updateScorebug();
}

// ─── TOGGLE PIN ───
function togglePin(side,pid){
    const team=getTeam(side); if(!team)return;
    const p=team.pl.find(x=>x.id===pid); if(!p)return;
    if(!p.pinned){ const cnt=team.pl.filter(x=>x.pinned).length; if(cnt>=6){toast('Max 6 pinned');return;} }
    p.pinned=!p.pinned;
    team.pl.sort((a,b)=>{ if(a.pinned&&!b.pinned)return -1; if(!a.pinned&&b.pinned)return 1; return (parseInt(a.n)||999)-(parseInt(b.n)||999); });
    pushUndo(); saveState(); renderAll();
}
function playerStatTooltip(side,pid){
    const sp=g(); const team=getTeam(side); if(!team)return'';
    const p=team.pl.find(x=>x.id===pid); if(!p)return'';
    const st=sp.playerStats[p.id]||{};
    const parts=[];
    if(st.carries)parts.push('Carries:'+st.carries);
    if(st.yards)parts.push('Yards:'+st.yards);
    if(st.catches)parts.push('Catches:'+st.catches);
    if(st.tackles)parts.push('Tackles:'+st.tackles);
    if(st.tds)parts.push('TDs:'+st.tds);
    if(st.fgs)parts.push('FGs:'+st.fgs);
    if(st.pats)parts.push('PATs:'+st.pats);
    if(st.safeties)parts.push('Safeties:'+st.safeties);
    if(st.penalties)parts.push('Penalties:'+st.penalties);
    return parts.length?parts.join(' | '):'No stats';
}

    const sp=g();
    let html='<div class="game-controls">';
    html+=`Down: <select id="downSelect" onchange="setDown(this.value)">${[1,2,3,4].map(d=>`<option ${d==sp.down?'selected':''}>${d}</option>`).join('')}</select>`;
    html+=` Yards: <input type="number" id="distInput" value="${sp.dist||10}" min="1" max="99" style="width:55px;" onchange="setDist(this.value)">`;
    html+=`<button onclick="firstDown()">🔻 1st Down</button>`;
    html+=`<div class="possession"><button class="${sp.poss==='home'?'active':''}" onclick="setPossession('home')">🏠 HOME</button><button class="${sp.poss==='away'?'active':''}" onclick="setPossession('away')">✈️ AWAY</button></div>`;
    html+=`<button class="td" onclick="quickScore('td')">TD +6</button><button class="fg" onclick="quickScore('fg')">FG +3</button><button class="pat" onclick="quickScore('pat')">PAT +1</button><button class="safety" onclick="quickScore('safety')">Safety +2</button>`;
    html+=`<button class="flag-btn" onclick="quickPenalty()">🚩 FLAG</button>`;
    html+=`<button onclick="undoGame()">↩ Undo</button><button onclick="redoGame()">↪ Redo</button><button onclick="exportBoxScore()">📊 Export</button><button onclick="printLU()">🖨️ Print</button>`;
    html+=`</div>`;
    html+=`<div class="team-cards">`;
    const positions=getPositions();
    ['away','home'].forEach(side=>{
        const team=getTeam(side);
        const filter=S['u'+side[0]]||'all';
        const color=team?team.color:(side==='away'?'#1e3a5f':'#7f1d1d');
        html+=`<div class="team-card">`;
        html+=`<div class="card-head" style="background:${color};">
            <span>${side.toUpperCase()}</span>${team?.logo?'<img src="'+esc(team.logo)+'" style="width:24px;height:24px;">':''}
            <select onchange="switchTeam('${side}',this.value)">${sp.tms.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===(side==='away'?sp.aid:sp.hid)?'selected':'')+'>'+esc(x.name)+'</option>').join('')}</select>
            <button onclick="setPossession('${side}')" style="background:${sp.poss===side?'#facc15':'transparent'};color:${sp.poss===side?'#000':'#fff'};">🏈</button>
        </div>`;
        html+=`<div class="unit-tabs"><button class="unit-tab ${filter==='all'?'active':''}" onclick="setFilter('${side}','all')">ALL</button><button class="unit-tab ${filter==='offense'?'active':''}" onclick="setFilter('${side}','offense')">OFF</button><button class="unit-tab ${filter==='defense'?'active':''}" onclick="setFilter('${side}','defense')">DEF</button>${sp.md!=='7v7'?'<button class="unit-tab '+(filter==='special'?'active':'')+'" onclick="setFilter(\''+side+'\',\'special\')">ST</button>':''}</div>`;
        html+=`<div class="player-list-body">`;
        getPlayers(side,filter).forEach(p=>{
            html+=`<div class="player-row${p.st?' starter':''}">
                <span>${p.ph?'<img src="'+esc(p.ph)+'" style="width:20px;height:20px;border-radius:50%;">':''}</span>
                <span><input value="${esc(p.n||'')}" onchange="updatePlayerField('${side}','${p.id}','n',this.value)"></span>
                <span><input value="${esc(p.na||'')}" onchange="updatePlayerField('${side}','${p.id}','na',this.value)"></span>
                <span><input value="${esc(p.nt||'')}" onchange="updatePlayerField('${side}','${p.id}','nt',this.value)"></span>
                <span><select onchange="updatePlayerField('${side}','${p.id}','po',this.value)">${positions.map(o=>'<option '+(p.po===o?'selected':'')+'>'+o+'</option>').join('')}</select></span>
                <button onclick="toggleStarter('${side}','${p.id}')">⭐</button>
                <button onclick="togglePin('${side}','${p.id}')">📌</button>
                <button onclick="deletePlayer('${side}','${p.id}')">✕</button>
            </div>`;
        });
        html+=`</div></div>`;
    });
    html+=`</div>`;
    document.getElementById('main').innerHTML=html;
    updateScorebug();
}
function setFilter(side,f){ S['u'+side[0]]=f; renderAll(); }
function switchTeam(side,id){ if(!id)return; if(side==='away')g().aid=id; else g().hid=id; saveState(); renderAll(); }
function addPlayer(side){ /* simplified for brevity */ }
function toggleStarter(side,pid){ const team=getTeam(side); if(!team)return; const p=team.pl.find(x=>x.id===pid); if(!p)return; p.st=!p.st; saveState(); renderAll(); }
function deletePlayer(side,pid){ const team=getTeam(side); if(!team)return; team.pl=team.pl.filter(x=>x.id!==pid); saveState(); renderAll(); }
function updatePlayerField(side,pid,field,val){ const team=getTeam(side); if(!team)return; const p=team.pl.find(x=>x.id===pid); if(!p)return; p[field]=val; saveState(); }

// ─── LOG VIEW ───
function renderLog(){
    const sp=g();
    let html='<div class="panel"><h3>📜 GAME LOG</h3>';
    const current=[...sp.scoringLog.map(e=>({...e,type:'score'})),...sp.penaltyLog.map(e=>({...e,type:'penalty'}))];
    current.sort((a,b)=>b.timestamp-a.timestamp);
    if(current.length===0) html+='<p>No events in current game.</p>';
    else {
        html+='<h4>Current Game</h4><table style="width:100%;border-collapse:collapse;font-size:0.8rem;"><tr><th>Time</th><th>Team</th><th>Event</th><th>Details</th></tr>';
        current.forEach(ev=>{
            const timeStr=ev.time!==undefined?`${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}`:'--:--';
            const teamLabel=ev.team==='home'?'Home':'Away';
            let desc=ev.type==='score'?`${ev.player} scored (${ev.points} pts)`:`${ev.player} – Penalty`;
            html+=`<tr><td>${timeStr}</td><td>${teamLabel}</td><td>${ev.type.toUpperCase()}</td><td>${desc}</td></tr>`;
        });
        html+='</table>';
    }
    if(sp.gameHistory && sp.gameHistory.length>0){
        html+='<hr><h4>Game History</h4><table style="width:100%;border-collapse:collapse;font-size:0.8rem;"><tr><th>Date</th><th>Matchup</th><th>Score</th><th>Actions</th></tr>';
        sp.gameHistory.forEach((game,idx)=>{
            const d=new Date(game.date).toLocaleDateString();
            html+=`<tr><td>${d}</td><td>${game.away} vs ${game.home}</td><td>${game.awayScore} - ${game.homeScore}</td><td><button onclick="printGameLog(${idx})">🖨️ Print</button></td></tr>`;
        });
        html+='</table>';
    }
    html+='</div>';
    document.getElementById('main').innerHTML=html;
}
function printGameLog(idx){
    const sp=g();
    let game;
    if(idx===undefined || idx===null){
        game={ date:new Date(), away:sp.tms.find(t=>t.id===sp.aid)?.name||'Away', home:sp.tms.find(t=>t.id===sp.hid)?.name||'Home', awayScore:sp.as, homeScore:sp.hs, log:[...sp.scoringLog,...sp.penaltyLog] };
    } else {
        game=sp.gameHistory[idx];
    }
    if(!game) return toast('No log');
    const events=game.log||[];
    events.sort((a,b)=>a.timestamp-b.timestamp);
    let html=`<html><head><title>Game Log</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th,td{border:1px solid #000;padding:4px 6px}th{background:#ddd}</style></head><body>`;
    html+=`<h2>Game Log – ${game.away} vs ${game.home}</h2>`;
    html+=`<p>Final Score: ${game.awayScore} - ${game.homeScore}</p>`;
    html+=`<table><tr><th>Time</th><th>Team</th><th>Event</th><th>Details</th></tr>`;
    events.forEach(ev=>{
        const timeStr=ev.time!==undefined?`${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}`:'--:--';
        const teamLabel=ev.team==='home'?'Home':'Away';
        let desc=ev.type==='score'?`${ev.player} scored (${ev.points} pts)`:`${ev.player} – Penalty`;
        html+=`<tr><td>${timeStr}</td><td>${teamLabel}</td><td>${ev.type.toUpperCase()}</td><td>${desc}</td></tr>`;
    });
    html+=`</table></body></html>`;
    const w=window.open(); w.document.write(html); w.print();
}

function saveTeam(){
    const ct=g().tms.find(t=>t.id===g().cid); if(!ct)return;
    ct.name=document.getElementById('etn').value;
    ct.color=document.getElementById('tc').value;
    saveState(); renderRoster(); toast('Saved');
}
function addPlayerToTeam(tid){
    const team=g().tms.find(t=>t.id===tid); if(!team)return;
    team.pl.push({id:uid(),n:'',na:'New Player',po:'QB',st:false,nt:'',ph:'',pron:'',pinned:false});
    saveState(); renderRoster();
}
function deletePlayer(side,pid){ const team=getTeam(side); if(!team)return; team.pl=team.pl.filter(x=>x.id!==pid); saveState(); renderAll(); }
function updatePlayerField(side,pid,field,val){ const team=getTeam(side); if(!team)return; const p=team.pl.find(x=>x.id===pid); if(!p)return; p[field]=val; saveState(); }

// ─── ADMIN VIEW ───
function renderAdmin(){
    const tabs=['theme','clock','colors','help'];
    const labels={theme:'Theme',clock:'Clock',colors:'Colors',help:'Help'};
    let html='<div class="panel"><h3>⚙️ ADMIN</h3><div style="display:flex;gap:4px;margin-bottom:8px;">';
    tabs.forEach(x=>{ html+=`<button class="hdr-btn" onclick="S.at='${x}';renderAdmin()">${labels[x]}</button>`; });
    html+='</div><div id="ac"></div></div>';
    document.getElementById('main').innerHTML=html;
    renderAdminContent();
}
function renderAdminContent(){
    const c=document.getElementById('ac'); if(!c)return;
    const sp=g();
    if(S.at==='theme'){
        c.innerHTML=`<h4>Theme</h4><p>Current: <strong>${S.md==='dark'?'Dark':'Light'}</strong></p><button class="hdr-btn" onclick="toggleTheme()">Toggle</button>`;
    } else if(S.at==='clock'){
        c.innerHTML=`<h4>Clock</h4><p>Default 8 minutes per quarter.</p>`;
    } else if(S.at==='colors'){
        c.innerHTML=`<h4>Color Customization</h4>
            <label>Scorebug Background</label><input type="color" id="sbBg" value="${S.colors.scorebugBg}" onchange="S.colors.scorebugBg=this.value;">
            <label>Scorebug Text</label><input type="color" id="sbText" value="${S.colors.scorebugText}" onchange="S.colors.scorebugText=this.value;">
            <label>Team Card Background (Away)</label><input type="color" id="tcA" value="${S.colors.teamCardBgAway}" onchange="S.colors.teamCardBgAway=this.value;">
            <label>Team Card Background (Home)</label><input type="color" id="tcH" value="${S.colors.teamCardBgHome}" onchange="S.colors.teamCardBgHome=this.value;">
            <button class="hdr-btn" onclick="saveState();toast('Colors applied')">Apply</button>`;
    } else if(S.at==='help'){
        c.innerHTML=`<h4>📖 Instructions</h4>
        <ul>
            <li>Use the scorebug to control the game.</li>
            <li>Flag button is yellow for penalties.</li>
            <li>Game logs save automatically after Final.</li>
        </ul>`;
    }
}

// ─── CLOUD SYNC ───
async function fnlCloudSaveAll(silent=false){
    if(!silent&&!confirm('Save entire game to cloud?'))return;
    try{
        const snap=JSON.parse(JSON.stringify(S)); delete snap.wd;
        await fetch(CLOUD+'?id='+FNL_NS+'full_sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)});
        if(!silent)toast('✅ Full game saved');
    }catch(e){ if(!silent)toast('❌ Save failed'); }
}
async function fnlCloudLoadAll(){
    if(!confirm('Load entire game from cloud?'))return;
    try{
        const r=await fetch(CLOUD+'?id='+FNL_NS+'full_sync');
        if(!r.ok)throw new Error('No data');
        const snap=await r.json();
        S=snap; S.wd=null;
        saveState(); applyTheme(); renderAll();
        toast('✅ Game loaded');
    }catch(e){ toast('❌ Load failed'); }
}
