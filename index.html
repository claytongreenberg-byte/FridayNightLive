<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – PA Console</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--accent:#facc15;--bg:#f1f5f9;--surface:#e2e8f0;--text:#0f172a;--border:#94a3b8;--footer-bg:#1a1a1a;--footer-text:#f1f5f9;--scorebug-bg:#0d0d1a;--scorebug-text:#ffffff;--team-card-away:#e2e8f0;--team-card-home:#e2e8f0;--badge-offense:#2563eb;--badge-defense:#dc2626;--badge-special:#16a34a;--badge-both:#8b5cf6;--badge-other:#6b7280}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
        select{-webkit-appearance:menulist;appearance:menulist}
        header{background:linear-gradient(180deg,#1a3a0e,#0f2a08);padding:6px 10px;border-bottom:3px solid var(--accent);flex-shrink:0}
        .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
        .hdr-top-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
        .brand-logo{height:32px;width:auto;max-width:60px;object-fit:contain;flex-shrink:0}
        .brand-text{display:flex;flex-direction:column;line-height:1.1}
        .brand-text h1{font-size:.85rem;color:#fff;white-space:nowrap}
        .brand-text p{font-size:.5rem;color:var(--accent);opacity:.9}
        .hdr-top-right{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
        .wall-clock,.weather-pill{color:var(--accent);font-weight:700;font-size:.6rem;background:rgba(0,0,0,.4);border:1px solid var(--accent);border-radius:5px;padding:2px 6px;white-space:nowrap}
        .hdr-btn{background:#334155;color:#fff;border:1px solid #475569;border-radius:16px;padding:4px 8px;font-size:.58rem;cursor:pointer;white-space:nowrap;min-height:24px;transition:all .15s}
        .hdr-btn:hover{background:#475569}
        .hdr-btn.save-btn{background:#16a34a;border-color:#16a34a}
        .hdr-btn.save-btn:hover{background:#15803d}
        .hdr-btn.undo-btn{background:#dc2626;border-color:#dc2626}
        .hdr-btn.undo-btn:hover{background:#b91c1c}
        .hdr-btn.undo-btn:disabled{opacity:.4;cursor:not-allowed}
        .hdr-bottom{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px}
        .save-status{font-size:.5rem;color:var(--accent);background:rgba(0,0,0,.4);padding:2px 8px;border-radius:10px;white-space:nowrap}
        .save-status.saved{color:#4ade80}
        .save-status.offline{color:#facc15}
        .scorebug-wrap{width:100%;display:flex;flex-direction:column;gap:4px}
        .scorebug{position:relative;display:flex;align-items:stretch;justify-content:center;gap:0;background:var(--scorebug-bg);border:3px solid var(--accent);border-radius:12px;padding:12px 18px 10px;flex-wrap:nowrap;width:100%;box-shadow:0 4px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);--sb-text:#ffffff;min-height:160px;transition:all .3s ease}
        .scorebug.compact{padding:6px 10px 4px;min-height:60px;border-radius:8px}
        .scorebug.compact .sb-block{padding:0 6px}
        .scorebug.compact .sb-team-name{font-size:1.2rem!important}
        .scorebug.compact .sb-val{font-size:2rem;min-width:30px}
        .scorebug.compact .game-clock{font-size:2rem}
        .scorebug.compact .sb-qtr{font-size:1.8rem}
        .scorebug.compact .sb-label{font-size:.5rem}
        .scorebug.compact .sb-btn{width:20px;height:20px;font-size:8px}
        .scorebug.compact .sb-game-btns button{font-size:.4rem;padding:2px 6px;min-height:18px;min-width:28px}
        .scorebug.compact .last-event{font-size:.55rem;min-height:22px;padding:2px 8px;max-width:200px}
        .scorebug.compact .timeout-display{display:none}
        .scorebug.compact .sb-row{gap:2px}
        .scorebug.compact .sb-game-btns{gap:2px}
        .scorebug.compact .sb-game-btns button{min-height:16px;padding:1px 4px;font-size:.35rem}
        .sb-network-tag{position:absolute;top:-11px;left:16px;background:var(--accent);color:#000;font-weight:900;font-size:.65rem;letter-spacing:2px;padding:3px 14px;border-radius:4px;text-transform:uppercase;box-shadow:0 2px 12px rgba(0,0,0,.6)}
        .live-pill{position:absolute;top:-11px;right:16px;background:#dc2626;color:#fff;font-weight:800;font-size:.55rem;padding:3px 14px;border-radius:10px;display:none;align-items:center;gap:6px;letter-spacing:1px;box-shadow:0 2px 12px rgba(0,0,0,.6)}
        .live-pill.show{display:inline-flex}
        .live-pill.final{background:#334155}
        .live-pill.halftime{background:#f59e0b}
        .live-pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:sbpulse 1s infinite}
        .live-pill.final .dot,.live-pill.halftime .dot{animation:none}
        @keyframes sbpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.7)}}
        .sb-block{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;border-right:1px solid rgba(255,255,255,.06);flex:1 1 0;min-width:60px;cursor:pointer;transition:all .15s}
        .sb-block:hover{background:rgba(255,255,255,.03)}
        .sb-block:active{transform:scale(.98)}
        .sb-block:last-child{border-right:none}
        .sb-block.score-block{flex:1.5}
        .sb-block.clock-block{flex:.9}
        .sb-block.game-block{flex:1.8}
        .sb-team-name{font-size:2.2rem;font-weight:900;color:var(--sb-text);letter-spacing:1px;text-align:center;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6);word-wrap:break-word;max-width:140px}
        .sb-label{font-size:.7rem;font-weight:800;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:2px;margin-top:0;text-shadow:0 1px 4px rgba(0,0,0,.8)}
        .sb-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}
        .sb-val{font-size:3.6rem;font-weight:900;color:var(--sb-text);min-width:48px;text-align:center;text-shadow:0 0 40px rgba(255,255,255,.05);line-height:1}
        .sb-qtr{font-size:3.2rem;font-weight:900;color:var(--accent);text-shadow:0 0 30px rgba(250,204,21,.2)}
        .game-clock{font-family:'Courier New',monospace;font-size:3.6rem;font-weight:900;color:#00ff88;text-shadow:0 0 40px rgba(0,255,136,.2),0 0 80px rgba(0,255,136,.05);letter-spacing:2px}
        .game-clock.paused{color:var(--sb-text);opacity:.4}
        .game-clock.clock-warning{color:#ff6b6b;animation:clockPulse 1s infinite}
        @keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.3}}
        .sb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;width:28px;height:28px;border-radius:50%;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
        .sb-btn:hover{background:var(--accent);color:#000;transform:scale(1.1)}
        .sb-btn:active{transform:scale(.9)}
        .sb-game-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
        .sb-game-btns button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:5px 12px;font-size:.6rem;font-weight:700;cursor:pointer;min-height:28px;min-width:40px;transition:all .15s}
        .sb-game-btns button:hover{background:var(--accent);color:#000;transform:scale(1.04)}
        .sb-game-btns button:active{transform:scale(.95)}
        .sb-game-btns button.half-active{background:#f59e0b;color:#000}
        .sb-game-btns button.final-active{background:#dc2626;color:#fff}
        .sb-game-btns button:disabled{opacity:.2;cursor:not-allowed;transform:none!important}
        .sb-game-btns button:disabled:hover{background:rgba(255,255,255,.08);color:#fff}
        .dd-ticker{padding:5px 14px;border-radius:6px;font-weight:800;font-size:.8rem;text-align:center;color:#fff;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.8);background:#1a1a2e;min-height:28px;border:1px solid rgba(255,255,255,.05);transition:all .3s ease}
        .timeout-display{display:flex;gap:4px;align-items:center;margin-top:3px}
        .timeout-dot{width:10px;height:10px;border-radius:50%;background:#4ade80;transition:all .3s;box-shadow:0 0 10px rgba(74,222,128,.4)}
        .timeout-dot.used{background:#334155;opacity:.25;box-shadow:none}
        .timeout-zero{font-size:.6rem;font-weight:800;color:#f87171;letter-spacing:.5px}
        .timeout-label{font-size:.45rem;color:var(--sb-text);opacity:.4;letter-spacing:.5px}
        .last-event{background:rgba(0,0,0,.7);border:2px solid var(--accent);border-radius:8px;padding:6px 14px;text-align:center;font-weight:800;font-size:.85rem;color:#fff;min-height:34px;display:flex;align-items:center;justify-content:center;transition:all .3s;flex:1;max-width:450px;box-shadow:inset 0 0 40px rgba(250,204,21,.05)}
        nav{background:#1a1a1a;display:flex;gap:4px;padding:0 10px;flex-shrink:0;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.05)}
        .nav-link{background:0 0;border:none;color:#999;padding:6px 10px;font-weight:700;cursor:pointer;font-size:.65rem;white-space:nowrap;transition:all .15s}
        .nav-link:hover{color:#fff}
        .nav-link.active{background:var(--accent);color:#000;border-radius:6px 6px 0 0}
        main{flex:1;overflow:auto;padding:6px}
        .panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px}
        .roster-layout{display:flex;gap:8px;height:100%}
        .team-sidebar{width:150px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;overflow-y:auto}
        .team-item{padding:4px 6px;border-radius:4px;margin-bottom:2px;cursor:pointer;font-weight:600;font-size:.6rem;color:var(--text)}
        .team-item.active{background:var(--accent);color:#000}
        .roster-workspace{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;overflow-y:auto}
        .cat-badge{font-size:.55rem;font-weight:800;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block;cursor:help;letter-spacing:.3px;border:1px solid rgba(255,255,255,.2);text-shadow:0 1px 2px rgba(0,0,0,.2);transition:all .2s;line-height:1.3}
        .cat-badge:hover{transform:scale(1.1);box-shadow:0 2px 8px rgba(0,0,0,.3)}
        .cat-badge.offense{background:var(--badge-offense);color:#fff}
        .cat-badge.defense{background:var(--badge-defense);color:#fff}
        .cat-badge.special{background:var(--badge-special);color:#fff}
        .cat-badge.both{background:var(--badge-both);color:#fff}
        .cat-badge.other{background:var(--badge-other);color:#fff}
        .cat-legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border);margin-bottom:8px;font-size:.55rem;font-weight:600}
        .cat-legend .legend-item{display:flex;align-items:center;gap:4px}
        footer{background:var(--footer-bg);color:var(--footer-text);padding:3px 8px;text-align:center;font-size:.5rem;flex-shrink:0;border-top:1px solid var(--accent)}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:6px 14px;border-radius:16px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;font-size:.75rem;backdrop-filter:blur(10px)}
        .toast.show{opacity:1}
        .player-list-body{flex:1;overflow-y:auto;padding:4px 5px}
        .player-row{display:grid;grid-template-columns:28px 1fr 80px 28px 20px 20px 20px;gap:3px;align-items:center;padding:3px 2px;border-bottom:2px solid #333;font-size:.65rem}
        .player-row:last-child{border-bottom:none}
        .player-row input,.player-row select{background:transparent;border:1px solid var(--border);color:#0a0a0a;font-weight:700;padding:2px 3px;width:100%;font-size:.6rem;border-radius:3px;min-width:0}
        .player-row input:focus,.player-row select:focus{border-color:var(--accent);outline:0;background:rgba(255,255,255,.5)}
        .player-row.starter{background:rgba(251,191,36,.08);border-left:3px solid var(--accent)}
        .st-toggle,.pin-btn{background:0 0;border:1px solid var(--border);border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:.45rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .st-toggle.active{background:var(--accent);color:#000;border-color:var(--accent)}
        .delete-btn{background:0 0;border:1px solid var(--border);border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#dc2626}
        .delete-btn:hover{background:#dc2626;color:#fff;border-color:#dc2626}
        .game-controls-row{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding:4px 10px;background:var(--bg);border:2px solid var(--accent);border-radius:8px;margin-bottom:6px;box-shadow:0 2px 16px rgba(250,204,21,.08);min-height:40px;overflow-x:auto}
        .game-controls-row .label{font-weight:800;font-size:.5rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text);opacity:.4;margin-right:1px;white-space:nowrap}
        .game-controls-row .divider{width:1px;height:24px;background:var(--border);opacity:.2;margin:0 2px;flex-shrink:0}
        .game-controls-row .pos-btn{padding:2px 10px;font-size:.65rem;font-weight:700;min-width:48px;border-radius:6px;border:2px solid #475569;cursor:pointer;transition:all .15s;background:#334155;color:#fff;display:flex;align-items:center;gap:3px;justify-content:center;white-space:nowrap;flex-shrink:0}
        .game-controls-row .pos-btn:hover{transform:scale(1.04)}
        .game-controls-row .pos-btn:active{transform:scale(.95)}
        .game-controls-row .pos-btn.active{color:#fff;border-color:var(--accent);box-shadow:0 0 20px rgba(250,204,21,.15)}
        .game-controls-row .pos-btn .team-logo{width:14px;height:14px;border-radius:50%;object-fit:cover}
        .game-controls-row .to-btn{padding:2px 8px;font-size:.5rem;font-weight:700;border-radius:6px;border:0;cursor:pointer;background:#f97316;color:#fff;transition:all .15s;white-space:nowrap;flex-shrink:0}
        .game-controls-row .to-btn:hover{transform:scale(1.04);background:#ea580c}
        .game-controls-row .to-btn.injury-btn{background:#dc2626}
        .game-controls-row .to-btn.injury-btn:hover{background:#b91c1c}
        .game-controls-row .clock-status{font-size:.5rem;padding:2px 8px;background:rgba(0,0,0,.05);border-radius:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
        .game-controls-row .clock-status.running{color:#4ade80;opacity:1}
        .game-controls-row .clock-status.paused{color:#facc15;opacity:1}
        .game-controls-row select,.game-controls-row input{padding:2px 4px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.5rem;min-height:20px;flex-shrink:0}
        .game-controls-row .yd-input{width:32px}
        .game-controls-row .gc-btn{background:#334155;color:#fff;border:1px solid #475569;border-radius:6px;padding:2px 5px;font-weight:700;font-size:.5rem;cursor:pointer;min-height:20px;transition:all .15s;white-space:nowrap;flex-shrink:0}
        .game-controls-row .gc-btn:hover{background:#475569}
        .game-controls-row .gc-btn.td{background:#dc2626;border-color:#dc2626}
        .game-controls-row .gc-btn.fg{background:#2563eb;border-color:#2563eb}
        .game-controls-row .gc-btn.twopt{background:#8b5cf6;border-color:#8b5cf6}
        .game-controls-row .gc-btn.pat{background:#16a34a;border-color:#16a34a}
        .game-controls-row .gc-btn.safety{background:#f59e0b;color:#000;border-color:#f59e0b}
        .team-cards{display:flex;gap:6px;height:calc(100% - 120px);min-height:200px}
        .team-card{flex:1;background:var(--team-card-bg);border:2px solid var(--border);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
        .team-card.away-card{background:var(--team-card-away)}
        .team-card.home-card{background:var(--team-card-home)}
        .card-head{padding:5px 8px;font-weight:700;display:flex;align-items:center;gap:5px;color:#fff;font-size:.75rem;flex-shrink:0}
        .card-head select{flex:1;padding:3px 5px;border-radius:4px;background:#fff;color:#000;font-size:.7rem;min-height:24px;border:1px solid rgba(255,255,255,.3)}
        .card-head select option{color:#000}
        .card-head .mini-logo{width:22px;height:22px;object-fit:cover;border-radius:50%;flex-shrink:0}
        .card-head .sb-btn{width:22px;height:22px;font-size:10px}
        .unit-tabs{display:flex;gap:3px;padding:2px 5px;border-bottom:1px solid var(--border);flex-shrink:0}
        .unit-tab{background:0 0;border:none;padding:3px 6px;cursor:pointer;font-weight:700;font-size:.5rem;border-radius:4px;transition:all .15s}
        .unit-tab.active{color:#000}
        .unit-tab.all-tab{color:var(--accent)}
        .unit-tab.all-tab.active{background:var(--accent);color:#000}
        .unit-tab.offense-tab{color:var(--badge-offense)}
        .unit-tab.offense-tab.active{background:var(--badge-offense);color:#fff}
        .unit-tab.defense-tab{color:var(--badge-defense)}
        .unit-tab.defense-tab.active{background:var(--badge-defense);color:#fff}
        .unit-tab.special-tab{color:var(--badge-special)}
        .unit-tab.special-tab.active{background:var(--badge-special);color:#fff}

<script>
// ============================================================
// CONSTANTS
// ============================================================
const MAX_UNDO = 50;

const POSITION_CATEGORIES = {
    OFFENSE: ['QB','RB','FB','WR','TE','OL','Center','Guard','Tackle','LS'],
    DEFENSE: ['DL','DE','DT','NG','LB','MLB','OLB','ILB','CB','S','SS','FS','DB'],
    SPECIAL: ['K','P','KR','PR']
};

function normalizePosition(pos) {
    if (!pos) return '';
    const map = {'C':'Center','G':'Guard','T':'Tackle','QB':'QB','RB':'RB','WR':'WR','TE':'TE','DT':'DT','DE':'DE','LB':'LB','CB':'CB','S':'S','DL':'DL','MLB':'MLB','OLB':'OLB','ILB':'ILB','SS':'SS','FS':'FS','DB':'DB','K':'K','P':'P','KR':'KR','PR':'PR','LS':'LS'};
    return map[pos.toUpperCase()] || pos;
}

function getAllPositions() {
    return [...POSITION_CATEGORIES.OFFENSE, ...POSITION_CATEGORIES.DEFENSE, ...POSITION_CATEGORIES.SPECIAL];
}

function getTeamMascot(team) {
    if (!team || !team.name) return 'TEAM';
    const words = team.name.trim().split(/\s+/);
    return words[words.length - 1].toUpperCase();
}

// ============================================================
// STATE
// ============================================================
let S = {
    v: 'sport', md: 'light', outdoor: false, at: 'theme',
    as: 0, hs: 0, q: 1, down: 1, dist: 10, poss: 'home',
    gameState: 'READY',
    gc: { rem: 480, run: false, max: 480 },
    md7: 'tackle', p7: ['QB','Center','WR','WR','WR','DB','DB'],
    cf: '12h', cs: true,
    awayId: 'h', homeId: 's',
    timeouts: { away: 3, home: 3 },
    timeoutConfig: { tackle: { perHalf: 3, overtimePerPeriod: 1 }, sevens: { perHalf: 0, overtimePerPeriod: 0 } },
    undoStack: [], sessionId: null,
    lastEvent: { text: '🏈 Ready — Set possession to begin', type: 'info' },
    scorebugMode: 'full',
    teams: [
        { id: 'h', name: 'Euless Trinity Trojans', abbr: 'ETT', color: '#1e3a5f', textColor: '#ffffff', logo: '', mascot: 'Trojans', coach: '', players: [] },
        { id: 's', name: 'Mansfield Tigers', abbr: 'MHS', color: '#7f1d1d', textColor: '#ffffff', logo: '', mascot: 'Tigers', coach: '', players: [] }
    ],
    scoringLog: [], penaltyLog: [], gameHistory: [], script: '', cp: {}, ap: '', im: true,
    ua: 'all', uh: 'all', cid: 'h',
    colors: { scorebugBg: '#0d0d1a', scorebugText: '#ffffff', accent: '#facc15', teamCardAway: '#e2e8f0', teamCardHome: '#e2e8f0', teamCardBorder: '#94a3b8' }
};

const STORAGE_KEY = 'fnl_v27';

function toast(m) {
    const x = document.getElementById('toast');
    if (!x) return;
    x.textContent = m;
    x.classList.add('show');
    setTimeout(() => x.classList.remove('show'), 2000);
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
        const el = document.getElementById('saveStatus');
        if (el) {
            const now = new Date();
            el.textContent = `💾 Saved ${now.toLocaleTimeString()}`;
            el.className = 'save-status saved';
        }
    } catch(e) { console.error('Save error:', e); }
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            S = { ...S, ...parsed };
        }
    } catch(e) { console.error('Load error:', e); }
    normalizeState();
}

function normalizeState() {
    if (!Array.isArray(S.teams) || S.teams.length === 0) {
        S.teams = [{ id: 't1', name: 'Away Team', abbr: 'AWY', color: '#334155', textColor: '#ffffff', logo: '', mascot: '', coach: '', players: [] }];
    }
    S.teams.forEach(t => {
        if (!t.abbr) t.abbr = '';
        if (!t.textColor) t.textColor = '#ffffff';
        if (!t.mascot) t.mascot = '';
        t.players.forEach(p => {
            if (!p.categories) p.categories = getPositionCategories(p.po || '');
            if (!p.posFull) p.posFull = p.po || '';
            if (p.st === undefined) p.st = false;
        });
    });
    if (!S.teams.find(t => t.id === S.awayId)) S.awayId = S.teams[0].id;
    if (!S.teams.find(t => t.id === S.homeId) || S.homeId === S.awayId) {
        const alt = S.teams.find(t => t.id !== S.awayId);
        S.homeId = alt ? alt.id : S.awayId;
    }
    if (!S.colors) S.colors = { scorebugBg: '#0d0d1a', scorebugText: '#ffffff', accent: '#facc15', teamCardAway: '#e2e8f0', teamCardHome: '#e2e8f0', teamCardBorder: '#94a3b8' };
    if (!S.gc.max) S.gc.max = 480;
    if (!S.timeouts) S.timeouts = { away: 3, home: 3 };
    if (!S.timeoutConfig) {
        S.timeoutConfig = { tackle: { perHalf: 3, overtimePerPeriod: 1 }, sevens: { perHalf: 0, overtimePerPeriod: 0 } };
    }
    if (!S.undoStack) S.undoStack = [];
    if (!S.lastEvent) S.lastEvent = { text: '🏈 Ready — Set possession to begin', type: 'info' };
    if (!S.scorebugMode) S.scorebugMode = 'full';
    S.gc.run = false;
}

function getTeam(side) {
    const id = side === 'away' ? S.awayId : S.homeId;
    let t = S.teams.find(x => x.id === id);
    if (!t) t = S.teams[0];
    return t || { name: 'TBD', abbr: 'TBD', color: '#334155', textColor: '#ffffff', mascot: '', players: [], id: '' };
}

function getPositionCategories(posStr) {
    if (!posStr) return ['all'];
    const positions = posStr.split('/').map(p => p.trim().toUpperCase());
    const categories = new Set();
    const OFFENSE_NORM = POSITION_CATEGORIES.OFFENSE.map(p => p.toUpperCase());
    const DEFENSE_NORM = POSITION_CATEGORIES.DEFENSE.map(p => p.toUpperCase());
    const SPECIAL_NORM = POSITION_CATEGORIES.SPECIAL.map(p => p.toUpperCase());
    positions.forEach(pos => {
        if (OFFENSE_NORM.includes(pos) || pos === 'LS') categories.add('offense');
        if (DEFENSE_NORM.includes(pos)) categories.add('defense');
        if (SPECIAL_NORM.includes(pos) || pos === 'LS') categories.add('special');
    });
    if (categories.size === 0) categories.add('all');
    return Array.from(categories);
}

function getCategoryLabel(categories) {
    if (!categories || categories.length === 0 || categories[0] === 'all') return '[?]';
    const hasOffense = categories.includes('offense');
    const hasDefense = categories.includes('defense');
    const hasSpecial = categories.includes('special');
    if (hasOffense && hasDefense) return '[O/D]';
    if (hasOffense) return '[O]';
    if (hasDefense) return '[D]';
    if (hasSpecial) return '[ST]';
    return '[?]';
}

function getCategoryClass(categories) {
    if (!categories || categories.length === 0 || categories[0] === 'all') return 'other';
    const hasOffense = categories.includes('offense');
    const hasDefense = categories.includes('defense');
    const hasSpecial = categories.includes('special');
    if (hasOffense && hasDefense) return 'both';
    if (hasOffense) return 'offense';
    if (hasDefense) return 'defense';
    if (hasSpecial) return 'special';
    return 'other';
}

function getCategoryTooltip(categories) {
    if (!categories || categories.length === 0 || categories[0] === 'all') return 'Unknown Position';
    const labels = [];
    if (categories.includes('offense')) labels.push('Offense');
    if (categories.includes('defense')) labels.push('Defense');
    if (categories.includes('special')) labels.push('Special Teams');
    return labels.join(' + ') || 'Unknown';
}

function getAllPositionOptionsWithLabels() {
    const basePositions = S.md7 === '7v7' ? S.p7 : getAllPositions();
    const allPosStrings = new Set();
    S.teams.forEach(team => {
        team.players.forEach(p => {
            if (p.posFull) allPosStrings.add(p.posFull);
            if (p.po) allPosStrings.add(p.po);
        });
    });
    const combined = [...basePositions];
    allPosStrings.forEach(pos => {
        if (!combined.includes(pos)) combined.push(pos);
    });
    return combined.map(pos => {
        const cats = getPositionCategories(pos);
        const label = getCategoryLabel(cats);
        return { value: pos, display: `${label} ${pos}`, categories: cats };
    }).sort((a, b) => a.value.localeCompare(b.value));
}

function getPlayers(side, filter) {
    const t = getTeam(side);
    if (!t) return [];
    let list = [...t.players];
    if (filter === 'all') {
        list.sort((a, b) => (parseInt(a.n) || 999) - (parseInt(b.n) || 999));
        return list;
    }
    if (filter === 'offense' || filter === 'defense' || filter === 'special') {
        list = list.filter(p => {
            if (p.categories && p.categories.length > 0) {
                return p.categories.includes(filter);
            }
            return true;
        });
    }
    list.sort((a, b) => (parseInt(a.n) || 999) - (parseInt(b.n) || 999));
    return list;
}

// ============================================================
// CLOUD SYNC
// ============================================================
async function fnlCloudSaveAll() {
    try {
        const snap = JSON.parse(JSON.stringify(S));
        const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(snap)
        });
        if (resp.ok) {
            toast('✅ All data synced to cloud');
            const el = document.getElementById('saveStatus');
            if (el) {
                el.textContent = `✅ Synced ${new Date().toLocaleTimeString()}`;
                el.className = 'save-status saved';
            }
        } else {
            toast('❌ Cloud sync failed');
        }
    } catch(e) {
        toast('⚠️ Cloud unavailable - saved locally');
        console.error('Save error:', e);
    }
}

async function fnlCloudLoadGameState() {
    if (!confirm('Load game state from cloud?')) return;
    try {
        const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
        if (!resp.ok) throw new Error('Load failed');
        const data = await resp.json();
        if (!data || Object.keys(data).length === 0) throw new Error('No data');
        if (data.as !== undefined) S.as = data.as;
        if (data.hs !== undefined) S.hs = data.hs;
        if (data.q !== undefined) S.q = data.q;
        if (data.down !== undefined) S.down = data.down;
        if (data.dist !== undefined) S.dist = data.dist;
        if (data.poss !== undefined) S.poss = data.poss;
        if (data.gameState !== undefined) S.gameState = data.gameState;
        if (data.gc) {
            if (data.gc.rem !== undefined) S.gc.rem = data.gc.rem;
            if (data.gc.max !== undefined) S.gc.max = data.gc.max;
            S.gc.run = false;
        }
        if (data.timeouts) {
            if (data.timeouts.away !== undefined) S.timeouts.away = data.timeouts.away;
            if (data.timeouts.home !== undefined) S.timeouts.home = data.timeouts.home;
        }
        saveState();
        renderAll();
        toast('✅ Game state loaded');
    } catch(e) {
        toast('❌ Load failed: ' + e.message);
    }
}

async function fnlCloudLoadRostersOnly() {
    if (!confirm('Load rosters from cloud? (merges)')) return;
    try {
        const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
        if (!resp.ok) throw new Error('Load failed');
        const data = await resp.json();
        if (!data || Object.keys(data).length === 0) throw new Error('No data');
        if (data.teams) {
            data.teams.forEach(cloudTeam => {
                const existing = S.teams.find(t => t.id === cloudTeam.id);
                if (existing) {
                    existing.name = cloudTeam.name || existing.name;
                    existing.abbr = cloudTeam.abbr || existing.abbr;
                    existing.color = cloudTeam.color || existing.color;
                    existing.textColor = cloudTeam.textColor || '#ffffff';
                    existing.logo = cloudTeam.logo || existing.logo;
                    existing.mascot = cloudTeam.mascot || existing.mascot;
                    existing.coach = cloudTeam.coach || existing.coach;
                    if (cloudTeam.players) {
                        cloudTeam.players.forEach(player => {
                            const existingPlayer = existing.players.find(p => p.id === player.id);
                            if (existingPlayer) {
                                existingPlayer.n = player.n || existingPlayer.n;
                                existingPlayer.na = player.na || existingPlayer.na;
                                existingPlayer.po = player.po || existingPlayer.po;
                                existingPlayer.st = player.st !== undefined ? player.st : existingPlayer.st;
                                existingPlayer.posFull = player.posFull || player.po || existingPlayer.posFull;
                                if (player.categories) existingPlayer.categories = player.categories;
                                else if (player.posFull || player.po) existingPlayer.categories = getPositionCategories(player.posFull || player.po);
                            } else {
                                const newPlayer = { ...player };
                                if (!newPlayer.categories && (newPlayer.posFull || newPlayer.po)) {
                                    newPlayer.categories = getPositionCategories(newPlayer.posFull || newPlayer.po);
                                }
                                if (!newPlayer.categories) newPlayer.categories = ['all'];
                                existing.players.push(newPlayer);
                            }
                        });
                    }
                } else {
                    const newTeam = { ...cloudTeam };
                    if (!newTeam.textColor) newTeam.textColor = '#ffffff';
                    newTeam.players = (cloudTeam.players || []).map(p => {
                        const player = { ...p };
                        if (!player.categories && (player.posFull || player.po)) {
                            player.categories = getPositionCategories(player.posFull || player.po);
                        }
                        if (!player.categories) player.categories = ['all'];
                        return player;
                    });
                    S.teams.push(newTeam);
                }
            });
        }
        saveState();
        renderAll();
        toast('✅ Rosters loaded');
    } catch(e) {
        toast('❌ Load failed: ' + e.message);
    }
}

// ============================================================
// SCOREBUG FUNCTIONS
// ============================================================
function updateScorebug() {
    const away = getTeam('away'), home = getTeam('home');
    const awayNameEl = document.getElementById('sbAwayName');
    const homeNameEl = document.getElementById('sbHomeName');
    if (awayNameEl) {
        awayNameEl.textContent = getTeamMascot(away);
        awayNameEl.style.color = away.textColor || '#ffffff';
    }
    if (homeNameEl) {
        homeNameEl.textContent = getTeamMascot(home);
        homeNameEl.style.color = home.textColor || '#ffffff';
    }
    const awayScoreEl = document.getElementById('sbAwayScore');
    const homeScoreEl = document.getElementById('sbHomeScore');
    if (awayScoreEl) awayScoreEl.textContent = S.as;
    if (homeScoreEl) homeScoreEl.textContent = S.hs;
    updateTimeoutDisplay();
    updateDDTicker();
    updateGameClockDisplay();
    updateGameStateBadge();
    updateUndoButton();
}

function updateGameClockDisplay() {
    const el = document.getElementById('gameClockDisplay');
    if (!el) return;
    const m = Math.floor(S.gc.rem / 60);
    const s = S.gc.rem % 60;
    el.textContent = `${m}:${String(s).padStart(2, '0')}`;
}

function updateDDTicker() {
    const el = document.getElementById('ddTicker');
    if (!el) return;
    if (S.gameState === 'FINAL') { el.textContent = '🏁 GAME FINAL'; el.style.background = '#dc2626'; return; }
    if (S.gameState === 'HALFTIME') { el.textContent = '⏸️ HALFTIME'; el.style.background = '#f59e0b'; return; }
    if (S.gameState === 'READY') {
        const team = getTeam(S.poss);
        el.textContent = `🏈 ${getTeamMascot(team)} HAS THE BALL • PRESS "▶ START" TO BEGIN`;
        el.style.background = '#334155'; return;
    }
    const team = getTeam(S.poss);
    const ord = { 1: '1ST', 2: '2ND', 3: '3RD', 4: '4TH' }[S.down] || (S.down + 'TH');
    el.innerHTML = `🏈 ${getTeamMascot(team)} BALL • ${ord} & ${S.dist}`;
    el.style.background = team.color || '#334155';
}

function updateGameStateBadge() {
    const pill = document.getElementById('livePill');
    const txt = document.getElementById('livePillText');
    if (!pill || !txt) return;
    pill.classList.remove('final', 'halftime');
    if (S.gameState === 'FINAL') { pill.classList.add('show', 'final'); txt.textContent = 'FINAL'; }
    else if (S.gameState === 'HALFTIME') { pill.classList.add('show', 'halftime'); txt.textContent = 'HALF'; }
    else if (S.gameState === 'FIRST_HALF' || S.gameState === 'SECOND_HALF' || S.gameState === 'OVERTIME') {
        pill.classList.add('show'); txt.textContent = 'LIVE';
    } else { pill.classList.remove('show'); }
}

function updateUndoButton() {
    const btn = document.getElementById('undoBtn');
    if (btn) {
        btn.disabled = S.undoStack.length === 0;
        btn.textContent = S.undoStack.length > 0 ? `↩ Undo (${S.undoStack.length})` : '↩ Undo';
    }
}

function updateTimeoutDisplay() {
    const away = S.timeouts.away || 0;
    const home = S.timeouts.home || 0;
    for (let i = 1; i <= 3; i++) {
        const awayDot = document.getElementById('awayTO' + i);
        if (awayDot) awayDot.className = 'timeout-dot' + (i > away ? ' used' : '');
        const homeDot = document.getElementById('homeTO' + i);
        if (homeDot) homeDot.className = 'timeout-dot' + (i > home ? ' used' : '');
    }
}

function chScore(side, delta) {
    if (side === 'away') S.as = Math.max(0, S.as + delta);
    else S.hs = Math.max(0, S.hs + delta);
    updateScorebug();
    saveState();
}

function chQuarter(delta) {
    const maxQ = S.md7 === '7v7' ? 2 : (S.gameState === 'OVERTIME' ? 5 : 4);
    S.q = Math.min(maxQ, Math.max(1, S.q + delta));
    if (delta !== 0) {
        S.gc.rem = S.gc.max || 480;
        S.gc.run = false;
        updateGameClockDisplay();
        toast(`⏱️ Qtr changed — Clock reset`);
    }
    updateScorebug();
    saveState();
}

function startGC() {
    if (S.gameState === 'FINAL' || S.gameState === 'HALFTIME' || S.gameState === 'READY') {
        toast('⏳ Cannot start clock');
        return;
    }
    S.gc.run = true;
    toast('▶️ Clock running');
    updateGameClockDisplay();
    saveState();
}

function pauseGC() {
    S.gc.run = false;
    toast('⏸️ Clock paused');
    updateGameClockDisplay();
    saveState();
}

function resetGC() {
    S.gc.run = false;
    S.gc.rem = S.gc.max || 480;
    updateGameClockDisplay();
    saveState();
}

function setPossession(side) {
    if (!['away','home'].includes(side)) { toast('❌ Invalid possession side'); return; }
    S.poss = side;
    const team = getTeam(side);
    toast(`🏈 ${getTeamMascot(team)} has the ball`);
    renderGame();
    updateScorebug();
    saveState();
}

    html += `<span class="label">🏈</span>`;
    html += `<button class="pos-btn ${S.poss === 'away' ? 'active' : ''}" onclick="setPossession('away')" style="${S.poss === 'away' ? 'background:' + awayColor + ';border-color:' + awayColor + ';' : 'border-color:' + awayColor + ';'}">${awayLogo} ${getTeamMascot(awayTeam)}</button>`;
    html += `<button class="pos-btn ${S.poss === 'home' ? 'active' : ''}" onclick="setPossession('home')" style="${S.poss === 'home' ? 'background:' + homeColor + ';border-color:' + homeColor + ';' : 'border-color:' + homeColor + ';'}">${homeLogo} ${getTeamMascot(homeTeam)}</button>`;
    html += `<button class="to-btn" onclick="useTimeout('away')">⏱ AWAY</button>`;
    html += `<button class="to-btn" onclick="useTimeout('home')">⏱ HOME</button>`;
    html += `<button class="to-btn injury-btn" onclick="injuryTimeout()">🆘 INJ</button>`;
    html += `<span class="clock-status ${S.gc.run ? 'running' : 'paused'}" id="clockStatusIndicator">${S.gc.run ? '▶ LIVE' : '⏸ PAUSED'}</span>`;
    html += `<span class="divider"></span>`;
    html += `<span class="label">DOWN</span>`;
    html += `<select onchange="setDown(this.value)">${[1,2,3,4].map(d => `<option ${d === S.down ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
    html += `<span class="label">YDS</span>`;
    html += `<input type="number" value="${S.dist}" min="1" max="99" style="width:32px;" onchange="setDist(this.value)" class="yd-input">`;
    html += `<button class="gc-btn" onclick="adjustYards(-1)">-1</button>`;

    html += `<button class="gc-btn twopt" onclick="quickScore('twopt')">2PT</button>`;
    html += `<button class="gc-btn pat" onclick="quickScore('pat')">PAT</button>`;
    html += `<button class="gc-btn safety" onclick="quickScore('safety')">Safe</button>`;
    html += `<button class="gc-btn load-btn" onclick="fnlCloudLoadGameState()">📥LOAD</button>`;
    html += `</div>`;

    html += '<div class="team-cards">';
    ['away','home'].forEach(side => {

        html += `<select onchange="setSideTeam('${side}', this.value)" style="border-color:${team.color};">${S.teams.map(t => `<option value="${t.id}" ${t.id === team.id ? 'selected' : ''}>${t.name}</option>`).join('')}</select>`;

        html += `<button class="unit-tab all-tab ${allActive}" onclick="setFilter('${side}','all')">ALL</button>`;
        if (S.md7 === 'tackle') {
            const offActive = filter === 'offense' ? 'active' : '';
            html += `<button class="unit-tab offense-tab ${offActive}" onclick="setFilter('${side}','offense')">OFF</button>`;
            const defActive = filter === 'defense' ? 'active' : '';
            html += `<button class="unit-tab defense-tab ${defActive}" onclick="setFilter('${side}','defense')">DEF</button>`;
            const stActive = filter === 'special' ? 'active' : '';
            html += `<button class="unit-tab special-tab ${stActive}" onclick="setFilter('${side}','special')">ST</button>`;

        getPlayers(side, filter).forEach(p => {
            let catBadge = '';

                const catClass = getCategoryClass(p.categories);
                const tooltipText = getCategoryTooltip(p.categories);
                const label = getCategoryLabel(p.categories);
                const badgeText = label.replace(/\[|\]/g, '');

            html += `<input value="${p.na}" onchange="updateGamePlayerFieldOnly('${side}','${p.id}','na',this.value)">`;
            html += `<div class="pos-select-wrapper">`;
            html += `<select onchange="updateGamePlayerPositionOnly('${side}','${p.id}',this.value)">`;

                const selected = (opt.value === currentPos) ? 'selected' : '';
                html += `<option ${selected} value="${opt.value}">${opt.display}</option>`;
            });
            html += `</select>`;
            html += `<button class="quick-add-btn" onclick="quickAddPositionOnly('${side}','${p.id}')">+</button>`;

    });

    updateClockStatusIndicator();

function updateGamePlayerFieldOnly(side, pid, field, val) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    p[field] = val;
    saveState();
    renderGame();
}

function updateGamePlayerPositionOnly(side, pid, val) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    p.posFull = val;
    p.po = val.split('/')[0].trim() || val;
    p.categories = getPositionCategories(val);
    saveState();
    renderGame();
    toast(`✅ ${p.na} set to ${val}`);
}

function quickAddPositionOnly(side, pid) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    const newPos = prompt('Enter position to add (e.g., CB, DE, SS):', '');
    if (!newPos) return;
    const cleanPos = normalizePosition(newPos.trim());
    if (!cleanPos) return;
    const currentPos = p.posFull || p.po || '';
    let newPosFull = currentPos;
    const parts = currentPos.split('/').map(s => s.trim());
    const normParts = parts.map(s => normalizePosition(s));
    if (normParts.includes(cleanPos)) {
        newPosFull = parts.filter((s, i) => normParts[i] !== cleanPos).join('/');
        toast(`❌ Removed ${cleanPos} from ${p.na}`);
    } else {
        newPosFull = currentPos ? currentPos + '/' + cleanPos : cleanPos;
        toast(`✅ Added ${cleanPos} to ${p.na}`);
    }
    p.posFull = newPosFull;
    p.po = newPosFull.split('/')[0].trim() || newPosFull;
    p.categories = getPositionCategories(newPosFull);
    saveState();
    renderGame();
}

function toggleStarterOnly(side, pid) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    p.st = !p.st;
    saveState();
    renderGame();
    toast(p.st ? `⭐ ${p.na} is now a starter` : `📋 ${p.na} is now on bench`);
}

function togglePinOnly(side, pid) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    p.pinned = !p.pinned;
    saveState();
    renderGame();
    toast(p.pinned ? `📌 ${p.na} pinned` : `📌 ${p.na} unpinned`);
}

function deletePlayerOnly(side, pid) {
    const team = getTeam(side);
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    if (!confirm(`Delete ${p.na} (#${p.n})?`)) return;
    team.players = team.players.filter(x => x.id !== pid);
    saveState();
    renderGame();
    toast(`🗑️ ${p.na} deleted`);
}

function setFilter(side, f) {
    if (side === 'away') S.ua = f;
    else S.uh = f;
    renderGame();
}

function updateClockStatusIndicator() {
    const el = document.getElementById('clockStatusIndicator');
    if (el) {
        el.textContent = S.gc.run ? '▶ LIVE' : '⏸ PAUSED';
        el.className = 'clock-status ' + (S.gc.run ? 'running' : 'paused');
    }
}

function applyColors() {
    const el = document.getElementById('scorebug');
    if (el) {
        el.style.setProperty('--accent', S.colors.accent);
        el.style.setProperty('--scorebug-bg', S.colors.scorebugBg);
        el.style.setProperty('--scorebug-text', S.colors.scorebugText);
    }
}

// ============================================================
// GAME CONTROLS
// ============================================================
function useTimeout(side) {
    if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
    const key = side === 'away' ? 'away' : 'home';
    if (S.timeouts[key] <= 0) { toast(`⚠️ ${side.toUpperCase()} has no timeouts`); return; }
    S.timeouts[key]--;
    S.gc.run = false;
    pushUndo();
    setLastEvent(`⏱️ ${side.toUpperCase()} TIMEOUT — ${S.timeouts[key]} remaining`, 'timeout');
    updateTimeoutDisplay();
    updateGameClockDisplay();
    saveState();
    toast(`⏱️ ${side.toUpperCase()} timeout — ${S.timeouts[key]} remaining`);
}

function injuryTimeout() {
    if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
    S.gc.run = false;
    setLastEvent('🆘 INJURY TIMEOUT — Clock paused', 'injury');
    updateGameClockDisplay();
    saveState();
    toast('🆘 Injury timeout — Clock paused');
}

function startGame() {
    if (S.gameState !== 'READY') { toast('⏳ Game already in progress'); return; }
    S.sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    S.gameState = 'FIRST_HALF';
    S.gc.rem = S.gc.max || 480;
    S.gc.run = false;
    S.q = 1;
    S.as = 0; S.hs = 0;
    S.down = 1; S.dist = 10; S.poss = 'home';
    S.scoringLog = []; S.penaltyLog = [];
    const timeoutCount = S.md7 === '7v7' ? 0 : 3;
    S.timeouts = { away: timeoutCount, home: timeoutCount };
    S.undoStack = [];
    pushUndo();
    setLastEvent('🏈 GAME STARTED — Q1', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('🏈 Game started!');
}

function setHalftime() {
    if (S.gameState !== 'FIRST_HALF' && S.gameState !== 'SECOND_HALF') { toast('⏳ Halftime only during a half'); return; }
    S.gameState = 'HALFTIME';
    S.gc.run = false;
    S.q = 2;
    const timeoutCount = S.md7 === '7v7' ? 0 : 3;
    S.timeouts = { away: timeoutCount, home: timeoutCount };
    pushUndo();
    setLastEvent('⏸️ HALFTIME — Timeouts reset', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('⏸️ Halftime');
}

function startSecondHalf() {
    if (S.gameState !== 'HALFTIME') { toast('⏳ Can only start 2nd half from HALFTIME'); return; }
    S.gameState = 'SECOND_HALF';
    S.gc.rem = S.gc.max || 480;
    S.gc.run = false;
    S.q = 3;
    const timeoutCount = S.md7 === '7v7' ? 0 : 3;
    S.timeouts = { away: timeoutCount, home: timeoutCount };
    pushUndo();
    setLastEvent('⏭️ SECOND HALF STARTED — Q3', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('⏭️ 2nd Half started');
}

function setOvertime() {
    if (S.gameState !== 'SECOND_HALF' && S.gameState !== 'OVERTIME') { toast('⏳ OT only during 2nd half'); return; }
    S.gameState = 'OVERTIME';
    S.gc.rem = 360;
    S.gc.run = false;
    S.q = 5;
    S.timeouts = { away: 1, home: 1 };
    pushUndo();
    setLastEvent('⏱️ OVERTIME', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('⏱️ Overtime');
}

function endGame() {
    if (S.gameState === 'READY') { toast('⏳ No game in progress'); return; }
    if (S.gameState === 'FINAL') { toast('⛔ Already final'); return; }
    if (!confirm('End game?')) return;
    S.gameState = 'FINAL';
    S.gc.run = false;
    const away = getTeam('away'), home = getTeam('home');
    S.gameHistory.push({ date: new Date().toISOString(), sessionId: S.sessionId, away: away.name, home: home.name, awayScore: S.as, homeScore: S.hs, log: [...S.scoringLog, ...S.penaltyLog] });
    pushUndo();
    setLastEvent(`🏁 GAME FINAL — ${getTeamMascot(away)} ${S.as} - ${S.hs} ${getTeamMascot(home)}`, 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('🏁 Game ended');
}

function resetGame() {
    if (!confirm('Reset game? Clears score, clock, logs.')) return;
    S.as = 0; S.hs = 0; S.q = 1; S.down = 1; S.dist = 10; S.poss = 'home';
    S.gameState = 'READY';
    S.gc.rem = S.gc.max || 480; S.gc.run = false;
    S.scoringLog = []; S.penaltyLog = [];
    S.timeouts = { away: 3, home: 3 };
    S.undoStack = []; S.sessionId = null;
    S.lastEvent = { text: '🏈 Ready — Set possession to begin', type: 'info' };
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    renderView();
    saveState();
    setLastEvent('🔄 Game reset', 'info');
    toast('🔄 Game reset');
    renderGame();
}

function setDown(v) { S.down = parseInt(v) || 1; updateDDTicker(); saveState(); }
function setDist(v) { S.dist = parseInt(v) || 1; updateDDTicker(); saveState(); }
function adjustYards(delta) { S.dist = Math.max(1, Math.min(99, S.dist + delta)); updateDDTicker(); saveState(); }

// ============================================================
// SCORING & QUICK ACTIONS
// ============================================================
function pushUndo() {
    const snapshot = {
        as: S.as, hs: S.hs,
        scoringLog: [...S.scoringLog],
        penaltyLog: [...S.penaltyLog],
        gameState: S.gameState,
        q: S.q, down: S.down, dist: S.dist, poss: S.poss,
        gc: { rem: S.gc.rem, run: S.gc.run },
        timeouts: { away: S.timeouts.away, home: S.timeouts.home }
    };
    S.undoStack.push(snapshot);
    if (S.undoStack.length > MAX_UNDO) S.undoStack.shift();
    saveState();
}

function undoLastEvent() {
    if (S.undoStack.length === 0) { toast('ℹ️ Nothing to undo'); return; }
    const prev = S.undoStack.pop();
    S.as = prev.as; S.hs = prev.hs;
    S.scoringLog = prev.scoringLog;
    S.penaltyLog = prev.penaltyLog;
    S.gameState = prev.gameState;
    S.q = prev.q; S.down = prev.down; S.dist = prev.dist; S.poss = prev.poss;
    S.gc.rem = prev.gc.rem; S.gc.run = prev.gc.run;
    S.timeouts.away = prev.timeouts.away; S.timeouts.home = prev.timeouts.home;
    updateUndoButton();
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    renderGame();
    setLastEvent('↩ Undo', 'undo');
    saveState();
    toast('↩ Undo successful');
}

function setLastEvent(text, type) {
    S.lastEvent = { text, type: type || 'info' };
    const el = document.getElementById('lastEvent');
    if (el) {
        el.innerHTML = text;
        el.style.borderColor = { td: '#dc2626', fg: '#2563eb', penalty: '#facc15', timeout: '#f97316', injury: '#dc2626' }[type] || 'var(--accent)';
    }
}

function recordScore(type, pts, teamSide, playerName) {
    if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
    if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
    pushUndo();
    if (teamSide === 'home') S.hs += pts;
    else S.as += pts;
    S.scoringLog.push({ type, team: teamSide, player: playerName, points: pts, time: S.gc.rem, quarter: S.q, id: Date.now() + '_' + Math.random().toString(36).slice(2,5) });
    const team = getTeam(teamSide);
    const emoji = type === 'td' ? '🏈' : type === 'fg' ? '🎯' : type === 'twopt' ? '➕' : type === 'pat' ? '🎯' : '⚡';
    const label = type === 'td' ? 'TOUCHDOWN' : type === 'fg' ? 'FIELD GOAL' : type === 'twopt' ? '2-POINT CONVERSION' : type === 'pat' ? 'PAT' : 'SAFETY';
    setLastEvent(`${emoji} ${label} — ${playerName || getTeamMascot(team)} (+${pts})`, type);
    updateScorebug();
    saveState();
    toast(`${label} +${pts} - ${playerName || getTeamMascot(team)}`);
}

function openPlayerPicker(title, callback) {
    const team = getTeam(S.poss);
    const overlay = document.createElement('div');
    overlay.className = 'pp-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10001;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);';
    const box = document.createElement('div');
    box.className = 'pp-box';
    box.style.cssText = 'background:var(--bg);color:var(--text);border-radius:10px;padding:14px;max-width:320px;width:100%;max-height:80vh;overflow-y:auto;border:2px solid var(--accent);box-shadow:0 8px 32px rgba(0,0,0,.5);';
    let html = `<h3>${title} — ${getTeamMascot(team)}</h3>`;
    const sorted = [...team.players].sort((a,b) => (parseInt(a.n)||999) - (parseInt(b.n)||999));
    if (sorted.length) {
        html += '<div class="pp-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;">';
        sorted.forEach(p => { html += `<button type="button" data-pid="${p.id}" style="background:#334155;color:#fff;border:1px solid #475569;border-radius:4px;padding:6px 3px;font-size:.6rem;cursor:pointer;line-height:1.2;">#${p.n || '-'}<br>${p.na}</button>`; });
        html += '</div>';
    } else {
        html += '<p style="margin-bottom:8px;opacity:.6;">No players on this roster yet.</p>';
    }
    html += `<div class="pp-actions" style="display:flex;gap:4px;">
        <input id="ppManual" placeholder="Or type a name / number" style="flex:1;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:.7rem;">
        <button type="button" class="hdr-btn" id="ppSkip" style="background:#334155;color:#fff;border:1px solid #475569;border-radius:16px;padding:4px 8px;font-size:.58rem;cursor:pointer;">Skip</button>
        <button type="button" class="hdr-btn" id="ppCancel" style="background:#dc2626;color:#fff;border:1px solid #dc2626;border-radius:16px;padding:4px 8px;font-size:.58rem;cursor:pointer;">Cancel</button>
    </div>`;
    box.innerHTML = html;
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close() { document.body.removeChild(overlay); }
    box.querySelectorAll('button[data-pid]').forEach(btn => {
        btn.onclick = () => {
            const p = team.players.find(x => x.id === btn.dataset.pid);
            close();
            callback(p ? p.na : getTeamMascot(team));
        };
    });
    box.querySelector('#ppSkip').onclick = () => { close(); callback(getTeamMascot(team)); };
    box.querySelector('#ppCancel').onclick = () => { close(); };
    const manual = box.querySelector('#ppManual');
    manual.focus();
    manual.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const v = e.target.value.trim();
            close();
            callback(v || getTeamMascot(team));
        }
    });
}

function quickScore(type) {
    const pts = type === 'td' ? 6 : type === 'fg' ? 3 : type === 'twopt' ? 2 : type === 'pat' ? 1 : 2;
    const label = type === 'td' ? 'Touchdown' : type === 'fg' ? 'Field Goal' : type === 'twopt' ? '2-Point Conversion' : type === 'pat' ? 'PAT' : 'Safety';
    openPlayerPicker(`${label} (+${pts})`, (playerName) => { recordScore(type, pts, S.poss, playerName); });
}

function quickCue(text, type) {
    setLastEvent(text, type || 'info');
    S.scoringLog.push({ type: 'note', team: S.poss, player: text, points: 0, time: S.gc.rem, quarter: S.q, id: Date.now() + '_note' });
    saveState();
    toast(`📢 ${text}`);
}

function quickPenalty() {
    if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
    if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
    openPlayerPicker('🚩 Penalty on', (playerName) => {
        pushUndo();
        S.penaltyLog.push({ type: 'flag', team: S.poss, player: playerName, time: S.gc.rem, quarter: S.q, id: Date.now() + '_penalty' });
        setLastEvent(`🚩 PENALTY — ${playerName}`, 'penalty');
        saveState();
        toast(`🚩 Penalty on ${playerName}`);
    });
}

function toggleRosterStarter(teamId, pidx) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team || !team.players[pidx]) return;
    team.players[pidx].st = !team.players[pidx].st;
    saveState();
    renderRoster();
    toast(team.players[pidx].st ? '⭐ Starter' : 'Bench');
}

function parseRosterText(teamId) {
    const tx = document.getElementById('parseArea').value.trim();
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    if (!tx) return toast('⚠️ Empty input');

    const positionMap = { 'Quick H':'WR','Quick':'WR','Big H':'TE','Q':'QB','TB':'RB','Y':'TE','Z':'WR' };
    const starters = ['Cameron Hayes','Cameron Howell','Josh Dimsdale','Viliami Finau','Fili Mose','Kava Afungia','Brendon Cary','Graven Mohetau','Jonathan Simkins','Mack Lineweaver','Marcus Turner','Abel Ditu'];

    const lines = tx.split('\n');
    const out = [];
    const seenPlayers = new Set();
    lines.forEach(l => {
        if (!l.trim()) return;
        let parts = l.split('\t').map(s => s.trim());
        if (parts.length < 2) {
            let match = l.match(/^#?\s*(\d+)\s+(.+?)\s+([A-Za-z/ ]+)$/);
            if (match) parts = [match[1], match[2], match[3]];
            else {
                match = l.match(/^(.+?)\s+([A-Za-z/ ]+)$/);
                if (match) parts = ['', match[1], match[2]];
                else parts = ['', l.trim(), ''];
            }
        }
        const number = parts[0] || '';
        const name = parts[1] || 'Unknown Player';
        let positionStr = parts[2] || '';
        positionStr = positionStr.replace(/[^A-Za-z/ ]/g,'').trim();
        let mappedPosition = positionMap[positionStr] || positionStr;
        if (positionStr === 'Quick H' || positionStr === 'Quick') mappedPosition = 'WR';
        if (positionStr === 'Big H') mappedPosition = 'TE';
        const isStarter = starters.some(s => name.toLowerCase().includes(s.toLowerCase()));
        const categories = getPositionCategories(mappedPosition);
        const primaryPos = mappedPosition.split('/')[0].trim() || 'QB';
        const key = (number + name).toLowerCase();
        if (seenPlayers.has(key)) return;
        seenPlayers.add(key);
        out.push({
            id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
            n: number,
            na: name,
            po: primaryPos,
            posFull: mappedPosition || positionStr,
            st: isStarter,
            nt: '', pron: '', ph: '', pinned: false,
            categories: categories
        });
    });
    out.sort((a,b) => (parseInt(a.n)||999) - (parseInt(b.n)||999));
    if (out.length) {
        team.players = out;
        saveState();
        renderRoster();
        toast(`✅ ${out.length} players parsed - ${out.filter(p => p.st).length} starters marked`);
    } else {
        toast('❌ No players found');
    }
}

function selectTeam(id) { S.cid = id; renderRoster(); }

function newTeam() {
    const name = prompt('Team name:');
    if (!name) return;
    S.teams.push({ id: 't' + Date.now(), name, abbr: '', color: '#1e3a5f', textColor: '#ffffff', logo: '', mascot: '', coach: '', players: [] });
    S.cid = S.teams[S.teams.length - 1].id;
    saveState();
    renderRoster();
}

function saveTeam() {
    const team = S.teams.find(t => t.id === S.cid);
    if (!team) return;
    team.name = document.getElementById('etn').value;
    team.abbr = document.getElementById('eta').value.toUpperCase();
    team.color = document.getElementById('etc').value;
    team.textColor = document.getElementById('ettc').value || '#ffffff';
    team.mascot = document.getElementById('etm').value;
    team.coach = document.getElementById('etco').value;
    saveState();
    renderRoster();
    updateScorebug();
    toast(`✅ ${team.name} saved`);
}

function previewTeamLogo(input) {
    const f = input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        const team = S.teams.find(t => t.id === S.cid);
        if (team) {
            team.logo = ev.target.result;
            document.getElementById('etl').src = ev.target.result;
            document.getElementById('etl').style.display = 'inline-block';
            saveState();
            updateScorebug();
            toast('✅ Logo uploaded!');
        }
    };
    r.readAsDataURL(f);
}

function deleteTeamById(id) {
    if (!confirm('Delete team?')) return;
    S.teams = S.teams.filter(t => t.id !== id);
    if (S.teams.length === 0) {
        S.teams.push({ id: 't' + Date.now(), name: 'New Team', abbr: '', color: '#1e3a5f', textColor: '#ffffff', logo: '', mascot: '', coach: '', players: [] });
    }
    normalizeState();
    S.cid = S.teams[0].id;
    saveState();
    renderRoster();
    updateScorebug();
}

function updatePlayerField(teamId, pidx, field, val) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team || !team.players[pidx]) return;
    const p = team.players[pidx];
    p[field] = val;
    if (field === 'posFull') {
        p.po = val.split('/')[0].trim() || val;
        p.categories = getPositionCategories(val);
    }
    saveState();
    renderGame();
}

function addPlayerToTeam(teamId) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    team.players.push({ id: 'p' + Date.now(), n: '', na: 'New Player', po: 'QB', st: false, nt: '', pron: '', ph: '', pinned: false, categories: ['all'], posFull: 'QB' });
    saveState();
    renderRoster();
}

function recategorizeTeam(teamId) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    let updated = 0;
    team.players.forEach(p => {
        const posStr = p.posFull || p.po || '';
        const newCats = getPositionCategories(posStr);
        if (JSON.stringify((p.categories || ['all']).sort()) !== JSON.stringify(newCats.sort())) {
            p.categories = newCats;
            updated++;
        }
    });
    saveState();
    renderRoster();
    toast(`🔄 ${updated} players recategorized`);
}

function setSideTeam(side, teamId) {
    if (side === 'away') S.awayId = teamId;
    else S.homeId = teamId;
    if (S.awayId === S.homeId) {
        const otherTeam = S.teams.find(t => t.id !== S.awayId);
        if (otherTeam) {
            if (side === 'away') S.homeId = otherTeam.id;
            else S.awayId = otherTeam.id;
        }
    }
    saveState();
    renderGame();
    updateScorebug();
}

    html += `<button class="hdr-btn" onclick="clearLogs()" style="background:#dc2626;">🗑️ Clear</button>`;
    html += '</div></div>';
    const events = [...S.scoringLog.map(e => ({...e, type:'score'})), ...S.penaltyLog.map(e => ({...e, type:'penalty'}))];
    if (events.length === 0) {
        html += '<p style="opacity:0.6;font-size:0.75rem;">No events in current game.</p>';
    } else {
        html += '<table style="width:100%;border-collapse:collapse;font-size:0.65rem;">';
        html += '<tr style="border-bottom:2px solid var(--border);"><th style="text-align:left;padding:3px;">Time</th><th style="text-align:left;padding:3px;">Team</th><th style="text-align:left;padding:3px;">Event</th></tr>';
        events.sort((a,b) => (b.time||0) - (a.time||0));
        events.forEach(ev => {
            const timeStr = ev.time !== undefined ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
            const teamLabel = ev.team === 'home' ? 'Home' : ev.team === 'away' ? 'Away' : '';
            const emoji = ev.type === 'td' ? '🏈' : ev.type === 'fg' ? '🎯' : ev.type === 'penalty' ? '🚩' : '';
            html += `<tr><td>${timeStr}</td><td>${teamLabel}</td><td>${emoji} ${ev.type.toUpperCase()} - ${ev.player || ''}</td></tr>`;
        });
        html += '</table>';
    }
    html += '</div>';
    document.getElementById('main').innerHTML = html;
}

function clearLogs() {
    if (!confirm('Clear current game logs?')) return;
    S.scoringLog = []; S.penaltyLog = [];
    saveState();
    renderLog();
    toast('🗑️ Logs cleared');
}

function renderScript() {
    let html = '<div class="panel"><div class="panel-header">';
    html += '<h3>🎙️ SCRIPT</h3>';
    html += '<div class="panel-actions">';
    html += `<button class="hdr-btn" onclick="fnlCloudLoadScriptOnly()">📥 LOAD SCRIPT</button>`;
    html += '</div></div>';
    html += `<textarea id="scriptEditor" style="width:100%;height:300px;padding:8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.8rem;">${S.script || ''}</textarea>`;
    html += `<div style="display:flex;gap:4px;margin-top:4px;">`;
    html += `<button class="hdr-btn" onclick="saveScript()">💾 Save</button>`;
    html += `<button class="hdr-btn" onclick="printScript()">🖨️ Print</button>`;
    html += `<button class="hdr-btn" onclick="clearScript()" style="background:#dc2626;">🗑️ Clear</button>`;
    html += `</div></div>`;
    document.getElementById('main').innerHTML = html;
}

async function fnlCloudLoadScriptOnly() {
    if (!confirm('Load script from cloud?')) return;
    try {
        const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
        if (!resp.ok) throw new Error('Load failed');
        const data = await resp.json();
        if (data.script !== undefined) {
            S.script = data.script;
            saveState();
            renderAll();
            toast('✅ Script loaded');
        } else { toast('ℹ️ No script found'); }
    } catch(e) { toast('❌ Load failed: ' + e.message); }
}

function saveScript() {
    const el = document.getElementById('scriptEditor');
    if (el) { S.script = el.value; saveState(); toast('✅ Script saved'); }
}

function printScript() {
    const w = window.open('', '_blank');
    if (!w) { toast('⚠️ Enable pop-ups to print'); return; }
    w.document.write('<html><head><title>Script</title></head><body><pre>' + (S.script || '') + '</pre></body></html>');
    w.document.close();
    w.print();
}

function clearScript() {
    if (!confirm('Clear script?')) return;
    S.script = '';
    const el = document.getElementById('scriptEditor');
    if (el) el.value = '';
    saveState();
    toast('🗑️ Cleared');
}

function renderAdmin() {
    let html = '<div class="panel"><div class="panel-header">';
    html += '<h3>⚙️ ADMIN</h3>';
    html += '<div class="panel-actions">';
    html += `<button class="hdr-btn" onclick="fnlCloudLoadSettingsOnly()">📥 LOAD SETTINGS</button>`;
    html += '</div></div>';
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">';
    html += `<button class="hdr-btn" onclick="toggleTheme()">Toggle Theme</button>`;
    html += `<button class="hdr-btn" onclick="toggleOutdoor()">Toggle Outdoor</button>`;
    html += `</div>`;
    html += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">`;
    html += `<button class="hdr-btn" onclick="S.md7='tackle';saveState();renderAll();">${S.md7 === 'tackle' ? '✅' : ''} Tackle</button>`;
    html += `<button class="hdr-btn" onclick="S.md7='7v7';saveState();renderAll();">${S.md7 === '7v7' ? '✅' : ''} 7v7</button>`;
    html += `</div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:400px;">`;
    html += `<div><label style="font-size:0.6rem;font-weight:600;">Scorebug BG</label><input type="color" value="${S.colors.scorebugBg}" oninput="S.colors.scorebugBg=this.value;applyColors();saveState()" style="width:100%;height:30px;"></div>`;
    html += `<div><label style="font-size:0.6rem;font-weight:600;">Accent</label><input type="color" value="${S.colors.accent}" oninput="S.colors.accent=this.value;applyColors();saveState()" style="width:100%;height:30px;"></div>`;
    html += `</div>`;
    html += `<div style="display:flex;gap:4px;margin-top:6px;">`;
    html += `<button class="hdr-btn" onclick="exportBackup()">📤 Export</button>`;
    html += `<button class="hdr-btn" onclick="document.getElementById('impf').click()">📥 Import</button>`;
    html += `<input type="file" id="impf" accept=".json" style="display:none;" onchange="importBackup(this)">`;
    html += `<button class="hdr-btn" onclick="fnlCloudSaveAll()" style="background:#16a34a;">💾 Save All to Cloud</button>`;
    html += `</div>`;
    html += `<div style="display:flex;gap:4px;margin-top:6px;">`;
    html += `<button class="hdr-btn" onclick="fnlCloudLoadGameState()">📥 Game State</button>`;
    html += `<button class="hdr-btn" onclick="fnlCloudLoadRostersOnly()">📥 Rosters</button>`;
    html += `</div></div>`;
    document.getElementById('main').innerHTML = html;
}

async function fnlCloudLoadSettingsOnly() {
    if (!confirm('Load settings from cloud?')) return;
    try {
        const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
        if (!resp.ok) throw new Error('Load failed');
        const data = await resp.json();
        if (data.colors) {
            S.colors.scorebugBg = data.colors.scorebugBg || S.colors.scorebugBg;
            S.colors.scorebugText = data.colors.scorebugText || S.colors.scorebugText;
            S.colors.accent = data.colors.accent || S.colors.accent;
            S.colors.teamCardAway = data.colors.teamCardAway || S.colors.teamCardAway;
            S.colors.teamCardHome = data.colors.teamCardHome || S.colors.teamCardHome;
        }
        if (data.md7 !== undefined) S.md7 = data.md7;
        if (data.gc && data.gc.max !== undefined) S.gc.max = data.gc.max;
        saveState();
        renderAll();
        applyColors();
        toast('✅ Settings loaded');
    } catch(e) { toast('❌ Load failed: ' + e.message); }
}

function exportBackup() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
    a.download = 'fnl_backup.json';
    a.click();
}

function importBackup(input) {
    const f = input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        try {
            S = JSON.parse(ev.target.result);
            normalizeState();
            saveState();
            renderAll();
            toast('✅ Restored');
        } catch(e) { toast('❌ Invalid file'); }
    };
    r.readAsText(f);
}

function toggleTheme() {
    S.md = S.md === 'dark' ? 'light' : 'dark';
    if (S.md === 'dark') {
        document.documentElement.style.setProperty('--bg', '#0f172a');
        document.documentElement.style.setProperty('--surface', '#1e293b');
        document.documentElement.style.setProperty('--text', '#f1f5f9');
        document.documentElement.style.setProperty('--border', '#334155');
        document.getElementById('themeBtn').textContent = '☀️ Light';
    } else {
        document.documentElement.style.setProperty('--bg', '#f1f5f9');
        document.documentElement.style.setProperty('--surface', '#e2e8f0');
        document.documentElement.style.setProperty('--text', '#0f172a');
        document.documentElement.style.setProperty('--border', '#94a3b8');
        document.getElementById('themeBtn').textContent = '🌙 Dark';
    }
    saveState();
}

function toggleOutdoor() {
    S.outdoor = !S.outdoor;
    document.body.style.fontSize = S.outdoor ? '20px' : '14px';
    const btn = document.getElementById('outdoorBtn');
    if (btn) btn.textContent = S.outdoor ? '🌤 ON' : '🌤';
    toast(S.outdoor ? '🌤 Outdoor ON' : '🌤 Outdoor OFF');
    saveState();
}

function renderClients() {
    let html = '<div class="panel"><div class="panel-header">';
    html += '<h3>👥 CLIENTS</h3>';
    html += '</div></div>';
    const keys = Object.keys(S.cp);
    if (keys.length === 0) {
        html += '<p style="opacity:0.6;font-size:0.7rem;margin-top:4px;">No clients yet. Add one below.</p>';
    } else {
        keys.forEach(pin => {
            const client = S.cp[pin];
            const isActive = (pin === S.ap);
            html += `<div class="client-item" style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;${isActive ? 'border-color: var(--accent); background: rgba(250,204,21,0.05);' : ''}">`;
            html += `<span style="font-weight:700;font-size:0.7rem;flex:1;">${pin}</span>`;
            html += `<span style="flex:2;font-size:0.7rem;">${client.n || 'Unnamed'}</span>`;
            html += `<button class="hdr-btn" onclick="selectClient('${pin}')" style="font-size:0.5rem;padding:2px 6px;${isActive ? 'background:var(--accent);color:#000;' : ''}">${isActive ? '✅' : 'Select'}</button>`;
            html += `<button class="hdr-btn" style="background:#dc2626;font-size:0.5rem;padding:2px 6px;" onclick="deleteClient('${pin}')">🗑️</button>`;
            html += '</div>';
        });
    }
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">';
    html += '<button class="hdr-btn" onclick="addClient()">➕ Add Client</button> ';
    html += '<button class="hdr-btn" onclick="showAllPINs()">🔑 Show PINs</button>';
    html += '</div></div>';
    document.getElementById('main').innerHTML = html;
}

function addClient() {
    const pin = prompt('Enter PIN (4-6 characters):');
    if (!pin || pin.length < 4) return toast('PIN must be at least 4 characters');
    const name = prompt('Client name:');
    if (!name) return;
    S.cp[pin.toUpperCase()] = { n: name, l: '', logo: '' };
    S.ap = pin.toUpperCase();
    saveState();
    renderClients();
    toast('✅ Client added');
}

function deleteClient(pin) {
    if (!confirm('Delete client?')) return;
    delete S.cp[pin];
    if (S.ap === pin) S.ap = '';
    saveState();
    renderClients();
}

function selectClient(pin) {
    if (!S.cp[pin]) return toast('Client not found');
    S.ap = pin;
    saveState();
    renderClients();
    toast(`✅ ${S.cp[pin].n} is now active`);
}

function showAllPINs() {
    const ks = Object.keys(S.cp);
    if (!ks.length) return toast('No clients');
    alert('Client PINs:\n' + ks.map(p => `${p} → ${S.cp[p].n}`).join('\n'));
}

function updateHeaderBranding() {
    const subtitle = document.getElementById('brandSubtitle');
    if (subtitle) {
        if (S.ap && S.cp[S.ap]) {
            subtitle.textContent = S.cp[S.ap].n + ' | PA CONSOLE';
        } else {
            subtitle.textContent = 'PA CONSOLE';
        }
    }
}

function printLU() {
    let html = '<html><head><title>Starting Lineups</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{border:1px solid #000;padding:4px}</style></head><body>';
    ['away','home'].forEach(side => {
        const t = getTeam(side);
        html += `<h2>${side === 'away' ? 'Away' : 'Home'}: ${getTeamMascot(t)}</h2><table><tr><th>#</th><th>Name</th><th>Pos</th></tr>`;
        t.players.filter(p => p.st).forEach(p => { html += `<tr><td>${p.n}</td><td>${p.na}</td><td>${p.posFull || p.po}</td></tr>`; });
        html += '</table>';
    });
    html += '</body></html>';
    const w = window.open('', '_blank');
    if (!w) { toast('⚠️ Enable pop-ups to print'); return; }
    w.document.write(html);
    w.document.close();
    w.focus();
    w.print();
}

function printRoster(teamId) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    let html = `<html><head><title>${team.name} Roster</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>`;
    html += `<h2>${team.name} Roster</h2>`;
    html += '<table><tr><th>#</th><th>Name</th><th>Pos</th><th>Starter</th></tr>';
    team.players.forEach(p => {
        html += `<tr><td>${p.n}</td><td>${p.na}</td><td>${p.posFull || p.po}</td><td>${p.st ? 'Yes' : 'No'}</td></tr>`;
    });
    html += '</table></body></html>';
    const w = window.open('', '_blank');
    if (!w) { toast('⚠️ Enable pop-ups to print'); return; }
    w.document.write(html);
    w.document.close();
    w.focus();
    w.print();
}

function exportTeamCSV(teamId) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    let csv = 'Number,Name,Position,Starter\n';
    team.players.forEach(p => {
        csv += `"${p.n}","${p.na}","${p.posFull || p.po}","${p.st ? 'Yes' : 'No'}"\n`;
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = team.name + '.csv';
    a.click();
}

function uploadRosterFile(teamId, input) {
    const f = input.files[0];
    if (!f) return;
    if (f.name.endsWith('.docx')) { toast('⚠️ .docx not supported. Use .txt or .csv'); return; }
    const r = new FileReader();
    r.onload = ev => {
        document.getElementById('parseArea').value = ev.target.result;
        parseRosterText(teamId);
    };
    r.readAsText(f);
}

function toggleScorebugMode() {
    const sb = document.getElementById('scorebug');
    const btn = document.getElementById('sbModeBtn');
    if (!sb) return;
    if (S.scorebugMode === 'full') {
        S.scorebugMode = 'compact';
        sb.classList.add('compact');
        if (btn) btn.textContent = '📐';
        toast('📐 Compact mode');
    } else {
        S.scorebugMode = 'full';
        sb.classList.remove('compact');
        if (btn) btn.textContent = '📏';
        toast('📏 Full mode');
    }
    saveState();
}

function toggleScorebugDisplay() {
    const sb = document.getElementById('scorebug');
    if (sb) { sb.style.display = sb.style.display === 'none' ? 'flex' : 'none'; }
}

function uploadScorebugLogo(side) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        const f = input.files[0];
        if (!f || !f.type.startsWith('image/')) return toast('📷 Image required');
        const r = new FileReader();
        r.onload = ev => {
            const team = getTeam(side);
            if (team) { team.logo = ev.target.result; saveState(); updateScorebug(); toast('✅ Logo updated'); }
        };
        r.readAsDataURL(f);
    };
    input.click();
}

function updateTeamColor(side, color) {
    const team = getTeam(side);
    if (!team) return;
    team.color = color;
    saveState();
    updateScorebug();
    renderGame();
    toast(`✅ ${team.name} color updated`);
}

function updateWallClock() {
    const n = new Date();
    let h = n.getHours();
    const m = String(n.getMinutes()).padStart(2, '0');
    const s = String(n.getSeconds()).padStart(2, '0');
    const a = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const el = document.getElementById('wallClock');
    if (el) el.textContent = `${h}:${m}:${s} ${a}`;
}
setInterval(updateWallClock, 1000);
updateWallClock();

function updateWeather() {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph')
        .then(r => r.json()).then(d => {
            if (d.current) {
                const el = document.getElementById('weatherHeader');
                if (el) el.textContent = `🌤 ${Math.round(d.current.temperature_2m)}°F | 💨 ${Math.round(d.current.wind_speed_10m)}mph`;
            }
        }).catch(() => {});
}
updateWeather();

document.addEventListener('keydown', e => {
    const typing = ['input','select','textarea'].includes((e.target.tagName||'').toLowerCase()) || e.target.isContentEditable;
    if (e.code === 'Space' && !typing) { e.preventDefault(); if (S.gc.run) pauseGC(); else startGC(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); fnlCloudSaveAll(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undoLastEvent(); }
});

// ============================================================
// INIT
// ============================================================
loadState();
renderAll();
updateScorebug();
updateGameClockDisplay();
updateGameStateBadge();
applyColors();
updateUndoButton();
updateHeaderBranding();
saveState();

const sb = document.getElementById('scorebug');
if (sb && S.scorebugMode === 'compact') {
    sb.classList.add('compact');
}

console.log('FNL started successfully!');
</script>
