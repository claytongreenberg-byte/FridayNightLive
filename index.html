<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – PA Console</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
                /* FIX: Client Header Logo Size */
        .client-header-logo {
            width: 36px !important;
            height: 36px !important;
            max-width: 36px !important;
            max-height: 36px !important;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: #fff;
            margin-left: 8px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .client-header-name {
            font-size: 0.6rem;
            color: var(--accent);
            font-weight: 700;
            margin-left: 6px;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        :root{--accent:#facc15;--bg:#f1f5f9;--surface:#e2e8f0;--text:#0f172a;--border:#94a3b8;--footer-bg:#1a1a1a;--footer-text:#f1f5f9;--scorebug-bg:#0d0d1a;--scorebug-text:#ffffff;--team-card-away:#e2e8f0;--team-card-home:#e2e8f0;--badge-offense:#2563eb;--badge-defense:#dc2626;--badge-special:#16a34a;--badge-both:#8b5cf6;--badge-other:#6b7280}
        html,body{height:100%;overflow:hidden}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:14px}
        select{-webkit-appearance:menulist;appearance:menulist}
        header{background:linear-gradient(180deg,#1a3a0e,#0f2a08);padding:6px 10px;border-bottom:3px solid var(--accent);flex-shrink:0}
        .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
       .hdr-top-left{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;position:relative;z-index:1000}
        .brand-logo{height:32px;width:auto;max-width:60px;object-fit:contain;flex-shrink:0}
        .brand-text{display:flex;flex-direction:column;line-height:1.1}
        .brand-text h1{font-size:.85rem;color:#fff;white-space:nowrap}
        .brand-text p{font-size:.5rem;color:var(--accent);opacity:.9}
        .hdr-top-right{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
        .wall-clock,.weather-pill{color:var(--accent);font-weight:700;font-size:.6rem;background:rgba(0,0,0,.4);border:1px solid var(--accent);border-radius:5px;padding:2px 6px;white-space:nowrap}
        .hdr-btn{background:#334155;color:#fff;border:1px solid #475569;border-radius:16px;padding:4px 8px;font-size:.58rem;cursor:pointer;white-space:nowrap;min-height:24px;transition:all .15s;display:inline-flex;align-items:center;gap:4px;border-radius:16px!important}
        .hdr-btn:hover{background:#475569;transform:scale(1.02)}
        .hdr-btn.save-btn{background:#16a34a;border-color:#16a34a}
        .hdr-btn.save-btn:hover{background:#15803d}
        .hdr-btn.undo-btn{background:#dc2626;border-color:#dc2626}
        .hdr-btn.undo-btn:hover{background:#b91c1c}
        .hdr-btn.undo-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
        .hdr-bottom{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px}
        .save-status{font-size:.5rem;color:var(--accent);background:rgba(0,0,0,.4);padding:2px 8px;border-radius:10px;white-space:nowrap}
        .save-status.saved{color:#4ade80}
        .save-status.offline{color:#facc15}
        .scorebug-wrap{width:100%;display:flex;flex-direction:column;gap:4px}
        .scorebug{position:relative;display:flex;align-items:stretch;justify-content:center;gap:0;background:var(--scorebug-bg);border:3px solid var(--accent);border-radius:12px;padding:12px 18px 10px;flex-wrap:nowrap;width:100%;box-shadow:0 4px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);--sb-text:#ffffff;min-height:160px;transition:all .3s ease}
        .scorebug.compact{padding:6px 10px 4px;min-height:60px;border-radius:8px}
        .scorebug.compact .sb-block{padding:0 6px}
        .scorebug.compact .sb-team-name{font-size:1.2rem!important}
        .scorebug.compact .sb-val{font-size:2rem;min-width:30px}
        .scorebug.compact .game-clock{font-size:2rem}
        .scorebug.compact .sb-qtr{font-size:1.8rem}
        .scorebug.compact .sb-label{font-size:.5rem}
        .scorebug.compact .sb-btn{width:20px;height:20px;font-size:8px}
        .scorebug.compact .sb-game-btns button{font-size:.4rem;padding:2px 6px;min-height:18px;min-width:28px}
        .scorebug.compact .last-event{font-size:.55rem;min-height:22px;padding:2px 8px;max-width:200px}
        .scorebug.compact .timeout-display{display:none}
        .scorebug.compact .sb-row{gap:2px}
        /* FIX: Shrink mode/toggle buttons in compact mode */
.scorebug.compact ~ .sb-mode-btn, 
.scorebug.compact ~ .sb-toggle-btn,
.hdr-bottom .sb-mode-btn.compact,
.hdr-bottom .sb-toggle-btn.compact {
    width: 20px !important;
    height: 20px !important;
    font-size: 10px !important;
    min-width: 20px !important;
    min-height: 20px !important;
    margin-top: 4px;
}
        /* FIX: Compact Mode Buttons */
        .scorebug.compact .sb-mode-btn,
        .scorebug.compact .sb-toggle-btn {
            width: 20px;
            height: 20px;
            font-size: 10px;
            margin-top: 2px;
        }
        .sb-network-tag{position:absolute;top:-11px;left:16px;background:var(--accent);color:#000;font-weight:900;font-size:.65rem;letter-spacing:2px;padding:3px 14px;border-radius:4px;text-transform:uppercase;box-shadow:0 2px 12px rgba(0,0,0,.6)}
        .live-pill{position:absolute;top:-11px;right:16px;background:#dc2626;color:#fff;font-weight:800;font-size:.55rem;padding:3px 14px;border-radius:10px;display:none;align-items:center;gap:6px;letter-spacing:1px;box-shadow:0 2px 12px rgba(0,0,0,.6)}
        .live-pill.show{display:inline-flex}
        .live-pill.final{background:#334155}
        .live-pill.halftime{background:#f59e0b}
        .live-pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:sbpulse 1s infinite}
        .live-pill.final .dot,.live-pill.halftime .dot{animation:none}
        @keyframes sbpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.7)}}
        .sb-block{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;border-right:1px solid rgba(255,255,255,.06);flex:1 1 0;min-width:60px;cursor:pointer;transition:all .15s}
        .sb-block:hover{background:rgba(255,255,255,.03)}
        .sb-block:active{transform:scale(.98)}
        .sb-block:last-child{border-right:none}
        .sb-block.score-block{flex:1.5}
        .sb-block.clock-block{flex:.9}
        .sb-block.game-block{flex:1.8}
        .sb-team-name{font-size:2.2rem;font-weight:900;color:var(--sb-text);letter-spacing:1px;text-align:center;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6);word-wrap:break-word;max-width:140px}
        .sb-label{font-size:.7rem;font-weight:800;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:2px;margin-top:0;text-shadow:0 1px 4px rgba(0,0,0,.8)}
        .sb-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}
        .sb-val{font-size:3.6rem;font-weight:900;color:var(--sb-text);min-width:48px;text-align:center;text-shadow:0 0 40px rgba(255,255,255,.05);line-height:1}
        .sb-qtr{font-size:3.2rem;font-weight:900;color:var(--accent);text-shadow:0 0 30px rgba(250,204,21,.2)}
        .game-clock{font-family:'Courier New',monospace;font-size:3.6rem;font-weight:900;color:#00ff88;text-shadow:0 0 40px rgba(0,255,136,.2),0 0 80px rgba(0,255,136,.05);letter-spacing:2px}
        .game-clock.paused{color:var(--sb-text);opacity:.4}
        .game-clock.clock-warning{color:#ff6b6b;animation:clockPulse 1s infinite}
        @keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.3}}
        .sb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;width:28px;height:28px;border-radius:50%;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;border-radius:50%!important}
        .sb-btn:hover{background:var(--accent);color:#000;transform:scale(1.1)}
        .sb-btn:active{transform:scale(.9)}
        .sb-game-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
        .sb-game-btns button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:5px 12px;font-size:.6rem;font-weight:700;cursor:pointer;min-height:28px;min-width:40px;transition:all .15s;border-radius:10px!important}
        .sb-game-btns button:hover{background:var(--accent);color:#000;transform:scale(1.04)}
        .sb-game-btns button:active{transform:scale(.95)}
        .sb-game-btns button.half-active{background:#f59e0b;color:#000}
        .sb-game-btns button.final-active{background:#dc2626;color:#fff}
        .sb-game-btns button:disabled{opacity:.2;cursor:not-allowed;transform:none!important}
        .dd-ticker{padding:5px 14px;border-radius:6px;font-weight:800;font-size:.8rem;text-align:center;color:#fff;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.8);background:#1a1a2e;min-height:28px;border:1px solid rgba(255,255,255,.05);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .timeout-display{display:flex;gap:4px;align-items:center;margin-top:3px}
        .timeout-dot{width:10px;height:10px;border-radius:50%;background:#4ade80;transition:all .3s;box-shadow:0 0 10px rgba(74,222,128,.4)}
        .timeout-dot.used{background:#334155;opacity:.25;box-shadow:none}
        .timeout-zero{font-size:.6rem;font-weight:800;color:#f87171;letter-spacing:.5px}
        .timeout-label{font-size:.45rem;color:var(--sb-text);opacity:.4;letter-spacing:.5px}
        .last-event{background:rgba(0,0,0,.7);border:2px solid var(--accent);border-radius:8px;padding:6px 14px;text-align:center;font-weight:800;font-size:.85rem;color:#fff;min-height:34px;display:flex;align-items:center;justify-content:center;transition:all .3s;flex:1;max-width:450px;box-shadow:inset 0 0 40px rgba(250,204,21,.05);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        nav{background:#1a1a1a;display:flex;gap:4px;padding:0 10px;flex-shrink:0;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.05)}
        .nav-link{background:0 0;border:none;color:#999;padding:6px 10px;font-weight:700;cursor:pointer;font-size:.65rem;white-space:nowrap;transition:all .15s;border-radius:6px 6px 0 0!important}
        .nav-link:hover{color:#fff}
        .nav-link.active{background:var(--accent);color:#000}
        main{flex:1;overflow:auto;padding:6px}
        .panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px}
        .roster-layout{display:flex;gap:8px;height:100%}
        .team-sidebar{width:150px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;overflow-y:auto}
        .team-item{padding:4px 6px;border-radius:4px;margin-bottom:2px;cursor:pointer;font-weight:600;font-size:.6rem;color:var(--text)}
        .team-item.active{background:var(--accent);color:#000}
        .roster-workspace{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;overflow-y:auto}
        .cat-badge{font-size:.55rem;font-weight:800;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block;cursor:help;letter-spacing:.3px;border:1px solid rgba(255,255,255,.2);text-shadow:0 1px 2px rgba(0,0,0,.2);transition:all .2s;line-height:1.3;border-radius:4px!important}
        .cat-badge:hover{transform:scale(1.1);box-shadow:0 2px 8px rgba(0,0,0,.3)}
        .cat-badge.offense{background:var(--badge-offense);color:#fff}
        .cat-badge.defense{background:var(--badge-defense);color:#fff}
        .cat-badge.special{background:var(--badge-special);color:#fff}
        .cat-badge.both{background:var(--badge-both);color:#fff}
        .cat-badge.other{background:var(--badge-other);color:#fff}
        .cat-legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border);margin-bottom:8px;font-size:.55rem;font-weight:600}
        .cat-legend .legend-item{display:flex;align-items:center;gap:4px}
        footer{background:var(--footer-bg);color:var(--footer-text);padding:3px 8px;text-align:center;font-size:.5rem;flex-shrink:0;border-top:1px solid var(--accent)}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:6px 14px;border-radius:16px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;font-size:.75rem;backdrop-filter:blur(10px)}
        .toast.show{opacity:1}
        .player-list-body{flex:1;overflow-y:auto;padding:4px 5px}
        .player-row{display:grid;grid-template-columns:4px 28px 1fr 80px 80px 22px 22px 22px;gap:3px;align-items:center;padding:4px 4px;border-bottom:1px solid rgba(0,0,0,.08);font-size:.6rem;border-left:4px solid transparent;min-height:32px;background:rgba(255,255,255,.4);border-radius:4px;margin-bottom:2px}
        .player-row:last-child{border-bottom:none}
        .player-row input,.player-row select{background:rgba(255,255,255,.7);border:1px solid var(--border);color:#0a0a0a;font-weight:700;padding:2px 4px;width:100%;font-size:.55rem;border-radius:3px;min-width:0;height:24px}
        .player-row input:focus,.player-row select:focus{border-color:var(--accent);outline:2px solid rgba(250,204,21,.3);background:#fff}
        .player-row.starter{background:rgba(251,191,36,.12);border-left:4px solid var(--accent)}
        .player-row.pinned{background:rgba(250,204,21,.15);border-left-color:var(--accent)!important}
        .player-row.category-offense{border-left-color:var(--badge-offense)}
        .player-row.category-defense{border-left-color:var(--badge-defense)}
        .player-row.category-special{border-left-color:var(--badge-special)}
        .player-row.category-both{border-left-color:var(--badge-both)}
        .player-row.category-other{border-left-color:#c9a227}
        .st-toggle,.pin-btn{background:rgba(255,255,255,.5);border:1px solid var(--border);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:.5rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
        .st-toggle:hover,.pin-btn:hover{transform:scale(1.1)}
        .st-toggle.active{background:var(--accent);color:#000;border-color:var(--accent)}
        .pin-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
        .delete-btn{background:0 0;border:1px solid var(--border);border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#dc2626;border-radius:50%!important}
        .delete-btn:hover{background:#dc2626;color:#fff;border-color:#dc2626}
        .quick-cues{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;background:rgba(250,204,21,.08);border:2px solid var(--accent);border-radius:8px;margin-bottom:8px}
        .quick-cues button{font-size:.7rem;padding:6px 14px;min-height:32px;border-radius:6px;background:#334155;color:#fff;border:2px solid #475569;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;flex:1 0 auto;min-width:80px;border-radius:6px!important}
        .quick-cues button:hover{transform:scale(1.03);border-color:var(--accent);background:#475569}
        .quick-cues button:active{transform:scale(.95)}
        .quick-cues button.flag{background:#dc2626;border-color:#b91c1c}
        .quick-cues button.flag:hover{background:#b91c1c}
        .game-controls-row{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding:4px 10px;background:var(--bg);border:2px solid var(--accent);border-radius:8px;margin-bottom:6px;box-shadow:0 2px 16px rgba(250,204,21,.08);min-height:40px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;white-space:nowrap}
        .game-controls-row::-webkit-scrollbar{height:4px}
        .game-controls-row::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
        .game-controls-row .label{font-weight:800;font-size:.5rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text);opacity:.4;margin-right:1px;white-space:nowrap}
        .game-controls-row .divider{width:1px;height:24px;background:var(--border);opacity:.2;margin:0 2px;flex-shrink:0}
        .game-controls-row .pos-btn{padding:2px 10px;font-size:.65rem;font-weight:700;min-width:48px;border-radius:6px;border:2px solid #475569;cursor:pointer;transition:all .15s;background:#334155;color:#fff;display:flex;align-items:center;gap:3px;justify-content:center;white-space:nowrap;flex-shrink:0;border-radius:6px!important}
        .game-controls-row .pos-btn:hover{transform:scale(1.04)}
        .game-controls-row .pos-btn:active{transform:scale(.95)}
        .game-controls-row .pos-btn.active{color:#fff;border-color:var(--accent);box-shadow:0 0 20px rgba(250,204,21,.15)}
        .game-controls-row .pos-btn .team-logo{width:14px;height:14px;border-radius:50%;object-fit:cover}
        .game-controls-row .to-btn{padding:2px 8px;font-size:.5rem;font-weight:700;border-radius:6px;border:0;cursor:pointer;background:#f97316;color:#fff;transition:all .15s;white-space:nowrap;flex-shrink:0;border-radius:6px!important}
        .game-controls-row .to-btn:hover{transform:scale(1.04);background:#ea580c}
        .game-controls-row .to-btn.injury-btn{background:#dc2626}
        .game-controls-row .to-btn.injury-btn:hover{background:#b91c1c}
        .game-controls-row .clock-status{font-size:.5rem;padding:2px 8px;background:rgba(0,0,0,.05);border-radius:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
        .game-controls-row .clock-status.running{color:#4ade80;opacity:1}
        .game-controls-row .clock-status.paused{color:#facc15;opacity:1}
        .game-controls-row select,.game-controls-row input{padding:2px 4px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.5rem;min-height:20px;flex-shrink:0}
        .game-controls-row .yd-input{width:32px}
        .game-controls-row .gc-btn{background:#334155;color:#fff;border:1px solid #475569;border-radius:6px;padding:2px 5px;font-weight:700;font-size:.5rem;cursor:pointer;min-height:20px;transition:all .15s;white-space:nowrap;flex-shrink:0;border-radius:6px!important}
        .game-controls-row .gc-btn:hover{background:#475569}
        .game-controls-row .gc-btn.td{background:linear-gradient(135deg,#dc2626,#b91c1c);border-color:#b91c1c;color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.4)}
        .game-controls-row .gc-btn.td:hover{background:linear-gradient(135deg,#ef4444,#dc2626);transform:scale(1.05);box-shadow:0 4px 16px rgba(220,38,38,.6)}
        .game-controls-row .gc-btn.fg{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:#1d4ed8;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.4)}
        .game-controls-row .gc-btn.fg:hover{background:linear-gradient(135deg,#3b82f6,#2563eb);transform:scale(1.05);box-shadow:0 4px 16px rgba(37,99,235,.6)}
        .game-controls-row .gc-btn.twopt{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border-color:#7c3aed;color:#fff;box-shadow:0 2px 8px rgba(139,92,246,.4)}
        .game-controls-row .gc-btn.twopt:hover{background:linear-gradient(135deg,#a78bfa,#8b5cf6);transform:scale(1.05);box-shadow:0 4px 16px rgba(139,92,246,.6)}
        .game-controls-row .gc-btn.pat{background:linear-gradient(135deg,#16a34a,#15803d);border-color:#15803d;color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.4)}
        .game-controls-row .gc-btn.pat:hover{background:linear-gradient(135deg,#22c55e,#16a34a);transform:scale(1.05);box-shadow:0 4px 16px rgba(22,163,74,.6)}
        .game-controls-row .gc-btn.safety{background:linear-gradient(135deg,#f59e0b,#d97706);border-color:#d97706;color:#000;box-shadow:0 2px 8px rgba(245,158,11,.4)}
        .game-controls-row .gc-btn.safety:hover{background:linear-gradient(135deg,#fbbf24,#f59e0b);transform:scale(1.05);box-shadow:0 4px 16px rgba(245,158,11,.6)}
        .game-controls-row .gc-btn.load-btn{background:linear-gradient(135deg,#334155,#1e293b);border-color:#475569;color:#fff}
        .game-controls-row .gc-btn.load-btn:hover{background:linear-gradient(135deg,#475569,#334155);transform:scale(1.05)}
        .quick-cues button[onclick*="FIRST DOWN"]{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:#1d4ed8}
        .quick-cues button[onclick*="PUNT"]{background:linear-gradient(135deg,#6b7280,#4b5563);border-color:#4b5563}
        .quick-cues button[onclick*="INTERCEPTION"]{background:linear-gradient(135deg,#dc2626,#b91c1c);border-color:#b91c1c}
        .quick-cues button[onclick*="FUMBLE"]{background:linear-gradient(135deg,#ea580c,#c2410c);border-color:#c2410c}
        .quick-cues button[onclick*="END OF QUARTER"]{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border-color:#7c3aed}
        .quick-cues button.flag{background:linear-gradient(135deg,#facc15,#eab308)!important;border-color:#eab308!important;color:#000!important}
        .quick-cues button.flag:hover{background:linear-gradient(135deg,#fde047,#facc15)!important}

<body>
<div class="toast" id="toast"></div>

<header>
    <div class="hdr-top">
        <div class="hdr-top-left" id="brandContainer">
            <img src="FNL.jpg" alt="FNL" class="brand-logo" id="brandLogo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1 id="brandTitle">🏈 FRIDAY NIGHT LIVE</h1>
                <p id="brandSubtitle">PA CONSOLE</p>
            </div>
        </div>
        <div class="hdr-top-right">
            <span class="wall-clock" id="wallClock">12:00 AM</span>
            <span class="weather-pill" id="weatherHeader">--°F</span>
            <span class="save-status" id="saveStatus">💾 Auto-saved</span>
            <button class="hdr-btn save-btn" onclick="fnlCloudSaveAll()" data-tooltip="Save all data to cloud">💾 SAVE ALL</button>
            <button class="hdr-btn" id="themeBtn" onclick="toggleTheme()" data-tooltip="Toggle dark/light theme">🌙 Dark</button>
            <button class="hdr-btn" id="outdoorBtn" onclick="toggleOutdoor()" data-tooltip="Toggle outdoor mode">🌤</button>
            <button class="hdr-btn" onclick="printLU()" data-tooltip="Print starting lineups">🖨️</button>
            <button class="hdr-btn undo-btn" onclick="undoLastEvent()" id="undoBtn" disabled data-tooltip="Undo last action (Ctrl+Z)">↩ Undo</button>
            <button class="hdr-btn" onclick="resetGame()" style="background:#dc2626;" data-tooltip="Reset entire game">RESET</button>
        </div>
    </div>
    <div class="hdr-bottom">
        <div class="scorebug-wrap">
            <div class="scorebug" id="scorebug">
                <span class="sb-network-tag">Voice of DFW Live</span>
                <span class="live-pill" id="livePill"><span class="dot"></span><span id="livePillText">LIVE</span></span>
                <div class="sb-block score-block" onclick="setPossession('away')" data-tooltip="Click to set possession to Away">
                    <div class="sb-name-col">
                        <span class="sb-label">AWAY</span>
                        <span class="sb-team-name" id="sbAwayName" style="color:#ffffff;">AWAY</span>
                    </div>
                    <div class="sb-row">
                        <button class="sb-btn" onclick="event.stopPropagation();chScore('away',-1)" data-tooltip="Subtract 1 point">−</button>
                        <span class="sb-val" id="sbAwayScore">0</span>
                        <button class="sb-btn" onclick="event.stopPropagation();chScore('away',1)" data-tooltip="Add 1 point">+</button>
                    </div>
                    <div class="sb-color-picker-wrapper">
                        <button class="sb-btn" onclick="event.stopPropagation();uploadScorebugLogo('away')" style="width:22px;height:22px;font-size:10px;" data-tooltip="Upload team logo">📷</button>
                        <input type="color" class="team-color-picker" id="awayColorPicker" onchange="event.stopPropagation();updateTeamColor('away',this.value)" value="#334155" data-tooltip="Team color">
                    </div>
                    <div class="timeout-display">
                        <span class="timeout-label">TO:</span>
                        <span class="timeout-dot" id="awayTO1"></span>
                        <span class="timeout-dot" id="awayTO2"></span>
                        <span class="timeout-dot" id="awayTO3"></span>
                    </div>
                </div>
                <div class="sb-block" data-tooltip="Current quarter">
                    <span class="sb-label" style="font-size:0.7rem;color:var(--sb-text);opacity:0.85;font-weight:800;letter-spacing:2px;">QUARTER</span>
                    <span class="sb-qtr" id="sbQuarter">Q1</span>
                    <div class="sb-row">
                        <button class="sb-btn" onclick="chQuarter(-1)" data-tooltip="Previous quarter">◀</button>
                        <button class="sb-btn" onclick="chQuarter(1)" data-tooltip="Next quarter">▶</button>
                    </div>
                </div>
                <div class="sb-block score-block" onclick="setPossession('home')" data-tooltip="Click to set possession to Home">
                    <div class="sb-name-col">
                        <span class="sb-label">HOME</span>
                        <span class="sb-team-name" id="sbHomeName" style="color:#ffffff;">HOME</span>
                    </div>
                    <div class="sb-row">
                        <button class="sb-btn" onclick="event.stopPropagation();chScore('home',-1)" data-tooltip="Subtract 1 point">−</button>
                        <span class="sb-val" id="sbHomeScore">0</span>
                        <button class="sb-btn" onclick="event.stopPropagation();chScore('home',1)" data-tooltip="Add 1 point">+</button>
                    </div>
                    <div class="sb-color-picker-wrapper">
                        <button class="sb-btn" onclick="event.stopPropagation();uploadScorebugLogo('home')" style="width:22px;height:22px;font-size:10px;" data-tooltip="Upload team logo">📷</button>
                        <input type="color" class="team-color-picker" id="homeColorPicker" onchange="event.stopPropagation();updateTeamColor('home',this.value)" value="#334155" data-tooltip="Team color">
                    </div>
                    <div class="timeout-display">
                        <span class="timeout-label">TO:</span>
                        <span class="timeout-dot" id="homeTO1"></span>
                        <span class="timeout-dot" id="homeTO2"></span>
                        <span class="timeout-dot" id="homeTO3"></span>
                    </div>
                </div>
                <div class="sb-block clock-block" data-tooltip="Game clock">
                    <span class="sb-label" style="font-size:0.5rem;color:var(--sb-text);opacity:.35;">CLOCK</span>
                    <span class="game-clock" id="gameClockDisplay">8:00</span>
                    <div class="sb-row">
                        <button class="sb-btn" onclick="startGC()" data-tooltip="Start clock (Space)">▶</button>
                        <button class="sb-btn" onclick="pauseGC()" data-tooltip="Pause clock (Space)">⏸</button>
                        <button class="sb-btn" onclick="resetGC()" data-tooltip="Reset clock">↺</button>
                    </div>
                </div>
                <div class="sb-block game-block" data-tooltip="Game controls">
                    <span class="sb-label" style="font-size:0.5rem;color:var(--sb-text);opacity:.35;">GAME</span>
                    <div class="sb-game-btns">
                        <button onclick="startGame()" id="btnStart" data-tooltip="Start new game">▶ Start</button>
                        <button onclick="setHalftime()" id="btnHalf" data-tooltip="Halftime">⏸ Half</button>
                        <button onclick="startSecondHalf()" id="btn2nd" data-tooltip="Start 2nd half">⏭ 2nd</button>
                        <button onclick="setOvertime()" id="btnOT" data-tooltip="Overtime">⏱ OT</button>
                        <button onclick="endGame()" id="btnFinal" data-tooltip="End game">🏁 Final</button>
                    </div>
                    <div class="last-event" id="lastEvent">🏈 Ready — Set possession</div>
                </div>
            </div>
            <div class="dd-ticker" id="ddTicker">🏈 SET POSSESSION TO BEGIN</div>
        </div>
        <button class="sb-mode-btn" onclick="toggleScorebugMode()" id="sbModeBtn" data-tooltip="Toggle compact scorebug">📏</button>
        <button class="sb-toggle-btn" onclick="toggleScorebugDisplay()" data-tooltip="Toggle scoreboard visibility">👁️</button>
    </div>
</header>

<script>
// ============================================================
// CONSTANTS
// ============================================================
var MAX_UNDO = 50;
var MAX_ROSTER_UNDO = 20;

var POSITION_CATEGORIES = {
    OFFENSE: ['QB','RB','FB','WR','TE','OL','Center','Guard','Tackle','LS'],
    DEFENSE: ['DL','DE','DT','NG','LB','MLB','OLB','ILB','CB','S','SS','FS','DB'],
    SPECIAL: ['K','P','KR','PR']
};

function getAllPositions() {
    var result = [];
    result = result.concat(POSITION_CATEGORIES.OFFENSE);
    result = result.concat(POSITION_CATEGORIES.DEFENSE);
    result = result.concat(POSITION_CATEGORIES.SPECIAL);
    return result;
}

function getTeamMascot(team) {
    if (!team || !team.name) return 'TEAM';
    if (team.mascot && team.mascot.trim()) return team.mascot.trim().toUpperCase();
    var words = team.name.trim().split(/\s+/);
    return words[words.length - 1].toUpperCase();
}

// ============================================================
// STATE
// ============================================================
var S = {
    v: 'sport', md: 'light', outdoor: false, at: 'theme',
    as: 0, hs: 0, q: 1, down: 1, dist: 10, poss: 'home',
    gameState: 'READY',
    gc: { rem: 480, run: false, max: 480 },
    md7: 'tackle', p7: ['QB','Center','WR','WR','WR','DB','DB'],
    cf: '12h', cs: true,
    awayId: 'h', homeId: 's',
    timeouts: { away: 3, home: 3 },
    timeoutConfig: { tackle: { perHalf: 3, overtimePerPeriod: 1 }, sevens: { perHalf: 0, overtimePerPeriod: 0 } },
    undoStack: [], sessionId: null,
    lastEvent: { text: '🏈 Ready — Set possession to begin', type: 'info' },
    scorebugMode: 'full',
    useTeamColor: true,
    teams: [
        { id: 'h', name: 'Euless Trinity Trojans', abbr: 'ETT', color: '#1e3a5f', textColor: '#ffffff', logo: '', mascot: 'Trojans', coach: '', players: [] },
        { id: 's', name: 'Mansfield Berkner Rams', abbr: 'MBR', color: '#7f1d1d', textColor: '#ffffff', logo: '', mascot: 'Rams', coach: '', players: [] }
    ],
    scoringLog: [], penaltyLog: [], gameHistory: [], script: '', cp: {}, ap: '', im: true,
    ua: 'all', uh: 'all', cid: 'h',
    rosterUndo: [],
    rosterRedo: [],
    colors: { 
        scorebugBg: '#0d0d1a', 
        scorebugText: '#ffffff', 
        accent: '#facc15', 
        teamCardAway: '#e2e8f0', 
        teamCardHome: '#e2e8f0', 
        teamCardBorder: '#94a3b8',
        awayHeaderBg: '#1e3a5f',
        homeHeaderBg: '#7f1d1d',
        awayCardBg: '#e2e8f0',
        homeCardBg: '#e2e8f0',
        quarterColor: '#facc15',
        clockColor: '#00ff88'
    }
};

var STORAGE_KEY = 'fnl_v36';

function toast(m) {
    var x = document.getElementById('toast');
    if (!x) return;
    x.textContent = m;
    x.classList.add('show');
    setTimeout(function() { x.classList.remove('show'); }, 2000);
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
        var el = document.getElementById('saveStatus');
        if (el) {
            var now = new Date();
            el.textContent = '💾 Saved ' + now.toLocaleTimeString();
            el.className = 'save-status saved';
        }
    } catch(e) { console.error('Save error:', e); }
}

function loadState() {
    try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            var parsed = JSON.parse(raw);
            S = { ...S, ...parsed };
        }
    } catch(e) { console.error('Load error:', e); }
    normalizeState();
}

function normalizeState() {
    if (!Array.isArray(S.teams) || S.teams.length === 0) {
        S.teams = [{ id: 't1', name: 'Away Team', abbr: 'AWY', color: '#334155', textColor: '#ffffff', logo: '', mascot: '', coach: '', players: [] }];
    }
    S.teams.forEach(function(t) {
        if (!t.abbr) t.abbr = '';
        if (!t.textColor) t.textColor = '#ffffff';
        if (!t.mascot) t.mascot = '';
        t.players.forEach(function(p) {
            if (!p.categories) p.categories = getPositionCategories(p.po || '');
            if (!p.posFull) p.posFull = p.po || '';
            if (p.st === undefined) p.st = false;
            if (p.pinned === undefined) p.pinned = false;
            if (p.nt === undefined) p.nt = '';
        });
    });
    if (!S.teams.find(function(t) { return t.id === S.awayId; })) S.awayId = S.teams[0].id;
    if (!S.teams.find(function(t) { return t.id === S.homeId; }) || S.homeId === S.awayId) {
        var alt = S.teams.find(function(t) { return t.id !== S.awayId; });
        S.homeId = alt ? alt.id : S.awayId;
    }
    if (!S.colors) S.colors = { 
        scorebugBg: '#0d0d1a', 
        scorebugText: '#ffffff', 
        accent: '#facc15', 
        teamCardAway: '#e2e8f0', 
        teamCardHome: '#e2e8f0', 
        teamCardBorder: '#94a3b8',
        awayHeaderBg: '#1e3a5f',
        homeHeaderBg: '#7f1d1d',
        awayCardBg: '#e2e8f0',
        homeCardBg: '#e2e8f0',
        quarterColor: '#facc15',
        clockColor: '#00ff88'
    };
    if (!S.gc.max) S.gc.max = 480;
    if (!S.timeouts) S.timeouts = { away: 3, home: 3 };
    if (!S.timeoutConfig) {
        S.timeoutConfig = { tackle: { perHalf: 3, overtimePerPeriod: 1 }, sevens: { perHalf: 0, overtimePerPeriod: 0 } };
    }
    if (!S.undoStack) S.undoStack = [];
    if (!S.lastEvent) S.lastEvent = { text: '🏈 Ready — Set possession to begin', type: 'info' };
    if (!S.scorebugMode) S.scorebugMode = 'full';
    if (!S.rosterUndo) S.rosterUndo = [];
    if (!S.rosterRedo) S.rosterRedo = [];
    if (S.useTeamColor === undefined) S.useTeamColor = true;
    S.gc.run = false;
}

function getTeam(side) {
    var id = side === 'away' ? S.awayId : S.homeId;
    var t = S.teams.find(function(x) { return x.id === id; });
    if (!t) t = S.teams[0];
    return t || { name: 'TBD', abbr: 'TBD', color: '#334155', textColor: '#ffffff', mascot: '', players: [], id: '' };
}

function getPositionCategories(posStr) {
    if (!posStr) return ['all'];
    var positions = posStr.split('/').map(function(p) { return p.trim().toUpperCase(); });
    var categories = new Set();
    var OFFENSE_NORM = POSITION_CATEGORIES.OFFENSE.map(function(p) { return p.toUpperCase(); });
    var DEFENSE_NORM = POSITION_CATEGORIES.DEFENSE.map(function(p) { return p.toUpperCase(); });
    var SPECIAL_NORM = POSITION_CATEGORIES.SPECIAL.map(function(p) { return p.toUpperCase(); });
    positions.forEach(function(pos) {
        if (OFFENSE_NORM.indexOf(pos) !== -1 || pos === 'LS') categories.add('offense');
        if (DEFENSE_NORM.indexOf(pos) !== -1) categories.add('defense');
        if (SPECIAL_NORM.indexOf(pos) !== -1 || pos === 'LS') categories.add('special');
    });
    if (categories.size === 0) categories.add('all');
    return Array.from(categories);
}

function getCategoryClass(categories) {
    if (!categories || categories.length === 0 || categories[0] === 'all') return 'other';
    var hasOffense = categories.indexOf('offense') !== -1;
    var hasDefense = categories.indexOf('defense') !== -1;
    var hasSpecial = categories.indexOf('special') !== -1;
    if (hasOffense && hasDefense) return 'both';
    if (hasOffense) return 'offense';
    if (hasDefense) return 'defense';
    if (hasSpecial) return 'special';
    return 'other';
}

function getCategoryTooltip(categories) {
    if (!categories || categories.length === 0 || categories[0] === 'all') return 'Unknown Position';
    var labels = [];
    if (categories.indexOf('offense') !== -1) labels.push('Offense');
    if (categories.indexOf('defense') !== -1) labels.push('Defense');
    if (categories.indexOf('special') !== -1) labels.push('Special Teams');
    return labels.join(' + ') || 'Unknown';
}

function getContrastColor(hex) {
    if (!hex) return '#ffffff';
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    var brightness = (r * 299 + g * 587 + b * 114) / 1000;
    return brightness > 128 ? hex : '#ffffff';
}

function getAllPositionOptionsWithLabels() {
    var basePositions = S.md7 === '7v7' ? S.p7 : getAllPositions();
    var allPosStrings = new Set();
    S.teams.forEach(function(team) {
        team.players.forEach(function(p) {
            if (p.posFull) allPosStrings.add(p.posFull);
            if (p.po) allPosStrings.add(p.po);
        });
    });
    var combined = basePositions.slice();
    allPosStrings.forEach(function(pos) {
        if (combined.indexOf(pos) === -1) combined.push(pos);
    });
    var options = combined.map(function(pos) {
        var cats = getPositionCategories(pos);
        var catClass = getCategoryClass(cats);
        var dotHtml = '<span class="cat-dot ' + catClass + '" style="display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;"></span>';
        return { value: pos, display: dotHtml + ' ' + pos, categories: cats };
    });
    options.sort(function(a, b) { return a.value.localeCompare(b.value); });
    return options;
}

function getPlayers(side, filter) {
    var t = getTeam(side);
    if (!t) return [];
    var list = t.players.slice();
    
    // ---- SORTING (Starters first, then pinned, then number) ----
    list.sort(function(a, b) {
        if (a.st !== b.st) return (a.st ? -1 : 1);
        if ((a.pinned || false) !== (b.pinned || false)) return (b.pinned || false) - (a.pinned || false);
        return (parseInt(a.n) || 999) - (parseInt(b.n) || 999);
    });
    
    // ---- FILTERING (ALL / OFF / DEF / ST) ----
    if (filter === 'all') return list;
    if (filter === 'offense' || filter === 'defense' || filter === 'special') {
        list = list.filter(function(p) {
            if (p.categories && p.categories.length > 0) {
                return p.categories.indexOf(filter) !== -1;
            }
            return true;
        });
    }
    return list;
}

function pushRosterUndo(teamId, action, data) {
    if (!S.rosterUndo) S.rosterUndo = [];
    if (!S.rosterRedo) S.rosterRedo = [];
    S.rosterUndo.push({ teamId: teamId, action: action, data: data, timestamp: Date.now() });
    if (S.rosterUndo.length > MAX_ROSTER_UNDO) S.rosterUndo.shift();
    S.rosterRedo = [];
    saveState();
}

function rosterUndo() {
    if (!S.rosterUndo || S.rosterUndo.length === 0) { toast('ℹ️ Nothing to undo'); return; }
    var entry = S.rosterUndo.pop();
    var team = S.teams.find(function(t) { return t.id === entry.teamId; });
    if (!team) { toast('❌ Team not found'); return; }
    S.rosterRedo.push(entry);
    if (entry.action === 'add') {
        team.players = team.players.filter(function(p) { return p.id !== entry.data.id; });
        toast('↩ Undo add: ' + entry.data.na);
    } else if (entry.action === 'delete') {
        team.players.push(entry.data);
        team.players.sort(function(a,b) { return (parseInt(a.n)||999) - (parseInt(b.n)||999); });
        toast('↩ Undo delete: ' + entry.data.na);
    } else if (entry.action === 'edit') {
        var p = team.players.find(function(x) { return x.id === entry.data.id; });
        if (p) {
            var oldData = entry.data.oldData;
            p.n = oldData.n || p.n;
            p.na = oldData.na || p.na;
            p.posFull = oldData.posFull || p.posFull;
            p.po = oldData.po || p.po;
            p.st = oldData.st !== undefined ? oldData.st : p.st;
            p.pinned = oldData.pinned !== undefined ? oldData.pinned : p.pinned;
            p.nt = oldData.nt || p.nt;
            p.categories = oldData.categories || p.categories;
        }
        toast('↩ Undo edit');
    }
    saveState();
    renderRoster();
}

function rosterRedo() {
    if (!S.rosterRedo || S.rosterRedo.length === 0) { toast('ℹ️ Nothing to redo'); return; }
    var entry = S.rosterRedo.pop();
    var team = S.teams.find(function(t) { return t.id === entry.teamId; });
    if (!team) { toast('❌ Team not found'); return; }
    S.rosterUndo.push(entry);
    if (entry.action === 'add') {
        team.players.push(entry.data);
        team.players.sort(function(a,b) { return (parseInt(a.n)||999) - (parseInt(b.n)||999); });
        toast('↪ Redo add: ' + entry.data.na);
    } else if (entry.action === 'delete') {
        team.players = team.players.filter(function(p) { return p.id !== entry.data.id; });
        toast('↪ Redo delete: ' + entry.data.na);
    } else if (entry.action === 'edit') {
        var p = team.players.find(function(x) { return x.id === entry.data.id; });
        if (p) {
            var newData = entry.data.newData;
            p.n = newData.n || p.n;
            p.na = newData.na || p.na;
            p.posFull = newData.posFull || p.posFull;
            p.po = newData.po || p.po;
            p.st = newData.st !== undefined ? newData.st : p.st;
            p.pinned = newData.pinned !== undefined ? newData.pinned : p.pinned;
            p.nt = newData.nt || p.nt;
            p.categories = newData.categories || p.categories;
        }
        toast('↪ Redo edit');
    }
    saveState();
    renderRoster();
}

function fnlCloudLoadRostersOnly() {
    if (!confirm('Load rosters from cloud? (merges)')) return;
    fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync')
        .then(function(resp) {
            if (!resp.ok) throw new Error('Load failed');
            return resp.json();
        })
        .then(function(data) {
            if (!data || Object.keys(data).length === 0) throw new Error('No data');
            if (data.teams) {
                data.teams.forEach(function(cloudTeam) {
                    var existing = S.teams.find(function(t) { return t.id === cloudTeam.id; });
                    if (existing) {
                        existing.name = cloudTeam.name || existing.name;
                        existing.abbr = cloudTeam.abbr || existing.abbr;
                        existing.color = cloudTeam.color || existing.color;
                        existing.textColor = cloudTeam.textColor || '#ffffff';
                        existing.logo = cloudTeam.logo || existing.logo;
                        existing.mascot = cloudTeam.mascot || existing.mascot;
                        existing.coach = cloudTeam.coach || existing.coach;
                        if (cloudTeam.players) {
                            cloudTeam.players.forEach(function(player) {
                                var existingPlayer = existing.players.find(function(p) { return p.id === player.id; });
                                if (existingPlayer) {
                                    existingPlayer.n = player.n || existingPlayer.n;
                                    existingPlayer.na = player.na || existingPlayer.na;
                                    existingPlayer.po = player.po || existingPlayer.po;
                                    existingPlayer.st = player.st !== undefined ? player.st : existingPlayer.st;
                                    existingPlayer.posFull = player.posFull || player.po || existingPlayer.posFull;
                                    if (player.categories) existingPlayer.categories = player.categories;
                                    else if (player.posFull || player.po) existingPlayer.categories = getPositionCategories(player.posFull || player.po);
                                    if (player.nt !== undefined) existingPlayer.nt = player.nt;
                                } else {
                                    var newPlayer = { ...player };
                                    if (!newPlayer.categories && (newPlayer.posFull || newPlayer.po)) {
                                        newPlayer.categories = getPositionCategories(newPlayer.posFull || newPlayer.po);
                                    }
                                    if (!newPlayer.categories) newPlayer.categories = ['all'];
                                    if (!newPlayer.nt) newPlayer.nt = '';
                                    existing.players.push(newPlayer);
                                }
                            });
                        }
                    } else {
                        var newTeam = { ...cloudTeam };
                        if (!newTeam.textColor) newTeam.textColor = '#ffffff';
                        newTeam.players = (cloudTeam.players || []).map(function(p) {
                            var player = { ...p };
                            if (!player.categories && (player.posFull || player.po)) {
                                player.categories = getPositionCategories(player.posFull || player.po);
                            }
                            if (!player.categories) player.categories = ['all'];
                            if (!player.nt) player.nt = '';
                            return player;
                        });
                        S.teams.push(newTeam);
                    }
                });
            }
            saveState();
            renderAll();
            toast('✅ Rosters loaded');
        })
        .catch(function(e) {
            toast('❌ Load failed: ' + e.message);
        });
}

// ============================================================
// SCOREBUG FUNCTIONS
// ============================================================
function updateScorebug() {
    var away = getTeam('away'), home = getTeam('home');
    var awayNameEl = document.getElementById('sbAwayName');
    var homeNameEl = document.getElementById('sbHomeName');
    
    var awayColor = S.useTeamColor ? away.color : getContrastColor(away.color);
    var homeColor = S.useTeamColor ? home.color : getContrastColor(home.color);
    
    if (awayNameEl) {
        awayNameEl.textContent = getTeamMascot(away);
        awayNameEl.style.color = awayColor || '#ffffff';
    }
    if (homeNameEl) {
        homeNameEl.textContent = getTeamMascot(home);
        homeNameEl.style.color = homeColor || '#ffffff';
    }
    var awayScoreEl = document.getElementById('sbAwayScore');
    var homeScoreEl = document.getElementById('sbHomeScore');
    if (awayScoreEl) awayScoreEl.textContent = S.as;
    if (homeScoreEl) homeScoreEl.textContent = S.hs;
    updateTimeoutDisplay();
    updateDDTicker();
    updateGameClockDisplay();
    updateGameStateBadge();
    updateUndoButton();
}

function updateGameClockDisplay() {
    var el = document.getElementById('gameClockDisplay');
    if (!el) return;
    var m = Math.floor(S.gc.rem / 60);
    var s = S.gc.rem % 60;
    el.textContent = m + ':' + String(s).padStart(2, '0');
    if (S.gc.run) {
        el.style.color = S.colors.clockColor || '#00ff88';
        el.className = 'game-clock';
    } else {
        el.style.color = 'var(--sb-text)';
        el.className = 'game-clock paused';
    }
}

function updateDDTicker() {
    var el = document.getElementById('ddTicker');
    if (!el) return;
    if (S.gameState === 'FINAL') { el.textContent = '🏁 GAME FINAL'; el.style.background = '#dc2626'; return; }
    if (S.gameState === 'HALFTIME') { el.textContent = '⏸️ HALFTIME'; el.style.background = '#f59e0b'; return; }
    if (S.gameState === 'READY') {
        var team = getTeam(S.poss);
        el.textContent = '🏈 ' + getTeamMascot(team) + ' HAS THE BALL • PRESS "▶ START" TO BEGIN';
        el.style.background = '#334155'; return;
    }
    var team = getTeam(S.poss);
    var ord = { 1: '1ST', 2: '2ND', 3: '3RD', 4: '4TH' }[S.down] || (S.down + 'TH');
    el.innerHTML = '🏈 ' + getTeamMascot(team) + ' BALL • ' + ord + ' & ' + S.dist;
    el.style.background = team.color || '#334155';
}

function updateGameStateBadge() {
    var pill = document.getElementById('livePill');
    var txt = document.getElementById('livePillText');
    if (!pill || !txt) return;
    pill.classList.remove('final', 'halftime');
    if (S.gameState === 'FINAL') { pill.classList.add('show', 'final'); txt.textContent = 'FINAL'; }
    else if (S.gameState === 'HALFTIME') { pill.classList.add('show', 'halftime'); txt.textContent = 'HALF'; }
    else if (S.gameState === 'FIRST_HALF' || S.gameState === 'SECOND_HALF' || S.gameState === 'OVERTIME') {
        pill.classList.add('show'); txt.textContent = 'LIVE';
    } else { pill.classList.remove('show'); }
}

function updateUndoButton() {
    var btn = document.getElementById('undoBtn');
    if (btn) {
        btn.disabled = S.undoStack.length === 0;
        btn.textContent = S.undoStack.length > 0 ? '↩ Undo (' + S.undoStack.length + ')' : '↩ Undo';
    }
}

function updateTimeoutDisplay() {
    var away = S.timeouts.away || 0;
    var home = S.timeouts.home || 0;
    for (var i = 1; i <= 3; i++) {
        var awayDot = document.getElementById('awayTO' + i);
        if (awayDot) awayDot.className = 'timeout-dot' + (i > away ? ' used' : '');
        var homeDot = document.getElementById('homeTO' + i);
        if (homeDot) homeDot.className = 'timeout-dot' + (i > home ? ' used' : '');
    }
}

function chScore(side, delta) {
    if (side === 'away') S.as = Math.max(0, S.as + delta);
    else S.hs = Math.max(0, S.hs + delta);
    updateScorebug();
    saveState();
}

function chQuarter(delta) {
    var maxQ = S.md7 === '7v7' ? 2 : (S.gameState === 'OVERTIME' ? 5 : 4);
    S.q = Math.min(maxQ, Math.max(1, S.q + delta));
    if (delta !== 0) {
        S.gc.rem = S.gc.max || 480;
        S.gc.run = false;
        updateGameClockDisplay();
        updateClockStatusIndicator();
        toast('⏱️ Qtr changed — Clock reset');
    }
    updateScorebug();
    saveState();
}

function startGC() {
    if (S.gameState === 'FINAL' || S.gameState === 'HALFTIME' || S.gameState === 'READY') {
        toast('⏳ Cannot start clock');
        return;
    }
    if (S.gc.rem <= 0) { toast('⏳ Clock at zero'); return; }
    S.gc.run = true;
    toast('▶️ Clock running');
    updateGameClockDisplay();
    saveState();
    renderGame();
}

function pauseGC() {
    S.gc.run = false;
    toast('⏸️ Clock paused');
    updateGameClockDisplay();
    saveState();
    renderGame();
}

function resetGC() {
    S.gc.run = false;
    S.gc.rem = S.gc.max || 480;
    updateGameClockDisplay();
    saveState();
    renderGame();
}

function setPossession(side) {
    if (side !== 'away' && side !== 'home') { toast('❌ Invalid possession side'); return; }
    S.poss = side;
    var team = getTeam(side);
    toast('🏈 ' + getTeamMascot(team) + ' has the ball');
    renderGame();
    updateScorebug();
    saveState();
}

function updateClockStatusIndicator() {
    var el = document.getElementById('clockStatusIndicator');
    if (el) {

function updateTeamColor(side, color) {
    var team = getTeam(side);
    team.color = color;
    var brightness = getColorBrightness(color);
    team.textColor = brightness > 128 ? '#000000' : '#ffffff';
    var teamObj = S.teams.find(function(t) { return t.id === team.id; });
    if (teamObj) {
        teamObj.color = color;
        teamObj.textColor = team.textColor;
    }
    saveState();
    updateScorebug();
    renderGame();
    toast('✅ Team color updated');
}

function getColorBrightness(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000;
}

function uploadScorebugLogo(side) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        var f = input.files[0];
        if (!f || !f.type.startsWith('image/')) return toast('📷 Image required');
        var r = new FileReader();
        r.onload = function(ev) {
            var team = getTeam(side);
            team.logo = ev.target.result;
            saveState();
            updateScorebug();
            toast('✅ Logo uploaded');
        };
        r.readAsDataURL(f);
    };
    input.click();
}

// ============================================================
// TOOLTIPS
// ============================================================
var tooltipEl = document.getElementById('tooltip');
document.addEventListener('mouseover', function(e) {
    var t = e.target.closest('[data-tooltip]');
    if (t) {
        tooltipEl.textContent = t.getAttribute('data-tooltip');
        tooltipEl.style.display = 'block';
        positionTooltip(e.clientX, e.clientY);
    }
});
document.addEventListener('mousemove', function(e) {
    if (tooltipEl.style.display === 'block') positionTooltip(e.clientX, e.clientY);
});
document.addEventListener('mouseout', function(e) {
    if (!e.target.closest('[data-tooltip]')) tooltipEl.style.display = 'none';
});

function positionTooltip(x, y) {
    var left = x + 15, top = y + 15;
    var rect = tooltipEl.getBoundingClientRect();
    if (left + rect.width > window.innerWidth) left = x - rect.width - 15;
    if (left < 5) left = 5;
    if (top + rect.height > window.innerHeight) top = y - rect.height - 15;
    if (top < 5) top = 5;
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
}

// ============================================================
function deleteGamePlayer(side, pid) {
    if (!confirm('Delete this player?')) return;
    var team = getTeam(side);
    if (!team) return;
    var idx = team.players.findIndex(function(p) { return p.id === pid; });
    if (idx === -1) { toast('❌ Player not found'); return; }
    var player = team.players[idx];
    pushRosterUndo(team.id, 'delete', { ...player });
    team.players.splice(idx, 1);
    saveState();
    renderGame();
    toast('🗑️ Deleted ' + player.na);
}

function setFilterAndSearch(side, f) {
    if (side === 'away') S.ua = f;
    else S.uh = f;
    renderGame();
    setTimeout(function() {
        var inputs = document.querySelectorAll('.player-search');
        inputs.forEach(function(input) {
            var side2 = input.dataset.side;
            var val = input.value || '';
            var rows = document.querySelectorAll('#playerList_' + side2 + ' .player-row');
            rows.forEach(function(row) {
                var name = row.dataset.name || '';
                var number = row.dataset.number || '';
                var match = name.indexOf(val.toLowerCase().trim()) !== -1 || number.indexOf(val.toLowerCase().trim()) !== -1;
                row.style.display = match ? '' : 'none';
            });
        });
    }, 50);
}

function updateGamePlayerFieldOnly(side, pid, field, val) {
    var team = getTeam(side);
    var p = team.players.find(function(x) { return x.id === pid; });
    if (!p) return;
    p[field] = val;
    saveState();
    renderGame();

function updateGamePlayerPositionOnly(side, pid, val) {
    var team = getTeam(side);
    var p = team.players.find(function(x) { return x.id === pid; });

    p.posFull = val;
    p.po = val.split('/')[0].trim() || val;
    p.categories = getPositionCategories(val);
    saveState();
    renderGame();
    toast('✅ ' + p.na + ' set to ' + val);
}

function toggleStarterOnly(side, pid) {

    p.st = !p.st;

// ============================================================
// GAME CONTROLS
// ============================================================
function useTimeout(side) {
    if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
    if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
    var key = side === 'away' ? 'away' : 'home';
    if (S.timeouts[key] <= 0) { toast('⚠️ ' + side.toUpperCase() + ' has no timeouts'); return; }
    S.timeouts[key]--;
    S.gc.run = false;
    pushUndo();
    var team = getTeam(side);
    setLastEvent('⏱️ ' + getTeamMascot(team) + ' TIMEOUT — ' + S.timeouts[key] + ' remaining', 'timeout');
    updateTimeoutDisplay();
    updateGameClockDisplay();
    updateClockStatusIndicator();
    saveState();
    toast('⏱️ ' + side.toUpperCase() + ' timeout — ' + S.timeouts[key] + ' remaining');
}

function injuryTimeout() {
    if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
    if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
    S.gc.run = false;
    setLastEvent('🆘 INJURY TIMEOUT — Clock paused', 'injury');
    updateGameClockDisplay();
    updateClockStatusIndicator();
    saveState();
    toast('🆘 Injury timeout — Clock paused');
}

function startGame() {
    if (S.gameState !== 'READY') { toast('⏳ Game already in progress'); return; }
    S.sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    S.gameState = 'FIRST_HALF';
    S.gc.rem = S.gc.max || 480;
    S.gc.run = false;
    S.q = 1;
    S.as = 0; S.hs = 0;
    S.down = 1; S.dist = 10; S.poss = 'home';
    S.scoringLog = []; S.penaltyLog = [];
    var timeoutCount = S.md7 === '7v7' ? 0 : 3;
    S.timeouts = { away: timeoutCount, home: timeoutCount };
    S.undoStack = [];
    pushUndo();
    setLastEvent('🏈 GAME STARTED — Q1', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('🏈 Game started!');
}

function setHalftime() {
    if (S.gameState !== 'FIRST_HALF' && S.gameState !== 'SECOND_HALF') { toast('⏳ Halftime only during a half'); return; }
    S.gameState = 'HALFTIME';
    S.gc.run = false;
    S.q = 2;
    var timeoutCount = S.md7 === '7v7' ? 0 : 3;
    S.timeouts = { away: timeoutCount, home: timeoutCount };
    pushUndo();
    setLastEvent('⏸️ HALFTIME — Timeouts reset', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateClockStatusIndicator();
    updateGameStateBadge();
    saveState();
    toast('⏸️ Halftime');
}

function startSecondHalf() {
    if (S.gameState !== 'HALFTIME') { toast('⏳ Can only start 2nd half from HALFTIME'); return; }
    S.gameState = 'SECOND_HALF';
    S.gc.rem = S.gc.max || 480;
    S.gc.run = false;
    S.q = 3;
    var timeoutCount = S.md7 === '7v7' ? 0 : 3;
    S.timeouts = { away: timeoutCount, home: timeoutCount };
    pushUndo();
    setLastEvent('⏭️ SECOND HALF STARTED — Q3', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('⏭️ 2nd Half started');
}

function setOvertime() {
    if (S.gameState !== 'SECOND_HALF' && S.gameState !== 'OVERTIME') { toast('⏳ OT only during 2nd half'); return; }
    S.gameState = 'OVERTIME';
    S.gc.rem = 360;
    S.gc.run = false;
    S.q = 5;
    S.timeouts = { away: 1, home: 1 };
    pushUndo();
    setLastEvent('⏱️ OVERTIME', 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('⏱️ Overtime');
}

function endGame() {
    if (S.gameState === 'READY') { toast('⏳ No game in progress'); return; }
    if (S.gameState === 'FINAL') { toast('⛔ Already final'); return; }
    if (!confirm('End game?')) return;
    S.gameState = 'FINAL';
    S.gc.run = false;
    var away = getTeam('away'), home = getTeam('home');
    S.gameHistory.push({ date: new Date().toISOString(), sessionId: S.sessionId, away: away.name, home: home.name, awayScore: S.as, homeScore: S.hs, log: S.scoringLog.concat(S.penaltyLog) });
    pushUndo();
    setLastEvent('🏁 GAME FINAL — ' + getTeamMascot(away) + ' ' + S.as + ' - ' + S.hs + ' ' + getTeamMascot(home), 'info');
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    saveState();
    toast('🏁 Game ended');
}

function resetGame() {
    if (!confirm('Reset game? Clears score, clock, logs.')) return;
    S.as = 0; S.hs = 0; S.q = 1; S.down = 1; S.dist = 10; S.poss = 'home';
    S.gameState = 'READY';
    S.gc.rem = S.gc.max || 480; S.gc.run = false;
    S.scoringLog = []; S.penaltyLog = [];
    S.timeouts = { away: 3, home: 3 };
    S.undoStack = []; S.sessionId = null;
    S.lastEvent = { text: '🏈 Ready — Set possession to begin', type: 'info' };
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    renderView();
    saveState();
    setLastEvent('🔄 Game reset', 'info');
    toast('🔄 Game reset');
    renderGame();
}

function setDown(v) { S.down = parseInt(v) || 1; updateDDTicker(); saveState(); }
function setDist(v) { S.dist = parseInt(v) || 1; updateDDTicker(); saveState(); }
function adjustYards(delta) { S.dist = Math.max(1, Math.min(99, S.dist + delta)); updateDDTicker(); saveState(); }

// ============================================================
// SCORING & QUICK ACTIONS
// ============================================================
function pushUndo() {
    var snapshot = {
        as: S.as, hs: S.hs,
        scoringLog: S.scoringLog.slice(),
        penaltyLog: S.penaltyLog.slice(),
        gameState: S.gameState,
        q: S.q, down: S.down, dist: S.dist, poss: S.poss,
        gc: { rem: S.gc.rem, run: S.gc.run },
        timeouts: { away: S.timeouts.away, home: S.timeouts.home }
    };
    S.undoStack.push(snapshot);
    if (S.undoStack.length > MAX_UNDO) S.undoStack.shift();
    saveState();
}

function undoLastEvent() {
    if (S.undoStack.length === 0) { toast('ℹ️ Nothing to undo'); return; }
    var prev = S.undoStack.pop();
    S.as = prev.as; S.hs = prev.hs;
    S.scoringLog = prev.scoringLog;
    S.penaltyLog = prev.penaltyLog;
    S.gameState = prev.gameState;
    S.q = prev.q; S.down = prev.down; S.dist = prev.dist; S.poss = prev.poss;
    S.gc.rem = prev.gc.rem; S.gc.run = prev.gc.run;
    S.timeouts.away = prev.timeouts.away; S.timeouts.home = prev.timeouts.home;
    updateUndoButton();
    updateScorebug();
    updateGameClockDisplay();
    updateGameStateBadge();
    renderGame();
    setLastEvent('↩ Undo', 'undo');
    saveState();
    toast('↩ Undo successful');
}

function setLastEvent(text, type) {
    S.lastEvent = { text: text, type: type || 'info' };
    var el = document.getElementById('lastEvent');
    if (el) {
        el.innerHTML = text;
        var colors = { td: '#dc2626', fg: '#2563eb', penalty: '#facc15', timeout: '#f97316', injury: '#dc2626' };
        el.style.borderColor = colors[type] || 'var(--accent)';
    }
}

function recordScore(type, pts, teamSide, playerName) {
    if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
    if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
    pushUndo();
    if (teamSide === 'home') S.hs += pts;
    else S.as += pts;
    S.scoringLog.push({ type: type, team: teamSide, player: playerName, points: pts, time: S.gc.rem, quarter: S.q, id: Date.now() + '_' + Math.random().toString(36).slice(2,5) });
    var team = getTeam(teamSide);
    var emoji = type === 'td' ? '🏈' : type === 'fg' ? '🎯' : type === 'twopt' ? '➕' : type === 'pat' ? '🎯' : '⚡';
    var label = type === 'td' ? 'TOUCHDOWN' : type === 'fg' ? 'FIELD GOAL' : type === 'twopt' ? '2-POINT CONVERSION' : type === 'pat' ? 'PAT' : 'SAFETY';
    setLastEvent(emoji + ' ' + label + ' — ' + (playerName || getTeamMascot(team)) + ' (+' + pts + ')', type);
    updateScorebug();
    saveState();
    toast(label + ' +' + pts + ' - ' + (playerName || getTeamMascot(team)));
}

function openPlayerPicker(title, callback) {
    var team = getTeam(S.poss);

    var html = '<h3>' + title + ' — ' + getTeamMascot(team) + '</h3>';

    if (sorted.length) {
        html += '<div class="pp-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;">';
        sorted.forEach(function(p) { html += '<button type="button" data-pid="' + p.id + '" style="background:#334155;color:#fff;border:1px solid #475569;border-radius:4px;padding:6px 3px;font-size:.6rem;cursor:pointer;line-height:1.2;">#' + (p.n || '-') + '<br>' + p.na + '</button>'; });

        html += '<p style="margin-bottom:8px;opacity:.6;">No players on this roster yet.</p>';
    }
    html += '<div class="pp-actions" style="display:flex;gap:4px;">';
    html += '<input id="ppManual" placeholder="Or type a name / number" style="flex:1;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:.7rem;">';
    html += '<button type="button" class="hdr-btn" id="ppSkip" style="background:#334155;color:#fff;border:1px solid #475569;border-radius:16px;padding:4px 8px;font-size:.58rem;cursor:pointer;">Skip</button>';

    function close() { document.body.removeChild(overlay); }

        btn.onclick = function() {
            var p = team.players.find(function(x) { return x.id === btn.dataset.pid; });
            close();
            callback(p ? p.na : getTeamMascot(team));
        };
    });
    box.querySelector('#ppSkip').onclick = function() { close(); callback(getTeamMascot(team)); };
    box.querySelector('#ppCancel').onclick = function() { close(); };
    var manual = box.querySelector('#ppManual');
    manual.focus();
    manual.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            var v = e.target.value.trim();
            close();
            callback(v || getTeamMascot(team));
        }
    });
}

function quickScore(type) {
    var pts = type === 'td' ? 6 : type === 'fg' ? 3 : type === 'twopt' ? 2 : type === 'pat' ? 1 : 2;
    var label = type === 'td' ? 'Touchdown' : type === 'fg' ? 'Field Goal' : type === 'twopt' ? '2-Point Conversion' : type === 'pat' ? 'PAT' : 'Safety';
    openPlayerPicker(label + ' (+' + pts + ')', function(playerName) {
        recordScore(type, pts, S.poss, playerName);
    });

function quickCue(text) {
    setLastEvent(text, 'info');

function quickPenalty() {
    if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
    if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
    openPlayerPicker('🚩 Penalty on', function(playerName) {
        pushUndo();
        S.penaltyLog.push({ type: 'flag', team: S.poss, player: playerName, time: S.gc.rem, quarter: S.q, id: Date.now() + '_penalty' });

        saveState();
        toast('🚩 Penalty on ' + playerName);

function setSideTeam(side, teamId) {
    var otherSide = side === 'away' ? 'home' : 'away';
    var otherId = otherSide === 'away' ? S.awayId : S.homeId;
    var thisId = side === 'away' ? S.awayId : S.homeId;
    if (teamId === otherId) {
        if (side === 'away') { S.awayId = teamId; S.homeId = thisId; }
        else { S.homeId = teamId; S.awayId = thisId; }
        toast('🔄 Teams swapped');
    } else {
        if (side === 'away') S.awayId = teamId;
        else S.homeId = teamId;
    }
    saveState();
    renderGame();
    updateScorebug();
}

}

        'K': 'K', 'P': 'P', 'LS': 'LS', 'KR': 'KR', 'PR': 'PR',
        'ATH': 'ATH', 'ST': 'ST', 'SP': 'SP'
    };
    
    var lines = tx.split('\n');
    var out = [];
    var autoNumber = 1;
    
    lines.forEach(function(l) {
        var line = l.trim();
        if (!line) return;
        
        if (line.match(/^[\|\-\s]+$/) || 
            line.match(/^Role\s*\|/i) ||
            line.match(/^Notes\s*\|/i) ||
            line.match(/^Pron\s*\|/i) ||
            line.match(/^Offense\s*$/i) ||
            line.match(/^Defense\s*$/i) ||
            line.match(/^Special Teams\s*$/i) ||
            line.match(/^Both\s*$/i) ||
            line.match(/^Other\s*$/i) ||
            line.match(/^#\s+Name\s*$/i) ||
            line.match(/^Name\s+#\s*$/i) ||
            line === 'Role' || line === 'Notes' || line === 'Pron') {
            return;
        }
        
        line = line.replace(/^\||\|$/g, '').trim();
        var parts = line.split('|').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        if (parts.length >= 2 && parts[0].match(/^[A-Za-z]/) && parts[1].match(/^[A-Za-z]/)) {
            var namePart = parts[0].replace(/^[⭐\s]+/, '');
            var rolePart = parts[1].trim().toUpperCase();
            if (namePart === 'Notes' || namePart === 'Pron' || namePart === 'Role') return;
            var numMatch = namePart.match(/^(\d+)\s+/);
            var num = numMatch ? numMatch[1] : '';
            var cleanName = numMatch ? namePart.replace(/^(\d+)\s+/, '') : namePart;
            var pos = posMap[rolePart] || rolePart;
            if (positions.indexOf(pos) === -1 && pos !== 'ST' && pos !== 'SP' && pos !== 'ATH') {
                cleanName = namePart;
                pos = 'QB';
            }
            if (cleanName) {
                var isStarter = namePart.indexOf('⭐') !== -1 || line.indexOf('⭐') !== -1 || rolePart.indexOf('⭐') !== -1;
                out.push({ 
                    id: 'p' + Date.now() + Math.random().toString(36).slice(2,7), 
                    n: num, 
                    na: cleanName, 
                    po: pos, 
                    posFull: pos, 
                    st: isStarter, 
                    nt: '', 
                    pinned: false, 
                    categories: getPositionCategories(pos) 
                });
            }
            return;
        }
        
        var isStarter = false;
        if (line.indexOf('⭐') !== -1 || line.indexOf('*') !== -1) {
            isStarter = true;
            line = line.replace(/[⭐\*]\s*/, '');
        }
        
        var n = '';
        var rest = line;
        var numMatch = rest.match(/^(\d{1,3})\s+/);
        if (numMatch) { 
            n = numMatch[1]; 
            rest = rest.slice(numMatch[0].length).trim(); 
        }
        
        var po = '';
        var name = rest;
        var words = rest.split(/\s+/);
        var lastWord = words[words.length - 1] ? words[words.length - 1].toUpperCase() : '';
        
        if (lastWord && (positions.indexOf(lastWord) !== -1 || posMap[lastWord])) {
            po = posMap[lastWord] || lastWord;
            words.pop();
            name = words.join(' ');
        } else {
            var lastTwo = words.length >= 2 ? words.slice(-2).join('/').toUpperCase() : '';
            if (lastTwo) {
                var posCandidates = lastTwo.split('/');
                var found = false;
                posCandidates.forEach(function(p) {
                    if (positions.indexOf(p) !== -1 || posMap[p]) {
                        po = posMap[p] || p;
                        found = true;
                    }
                });
                if (found) {
                    var tempName = rest;
                    posCandidates.forEach(function(p) {
                        tempName = tempName.replace(new RegExp(p, 'i'), '').trim();
                    });
                    name = tempName;
                }
            }
        }
        
        name = name.replace(/\s+/g, ' ').trim();
        if (!name && rest) name = rest;
        if (!n) { n = autoNumber; autoNumber++; }
        if (!po) po = 'QB';
        
        if (name) {
            out.push({ 
                id: 'p' + Date.now() + Math.random().toString(36).slice(2,7), 
                n: String(n), 
                na: name, 
                po: po, 
                posFull: po, 
                st: isStarter, 
                nt: '', 
                pinned: false, 
                categories: getPositionCategories(po) 
            });
        }
    });
    return out;
}

    if (!tx) return toast('⚠️ Empty input');
    
    var out = processRosterText(tx);
    
    if (out.length) {
        pushRosterUndo(teamId, 'delete', { players: team.players.slice() });
        team.players = out;
        saveState();
        renderRoster();
        toast('✅ ' + out.length + ' players parsed (REPLACED)');
    } else {
        toast('❌ No players found. Format: "Number Name Position" or "Name Position"');
    }
}

// NEW: Add to existing roster without replacing
function addParsedRosterText(teamId) {
    var tx = document.getElementById('parseArea').value.trim();
    var team = S.teams.find(function(t) { return t.id === teamId; });
    if (!team) return;
    if (!tx) return toast('⚠️ Empty input');
    
    var out = processRosterText(tx);

        toast('❌ No players found. Format: "Number Name Position" or "Name Position"');
    }
}

function applyTimeoutConfig() {
    var timeoutCount = S.md7 === '7v7' ? S.timeoutConfig.sevens.perHalf : S.timeoutConfig.tackle.perHalf;
    if (S.gameState === 'READY' || S.gameState === 'FIRST_HALF' || S.gameState === 'HALFTIME' || S.gameState === 'SECOND_HALF') {
        S.timeouts = { away: timeoutCount, home: timeoutCount };
        updateTimeoutDisplay();
        saveState();
        toast('✅ Timeouts set to ' + timeoutCount + ' per team');
    } else {
        toast('ℹ️ Settings saved. Will apply on next game start.');
    }
}

function exportBackup() { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'fnl_backup.json'; a.click(); }

function importBackup(input) { 
    var f = input.files[0]; 
    if (!f) return; 
    var r = new FileReader(); 
    r.onload = function(ev) { 
        try { 
            S = JSON.parse(ev.target.result); 
            normalizeState(); 
            saveState(); 
            renderAll(); 
            updateHeaderBranding();
            toast('✅ Restored'); 
        } catch(e) { 
            toast('❌ Invalid file'); 
        } 
    }; 
    r.readAsText(f); 
}
