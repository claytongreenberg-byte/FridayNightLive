<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – PA Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #facc15;
            --bg: #f1f5f9;
            --surface: #e2e8f0;
            --text: #0f172a;
            --border: #94a3b8;
            --footer-bg: #1a1a1a;
            --footer-text: #f1f5f9;
            --scorebug-bg: #0d0d1a;
            --scorebug-text: #ffffff;
            --team-card-away: #e2e8f0;
            --team-card-home: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }
        select { -webkit-appearance: menulist; appearance: menulist; }
        header {
            background: linear-gradient(180deg, #1a3a0e, #0f2a08);
            padding: 6px 10px;
            border-bottom: 3px solid var(--accent);
            flex-shrink: 0;
        }
        .hdr-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hdr-top-left { display: flex; align-items: center; gap: 8px; }
        .brand-logo { height: 36px; width: auto; max-width: 80px; object-fit: contain; }
        .brand-text h1 { font-size: 1rem; color: #fff; }
        .brand-text p { font-size: 0.6rem; color: var(--accent); }
        .hdr-top-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .wall-clock, .weather-pill {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--accent);
            border-radius: 5px;
            padding: 3px 6px;
            white-space: nowrap;
        }
        .hdr-btn {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 16px;
            padding: 5px 9px;
            font-size: 0.62rem;
            cursor: pointer;
            white-space: nowrap;
            min-height: 26px;
            transition: all 0.15s;
        }
        .hdr-btn:hover { background: #475569; }
        .hdr-btn.outdoor-active {
            background: #22c55e;
            border-color: #22c55e;
        }
        .hdr-btn.save-btn { background: #16a34a; border-color: #16a34a; }
        .hdr-btn.save-btn:hover { background: #15803d; }
        .hdr-btn.undo-btn { background: #dc2626; border-color: #dc2626; }
        .hdr-btn.undo-btn:hover { background: #b91c1c; }
        .hdr-btn.undo-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .hdr-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .save-status {
            font-size: 0.55rem;
            color: var(--accent);
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .save-status.saved { color: #4ade80; }
        .save-status.offline { color: #facc15; }
        .save-status.error { color: #f87171; }

        /* ===== ESPN/FOX SPORTS style scorebug ===== */
        .scorebug-wrap { width: 100%; display: flex; flex-direction: column; gap: 4px; }
        .scorebug {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 0;
            background: linear-gradient(180deg, #0d0d1a, #000000);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 10px 14px 8px;
            flex-wrap: nowrap;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            --sb-text: #ffffff;
            min-height: 150px;
        }
        .sb-network-tag {
            position: absolute;
            top: -10px;
            left: 12px;
            background: var(--accent);
            color: #000;
            font-weight: 900;
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            padding: 2px 12px;
            border-radius: 3px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .live-pill {
            position: absolute;
            top: -10px;
            right: 12px;
            background: #dc2626;
            color: #fff;
            font-weight: 800;
            font-size: 0.55rem;
            padding: 2px 12px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 5px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .live-pill.show { display: inline-flex; }
        .live-pill.final { background: #334155; }
        .live-pill.halftime { background: #f59e0b; }
        .live-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            animation: sbpulse 1s infinite;
        }
        .live-pill.final .dot,
        .live-pill.halftime .dot { animation: none; }
        @keyframes sbpulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }
        .sb-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            border-right: 1px solid rgba(255,255,255,0.06);
            flex: 1 1 0;
            min-width: 50px;
        }
        .sb-block:last-child { border-right: none; }
        .sb-block.score-block { flex: 1.3; }
        .sb-block.clock-block { flex: 0.9; }
        .sb-block.game-block { flex: 1.7; }

        .sb-team-chip {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            border: 2px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .sb-team-chip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sb-name-col { display: flex; flex-direction: column; align-items: center; }
        .sb-abbr {
            font-size: 20px;
            font-weight: 900;
            color: var(--sb-text);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sb-poss {
            font-size: 22px;
            animation: possBounce 0.7s infinite;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(250,204,21,0.5));
        }
        @keyframes possBounce {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.2); }
        }
        .sb-label {
            font-size: 0.45rem;
            color: var(--sb-text);
            opacity: 0.35;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: -2px;
        }
        .sb-fullname {
            font-size: 0.55rem;
            color: var(--sb-text);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: rgba(0,0,0,0.2);
            padding: 1px 8px;
            border-radius: 4px;
            margin-top: 1px;
            opacity: 0.7;
        }
        .sb-row { display: flex; align-items: center; gap: 4px; }
        .sb-val {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--sb-text);
            min-width: 40px;
            text-align: center;
            text-shadow: 0 0 30px rgba(255,255,255,0.05);
            line-height: 1;
        }
        .sb-qtr {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(250,204,21,0.15);
        }
        .game-clock {
            font-family: 'Courier New', monospace;
            font-size: 3.4rem;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0,255,136,0.15), 0 0 60px rgba(0,255,136,0.05);
            letter-spacing: 1px;
        }
        .game-clock.paused { color: var(--sb-text); opacity: 0.4; }
        .game-clock.clock-warning { color: #ff6b6b; animation: clockPulse 1s infinite; }
        @keyframes clockPulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .sb-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .sb-btn:hover { background: var(--accent); color: #000; transform: scale(1.1); }
        .sb-btn:active { transform: scale(0.9); }
        .sb-game-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sb-game-btns button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 10px;
            padding: 4px 10px;
            font-size: 0.55rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 24px;
            min-width: 36px;
            transition: all 0.15s;
        }
        .sb-game-btns button:hover { background: var(--accent); color: #000; transform: scale(1.04); }
        .sb-game-btns button:active { transform: scale(0.95); }
        .sb-game-btns button.half-active { background: #f59e0b; color: #000; }
        .sb-game-btns button.final-active { background: #dc2626; color: #fff; }
        .sb-game-btns button:disabled { opacity: 0.2; cursor: not-allowed; transform: none !important; }
        .sb-game-btns button:disabled:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sb-toggle-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .dd-ticker {
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.75rem;
            text-align: center;
            color: #fff;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            background: #1a1a2e;
            min-height: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .timeout-display {
            display: flex;
            gap: 3px;
            align-items: center;
            margin-top: 2px;
        }
        .timeout-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            transition: all 0.2s;
            box-shadow: 0 0 8px rgba(74,222,128,0.3);
        }
        .timeout-dot.used {
            background: #334155;
            opacity: 0.2;
            box-shadow: none;
        }
        .timeout-zero {
            font-size: 0.55rem;
            font-weight: 800;
            color: #f87171;
            letter-spacing: 0.3px;
        }
        .timeout-label {
            font-size: 0.45rem;
            color: var(--sb-text);
            opacity: 0.4;
            letter-spacing: 0.3px;
        }
        .last-event {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 4px 12px;
            text-align: center;
            font-weight: 800;
            font-size: 0.75rem;
            color: #fff;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex: 1;
            max-width: 400px;
            box-shadow: inset 0 0 30px rgba(250,204,21,0.05);
        }

        nav {
            background: #1a1a1a;
            display: flex;
            gap: 4px;
            padding: 0 10px;
            flex-shrink: 0;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-link {
            background: none;
            border: none;
            color: #999;
            padding: 6px 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.6rem;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .nav-link:hover { color: #fff; }
        .nav-link.active {
            background: var(--accent);
            color: #000;
            border-radius: 6px 6px 0 0;
        }
        main {
            flex: 1;
            overflow: auto;
            padding: 6px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .panel-header h3 {
            margin: 0;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0.7;
        }
        .panel-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* Quick cues – compact */
        .quick-cues {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 3px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .quick-cues button {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 20px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .quick-cues button:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.04);
        }
        .quick-cues button:active { transform: scale(0.95); }
        .quick-cues button.flag {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .quick-cues button.injury {
            background: #dc2626;
            color: #fff;
            border-color: #dc2626;
        }

        /* SINGLE GAME CONTROLS ROW – combines possession + down/distance + scoring */
        .game-controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--bg);
            border: 2px solid var(--accent);
            border-radius: 8px;
            margin-bottom: 6px;
            box-shadow: 0 2px 12px rgba(250,204,21,0.08);
            min-height: 44px;
        }
        .game-controls-row .label {
            font-weight: 800;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text);
            opacity: 0.5;
            margin-right: 2px;
        }
        .game-controls-row .divider {
            width: 1px;
            height: 28px;
            background: var(--border);
            opacity: 0.3;
            margin: 0 2px;
        }
        .game-controls-row .pos-btn {
            padding: 4px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 65px;
            border-radius: 6px;
            border: 2px solid #475569;
            cursor: pointer;
            transition: all 0.15s;
            background: #334155;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
        }
        .game-controls-row .pos-btn:hover { transform: scale(1.04); }
        .game-controls-row .pos-btn:active { transform: scale(0.95); }
        .game-controls-row .pos-btn.active {
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(250,204,21,0.15);
        }
        .game-controls-row .pos-btn .team-logo {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
        }
        .game-controls-row .to-btn {
            padding: 4px 12px;
            font-size: 0.6rem;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #f97316;
            color: #fff;
            transition: all 0.15s;
        }
        .game-controls-row .to-btn:hover {
            transform: scale(1.04);
            background: #ea580c;
        }
        .game-controls-row .clock-status {
            font-size: 0.55rem;
            opacity: 0.6;
            padding: 3px 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            font-weight: 700;
        }
        .game-controls-row .clock-status.running {
            color: #4ade80;
            opacity: 1;
        }
        .game-controls-row .clock-status.paused {
            color: #facc15;
            opacity: 1;
        }
        .game-controls-row select,
        .game-controls-row input {
            padding: 3px 5px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.55rem;
            min-height: 22px;
        }
        .game-controls-row .yd-input { width: 38px; }
        .game-controls-row .gc-btn {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 3px 8px;
            font-weight: 700;
            font-size: 0.55rem;
            cursor: pointer;
            min-height: 22px;
            transition: all 0.15s;
        }
        .game-controls-row .gc-btn:hover { background: #475569; }
        .game-controls-row .gc-btn.td { background: #dc2626; border-color: #dc2626; }
        .game-controls-row .gc-btn.fg { background: #2563eb; border-color: #2563eb; }
        .game-controls-row .gc-btn.twopt { background: #8b5cf6; border-color: #8b5cf6; }
        .game-controls-row .gc-btn.pat { background: #16a34a; border-color: #16a34a; }
        .game-controls-row .gc-btn.safety { background: #f59e0b; color: #000; border-color: #f59e0b; }

        /* Team cards – more vertical space */
        .team-cards {
            display: flex;
            gap: 6px;
            height: calc(100% - 120px);
            min-height: 180px;
        }
        .team-card {
            flex: 1;
            background: var(--team-card-bg);
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .team-card.away-card { background: var(--team-card-away); }
        .team-card.home-card { background: var(--team-card-home); }
        .card-head {
            padding: 4px 6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #fff;
            font-size: 0.65rem;
            flex-shrink: 0;
        }
        .card-head select {
            flex: 1;
            padding: 2px 4px;
            border-radius: 4px;
            background: #fff;
            color: #000;
            font-size: 0.6rem;
            min-height: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .card-head select option { color: #000; }
        .card-head .mini-logo {
            width: 18px;
            height: 18px;
            object-fit: cover;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .card-head .sb-btn { width: 20px; height: 20px; font-size: 9px; }

        .unit-tabs {
            display: flex;
            gap: 2px;
            padding: 2px 4px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .unit-tab {
            background: none;
            border: none;
            color: var(--text);
            padding: 2px 5px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.45rem;
        }
        .unit-tab.active { background: var(--accent); color: #000; border-radius: 4px; }

        .player-list-body {
            flex: 1;
            overflow-y: auto;
            padding: 3px;
        }
        .player-row {
            display: grid;
            grid-template-columns: 24px 1fr 44px 20px 20px 18px;
            gap: 3px;
            align-items: center;
            padding: 2px 3px;
            border-bottom: 2px solid #333;
            font-size: 0.6rem;
        }
        .player-row:last-child { border-bottom: none; }
        .player-row input,
        .player-row select {
            background: transparent;
            border: 1px solid var(--border);
            color: #0a0a0a;
            font-weight: 700;
            padding: 1px 2px;
            width: 100%;
            font-size: 0.6rem;
            border-radius: 3px;
        }
        .player-row input:focus,
        .player-row select:focus {
            border-color: var(--accent);
            outline: none;
            background: rgba(255,255,255,0.4);
        }
        .player-row.starter {
            background: rgba(251,191,36,0.08);
            border-left: 3px solid var(--accent);
        }
        .st-toggle,
        .pin-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            cursor: pointer;
            font-size: 0.45rem;
        }
        .st-toggle.active { background: var(--accent); color: #000; }

        footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            padding: 3px 8px;
            text-align: center;
            font-size: 0.5rem;
            flex-shrink: 0;
            border-top: 1px solid var(--accent);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: 0.75rem;
            backdrop-filter: blur(10px);
        }
        .toast.show { opacity: 1; }
        .tooltip-js {
            position: fixed;
            z-index: 10000;
            background: #1e293b;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;

<script>
    // ============================================================
    // FULL STATE
    // ============================================================
    let S = {
        v: 'sport',
        md: 'light',
        outdoor: false,
        at: 'theme',
        as: 0,
        hs: 0,
        q: 1,
        down: 1,
        dist: 10,
        poss: 'home',
        gameState: 'READY',
        gc: { rem: 480, run: false, max: 480 },
        md7: 'tackle',
        p7: ['QB', 'Center', 'WR', 'WR', 'WR', 'DB', 'DB'],
        cf: '12h',
        cs: true,
        awayId: 'h',
        homeId: 's',
        timeouts: { away: 3, home: 3 },
        timeoutConfig: {
            tackle: { perHalf: 3, overtimePerPeriod: 1 },
            sevens: { perHalf: 0, overtimePerPeriod: 0 }
        },
        undoStack: [],
        sessionId: null,
        lastEvent: { text: '🏈 Ready — Set possession to begin', type: 'info' },
        teams: [
            { id: 'h', name: 'Texas Hawks', abbr: 'TXH', color: '#1e3a5f', logo: '', mascot: '', coach: '', players: [
                { id: 'h1', n: '7', na: 'Marcus Johnson', po: 'QB', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 'h2', n: '55', na: 'Chris Williams', po: 'Center', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 'h3', n: '11', na: 'Jalen Smith', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 'h4', n: '88', na: 'Ty Washington', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 'h5', n: '15', na: 'Jordan Davis', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false }
            ] },
            { id: 's', name: 'Dallas Cowboys', abbr: 'DAL', color: '#7f1d1d', logo: '', mascot: '', coach: '', players: [
                { id: 's1', n: '12', na: 'Caleb White', po: 'QB', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 's2', n: '72', na: 'Mason Lee', po: 'Center', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 's3', n: '1', na: 'Adrian Flores', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 's4', n: '5', na: 'Xavier Reed', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
                { id: 's5', n: '18', na: 'Karter Hill', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false }
            ] }
        ],
        scoringLog: [],
        penaltyLog: [],
        gameHistory: [],
        script: '',
        cp: {},
        ap: '',
        im: true,
        ua: 'all',
        uh: 'all',
        cid: 'h',
        colors: {
            scorebugBg: '#0d0d1a',
            scorebugText: '#ffffff',
            accent: '#facc15',
            teamCardAway: '#e2e8f0',
            teamCardHome: '#e2e8f0',
            teamCardBorder: '#94a3b8'
        }
    };

    const STORAGE_KEY = 'fnl_v25';

    function g() { return S; }

    function toast(m) {
        const x = document.getElementById('toast');
        x.textContent = m;
        x.classList.add('show');
        setTimeout(() => x.classList.remove('show'), 2000);
    }

    // ---- persistence ----
    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
        updateSaveStatus(true);
    }

    function updateSaveStatus(success) {
        const el = document.getElementById('saveStatus');
        if (!el) return;
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (success) {
            el.textContent = `✅ Saved ${time}`;
            el.className = 'save-status saved';
        } else {
            el.textContent = '⚠️ Offline — Local Backup';
            el.className = 'save-status offline';
        }
    }

    function normalizeState() {
        if (!Array.isArray(S.teams) || S.teams.length === 0) {
            S.teams = [{ id: 't1', name: 'Away Team', abbr: 'AWY', color: '#334155', logo: '', mascot: '', coach: '', players: [] }];
        }
        S.teams.forEach(t => { if (t.abbr === undefined) t.abbr = ''; });
        if (!S.teams.find(t => t.id === S.awayId)) S.awayId = S.teams[0].id;
        if (!S.teams.find(t => t.id === S.homeId) || S.homeId === S.awayId) {
            const alt = S.teams.find(t => t.id !== S.awayId);
            S.homeId = alt ? alt.id : S.awayId;
        }
        if (!S.colors) S.colors = { scorebugBg: '#0d0d1a', scorebugText: '#ffffff', accent: '#facc15', teamCardAway: '#e2e8f0', teamCardHome: '#e2e8f0', teamCardBorder: '#94a3b8' };
        if (S.gc.max === undefined) S.gc.max = 480;
        if (S.timeouts === undefined) S.timeouts = { away: 3, home: 3 };
        if (S.timeoutConfig === undefined) {
            S.timeoutConfig = {
                tackle: { perHalf: 3, overtimePerPeriod: 1 },
                sevens: { perHalf: 0, overtimePerPeriod: 0 }
            };
        }
        if (S.undoStack === undefined) S.undoStack = [];
        if (S.sessionId === undefined) S.sessionId = null;
        if (S.lastEvent === undefined) S.lastEvent = { text: '🏈 Ready — Set possession to begin', type: 'info' };
        S.gc.run = false;
    }

    function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { try { S = { ...S, ...JSON.parse(raw) }; } catch (e) {} }
        normalizeState();
    }

    function getTeam(side) {
        const id = side === 'away' ? S.awayId : S.homeId;
        let t = S.teams.find(x => x.id === id);
        if (!t) t = side === 'home' ? (S.teams[1] || S.teams[0]) : S.teams[0];
        return t || { name: 'TBD', abbr: 'TBD', color: '#334155', players: [], id: '' };
    }

    function getPositions() { return S.md7 === '7v7' ? S.p7 : ['QB', 'RB', 'FB', 'WR', 'TE', 'OL', 'C', 'G', 'T', 'DL', 'DE', 'DT', 'LB', 'OLB', 'ILB', 'CB', 'S', 'SS', 'FS', 'DB', 'K', 'P', 'LS', 'KR', 'PR']; }

    function getPlayers(side, filter) {
        const t = getTeam(side);
        if (!t) return [];
        let list = [...t.players];
        if (S.md7 === 'tackle') {
            const off = ['QB', 'RB', 'FB', 'WR', 'TE', 'OL', 'C', 'G', 'T'];
            const def = ['DL', 'DE', 'DT', 'LB', 'OLB', 'ILB', 'CB', 'S', 'SS', 'FS', 'DB'];
            const st = ['K', 'P', 'LS', 'KR', 'PR'];
            if (filter === 'offense') list = list.filter(p => off.includes(p.po));
            else if (filter === 'defense') list = list.filter(p => def.includes(p.po));
            else if (filter === 'special') list = list.filter(p => st.includes(p.po));
        }
        list.sort((a, b) => (parseInt(a.n) || 999) - (parseInt(b.n) || 999));
        return list;
    }

    function teamAbbr(team) {
        if (team.abbr && team.abbr.trim()) return team.abbr.trim().toUpperCase().slice(0, 4);
        const words = (team.name || 'TBD').trim().split(/\s+/);
        if (words.length > 1) return words.map(w => w[0]).join('').toUpperCase().slice(0, 4);
        return (team.name || 'TBD').slice(0, 3).toUpperCase();
    }

    // ---- UNDO ----
    function pushUndo() {
        const snapshot = {
            as: S.as,
            hs: S.hs,
            scoringLog: [...S.scoringLog],
            penaltyLog: [...S.penaltyLog],
            gameState: S.gameState,
            q: S.q,
            down: S.down,
            dist: S.dist,
            poss: S.poss,
            gc: { rem: S.gc.rem, run: S.gc.run },
            timeouts: { away: S.timeouts.away, home: S.timeouts.home }
        };
        S.undoStack.push(snapshot);
        if (S.undoStack.length > 20) S.undoStack.shift();
        updateUndoButton();
        saveState();
    }

    function undoLastEvent() {
        if (S.undoStack.length === 0) { toast('ℹ️ Nothing to undo'); return; }
        const prev = S.undoStack.pop();
        S.as = prev.as;
        S.hs = prev.hs;
        S.scoringLog = prev.scoringLog;
        S.penaltyLog = prev.penaltyLog;
        S.gameState = prev.gameState;
        S.q = prev.q;
        S.down = prev.down;
        S.dist = prev.dist;
        S.poss = prev.poss;
        S.gc.rem = prev.gc.rem;
        S.gc.run = prev.gc.run;
        S.timeouts.away = prev.timeouts.away;
        S.timeouts.home = prev.timeouts.home;
        updateUndoButton();
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        renderGame();
        setLastEvent('↩ Undo', 'undo');
        saveState();
        toast('↩ Undo successful');
    }

    function updateUndoButton() {
        const btn = document.getElementById('undoBtn');
        if (btn) {
            btn.disabled = S.undoStack.length === 0;
            btn.textContent = S.undoStack.length > 0 ? `↩ Undo (${S.undoStack.length})` : '↩ Undo';
        }
    }

    // ---- LAST EVENT ----
    function setLastEvent(text, type) {
        S.lastEvent = { text, type: type || 'info' };
        const el = document.getElementById('lastEvent');
        if (el) {
            el.innerHTML = text;
            el.className = 'last-event';
            const colors = { td: '#dc2626', fg: '#2563eb', twopt: '#8b5cf6', pat: '#16a34a', safety: '#f59e0b', penalty: '#facc15', undo: '#f97316', timeout: '#f97316', injury: '#dc2626' };
            el.style.borderColor = colors[type] || 'var(--accent)';
        }
        if (type !== 'info' && type !== 'undo') {
            clearTimeout(window.lastEventTimeout);
            window.lastEventTimeout = setTimeout(() => {
                const el2 = document.getElementById('lastEvent');
                if (el2) {
                    el2.innerHTML = '⏳ Waiting for next event...';
                    el2.style.borderColor = 'var(--accent)';
                }
            }, 10000);
        }
    }

    // ---- Tooltips ----
    const tooltipEl = document.getElementById('tooltip');
    document.addEventListener('mouseover', e => {
        const t = e.target.closest('[data-tooltip]');
        if (t) { tooltipEl.textContent = t.getAttribute('data-tooltip');
            tooltipEl.style.display = 'block';
            positionTooltip(e.clientX, e.clientY); }
    });
    document.addEventListener('mousemove', e => { if (tooltipEl.style.display === 'block') positionTooltip(e.clientX, e.clientY); });
    document.addEventListener('mouseout', e => { if (!e.target.closest('[data-tooltip]')) tooltipEl.style.display = 'none'; });

    function positionTooltip(x, y) {
        let left = x + 15,
            top = y + 15;
        const rect = tooltipEl.getBoundingClientRect();
        if (left + rect.width > window.innerWidth) left = x - rect.width - 15;
        if (top + rect.height > window.innerHeight) top = y - rect.height - 15;
        tooltipEl.style.left = left + 'px';
        tooltipEl.style.top = top + 'px';
    }

    // ---- Keyboard shortcuts ----
    document.addEventListener('keydown', e => {
        const tag = (e.target.tagName || '').toLowerCase();
        const typing = tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable;
        if (e.code === 'Space' && !typing) { e.preventDefault(); if (S.gc.run) pauseGC(); else startGC(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault();
            fnlCloudSaveAll(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault();
            undoLastEvent(); }
    });

    // ---- Theme ----
    function toggleTheme() {
        S.md = S.md === 'dark' ? 'light' : 'dark';
        if (S.md === 'dark') {
            document.documentElement.style.setProperty('--bg', '#0f172a');
            document.documentElement.style.setProperty('--surface', '#1e293b');
            document.documentElement.style.setProperty('--text', '#f1f5f9');
            document.documentElement.style.setProperty('--border', '#334155');
            document.documentElement.style.setProperty('--footer-bg', '#0f172a');
            document.documentElement.style.setProperty('--footer-text', '#f1f5f9');
            document.getElementById('themeBtn').textContent = '☀️ Light';
        } else {
            document.documentElement.style.setProperty('--bg', '#f1f5f9');
            document.documentElement.style.setProperty('--surface', '#e2e8f0');
            document.documentElement.style.setProperty('--text', '#0f172a');
            document.documentElement.style.setProperty('--border', '#94a3b8');
            document.documentElement.style.setProperty('--footer-bg', '#1a1a1a');
            document.documentElement.style.setProperty('--footer-text', '#f1f5f9');
            document.getElementById('themeBtn').textContent = '🌙 Dark';
        }
        saveState();
        renderAll();
    }

    // ---- Outdoor ----
    function toggleOutdoor() {
        S.outdoor = !S.outdoor;
        const size = S.outdoor ? '20px' : '14px';
        document.body.style.fontSize = size;
        const btn = document.getElementById('outdoorBtn');
        if (S.outdoor) {
            btn.classList.add('outdoor-active');
            btn.textContent = '🌤 ON';
            document.querySelector('.scorebug').style.transform = 'scale(1.05)';
            document.querySelector('.scorebug').style.transformOrigin = 'center center';
        } else {
            btn.classList.remove('outdoor-active');
            btn.textContent = '🌤';
            document.querySelector('.scorebug').style.transform = 'scale(1)';
        }
        toast(S.outdoor ? '🌤 Outdoor ON' : '🌤 Outdoor OFF');
        saveState();
    }

    // ---- Clock ----
    function updateWallClock() {
        const n = new Date();
        let h = n.getHours();
        const m = String(n.getMinutes()).padStart(2, '0');
        const s = String(n.getSeconds()).padStart(2, '0');
        let x = '';
        if (S.cf === '12h') { const a = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            x = `${h}:${m}${S.cs ? ':' + s : ''} ${a}`; } else { h = String(h).padStart(2, '0');
            x = `${h}:${m}${S.cs ? ':' + s : ''}`; }
        document.getElementById('wallClock').textContent = x;
    }
    setInterval(updateWallClock, 1000);
    updateWallClock();

    // ---- Weather ----
    function updateWeather() {
        fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph')
            .then(r => r.json()).then(d => { if (d.current) { document.getElementById('weatherHeader').textContent = `🌤 ${Math.round(d.current.temperature_2m)}°F | 💨 ${Math.round(d.current.wind_speed_10m)}mph`; } }).catch(() => {});
    }
    updateWeather();

    // ---- Colors ----
    function applyColors() {
        document.documentElement.style.setProperty('--accent', S.colors.accent);
        document.documentElement.style.setProperty('--scorebug-bg', S.colors.scorebugBg);
        document.documentElement.style.setProperty('--scorebug-text', S.colors.scorebugText);
        document.documentElement.style.setProperty('--team-card-away', S.colors.teamCardAway);
        document.documentElement.style.setProperty('--team-card-home', S.colors.teamCardHome);
        document.documentElement.style.setProperty('--border', S.colors.teamCardBorder);
        document.querySelectorAll('.team-card').forEach((card) => {
            if (card.classList.contains('away-card')) card.style.background = S.colors.teamCardAway;
            else if (card.classList.contains('home-card')) card.style.background = S.colors.teamCardHome;
            card.style.borderColor = S.colors.teamCardBorder;
        });
    }

    // ---- Scorebug ----
    function chScore(side, delta) {
        if (side === 'away') S.as = Math.max(0, S.as + delta);
        else S.hs = Math.max(0, S.hs + delta);
        updateScorebug();
        saveState();
    }

    function chQuarter(delta) {
        const maxQ = S.md7 === '7v7' ? 2 : (S.gameState === 'OVERTIME' ? 5 : 4);
        S.q = Math.min(maxQ, Math.max(1, S.q + delta));
        if (delta !== 0) {
            S.gc.rem = S.gc.max || 480;
            S.gc.run = false;
            updateGameClockDisplay();
            toast(`⏱️ Qtr changed — Clock reset`);
        }
        if (S.gameState !== 'OVERTIME' && S.gameState !== 'HALFTIME') {
            S.gameState = S.q <= (S.md7 === '7v7' ? 1 : 2) ? 'FIRST_HALF' : 'SECOND_HALF';
        }
        updateScorebug();
        updateGameStateBadge();
        saveState();
    }

    function updateScorebug() {
        const away = getTeam('away'),
            home = getTeam('home');
        document.getElementById('sbAwayAbbr').innerHTML = teamAbbr(away) + (S.poss === 'away' ? ' <span class="sb-poss">🏈</span>' : '');
        document.getElementById('sbHomeAbbr').innerHTML = teamAbbr(home) + (S.poss === 'home' ? ' <span class="sb-poss">🏈</span>' : '');
        document.getElementById('sbAwayFull').textContent = away.name;
        document.getElementById('sbHomeFull').textContent = home.name;
        const awayChip = document.getElementById('sbAwayChip');
        const homeChip = document.getElementById('sbHomeChip');
        awayChip.style.background = away.color || '#334155';
        awayChip.innerHTML = away.logo ? `<img src="${away.logo}" alt="">` : teamAbbr(away)[0];
        homeChip.style.background = home.color || '#334155';
        homeChip.innerHTML = home.logo ? `<img src="${home.logo}" alt="">` : teamAbbr(home)[0];
        document.getElementById('sbAwayScore').textContent = S.as;
        document.getElementById('sbHomeScore').textContent = S.hs;
        let qLabel;
        if (S.gameState === 'HALFTIME') qLabel = 'HALF';
        else if (S.gameState === 'FINAL') qLabel = 'FINAL';
        else if (S.md7 === '7v7') qLabel = S.q === 1 ? '1st Half' : '2nd Half';
        else qLabel = S.q >= 5 ? 'OT' : `Q${S.q}`;
        document.getElementById('sbQuarter').textContent = qLabel;
        updateTimeoutDisplay();
        applyColors();
        updateDDTicker();
        updateGameClockDisplay();
        updateGameStateBadge();
        updateUndoButton();
    }

    function updateGameClockDisplay() {
        const m = Math.floor(S.gc.rem / 60),
            s = S.gc.rem % 60;
        const el = document.getElementById('gameClockDisplay');
        el.textContent = `${m}:${String(s).padStart(2, '0')}`;
        if (S.gameState === 'FINAL') { el.className = 'game-clock clock-warning';
            el.style.color = '#ff6b6b'; } else if (S.gameState === 'HALFTIME') { el.className = 'game-clock paused';
            el.style.color = '#f59e0b'; } else if (!S.gc.run) { el.className = 'game-clock paused';
            el.style.color = 'var(--sb-text)'; } else { el.className = 'game-clock';
            el.style.color = '#00ff88'; }
    }

    setInterval(() => {
        if (S.gc.run && S.gc.rem > 0) {
            S.gc.rem--;
            updateGameClockDisplay();
            if (S.gc.rem === 0) { S.gc.run = false;
                toast('⏰ Clock expired!');
                setLastEvent('⏰ Clock expired', 'info'); }
        }
    }, 1000);

    function updateDDTicker() {
        const el = document.getElementById('ddTicker');
        if (!el) return;
        if (S.gameState === 'FINAL') { el.textContent = '🏁 GAME FINAL';
            el.style.background = '#dc2626'; return; }
        if (S.gameState === 'HALFTIME') { el.textContent = '⏸️ HALFTIME';
            el.style.background = '#f59e0b'; return; }
        if (S.gameState === 'READY') { const team = getTeam(S.poss);
            el.textContent = `🏈 ${team.name.toUpperCase()} HAS THE BALL • PRESS "▶ START" TO BEGIN`;
            el.style.background = '#334155'; return; }
        const team = getTeam(S.poss);
        const ord = { 1: '1ST', 2: '2ND', 3: '3RD', 4: '4TH' }[S.down] || (S.down + 'TH');
        el.innerHTML = `🏈 ${team.name.toUpperCase()} BALL &nbsp;•&nbsp; ${ord} &amp; ${S.dist}`;
        el.style.background = team.color || '#334155';
    }

    function updateGameStateBadge() {
        const pill = document.getElementById('livePill');
        const txt = document.getElementById('livePillText');
        if (!pill || !txt) return;
        pill.classList.remove('final', 'halftime');
        if (S.gameState === 'FINAL') { pill.classList.add('show', 'final');
            txt.textContent = 'FINAL';
            document.getElementById('btnFinal').classList.add('final-active'); } else if (S.gameState === 'HALFTIME') { pill.classList.add('show', 'halftime');
            txt.textContent = 'HALF';
            document.getElementById('btnHalf').classList.add('half-active'); } else if (S.gameState === 'FIRST_HALF' || S.gameState === 'SECOND_HALF' || S.gameState === 'OVERTIME') { pill.classList.add('show');
            txt.textContent = 'LIVE';
            document.getElementById('btnHalf').classList.remove('half-active');
            document.getElementById('btnFinal').classList.remove('final-active'); } else { pill.classList.remove('show');
            document.getElementById('btnHalf').classList.remove('half-active');
            document.getElementById('btnFinal').classList.remove('final-active'); }
    }

    // ---- TIMEOUTS ----
    function updateTimeoutDisplay() {
        const away = S.timeouts.away || 0;
        const home = S.timeouts.home || 0;
        const awayTOEl = document.querySelector('.sb-block.score-block:first-child .timeout-display');
        const homeTOEl = document.querySelector('.sb-block.score-block:last-child .timeout-display');

        if (awayTOEl) {
            if (away === 0) {
                awayTOEl.innerHTML = `<span class="timeout-zero">NONE</span>`;
            } else {
                let html = `<span class="timeout-label">TO:</span>`;
                for (let i = 1; i <= 3; i++) {
                    html += `<span class="timeout-dot${i > away ? ' used' : ''}"></span>`;
                }
                awayTOEl.innerHTML = html;
            }
        }
        if (homeTOEl) {
            if (home === 0) {
                homeTOEl.innerHTML = `<span class="timeout-zero">NONE</span>`;
            } else {
                let html = `<span class="timeout-label">TO:</span>`;
                for (let i = 1; i <= 3; i++) {
                    html += `<span class="timeout-dot${i > home ? ' used' : ''}"></span>`;
                }
                homeTOEl.innerHTML = html;
            }
        }
    }

    function useTimeout(side) {
        if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
        if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
        const key = side === 'away' ? 'away' : 'home';
        if (S.timeouts[key] <= 0) { toast(`⚠️ ${side.toUpperCase()} has no timeouts left`); return; }
        S.timeouts[key]--;
        S.gc.run = false;
        const team = getTeam(side);
        pushUndo();
        setLastEvent(`⏱️ ${team.name} TIMEOUT — ${S.timeouts[key]} remaining`, 'timeout');
        updateTimeoutDisplay();
        updateGameClockDisplay();
        saveState();
        toast(`⏱️ ${side.toUpperCase()} timeout — ${S.timeouts[key]} remaining — Clock paused`);
    }

    // ---- Injury timeout (no team charged) ----
    function injuryTimeout() {
        if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
        if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
        S.gc.run = false;
        setLastEvent('🆘 INJURY TIMEOUT — Clock paused', 'injury');
        updateGameClockDisplay();
        saveState();
        toast('🆘 Injury timeout — Clock paused (no timeout charged)');
    }

    // ---- Game state ----
    function startGame() {
        if (S.gameState !== 'READY') { toast('⏳ Game already in progress. Use RESET.'); return; }
        S.sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        S.gameState = 'FIRST_HALF';
        S.gc.rem = S.gc.max || 480;
        S.gc.run = false;
        S.q = 1;
        S.as = 0;
        S.hs = 0;
        S.down = 1;
        S.dist = 10;
        S.poss = 'home';
        S.scoringLog = [];
        S.penaltyLog = [];
        const timeoutCount = S.md7 === '7v7' ? (S.timeoutConfig.sevens ? S.timeoutConfig.sevens.perHalf : 0) : (S.timeoutConfig.tackle ? S.timeoutConfig.tackle.perHalf : 3);
        S.timeouts = { away: timeoutCount, home: timeoutCount };
        S.undoStack = [];
        pushUndo();
        setLastEvent('🏈 GAME STARTED — Q1', 'info');
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        saveState();
        toast('🏈 Game started!');
    }

    function setHalftime() {
        if (S.gameState !== 'FIRST_HALF' && S.gameState !== 'SECOND_HALF') { toast('⏳ Halftime only during a half'); return; }
        S.gameState = 'HALFTIME';
        S.gc.run = false;
        S.q = 2;
        const timeoutCount = S.md7 === '7v7' ? (S.timeoutConfig.sevens ? S.timeoutConfig.sevens.perHalf : 0) : (S.timeoutConfig.tackle ? S.timeoutConfig.tackle.perHalf : 3);
        S.timeouts = { away: timeoutCount, home: timeoutCount };
        pushUndo();
        setLastEvent('⏸️ HALFTIME', 'info');
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        saveState();
        toast('⏸️ Halftime');
    }

    function startSecondHalf() {
        if (S.gameState !== 'HALFTIME') { toast('⏳ Can only start 2nd half from HALFTIME'); return; }
        S.gameState = 'SECOND_HALF';
        S.gc.rem = S.gc.max || 480;
        S.gc.run = false;
        S.q = 3;
        pushUndo();
        setLastEvent('⏭️ SECOND HALF STARTED — Q3', 'info');
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        saveState();
        toast('⏭️ 2nd Half started');
    }

    function setOvertime() {
        if (S.gameState !== 'SECOND_HALF' && S.gameState !== 'OVERTIME') { toast('⏳ OT only during 2nd half or OT'); return; }
        S.gameState = 'OVERTIME';
        S.gc.rem = 360;
        S.gc.run = false;
        S.q = 5;
        const otCount = S.md7 === '7v7' ? (S.timeoutConfig.sevens ? S.timeoutConfig.sevens.overtimePerPeriod : 0) : (S.timeoutConfig.tackle ? S.timeoutConfig.tackle.overtimePerPeriod : 1);
        S.timeouts = { away: otCount, home: otCount };
        pushUndo();
        setLastEvent('⏱️ OVERTIME', 'info');
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        saveState();
        toast('⏱️ Overtime');
    }

    function endGame() {
        if (S.gameState === 'READY') { toast('⏳ No game in progress'); return; }
        if (S.gameState === 'FINAL') { toast('⛔ Already final'); return; }
        if (!confirm('End game?')) return;
        S.gameState = 'FINAL';
        S.gc.run = false;
        const away = getTeam('away'),
            home = getTeam('home');
        S.gameHistory.push({ date: new Date().toISOString(), sessionId: S.sessionId, away: away.name, home: home.name, awayScore: S.as, homeScore: S.hs, log: [...S.scoringLog, ...S.penaltyLog] });
        pushUndo();
        setLastEvent(`🏁 GAME FINAL — ${away.name} ${S.as} - ${S.hs} ${home.name}`, 'info');
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        saveState();
        toast('🏁 Game ended');
    }

    function startGC() {
        if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
        if (S.gameState === 'HALFTIME') { toast('⏸️ Halftime - clock paused'); return; }
        if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
        S.gc.run = true;
        toast('▶️ Clock running');
        updateGameClockDisplay();
        saveState();
    }

    function pauseGC() { S.gc.run = false;
        toast('⏸️ Clock paused');
        updateGameClockDisplay();
        saveState(); }

    function resetGC() { S.gc.run = false;
        S.gc.rem = S.gc.max || 480;
        updateGameClockDisplay();
        saveState(); }

    function resetGame() {
        if (!confirm('Reset game? Clears score, clock, logs.')) return;
        S.as = 0;
        S.hs = 0;
        S.q = 1;
        S.down = 1;
        S.dist = 10;
        S.poss = 'home';
        S.gameState = 'READY';
        S.gc.rem = S.gc.max || 480;
        S.gc.run = false;
        S.scoringLog = [];
        S.penaltyLog = [];
        const timeoutCount = S.md7 === '7v7' ? (S.timeoutConfig.sevens ? S.timeoutConfig.sevens.perHalf : 0) : (S.timeoutConfig.tackle ? S.timeoutConfig.tackle.perHalf : 3);
        S.timeouts = { away: timeoutCount, home: timeoutCount };
        S.undoStack = [];
        S.sessionId = null;
        S.lastEvent = { text: '🏈 Ready — Set possession to begin', type: 'info' };
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        renderView();
        saveState();
        setLastEvent('🔄 Game reset', 'info');
        toast('🔄 Game reset');
    }

    // ---- Game controls ----
    function setPossession(side) {
        S.poss = side;
        toast(`🏈 ${side.toUpperCase()} has the ball`);
        renderGame();
        updateScorebug();
        saveState();
    }

    function firstDown() { S.down = 1;
        S.dist = 10;
        renderGame();
        updateDDTicker();
        setLastEvent('🔻 1st & 10', 'info');
        saveState(); }

    function setDown(v) { S.down = parseInt(v) || 1;
        updateDDTicker();
        saveState(); }

    function setDist(v) { S.dist = parseInt(v) || 1;
        updateDDTicker();
        saveState(); }

    function adjustYards(delta) {
        S.dist = Math.max(1, Math.min(99, S.dist + delta));
        updateDDTicker();
        saveState();
    }

    // ---- Scoring ----
    function recordScore(type, pts, teamSide, playerName) {
        if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
        if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
        pushUndo();
        if (teamSide === 'home') S.hs += pts;
        else S.as += pts;
        const entry = { type, team: teamSide, player: playerName, points: pts, time: S.gc.rem, quarter: S.q, id: Date.now() + '_' + Math.random().toString(36).slice(2, 5) };
        S.scoringLog.push(entry);
        const team = getTeam(teamSide);
        const emoji = type === 'td' ? '🏈' : type === 'fg' ? '🎯' : type === 'twopt' ? '➕' : type === 'pat' ? '🎯' : '⚡';
        const label = type === 'td' ? 'TOUCHDOWN' : type === 'fg' ? 'FIELD GOAL' : type === 'twopt' ? '2-POINT CONVERSION' : type === 'pat' ? 'PAT' : 'SAFETY';
        setLastEvent(`${emoji} ${label} — ${playerName || team.name} (+${pts})`, type);
        updateScorebug();
        saveState();
        toast(`${label} +${pts} - ${playerName || team.name}`);
    }

    // ---- Player picker ----
    function openPlayerPicker(title, callback) {
        const team = getTeam(S.poss);
        const overlay = document.createElement('div');
        overlay.className = 'pp-overlay';
        const box = document.createElement('div');
        box.className = 'pp-box';
        let html = `<h3>${title} — ${team.name}</h3>`;
        const sorted = [...team.players].sort((a, b) => (parseInt(a.n) || 999) - (parseInt(b.n) || 999));
        if (sorted.length) {
            html += '<div class="pp-grid">';
            sorted.forEach(p => { html += `<button type="button" data-pid="${p.id}">#${p.n || '-'}<br>${p.na}</button>`; });
            html += '</div>';
        } else {
            html += '<p style="margin-bottom:8px;opacity:.6;">No players on this roster yet.</p>';
        }
        html += `<div class="pp-actions">
            <input id="ppManual" placeholder="Or type a name / number">
            <button type="button" class="hdr-btn" id="ppSkip">Skip</button>
            <button type="button" class="hdr-btn" id="ppCancel" style="background:#dc2626;">Cancel</button>
        </div>`;
        box.innerHTML = html;
        overlay.appendChild(box);
        document.body.appendChild(overlay);

        function close() { document.body.removeChild(overlay); }
        box.querySelectorAll('button[data-pid]').forEach(btn => {
            btn.onclick = () => { const p = team.players.find(x => x.id === btn.dataset.pid);
                close();
                callback(p ? p.na : team.name); };
        });
        box.querySelector('#ppSkip').onclick = () => { close();
            callback(team.name); };
        box.querySelector('#ppCancel').onclick = () => { close(); };
        const manual = box.querySelector('#ppManual');
        manual.focus();
        manual.addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim();
                close();
                callback(v || team.name); } });
    }

    function quickScore(type) {
        const pts = type === 'td' ? 6 : type === 'fg' ? 3 : type === 'twopt' ? 2 : type === 'pat' ? 1 : 2;
        const label = type === 'td' ? 'Touchdown' : type === 'fg' ? 'Field Goal' : type === 'twopt' ? '2-Point Conversion' : type === 'pat' ? 'PAT' : 'Safety';
        openPlayerPicker(`${label} (+${pts})`, (playerName) => {
            recordScore(type, pts, S.poss, playerName);
        });
    }

    // ---- Quick cues ----
    function quickCue(text, type) {
        setLastEvent(text, type || 'info');
        S.scoringLog.push({ type: 'note', team: S.poss, player: text, points: 0, time: S.gc.rem, quarter: S.q, id: Date.now() + '_note' });
        saveState();
        toast(`📢 ${text}`);
    }

    // ---- Penalty ----
    function quickPenalty() {
        if (S.gameState === 'FINAL') { toast('⛔ Game final'); return; }
        if (S.gameState === 'READY') { toast('⏳ Start the game first'); return; }
        openPlayerPicker('🚩 Penalty on', (playerName) => {
            pushUndo();
            S.penaltyLog.push({ type: 'flag', team: S.poss, player: playerName, time: S.gc.rem, quarter: S.q, id: Date.now() + '_penalty' });
            setLastEvent(`🚩 PENALTY — ${playerName}`, 'penalty');
            saveState();
            toast(`🚩 Penalty on ${playerName}`);
        });
    }

    // ---- Logo upload ----
    function uploadScorebugLogo(side) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function() {
            const f = input.files[0];
            if (!f || !f.type.startsWith('image/')) return toast('📷 Image required');
            const r = new FileReader();
            r.onload = ev => { const team = getTeam(side);
                team.logo = ev.target.result;
                saveState();
                updateScorebug();
                toast('✅ Logo updated'); };
            r.readAsDataURL(f);
        };
        input.click();
    }

    function toggleScorebugDisplay() { const sb = document.getElementById('scorebug'); if (sb) { sb.style.display = sb.style.display === 'none' ? 'flex' : 'none'; } }

    // ---- Navigation ----
    function renderNav() {
        const views = [
            { id: 'sport', label: '🏈 GAME' }, { id: 'roster', label: '📋 ROSTERS' },
            { id: 'log', label: '📜 LOG' }, { id: 'script', label: '🎙️ SCRIPT' },
            { id: 'admin', label: '⚙️ ADMIN' }, { id: 'clients', label: '👥 CLIENTS' }
        ];
        let html = '';
        views.forEach(v => { html += `<button class="nav-link ${S.v === v.id ? 'active' : ''}" onclick="switchView('${v.id}')">${v.label}</button>`; });
        document.getElementById('mainNav').innerHTML = html;
    }

    function switchView(v) { S.v = v;
        renderNav();
        renderView(); }

    function renderView() {
        if (S.v === 'roster') renderRoster();
        else if (S.v === 'log') renderLog();
        else if (S.v === 'script') renderScript();
        else if (S.v === 'admin') renderAdmin();
        else if (S.v === 'clients') renderClients();
        else renderGame();
    }

    function renderAll() { renderNav();
        renderView();
        updateScorebug();
        updateGameClockDisplay();
        updateGameStateBadge();
        updateUndoButton(); }

    // ---- GAME VIEW ----
    function renderGame() {

        // QUICK CUES
        html += '<div class="quick-cues">';
        html += '<button onclick="quickCue(\'🔻 FIRST DOWN\',\'info\')" data-tooltip="Announce 1st down">🔻 1st Down</button>';
        html += '<button onclick="quickCue(\'🏈 PUNT\',\'info\')" data-tooltip="Announce punt">🦵 Punt</button>';

        const awayColor = awayTeam.color || '#475569';

        html += `<div class="game-controls-row">`;

        html += `<button class="pos-btn ${S.poss === 'away' ? 'active' : ''}" onclick="setPossession('away')" style="${S.poss === 'away' ? 'background:' + awayColor + ';border-color:' + awayColor + ';' : 'border-color:' + awayColor + ';'}">${awayLogo} ${awayTeam.abbr || 'AWY'}</button>`;
        html += `<button class="pos-btn ${S.poss === 'home' ? 'active' : ''}" onclick="setPossession('home')" style="${S.poss === 'home' ? 'background:' + homeColor + ';border-color:' + homeColor + ';' : 'border-color:' + homeColor + ';'}">${homeLogo} ${homeTeam.abbr || 'HME'}</button>`;
        html += `<button class="to-btn" onclick="useTimeout('away')" data-tooltip="Away timeout">⏱ AWAY TO</button>`;
        html += `<button class="to-btn" onclick="useTimeout('home')" data-tooltip="Home timeout">⏱ HOME TO</button>`;
        html += `<span class="clock-status ${S.gc.run ? 'running' : 'paused'}">${S.gc.run ? '▶ LIVE' : '⏸ PAUSED'}</span>`;
        html += `<span class="divider"></span>`;
        // DOWN & DISTANCE
        html += `<span class="label">DOWN</span>`;
        html += `<select onchange="setDown(this.value)">${[1,2,3,4].map(d => `<option ${d === S.down ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
        html += `<span class="label">YDS</span>`;
        html += `<input type="number" value="${S.dist}" min="1" max="99" style="width:38px;" onchange="setDist(this.value)" class="yd-input">`;
        html += `<button class="gc-btn" onclick="adjustYards(-1)" data-tooltip="-1 yd">-1</button>`;
        html += `<button class="gc-btn" onclick="adjustYards(1)" data-tooltip="+1 yd">+1</button>`;
        html += `<span class="divider"></span>`;
        // SCORING
        html += `<span class="label">SCORE</span>`;
        html += `<button class="gc-btn td" onclick="quickScore('td')" data-tooltip="TD +6">TD +6</button>`;
        html += `<button class="gc-btn fg" onclick="quickScore('fg')" data-tooltip="FG +3">FG +3</button>`;
        html += `<button class="gc-btn twopt" onclick="quickScore('twopt')" data-tooltip="2PT +2">2PT +2</button>`;
        html += `<button class="gc-btn pat" onclick="quickScore('pat')" data-tooltip="PAT +1">PAT +1</button>`;
        html += `<button class="gc-btn safety" onclick="quickScore('safety')" data-tooltip="Safety +2">Safety +2</button>`;
        html += `</div>`;

        // ---- TEAM CARDS ----
        html += '<div class="team-cards">';
        ['away', 'home'].forEach(side => {
            const team = getTeam(side);
            const filter = S[side === 'away' ? 'ua' : 'uh'] || 'all';
            html += `<div class="team-card ${side}-card">`;
            html += `<div class="card-head" style="background:${team.color};">`;
            html += `<span>${side.toUpperCase()}</span>`;
            if (team.logo) html += `<img class="mini-logo" src="${team.logo}" alt="">`;
            html += `<select onchange="setSideTeam('${side}', this.value)" data-tooltip="Switch team" style="border-color:${team.color};">${S.teams.map(t => `<option value="${t.id}" ${t.id === team.id ? 'selected' : ''}>${t.name}</option>`).join('')}</select>`;
            html += `<button class="sb-btn" onclick="setPossession('${side}')" data-tooltip="Give ball" style="width:20px;height:20px;">🏈</button>`;
            html += '</div>';
            html += '<div class="unit-tabs">';

            if (S.md7 === 'tackle') {
                html += `<button class="unit-tab ${filter === 'offense' ? 'active' : ''}" onclick="setFilter('${side}','offense')">OFF</button>`;
                html += `<button class="unit-tab ${filter === 'defense' ? 'active' : ''}" onclick="setFilter('${side}','defense')">DEF</button>`;

    function setFilter(side, f) { if (side === 'away') S.ua = f;
        else S.uh = f;
        renderGame(); }

    function toggleStarter(side, pid) { const team = getTeam(side);
        const p = team.players.find(x => x.id === pid); if (p) { p.st = !p.st;
            saveState();
            renderGame(); } }

    function togglePin(side, pid) { const team = getTeam(side);
        const p = team.players.find(x => x.id === pid); if (p) { p.pinned = !p.pinned;
            saveState();
            renderGame(); } }

    function deletePlayer(side, pid) { const team = getTeam(side);
        team.players = team.players.filter(x => x.id !== pid);
        saveState();
        renderGame(); }

    function updateGamePlayerField(side, pid, field, val) {
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid);
        if (!p) return;
        p[field] = val;
        saveState();
    }

    function setSideTeam(side, teamId) {
        const otherSide = side === 'away' ? 'home' : 'away';
        const otherId = otherSide === 'away' ? S.awayId : S.homeId;
        const thisId = side === 'away' ? S.awayId : S.homeId;
        if (teamId === otherId) {
            if (side === 'away') { S.awayId = teamId;
                S.homeId = thisId; } else { S.homeId = teamId;
                S.awayId = thisId; }
            toast('🔄 Teams swapped');
        } else {
            if (side === 'away') S.awayId = teamId;
            else S.homeId = teamId;
        }
        saveState();
        renderGame();
        updateScorebug();
    }

    // ---- ROSTER VIEW ----

        const sortedTeams = [...S.teams].sort((a, b) => a.name.localeCompare(b.name));
        let selectedTeam = S.teams.find(t => t.id === S.cid) || S.teams[0];
        if (!selectedTeam) { S.teams.push({ id: 't' + Date.now(), name: 'New Team', abbr: '', color: '#1e3a5f', logo: '', mascot: '', coach: '', players: [] });
            normalizeState();
            saveState();
            return renderRoster(); }
        S.cid = selectedTeam.id;
        let html = '<div class="roster-layout">';
        html += '<div class="team-sidebar">';
        html += '<div class="panel-header" style="flex-direction:column;align-items:stretch;gap:4px;">';

        html += `<input id="etn" value="${selectedTeam.name}" placeholder="Team Name" style="flex:1;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.7rem;">`;
        html += `<input id="eta" value="${selectedTeam.abbr || ''}" placeholder="ABBR" maxlength="4" style="width:55px;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);text-transform:uppercase;font-size:0.7rem;">`;
        html += `<input type="color" id="etc" value="${selectedTeam.color}" style="width:35px;height:28px;">`;
        html += `<input id="etm" value="${selectedTeam.mascot || ''}" placeholder="Mascot" style="width:80px;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.7rem;">`;
        html += `<input id="etco" value="${selectedTeam.coach || ''}" placeholder="Coach" style="width:80px;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.7rem;">`;
        html += `<img id="etl" src="${selectedTeam.logo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;${selectedTeam.logo ? '' : 'display:none'}">`;
        html += `<input type="file" id="etlf" accept="image/*" style="display:none;" onchange="previewTeamLogo(this)">`;
        html += `<button class="hdr-btn" onclick="document.getElementById('etlf').click()" data-tooltip="Upload logo">📷</button>`;
        html += `<button class="hdr-btn" onclick="saveTeam()" data-tooltip="Save team">💾 Save</button>`;
        html += `<button class="hdr-btn" onclick="printRoster('${selectedTeam.id}')" data-tooltip="Print">🖨️</button>`;
        html += `<button class="hdr-btn" onclick="exportTeamCSV('${selectedTeam.id}')" data-tooltip="CSV">📊</button>`;
        html += `<button class="hdr-btn" style="background:#dc2626;" onclick="deleteTeamById('${selectedTeam.id}')" data-tooltip="Delete">🗑️</button>`;
        html += '</div>';
        html += `<div style="display:flex;gap:4px;margin-bottom:8px;">`;
        html += `<button class="hdr-btn ${selectedTeam.id === S.awayId ? 'active' : ''}" onclick="setSideTeam('away','${selectedTeam.id}')" data-tooltip="Set as away">✈️ Away</button>`;

        html += '<div style="display:grid;grid-template-columns:32px 1fr 70px 50px 70px 70px 26px;gap:3px;font-size:0.5rem;font-weight:700;margin-bottom:3px;opacity:0.6;">';

            html += '</div>';
        });

        html += '<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;">';
        html += `<textarea id="parseArea" placeholder="Paste roster (Number Name Position)" style="flex:2;min-width:150px;height:40px;padding:4px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.6rem;"></textarea>`;
        html += `<button class="hdr-btn" onclick="parseRosterText('${selectedTeam.id}')" data-tooltip="Parse">📝 Parse</button>`;
        html += `<input type="file" accept=".txt,.csv" onchange="uploadRosterFile('${selectedTeam.id}',this)" data-tooltip="Upload file" style="font-size:0.6rem;">`;

    function selectTeam(id) { S.cid = id;
        renderRoster(); }

    function newTeam() {
        const name = prompt('Team name:');
        if (!name) return;
        S.teams.push({ id: 't' + Date.now(), name, abbr: '', color: '#1e3a5f', logo: '', mascot: '', coach: '', players: [] });
        S.cid = S.teams[S.teams.length - 1].id;
        saveState();
        renderRoster();
    }

    function saveTeam() {
        const team = S.teams.find(t => t.id === S.cid);
        if (!team) return;
        team.name = document.getElementById('etn').value;
        team.abbr = document.getElementById('eta').value.toUpperCase();
        team.color = document.getElementById('etc').value;
        team.mascot = document.getElementById('etm').value;
        team.coach = document.getElementById('etco').value;
        saveState();
        renderRoster();
        updateScorebug();
        toast('✅ Team saved');
    }

    function previewTeamLogo(input) {
        const f = input.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
            const team = S.teams.find(t => t.id === S.cid);
            if (team) {
                team.logo = ev.target.result;
                document.getElementById('etl').src = ev.target.result;
                document.getElementById('etl').style.display = 'inline-block';
                saveState();
                updateScorebug();
                toast('✅ Logo uploaded!');
            }
        };
        r.readAsDataURL(f);
    }

    function deleteTeamById(id) {
        if (!confirm('Delete team?')) return;
        S.teams = S.teams.filter(t => t.id !== id);
        if (S.teams.length === 0) S.teams.push({ id: 't' + Date.now(), name: 'New Team', abbr: '', color: '#1e3a5f', logo: '', mascot: '', coach: '', players: [] });
        normalizeState();
        S.cid = S.teams[0].id;
        saveState();
        renderRoster();
        updateScorebug();
    }

    function updatePlayerField(teamId, pidx, field, val) {
        const team = S.teams.find(t => t.id === teamId);
        if (!team || !team.players[pidx]) return;
        team.players[pidx][field] = val;
        saveState();
    }

    function addPlayerToTeam(teamId) {
        const team = S.teams.find(t => t.id === teamId);
        if (!team) return;
        team.players.push({ id: 'p' + Date.now(), n: '', na: 'New Player', po: 'QB', st: false, nt: '', pron: '', ph: '', pinned: false });
        saveState();
        renderRoster();
    }

    function safePrint(html) {
        const w = window.open('', '_blank');
        if (!w) { toast('⚠️ Enable pop-ups to print'); return; }
        w.document.write(html);
        w.document.close();
        w.focus();
        w.print();
    }

    function printRoster(teamId) {
        const team = S.teams.find(t => t.id === teamId);
        if (!team) return;
        let html = `<html><head><title>${team.name} Roster</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>`;
        html += `<h2>${team.name} Roster</h2>`;
        html += '<table><tr><th>#</th><th>Name</th><th>Pos</th><th>Notes</th><th>Starter</th></tr>';
        team.players.forEach(p => {
            html += `<tr><td>${p.n}</td><td>${p.na}</td><td>${p.po}</td><td>${p.nt || ''}</td><td>${p.st ? 'Yes' : 'No'}</td></tr>`;
        });
        html += '</table></body></html>';
        safePrint(html);
    }

    function exportTeamCSV(teamId) {
        const team = S.teams.find(t => t.id === teamId);
        if (!team) return;
        let csv = 'Number,Name,Position,Starter,Notes,Pronunciation\n';
        team.players.forEach(p => { csv += `"${p.n}","${p.na}","${p.po}","${p.st ? 'Yes' : 'No'}","${(p.nt || '').replace(/"/g, '""')}","${p.pron || ''}"\n`; });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = team.name + '.csv';
        a.click();
    }

    function parseRosterText(teamId) {
        const tx = document.getElementById('parseArea').value.trim();
        const team = S.teams.find(t => t.id === teamId);
        if (!team) return;
        if (!tx) return toast('⚠️ Empty input');
        const positions = getPositions();
        const lines = tx.split('\n');
        const out = [];
        lines.forEach(l => {
            if (!l.trim()) return;
            let n = '',
                rest = l.trim();
            const m = rest.match(/^(\d{1,3})\s+/);
            if (m) { n = m[1];
                rest = rest.slice(m[0].length).trim(); }
            let po = '',
                name = rest;
            const words = rest.split(/\s+/);
            if (words.length && positions.includes(words[words.length - 1].toUpperCase())) { po = words.pop().toUpperCase();
                name = words.join(' '); }
            if (name) out.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7), n, na: name, po: po || 'QB', st: false, nt: '', pron: '', ph: '', pinned: false });
        });
        if (out.length) { team.players = out;
            saveState();
            renderRoster();
            toast(`✅ ${out.length} players parsed`); } else toast('❌ No players found');
    }

    function uploadRosterFile(teamId, input) {
        const f = input.files[0];
        if (!f) return;
        if (f.name.endsWith('.docx')) { toast('⚠️ .docx not supported. Use .txt or .csv'); return; }
        const r = new FileReader();
        r.onload = ev => { document.getElementById('parseArea').value = ev.target.result;
            parseRosterText(teamId); };
        r.readAsText(f);
    }

    // ---- LOG VIEW ----
    function renderLog() {
        let html = '<div class="panel"><div class="panel-header">';
        html += '<h3>📜 GAME LOG</h3>';
        html += '<div class="panel-actions">';
        html += `<button class="hdr-btn" onclick="fnlCloudLoadLogsOnly()" data-tooltip="Load logs from cloud (appends)">📥 LOAD LOGS</button>`;
        html += `<button class="hdr-btn" onclick="clearLogs()" data-tooltip="Clear logs" style="background:#dc2626;">🗑️ Clear</button>`;
        html += '</div></div>';
        const events = [...S.scoringLog.map(e => ({ ...e,
            type: 'score' })), ...S.penaltyLog.map(e => ({ ...e,
            type: 'penalty' }))];
        if (events.length === 0) { html += '<p style="opacity:0.6;font-size:0.75rem;">No events in current game.</p>'; } else {
            html += '<h4 style="font-size:0.7rem;margin-bottom:4px;">Current Game</h4><table style="width:100%;border-collapse:collapse;font-size:0.65rem;">';
            html += '<tr style="border-bottom:2px solid var(--border);"><th style="text-align:left;padding:3px;">Time</th><th style="text-align:left;padding:3px;">Team</th><th style="text-align:left;padding:3px;">Event</th><th style="text-align:left;padding:3px;">Details</th></tr>';
            events.sort((a, b) => (b.time || 0) - (a.time || 0));
            events.forEach(ev => {
                const timeStr = ev.time !== undefined ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
                const teamLabel = ev.team === 'home' ? 'Home' : ev.team === 'away' ? 'Away' : '';
                let desc = ev.type === 'score' ? `${ev.player} +${ev.points}` : ev.type === 'note' ? `📢 ${ev.player}` : ev.player || '';
                const emoji = ev.type === 'td' ? '🏈' : ev.type === 'fg' ? '🎯' : ev.type === 'twopt' ? '➕' : ev.type === 'pat' ? '🎯' : ev.type === 'safety' ? '⚡' : ev.type === 'penalty' ? '🚩' : ev.type === 'note' ? '📢' : '';
                html += `<tr style="border-bottom:1px solid var(--border);"><td style="padding:3px;">${timeStr}</td><td style="padding:3px;">${teamLabel}</td><td style="padding:3px;">${emoji} ${ev.type.toUpperCase()}</td><td style="padding:3px;">${desc}</td></tr>`;
            });
            html += '</table>';
        }
        if (S.gameHistory.length > 0) {
            html += '<hr style="border-color:var(--border);margin:8px 0;"><h4 style="font-size:0.7rem;margin-bottom:4px;">Game History</h4>';
            S.gameHistory.slice().reverse().forEach((game, idx) => {
                const d = new Date(game.date).toLocaleDateString();
                const realIdx = S.gameHistory.length - 1 - idx;
                html += `<div style="padding:4px;border-bottom:1px solid var(--border);font-size:0.65rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">`;
                html += `<span>${d} - ${game.away} vs ${game.home} - ${game.awayScore}-${game.homeScore}`;
                if (game.sessionId) html += ` <span style="opacity:0.4;font-size:0.5rem;">ID:${game.sessionId}</span>`;
                html += `</span>`;
                html += `<button class="hdr-btn" onclick="printGameLog(${realIdx})" data-tooltip="Print" style="font-size:0.5rem;padding:2px 6px;">🖨️</button>`;
                html += `</div>`;
            });
        }
        html += '</div>';
        document.getElementById('main').innerHTML = html;
    }

    function clearLogs() {
        if (!confirm('Clear current game logs?')) return;
        S.scoringLog = [];
        S.penaltyLog = [];
        saveState();
        renderLog();
        toast('🗑️ Logs cleared');
