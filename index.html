<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Friday Night Live – Football PA Console</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root {
            --accent:#d4af37;
            --bg:#f0f2f5;--surface:#ffffff;--text:#0a2540;
            --border:#cbd5e1;
            --btn:#d4af37;--btn-text:#000;
            --header-bg:#1a3a2a;
        }
        body {
            font-family:'Inter',-apple-system,sans-serif;
            background:var(--bg);color:var(--text);
            height:100vh;display:flex;flex-direction:column;overflow:hidden;
            font-size:14px;
        }
        /* HEADER - COMPACT */
        header {
            background:var(--header-bg);
            padding:4px 10px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:4px;
            border-bottom:3px solid var(--accent);
            flex-shrink:0;
            min-height:48px;
            flex-wrap:wrap;
        }
        .hdr-l,.hdr-r{display:flex;align-items:center;gap:4px}
        .hdr-l a{color:#fff;font-size:11px;text-decoration:none;background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:4px}
        .brand{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.3);padding:2px 12px;border-radius:6px}
        .brand h1{font-size:14px;color:#fff;font-weight:900}
        .brand span{font-size:9px;color:var(--accent);font-weight:700}
        .clock{font-size:13px;font-weight:700;color:var(--accent);background:rgba(0,0,0,0.4);padding:2px 12px;border-radius:6px;min-width:80px;text-align:center}
        .weather{font-size:11px;color:#fff;background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:12px;white-space:nowrap}
        .hdr-r .btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer;min-height:28px}
        .hdr-r .btn:hover{background:rgba(255,255,255,0.25)}
        .hdr-r .btn-red{background:#dc2626!important;color:#fff!important}
        .hdr-r .btn-gold{background:#e6a817!important;color:#000!important;font-weight:700}

        /* NAV */
        nav{background:#1a1a2e;display:flex;padding:0 8px;gap:2px;flex-shrink:0;min-height:30px;overflow-x:auto}
        .nav-link{padding:4px 12px;font-size:11px;font-weight:600;background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;border-bottom:2px solid transparent}
        .nav-link.active{color:#fff;border-bottom-color:var(--accent)}

        /* MAIN */
        main{flex:1;overflow:hidden;padding:4px;display:flex;gap:4px}
        .game-grid{display:flex;gap:6px;width:100%;height:100%;background:#e2e8f0;border-radius:8px;padding:4px}
        .team-card{flex:1;min-width:0;background:#fff;border-radius:6px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .card-head{
            padding:3px 8px;
            display:flex;
            align-items:center;
            gap:4px;
            color:#fff;
            min-height:32px;
            flex-wrap:wrap;
            border-bottom:2px solid var(--accent);
        }
        .card-head select{
            flex:1;
            min-width:80px;
            padding:2px 6px;
            border-radius:4px;
            border:1px solid rgba(255,255,255,0.3);
            background:rgba(255,255,255,0.15);
            color:#fff;
            font-weight:700;
            font-size:12px;
            min-height:26px;
        }
        .card-head select option{color:#000;background:#fff}
        .card-head .side-label{font-size:11px;font-weight:700;text-transform:uppercase}
        .card-head .coach-input{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;width:60px;min-height:20px}
        .card-head .coach-input::placeholder{color:rgba(255,255,255,0.4)}
        .card-head .poss-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;cursor:pointer;min-height:24px}
        .card-head .poss-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

        .unit-tabs{display:flex;gap:2px;padding:2px 6px;border-bottom:1px solid var(--border);flex-shrink:0}
        .unit-tab{padding:2px 8px;font-size:10px;font-weight:700;background:rgba(0,0,0,.05);border:none;color:inherit;cursor:pointer;border-radius:4px}
        .unit-tab.active{background:var(--btn);color:#000}

        .search-bar{display:flex;padding:1px 6px;border-bottom:1px solid var(--border)}
        .search-bar input{flex:1;border:1px solid var(--border);border-radius:3px;padding:1px 4px;font-size:11px;min-height:22px}

        .player-list-header,.player-row{
            display:grid;
            grid-template-columns:18px 28px 1fr 60px 50px 28px 28px 24px;
            gap:2px;
            align-items:center;
            padding:1px 6px;
            font-size:12px;
        }
        .player-list-header{font-size:9px;font-weight:700;text-transform:uppercase;opacity:.5;border-bottom:1px solid var(--border);min-height:18px}
        .player-list-body{flex:1;overflow-y:auto}
        .player-row{border-bottom:1px solid var(--border);min-height:26px}
        .player-row.starter{background:rgba(212,175,55,0.08)}
        .player-row.pinned{background:rgba(255,215,0,0.06);border-left:2px solid var(--accent)}
        .plyr-num{font-weight:700;font-size:13px;text-align:center}
        .plyr-name input,.plyr-pron input{background:transparent;border:none;padding:1px 2px;font-size:12px;width:100%;color:inherit}
        .plyr-name input{font-weight:600}
        .plyr-pron input{font-style:italic;font-size:10px}
        .plyr-pos select{background:transparent;border:none;font-size:11px;font-weight:700;width:100%}
        .st-toggle{background:none;border:2px solid var(--accent);border-radius:50%;width:18px;height:18px;font-size:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
        .st-toggle.off{border-color:#999;opacity:.4}
        .st-toggle:not(.off){background:var(--accent);color:#000}
        .pin-toggle{background:none;border:1px solid #999;border-radius:3px;width:18px;height:18px;font-size:9px;cursor:pointer}
        .pin-toggle.active{background:var(--accent);border-color:var(--accent);color:#000}
        .del-btn{background:none;border:none;color:#999;cursor:pointer;font-size:12px}

        .add-row{display:flex;gap:2px;padding:2px 6px;border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
        .add-row input,.add-row select{font-size:10px;padding:1px 4px;border:1px solid var(--border);border-radius:3px;min-height:22px}
        .add-row input{flex:1;min-width:40px}

        .game-controls{display:flex;gap:2px;padding:2px 6px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:2px;flex-shrink:0}
        .game-controls .btn-sm{font-size:9px;padding:1px 6px;min-height:20px;min-width:20px;border-radius:4px;border:none;cursor:pointer;font-weight:600}
        .game-controls .btn-sm.green{background:#22c55e;color:#000}
        .game-controls .btn-sm.red{background:#dc2626;color:#fff}
        .game-controls .btn-sm.gray{background:#666;color:#fff}
        .game-controls .btn-sm.gold{background:#f59e0b;color:#000}
        .game-controls input{width:28px;padding:1px 2px;font-size:10px;border:1px solid var(--border);border-radius:3px;text-align:center;min-height:20px}
        .game-controls span{font-size:10px;font-weight:600}

        .game-log{max-height:50px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-size:10px;flex-shrink:0}
        .game-log .entry{padding:0;border-bottom:1px solid var(--border);font-size:9px}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:4px 16px;border-radius:16px;font-size:12px;opacity:0;transition:.2s;z-index:999}
        .toast.show{opacity:1}

        footer{background:#0a0a1a;padding:2px 10px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--accent);color:#94a3b8;font-size:9px;flex-shrink:0;min-height:24px}

        /* SCOREBUG */
        #scorebug{
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#0a0a1a,#1a1a2e);
            border-radius:8px;
            padding:3px 10px;
            margin:0 0 2px;
            color:#fff;
            font-weight:700;
            min-height:44px;
            gap:4px;
            border:2px solid var(--accent);
            flex-shrink:0;
        }
        #scorebug .sb-side{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
        #scorebug .sb-name{font-size:12px;font-weight:900;text-transform:uppercase;min-width:50px;text-align:center}
        #scorebug .sb-score{font-size:24px;font-weight:900;min-width:40px;text-align:center;color:#fbbf24}
        #scorebug .sb-score-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer}
        #scorebug .sb-score-btn.plus{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.3)}
        #scorebug .sb-center{display:flex;align-items:center;gap:4px;padding:0 8px;border-left:1px solid rgba(255,215,0,0.15);border-right:1px solid rgba(255,215,0,0.15)}
        #scorebug .sb-clock{font-family:monospace;font-size:16px;font-weight:900;color:#fbbf24;min-width:60px;text-align:center}
        #scorebug .sb-clock-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:3px;padding:1px 6px;font-size:9px;cursor:pointer}
        #scorebug .sb-clock-btn.red{background:rgba(220,38,38,0.3);border-color:rgba(220,38,38,0.4)}
        #scorebug .sb-qtr{font-size:11px;font-weight:700;color:var(--accent);min-width:20px;text-align:center}
        .sb-toggle{background:rgba(0,0,0,0.3);border:1px solid var(--accent);color:#fff;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer}

        .panel{background:var(--surface);border-radius:6px;padding:8px;overflow-y:auto;width:100%}
        .roster-layout{display:grid;grid-template-columns:160px 1fr;gap:6px;height:100%}
        .team-sidebar{background:var(--surface);border-radius:6px;padding:6px;overflow-y:auto;border:1px solid var(--border)}
        .team-item{padding:4px 8px;border-radius:4px;margin-bottom:2px;cursor:pointer;font-size:12px;font-weight:600}
        .team-item.active{background:var(--btn);color:#000}
        .player-edit-row{display:grid;grid-template-columns:30px 1fr 50px 40px 1fr 40px 30px;gap:2px;margin-bottom:2px;align-items:center}
        .player-edit-row input,.player-edit-row select{font-size:11px;padding:1px 4px;border:1px solid var(--border);border-radius:3px;min-height:22px}

        @media(max-width:768px){
            header{min-height:40px;padding:2px 6px}
            .brand h1{font-size:12px}
            .clock{font-size:11px;min-width:60px;padding:2px 6px}
            .weather{font-size:9px;padding:2px 6px}
            .hdr-r .btn{font-size:9px;padding:1px 4px;min-height:22px}
            .game-grid{flex-direction:column}
            .roster-layout{grid-template-columns:1fr}
            .player-list-header,.player-row{grid-template-columns:14px 22px 1fr 40px 36px 22px 22px 20px;font-size:10px}
            #scorebug .sb-name{font-size:10px;min-width:30px}
            #scorebug .sb-score{font-size:18px;min-width:30px}
            #scorebug .sb-clock{font-size:13px;min-width:45px}
        }
    </style>
</head>
<body>

<header>
    <div class="hdr-l"><a href="https://voiceofdfw.com">← VODFW</a></div>
    <div class="brand"><h1>🏈 FNL</h1><span>PA</span></div>
    <div class="clock" id="wallClock">12:00</div>
    <div class="weather" id="weatherHeader">--°F</div>
    <div id="scorebug">
        <div class="sb-side">
            <span class="sb-name" id="sbAwayName">AWAY</span>
            <button class="sb-score-btn" onclick="chScore('away',-1)">−</button>
            <span class="sb-score" id="sbAwayScore">0</span>
            <button class="sb-score-btn plus" onclick="chScore('away',1)">+</button>
        </div>
        <div class="sb-center">
            <button class="sb-clock-btn" onclick="chQuarter(-1)">◀</button>
            <span class="sb-qtr" id="sbQuarter">Q1</span>
            <button class="sb-clock-btn" onclick="chQuarter(1)">▶</button>
            <span style="color:#666;margin:0 2px;">|</span>
            <span class="sb-clock" id="gameClockDisplay">--:--</span>
            <button class="sb-clock-btn" onclick="setGC()">⏳</button>
            <button class="sb-clock-btn" onclick="startGC()">▶</button>
            <button class="sb-clock-btn" onclick="pauseGC()">⏸</button>
            <button class="sb-clock-btn red" onclick="resetGC()">↺</button>
        </div>
        <div class="sb-side">
            <button class="sb-score-btn plus" onclick="chScore('home',1)">+</button>
            <span class="sb-score" id="sbHomeScore">0</span>
            <button class="sb-score-btn" onclick="chScore('home',-1)">−</button>
            <span class="sb-name" id="sbHomeName">HOME</span>
        </div>
        <button class="sb-toggle" onclick="toggleScorebugDisplay()">👁️</button>
    </div>
    <div class="hdr-r">
        <button class="btn btn-gold" onclick="fnlCloudSaveAll()">💾</button>
        <button class="btn" onclick="fnlCloudLoadAll()">📥</button>
        <button class="btn" onclick="toggleOutdoorMode()">☀️</button>
        <button class="btn" onclick="cycleTheme()">🎨</button>
        <button class="btn" onclick="printLU()">🖨️</button>
        <button class="btn" onclick="exportBoxScore()">📊</button>
        <button class="btn btn-red" id="resetBtn">↺</button>
    </div>
</header>

<nav id="mainNav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<footer>
    <span>© Clayton Greenberg | VoiceofDFW.com</span>
    <span id="ftSaved">Never saved</span>
</footer>

<script>
// ============================================================
// FRIDAY NIGHT LIVE - SIMPLIFIED WORKING VERSION
// ============================================================

// ============================================================
// 1. DATA - PRE-LOADED TEAMS
// ============================================================
const TEAMS_DATA = [
    {
        id: "cowboys",
        name: "Dallas Cowboys",
        color: "#0033A0",
        coach: "Mike McCarthy",
        pl: [
            { id: "p1", n: "4", na: "Dak Prescott", po: "QB", st: true, pinned: true, pron: "Dak PRESS-kott" },
            { id: "p2", n: "88", na: "CeeDee Lamb", po: "WR", st: true, pinned: true, pron: "SEE-dee LAMB" },
            { id: "p3", n: "21", na: "Ezekiel Elliott", po: "RB", st: true, pinned: false, pron: "eh-ZEEK-ee-ul" },
            { id: "p4", n: "11", na: "Micah Parsons", po: "LB", st: true, pinned: false, pron: "MY-kuh PAR-sons" },
            { id: "p5", n: "70", na: "Zack Martin", po: "G", st: true, pinned: false, pron: "ZAK MAR-tin" }
        ]
    },
    {
        id: "49ers",
        name: "San Francisco 49ers",
        color: "#AA0000",
        coach: "Kyle Shanahan",
        pl: [
            { id: "p6", n: "13", na: "Brock Purdy", po: "QB", st: true, pinned: true, pron: "BRAHK PUR-dee" },
            { id: "p7", n: "23", na: "Christian McCaffrey", po: "RB", st: true, pinned: true, pron: "KRIS-chun muh-KAF-ree" },
            { id: "p8", n: "19", na: "Deebo Samuel", po: "WR", st: true, pinned: false, pron: "DEE-bo SAM-yoo-el" },
            { id: "p9", n: "11", na: "Brandon Aiyuk", po: "WR", st: true, pinned: false, pron: "BRAN-dun EYE-yuk" }
        ]
    },
    {
        id: "chiefs",
        name: "Kansas City Chiefs",
        color: "#E31837",
        coach: "Andy Reid",
        pl: [
            { id: "p10", n: "15", na: "Patrick Mahomes", po: "QB", st: true, pinned: true, pron: "PAT-rik muh-HOMEZ" },
            { id: "p11", n: "87", na: "Travis Kelce", po: "TE", st: true, pinned: true, pron: "TRAV-is KEL-see" }
        ]
    },
    {
        id: "eagles",
        name: "Philadelphia Eagles",
        color: "#004C54",
        coach: "Nick Sirianni",
        pl: [
            { id: "p12", n: "1", na: "Jalen Hurts", po: "QB", st: true, pinned: true, pron: "JAY-len HERTS" },
            { id: "p13", n: "11", na: "AJ Brown", po: "WR", st: true, pinned: false, pron: "AY-JAY BROWN" }
        ]
    }
];

// ============================================================
// 2. STATE
// ============================================================
let game = {
    awayId: "49ers",
    homeId: "cowboys",
    awayScore: 0,
    homeScore: 0,
    quarter: 1,
    clock: { seconds: 1500, running: false },
    down: 1,
    distance: 10,
    yardline: 50,
    possession: "home",
    teams: JSON.parse(JSON.stringify(TEAMS_DATA)),
    gameLog: [],
    scoring: [],
    penalties: [],
    history: [],
    gs: "pregame"
};

let appState = {
    view: "sport",
    theme: "light",
    outdoor: false,
    awayFilter: "all",
    homeFilter: "all"
};

// Helpers
function g() { return game; }
function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function e(s) { if(!s) return ''; return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]); }

function getTeam(side) {
    const id = side === "away" ? game.awayId : game.homeId;
    return game.teams.find(t => t.id === id);
}

function getPlayers(side, filter) {
    const team = getTeam(side);
    if (!team) return [];
    let players = [...team.pl];
    if (filter === "offense") players = players.filter(p => ['QB','RB','FB','WR','TE','OL','C','G','T'].includes(p.po));
    else if (filter === "defense") players = players.filter(p => ['DL','DE','DT','LB','OLB','ILB','CB','S','SS','FS','DB'].includes(p.po));
    else if (filter === "special") players = players.filter(p => ['K','P','LS','KR','PR'].includes(p.po));
    players.sort((a,b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (parseInt(a.n)||999) - (parseInt(b.n)||999);
    });
    return players;
}

// ============================================================
// 3. SAVE/LOAD
// ============================================================
function save() {
    try {
        localStorage.setItem('fnl_game', JSON.stringify(game));
        localStorage.setItem('fnl_state', JSON.stringify(appState));
        document.getElementById('ftSaved').textContent = 'Saved ' + new Date().toLocaleTimeString();
    } catch(e) {}
}

function load() {
    try {
        const g = localStorage.getItem('fnl_game');
        if (g) game = JSON.parse(g);
        const s = localStorage.getItem('fnl_state');
        if (s) appState = JSON.parse(s);
        // Ensure all teams have players
        game.teams.forEach(t => {
            if (!t.pl) t.pl = [];
            t.pl.forEach(p => { if (p.pinned === undefined) p.pinned = false; if (p.pron === undefined) p.pron = ''; });
            if (!t.coach) t.coach = '';
        });
        // Ensure game has all fields
        if (!game.gameLog) game.gameLog = [];
        if (!game.scoring) game.scoring = [];
        if (!game.penalties) game.penalties = [];
        if (!game.history) game.history = [];
        if (game.gs === undefined) game.gs = 'pregame';
    } catch(e) {}
    applyTheme(appState.theme);
    if (appState.outdoor) document.body.classList.add('outdoor');
    renderAll();
}

// ============================================================
// 4. THEME
// ============================================================
const THEMES = ['light', 'dark', 'navy'];
let themeIdx = 0;

function applyTheme(theme) {
    appState.theme = theme;
    document.body.style.background = theme === 'dark' ? '#0a0c10' : theme === 'navy' ? '#0f172a' : '#f0f2f5';
    document.body.style.color = theme === 'dark' ? '#e2e8f0' : theme === 'navy' ? '#f1f5f9' : '#0a2540';
    save();
}

function cycleTheme() {
    themeIdx = (themeIdx + 1) % THEMES.length;
    applyTheme(THEMES[themeIdx]);
}

function toggleOutdoorMode() {
    appState.outdoor = !appState.outdoor;
    document.body.classList.toggle('outdoor', appState.outdoor);
    save();
}

// ============================================================
// 5. CLOCK
// ============================================================
function updateClock() {
    const n = new Date();
    document.getElementById('wallClock').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 10000);
updateClock();

function displayGameClock() {
    const el = document.getElementById('gameClockDisplay');
    const s = game.clock.seconds;
    const m = Math.floor(s / 60);
    const sec = s % 60;
    el.textContent = String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function setGC() {
    const mins = prompt('Minutes (or preset: 1=1Q, 2=2Q, 3=Half, 4=OT, 5=2min):');
    if (!mins) return;
    const m = parseInt(mins);
    if (!isNaN(m) && m > 0) { game.clock.seconds = m * 60; displayGameClock(); save(); return; }
    const presets = { '1':720, '2':720, '3':1440, '4':600, '5':120 };
    if (presets[mins]) { game.clock.seconds = presets[mins]; displayGameClock(); save(); }
}

function startGC() { game.clock.running = true; save(); }
function pauseGC() { game.clock.running = false; save(); }
function resetGC() { game.clock.running = false; game.clock.seconds = 0; displayGameClock(); save(); }

setInterval(() => {
    if (game.clock.running && game.clock.seconds > 0) {
        game.clock.seconds--;
        displayGameClock();
        if (game.clock.seconds === 0) {
            game.clock.running = false;
            toast('⏰ Time expired!');
            if (game.quarter < 4) { game.quarter++; save(); renderAll(); }
        }
    }
}, 1000);

// ============================================================
// 6. SCORE & QUARTER
// ============================================================
function chScore(side, d) {
    if (side === 'away') game.awayScore = Math.max(0, game.awayScore + d);
    else game.homeScore = Math.max(0, game.homeScore + d);
    updateScorebug();
    save();
}

function chQuarter(d) {
    const maxQ = 4;
    game.quarter = Math.min(maxQ, Math.max(1, game.quarter + d));
    updateScorebug();
    save();
}

function updateScorebug() {
    const at = getTeam('away');
    const ht = getTeam('home');
    document.getElementById('sbAwayName').textContent = at ? at.name.substring(0,6).toUpperCase() : 'AWAY';
    document.getElementById('sbHomeName').textContent = ht ? ht.name.substring(0,6).toUpperCase() : 'HOME';
    document.getElementById('sbAwayScore').textContent = game.awayScore;
    document.getElementById('sbHomeScore').textContent = game.homeScore;
    document.getElementById('sbQuarter').textContent = 'Q' + game.quarter;
    displayGameClock();
}

function toggleScorebugDisplay() {
    const sb = document.getElementById('scorebug');
    sb.style.display = sb.style.display === 'none' ? 'flex' : 'none';
}

// ============================================================
// 7. GAME ACTIONS
// ============================================================
function startGame() {
    if (game.gs === 'final') { toast('Game is final!'); return; }
    game.gs = 'first_half';
    if (game.clock.seconds === 0) game.clock.seconds = 1440;
    game.clock.running = true;
    toast('🏈 Game started!');
    save();
    renderAll();
}

function startSecondHalf() {
    if (game.gs === 'final') { toast('Game is final!'); return; }
    game.gs = 'second_half';
    game.clock.seconds = 1440;
    game.clock.running = true;
    toast('🏈 Second half started!');
    save();
    renderAll();
}

function endGame() {
    if (!confirm('Mark game as FINAL?')) return;
    game.gs = 'final';
    game.clock.running = false;
    toast('🏆 Game is final!');
    save();
    renderAll();
}

function resetGame() {
    if (!confirm('Reset entire game?')) return;
    game.awayScore = 0;
    game.homeScore = 0;
    game.quarter = 1;
    game.clock.seconds = 0;
    game.clock.running = false;
    game.gs = 'pregame';
    game.down = 1;
    game.distance = 10;
    game.yardline = 50;
    game.gameLog = [];
    game.scoring = [];
    game.penalties = [];
    game.teams.forEach(t => t.pl.forEach(p => { p.st = false; p.pinned = false; }));
    save();
    renderAll();
    toast('🔄 Game reset');
}

function setDown(d) { game.down = d; save(); renderAll(); }
function setDistance(d) { game.distance = parseInt(d) || 10; save(); renderAll(); }
function setYardline(d) { game.yardline = parseInt(d) || 50; save(); renderAll(); }
function setPossession(side) { game.possession = side; save(); renderAll(); }

function quickScore(team, type, pts) {
    const player = prompt('Scorer (or leave blank):');
    chScore(team, pts);
    if (!game.scoring) game.scoring = [];
    game.scoring.push({ team, type, player: player || '', quarter: game.quarter, time: game.clock.seconds });
    game.gameLog.push(`${team.toUpperCase()} ${type}${player ? ' by '+player : ''}`);
    save();
    renderAll();
}

function quickPenalty(team, type, yards) {
    const player = prompt('Player (or leave blank):');
    if (!game.penalties) game.penalties = [];
    game.penalties.push({ team, type, yards, player: player || '', quarter: game.quarter });
    game.gameLog.push(`⚖️ ${team.toUpperCase()} ${type}${yards ? ' '+yards+' yds' : ''}`);
    save();
    renderAll();
}

// ============================================================
// 8. PIN & STARTER TOGGLES
// ============================================================
function togglePin(side, pid) {
    const team = getTeam(side);
    if (!team) return;
    const p = team.pl.find(x => x.id === pid);
    if (!p) return;
    const pinnedCount = team.pl.filter(x => x.pinned).length;
    if (!p.pinned && pinnedCount >= 6) { toast('Max 6 pinned'); return; }
    p.pinned = !p.pinned;
    save();
    renderSport();
}

function toggleStarter(side, pid) {
    const team = getTeam(side);
    if (!team) return;
    const p = team.pl.find(x => x.id === pid);
    if (!p) return;
    p.st = !p.st;
    save();
    renderSport();
}

function deletePlayer(side, pid) {
    if (!confirm('Delete this player?')) return;
    const team = getTeam(side);
    if (!team) return;
    team.pl = team.pl.filter(x => x.id !== pid);
    save();
    renderSport();
}

function addPlayer(side) {
    const team = getTeam(side);
    if (!team) return;
    const num = document.getElementById('an-'+side)?.value || '';
    const name = document.getElementById('ana-'+side)?.value || '';
    const pos = document.getElementById('ap-'+side)?.value || 'QB';
    if (!name) { toast('Enter name'); return; }
    team.pl.push({ id: id(), n: num, na: name, po: pos, st: false, pinned: false, pron: '' });
    document.getElementById('an-'+side).value = '';
    document.getElementById('ana-'+side).value = '';
    save();
    renderSport();
    toast(name + ' added');
}

function updatePlayerField(side, pid, field, value) {
    const team = getTeam(side);
    if (!team) return;
    const p = team.pl.find(x => x.id === pid);
    if (!p) return;
    p[field] = value;
    save();
}

function searchPlayers(side, q) {
    const rows = document.querySelectorAll('.player-row[data-side="'+side+'"]');
    rows.forEach(r => r.style.background = '');
    const num = q.trim();
    if (!num) return;
    rows.forEach(r => {
        if (r.dataset.num === num) r.style.background = 'rgba(212,175,55,0.2)';
    });
}

// ============================================================
// 9. ROSTER MANAGEMENT
// ============================================================
function editTeam(tid) {
    game.currentTeamId = tid;
    renderRoster();
}

function newTeam() {
    const name = prompt('Team name:');
    if (!name) return;
    game.teams.push({ id: id(), name: name, color: '#1e3a5f', coach: '', pl: [] });
    game.currentTeamId = game.teams[game.teams.length-1].id;
    save();
    renderRoster();
}

function deleteTeam(tid) {
    if (!confirm('Delete this team?')) return;
    game.teams = game.teams.filter(t => t.id !== tid);
    if (game.awayId === tid) game.awayId = game.teams[0]?.id || '';
    if (game.homeId === tid) game.homeId = game.teams[0]?.id || '';
    game.currentTeamId = game.teams[0]?.id || '';
    save();
    renderRoster();
}

function collectRosterPlayers() {
    const grid = document.getElementById('rosterGrid');
    if (!grid) return [];
    const rows = grid.querySelectorAll('.player-edit-row');
    const players = [];
    rows.forEach(row => {
        const inputs = row.querySelectorAll('input, select');
        players.push({
            id: row.dataset.pid || id(),
            n: inputs[0]?.value || '',
            na: inputs[1]?.value || '',
            po: inputs[2]?.value || '',
            st: inputs[3]?.value === '1',
            pinned: false,
            pron: inputs[4]?.value || '',
            nt: inputs[5]?.value || ''
        });
    });
    return players;
}

// ============================================================
function exportBoxScore() {
    let csv = 'Friday Night Live - Box Score\n';
    csv += `Date,${new Date().toLocaleDateString()}\n`;
    const at = getTeam('away'), ht = getTeam('home');
    csv += `Away,${at ? at.name : 'Away'}\n`;
    csv += `Home,${ht ? ht.name : 'Home'}\n`;
    csv += `Score,${game.awayScore}-${game.homeScore}\n\n`;
    csv += 'Team,Number,Name,Position,Starter\n';
    ['away','home'].forEach(side => {
        const team = getTeam(side);
        if (!team) return;
        team.pl.forEach(p => {
            csv += `${side},${p.n},${p.na},${p.po},${p.st ? 'Yes' : 'No'}\n`;
        });
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = `boxscore_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    toast('📊 Exported');
}

function printLU() {
    const at = getTeam('away'), ht = getTeam('home');
    if (!at || !ht) return;
    let h = '<html><head><title>Lineup</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px 6px}th{background:#ddd}</style></head><body>';
    [at, ht].forEach(t => {
        h += `<h2>${e(t.name)}${t.coach ? ' (Coach: '+e(t.coach)+')' : ''}</h2><table><tr><th>#</th><th>Name</th><th>Pron</th><th>Pos</th></tr>`;
        t.pl.filter(p => p.st).forEach(p => {
            h += `<tr><td>${e(p.n)}</td><td>${e(p.na)}</td><td>${e(p.pron||'')}</td><td>${e(p.po)}</td></tr>`;
        });
        h += '</table>';
    });
    h += '</body></html>';
    const w = window.open();
    w.document.write(h);
    w.print();
}

// ============================================================
const CLOUD = "https://lineup-api.claytongreenberg.workers.dev/api/lineup";
const NS = "fnl_";

async function fnlCloudSaveAll() {
    if (!confirm('Save to cloud?')) return;
    try {
        const data = { game, appState };
        const r = await fetch(CLOUD + '?id=' + NS + 'full', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!r.ok) throw new Error('Failed');
        toast('✅ Saved to cloud!');
    } catch(e) { toast('❌ Cloud save failed'); }
}

async function fnlCloudLoadAll() {
    if (!confirm('Load from cloud?')) return;
    try {
        const r = await fetch(CLOUD + '?id=' + NS + 'full');
        if (!r.ok) throw new Error('No data');
        const data = await r.json();
        game = data.game;
        appState = data.appState;
        save();
        applyTheme(appState.theme);
        if (appState.outdoor) document.body.classList.add('outdoor');
        renderAll();
        toast('✅ Loaded from cloud!');
    } catch(e) { toast('❌ Cloud load failed'); }
}

function saveRosterTeam() {
    const ct = game.teams.find(t => t.id === game.currentTeamId);
    if (!ct) return;
    ct.name = document.getElementById('teamName').value.trim() || ct.name;
    ct.coach = document.getElementById('teamCoach').value.trim();
    ct.color = document.getElementById('teamColor').value;
    const grid = document.getElementById('rosterGrid');
    if (grid) {
        const rows = grid.querySelectorAll('.player-edit-row');
        ct.pl = [];
        rows.forEach(row => {
            const inputs = row.querySelectorAll('input, select');
            ct.pl.push({
                id: row.dataset.pid || id(),
                n: inputs[0]?.value || '',
                na: inputs[1]?.value || '',
                po: inputs[2]?.value || 'QB',
                st: inputs[3]?.value === '1',
                pron: inputs[4]?.value || '',
                nt: inputs[5]?.value || '',
                pinned: false
            });
        });
    }
    save();
    renderRoster();
    toast('Team saved');
}

function addRosterRow() {
    const grid = document.getElementById('rosterGrid');
    if (!grid) return;
    const row = document.createElement('div');
    row.className = 'player-edit-row';
    row.dataset.pid = id();
    row.innerHTML = `
        <input placeholder="#">
        <input placeholder="Name">
        <select><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>OL</option><option>DL</option><option>LB</option><option>DB</option><option>K</option><option>P</option></select>
        <select><option value="0">Bench</option><option value="1">Starter</option></select>
        <input placeholder="Pron">
        <input placeholder="Notes">
        <button onclick="this.parentElement.remove()">✖</button>
    `;
    grid.appendChild(row);
}

function bulkImportPlayers() {
    const text = document.getElementById('bulkImport').value.trim();
    if (!text) { toast('Paste players first'); return; }
    const ct = game.teams.find(t => t.id === game.currentTeamId);
    if (!ct) return;
    const lines = text.split('\n').filter(l => l.trim());
    lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        let num = '', name = '', pos = 'QB';
        // Try to parse: # Name Position
        if (parts.length >= 2 && /^\d+$/.test(parts[0])) {
            num = parts[0];
            const possiblePos = parts[parts.length-1].toUpperCase();
            if (['QB','RB','WR','TE','OL','DL','LB','DB','K','P'].includes(possiblePos)) {
                pos = possiblePos;
                name = parts.slice(1, -1).join(' ');
            } else {
                name = parts.slice(1).join(' ');
            }
        } else {
            name = parts.join(' ');
        }
        if (name) {
            ct.pl.push({ id: id(), n: num, na: name, po: pos, st: false, pinned: false, pron: '', nt: '' });
        }
    });
    save();
    renderRoster();
    toast('Imported ' + lines.length + ' players');
}

function switchTeam(side, tid) {
    if (side === 'away') game.awayId = tid;
    else game.homeId = tid;
    save();
    renderAll();
}

function setFilter(side, filter) {
    if (side === 'away') appState.awayFilter = filter;
    else appState.homeFilter = filter;
    renderSport();
}

function updateCoach(side, name) {
    const team = getTeam(side);
    if (team) { team.coach = name; save(); }
}

function renderNav() {
    const views = ['sport', 'roster', 'script', 'admin'];
    const labels = ['🏈 GAME', '📋 ROSTERS', '🎙️ SCRIPT', '⚙️ ADMIN'];
    let html = '';
    views.forEach((v, i) => {
        const active = appState.view === v ? 'active' : '';
        html += `<button class="nav-link ${active}" onclick="switchView('${v}')">${labels[i]}</button>`;
    });
    document.getElementById('mainNav').innerHTML = html;
}

function switchView(view) {
    appState.view = view;
    renderNav();
    renderAll();
}

function renderAll() {
    renderNav();
    if (appState.view === 'roster') renderRoster();
    else if (appState.view === 'script') renderScript();
    else if (appState.view === 'admin') renderAdmin();
    else renderSport();
    updateScorebug();
}

function clearScript() {

}

function printScript() {
    const w = window.open();

// 16. TOAST
// ============================================================
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============================================================
// 17. KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.key === ' ' && e.target === document.body) {
        e.preventDefault();
        game.clock.running ? pauseGC() : startGC();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        save();
        toast('Saved');
    }
});
