<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – PA Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #1e3a5f;
            padding: 10px;
            border-bottom: 3px solid #facc15;
            flex-shrink: 0;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }
        .scorebug {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #0f172a;
            border: 2px solid #facc15;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .team-name {
            font-size: 14px;
            font-weight: bold;
            color: #facc15;
        }
        .score {
            font-size: 2rem;
            font-weight: bold;
        }
        .score-buttons {
            display: flex;
            gap: 5px;
        }
        .score-buttons button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #475569;
            background: #334155;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }
        .quarter {
            text-align: center;
        }
        .quarter-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #facc15;
        }
        .clock-display {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
        }
        button {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        button:hover {
            background: #475569;
        }
        button.active {
            background: #facc15;
            color: #000;
        }
        nav {
            background: #1a1a1a;
            display: flex;
            gap: 5px;
            padding: 5px 10px;
            flex-shrink: 0;
        }
        .nav-link {
            background: none;
            border: none;
            color: #ccc;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-link.active {
            background: #facc15;
            color: #000;
            border-radius: 5px 5px 0 0;
        }
        main {
            flex: 1;
            overflow: auto;
            padding: 10px;
        }
        .game-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .team-cards {
            display: flex;
            gap: 10px;
            height: calc(100% - 60px);
        }
        .team-card {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-header {
            padding: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header select {
            flex: 1;
            padding: 5px;
            border-radius: 4px;
            background: #fff;
            color: #000;
            font-size: 1rem;
        }
        .unit-tabs {
            display: flex;
            gap: 5px;
            padding: 5px 10px;
        }
        .unit-tab {
            background: none;
            border: none;
            color: #ccc;
            padding: 5px 10px;
            cursor: pointer;
        }
        .unit-tab.active {
            background: #facc15;
            color: #000;
            border-radius: 5px;
        }
        .player-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .player-row {
            display: grid;
            grid-template-columns: 40px 1fr 60px 30px 30px;
            gap: 10px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #334155;
        }
        .player-row input, .player-row select {
            background: transparent;
            border: 1px solid transparent;
            color: #fff;
            padding: 5px;
            width: 100%;
        }
        .player-row input:focus, .player-row select:focus {
            border-color: #facc15;
            outline: none;
        }
        .flag-btn {
            background: #facc15;
            color: #000;
            border: 2px solid #facc15;
            font-weight: bold;
        }
        .td { background: #dc2626; }
        .fg { background: #2563eb; }
        .pat { background: #16a34a; }
        .safety { background: #f59e0b; color: #000; }
        footer {
            background: #1a1a1a;
            padding: 5px 10px;
            text-align: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<header>
    <div class="header-row">
        <img src="FNL.jpg" alt="FNL" class="logo" onerror="this.style.display='none'">
        <span class="title">🏈 FRIDAY NIGHT LIVE</span>
        <div style="display:flex; gap:5px; align-items:center;">
            <span id="wallClock">12:00 AM</span>
            <span id="weatherHeader">--°F</span>
            <button onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
            <button onclick="toggleOutdoor()">🌤</button>
        </div>
    </div>
    <div class="scorebug" id="scorebug">
        <div class="team">
            <span class="team-name" id="sbAwayAbbr">AWAY</span>
            <div class="score-buttons">
                <button onclick="chScore('away',-1)">−</button>
                <span class="score" id="sbAwayScore">0</span>
                <button onclick="chScore('away',1)">+</button>
            </div>
        </div>
        <div class="quarter">
            <span>QUARTER</span>
            <span class="quarter-display" id="sbQuarter">Q1</span>
            <div>
                <button onclick="chQuarter(-1)">◀</button>
                <button onclick="chQuarter(1)">▶</button>
            </div>
        </div>
        <div class="team">
            <span class="team-name" id="sbHomeAbbr">HOME</span>
            <div class="score-buttons">
                <button onclick="chScore('home',-1)">−</button>
                <span class="score" id="sbHomeScore">0</span>
                <button onclick="chScore('home',1)">+</button>
            </div>
        </div>
        <div class="quarter">
            <span>CLOCK</span>
            <span class="clock-display" id="gameClockDisplay">8:00</span>
            <div>
                <button onclick="startGC()">▶</button>
                <button onclick="pauseGC()">⏸</button>
                <button onclick="resetGC()">↺</button>
            </div>
        </div>
        <div>
            <button onclick="startGame()">▶ Start</button>
            <button onclick="setHalftime()">⏸ Half</button>
            <button onclick="startSecondHalf()">⏭ 2nd</button>
            <button onclick="setOvertime()">⏱ OT</button>
            <button onclick="endGame()">🏁 Final</button>
        </div>
    </div>
</header>

<nav id="mainNav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<footer>
    © 2026 Clayton E. Greenberg | VoiceofDFW.com | v22.0
</footer>

<script>
// Simple state
let S = {
    v: 'sport',
    md: 'dark',
    as: 0,
    hs: 0,
    q: 1,
    down: 1,
    dist: 10,
    poss: 'home',
    gameState: 'READY',
    gc: { rem: 480, run: false },
    awayTeam: { name: 'Texas Hawks', color: '#1e3a5f', players: [
        { id: 'h1', n: '7', na: 'Marcus Johnson', po: 'QB', st: true },
        { id: 'h2', n: '55', na: 'Chris Williams', po: 'Center', st: true },
        { id: 'h3', n: '11', na: 'Jalen Smith', po: 'WR', st: true }
    ]},
    homeTeam: { name: 'Dallas Cowboys', color: '#7f1d1d', players: [
        { id: 's1', n: '12', na: 'Caleb White', po: 'QB', st: true },
        { id: 's2', n: '72', na: 'Mason Lee', po: 'Center', st: true },
        { id: 's3', n: '1', na: 'Adrian Flores', po: 'WR', st: true }
    ]},
    scoringLog: [],
    penaltyLog: [],
    gameHistory: []
};

function g() { return S; }
function toast(m) { 
    const x = document.getElementById('toast'); 
    x.textContent = m; 
    x.classList.add('show'); 
    setTimeout(() => x.classList.remove('show'), 2000); 
}
function saveState() { 
    localStorage.setItem('fnl_v21', JSON.stringify(S)); 
}

function loadState() {
    const raw = localStorage.getItem('fnl_v21');
    if (raw) {
        try { S = { ...S, ...JSON.parse(raw) }; } catch(e) {}
    }
}

function toggleTheme() {
    S.md = S.md === 'dark' ? 'light' : 'dark';
    document.body.style.background = S.md === 'dark' ? '#0f172a' : '#f1f5f9';
    document.body.style.color = S.md === 'dark' ? '#fff' : '#000';
    document.getElementById('themeBtn').textContent = S.md === 'dark' ? '☀️ Light' : '🌙 Dark';
    saveState();
}

function toggleOutdoor() {
    document.body.style.fontSize = document.body.style.fontSize === '16px' ? '18px' : '16px';
    toast('Outdoor mode toggled');
}

function updateWallClock() {
    const n = new Date();
    let h = n.getHours();
    const m = String(n.getMinutes()).padStart(2, '0');
    const s = String(n.getSeconds()).padStart(2, '0');
    const a = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('wallClock').textContent = `${h}:${m}:${s} ${a}`;
}
setInterval(updateWallClock, 1000);
updateWallClock();

function updateWeather() {
    // Simple weather fetch
    fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph')
        .then(r => r.json())
        .then(d => {
            if (d.current) {
                document.getElementById('weatherHeader').textContent = `🌤 ${Math.round(d.current.temperature_2m)}°F | 💨 ${Math.round(d.current.wind_speed_10m)}mph`;
            }
        })
        .catch(() => {});
}
updateWeather();

function chScore(side, delta) {
    if (side === 'away') S.as = Math.max(0, S.as + delta);
    else S.hs = Math.max(0, S.hs + delta);
    updateScorebug();
    saveState();
}

function chQuarter(delta) {
    S.q = Math.min(4, Math.max(1, S.q + delta));
    updateScorebug();
    saveState();
}

function updateScorebug() {
    document.getElementById('sbAwayAbbr').textContent = S.awayTeam.name;
    document.getElementById('sbHomeAbbr').textContent = S.homeTeam.name;
    document.getElementById('sbAwayScore').textContent = S.as;
    document.getElementById('sbHomeScore').textContent = S.hs;
    document.getElementById('sbQuarter').textContent = `Q${S.q}`;
}

function updateGameClockDisplay() {
    const m = Math.floor(S.gc.rem / 60);
    const s = S.gc.rem % 60;
    document.getElementById('gameClockDisplay').textContent = `${m}:${String(s).padStart(2, '0')}`;
}

setInterval(() => {
    if (S.gc.run && S.gc.rem > 0) {
        S.gc.rem--;
        updateGameClockDisplay();
        if (S.gc.rem === 0) {
            S.gc.run = false;
            toast('Clock expired!');
        }
    }
}, 1000);

function startGame() {
    if (S.gameState !== 'READY' && !confirm('Game already started. Reset?')) return;
    S.gameState = 'FIRST_HALF';
    S.gc.rem = 480;
    S.gc.run = false;
    S.q = 1;
    S.as = 0;
    S.hs = 0;
    S.scoringLog = [];
    S.penaltyLog = [];
    updateScorebug();
    updateGameClockDisplay();
    saveState();
    toast('🏈 Game started!');
}

function setHalftime() {
    S.gameState = 'HALFTIME';
    S.gc.run = false;
    saveState();
    toast('⏸️ Halftime');
}

function startSecondHalf() {
    S.gameState = 'SECOND_HALF';
    S.gc.rem = 480;
    S.gc.run = false;
    S.q = 3;
    updateScorebug();
    updateGameClockDisplay();
    saveState();
    toast('⏭️ 2nd Half started');
}

function setOvertime() {
    S.gameState = 'OVERTIME';
    S.gc.rem = 360;
    S.gc.run = false;
    S.q = 5;
    updateScorebug();
    updateGameClockDisplay();
    saveState();
    toast('⏱️ Overtime');
}

function endGame() {
    if (!confirm('End game?')) return;
    S.gameState = 'FINAL';
    S.gc.run = false;
    S.gameHistory.push({
        date: new Date().toISOString(),
        away: S.awayTeam.name,
        home: S.homeTeam.name,
        awayScore: S.as,
        homeScore: S.hs,
        log: [...S.scoringLog, ...S.penaltyLog]
    });
    saveState();
    toast('🏁 Game ended');
}

function startGC() { S.gc.run = true; saveState(); }
function pauseGC() { S.gc.run = false; saveState(); }
function resetGC() { S.gc.run = false; S.gc.rem = 480; updateGameClockDisplay(); saveState(); }

function setPossession(side) {
    S.poss = side;
    saveState();
    renderGame();
}

function firstDown() {
    S.down = 1;
    S.dist = 10;
    renderGame();
    toast('1st & 10');
}

function setDown(v) { S.down = parseInt(v) || 1; saveState(); }
function setDist(v) { S.dist = parseInt(v) || 1; saveState(); }

function quickScore(type) {
    if (S.gameState === 'FINAL') { toast('Game is final'); return; }
    let pts = 0;
    if (type === 'td') pts = 6;
    else if (type === 'fg') pts = 3;
    else if (type === 'pat') pts = 1;
    else if (type === 'safety') pts = 2;
    
    if (S.poss === 'home') S.hs += pts;
    else S.as += pts;
    
    S.scoringLog.push({ type, team: S.poss, points: pts, time: S.gc.rem, quarter: S.q });
    updateScorebug();
    saveState();
    toast(`${type.toUpperCase()} +${pts}`);
}

function quickPenalty() {
    if (S.gameState === 'FINAL') { toast('Game is final'); return; }
    S.penaltyLog.push({ type: 'flag', team: S.poss, time: S.gc.rem, quarter: S.q });
    saveState();
    toast('🚩 Penalty');
}

function renderNav() {
    const views = [
        { id: 'sport', label: '🏈 GAME' },
        { id: 'roster', label: '📋 ROSTERS' },
        { id: 'log', label: '📜 LOG' },
        { id: 'script', label: '🎙️ SCRIPT' }
    ];
    let html = '';
    views.forEach(v => {
        html += `<button class="nav-link ${S.v === v.id ? 'active' : ''}" onclick="switchView('${v.id}')">${v.label}</button>`;
    });
    document.getElementById('mainNav').innerHTML = html;
}

function switchView(v) {
    S.v = v;
    renderNav();
    renderView();
}

function renderView() {
    if (S.v === 'roster') renderRoster();
    else if (S.v === 'log') renderLog();
    else if (S.v === 'script') renderScript();
    else renderGame();
}

function renderGame() {
    let html = '';
    
    // Game controls
    html += '<div class="game-controls">';
    html += `Down: <select onchange="setDown(this.value)">${[1,2,3,4].map(d => `<option ${d === S.down ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
    html += ` Yards: <input type="number" value="${S.dist}" min="1" max="99" style="width:50px;" onchange="setDist(this.value)">`;
    html += `<button onclick="firstDown()">🔻 1st Down</button>`;
    html += `<button class="${S.poss === 'home' ? 'active' : ''}" onclick="setPossession('home')">🏠 HOME</button>`;
    html += `<button class="${S.poss === 'away' ? 'active' : ''}" onclick="setPossession('away')">✈️ AWAY</button>`;
    html += `<button class="td" onclick="quickScore('td')">TD +6</button>`;
    html += `<button class="fg" onclick="quickScore('fg')">FG +3</button>`;
    html += `<button class="pat" onclick="quickScore('pat')">PAT +1</button>`;
    html += `<button class="safety" onclick="quickScore('safety')">Safety +2</button>`;
    html += `<button class="flag-btn" onclick="quickPenalty()">🚩 FLAG</button>`;
    html += '</div>';
    
    // Team cards
    html += '<div class="team-cards">';
    
    // Away team
    html += `<div class="team-card">`;
    html += `<div class="card-header" style="background:${S.awayTeam.color};">`;
    html += `<span>AWAY</span>`;
    html += `<select><option>${S.awayTeam.name}</option></select>`;
    html += `<button onclick="setPossession('away')">🏈</button>`;
    html += '</div>';
    html += '<div class="unit-tabs">';
    html += '<button class="unit-tab active">ALL</button>';
    html += '<button class="unit-tab">OFF</button>';
    html += '<button class="unit-tab">DEF</button>';
    html += '</div>';
    html += '<div class="player-list">';
    S.awayTeam.players.forEach(p => {
        html += `<div class="player-row">`;
        html += `<input value="${p.n}" style="width:40px;">`;
        html += `<input value="${p.na}">`;
        html += `<select><option>${p.po}</option></select>`;
        html += `<button>⭐</button>`;
        html += `<button>📌</button>`;
        html += '</div>';
    });
    html += '</div>';
    html += '</div>';
    
    // Home team
    html += `<div class="team-card">`;
    html += `<div class="card-header" style="background:${S.homeTeam.color};">`;
    html += `<span>HOME</span>`;
    html += `<select><option>${S.homeTeam.name}</option></select>`;
    html += `<button onclick="setPossession('home')">🏈</button>`;
    html += '</div>';
    html += '<div class="unit-tabs">';
    html += '<button class="unit-tab active">ALL</button>';
    html += '<button class="unit-tab">OFF</button>';
    html += '<button class="unit-tab">DEF</button>';
    html += '</div>';
    html += '<div class="player-list">';
    S.homeTeam.players.forEach(p => {
        html += `<div class="player-row">`;
        html += `<input value="${p.n}" style="width:40px;">`;
        html += `<input value="${p.na}">`;
        html += `<select><option>${p.po}</option></select>`;
        html += `<button>⭐</button>`;
        html += `<button>📌</button>`;
        html += '</div>';
    });
    html += '</div>';
    html += '</div>';
    
    html += '</div>';
    
    document.getElementById('main').innerHTML = html;
}

function renderRoster() {
    let html = '<div style="padding:20px;">';
    html += '<h3>ROSTERS</h3>';
    html += `<h4>${S.awayTeam.name}</h4>`;
    S.awayTeam.players.forEach(p => {
        html += `<div style="display:flex;gap:10px;margin-bottom:5px;">
            <input value="${p.n}" style="width:50px;">
            <input value="${p.na}" style="flex:1;">
            <select><option>${p.po}</option></select>
            <button>✕</button>
        </div>`;
    });
    html += '<button>➕ Add Player</button>';
    html += `<h4 style="margin-top:20px;">${S.homeTeam.name}</h4>`;
    S.homeTeam.players.forEach(p => {
        html += `<div style="display:flex;gap:10px;margin-bottom:5px;">
            <input value="${p.n}" style="width:50px;">
            <input value="${p.na}" style="flex:1;">
            <select><option>${p.po}</option></select>
            <button>✕</button>
        </div>`;
    });
    html += '<button>➕ Add Player</button>';
    html += '</div>';
    document.getElementById('main').innerHTML = html;
}

function renderLog() {
    let html = '<div style="padding:20px;"><h3>📜 GAME LOG</h3>';
    
    const events = [...S.scoringLog.map(e => ({...e, type: 'score'})), ...S.penaltyLog.map(e => ({...e, type: 'penalty'}))];
    
    if (events.length === 0) {
        html += '<p>No events in current game.</p>';
    } else {
        html += '<h4>Current Game</h4><table style="width:100%;border-collapse:collapse;font-size:0.8rem;">';
        html += '<tr><th>Time</th><th>Team</th><th>Event</th></tr>';
        events.forEach(ev => {
            const timeStr = ev.time ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
            html += `<tr><td>${timeStr}</td><td>${ev.team === 'home' ? 'Home' : 'Away'}</td><td>${ev.type.toUpperCase()}</td></tr>`;
        });
        html += '</table>';
    }
    
    if (S.gameHistory.length > 0) {
        html += '<hr><h4>Game History</h4>';
        S.gameHistory.forEach((game, idx) => {
            const d = new Date(game.date).toLocaleDateString();
            html += `<div style="padding:5px;border-bottom:1px solid #334155;">
                ${d} - ${game.away} vs ${game.home} - ${game.awayScore}-${game.homeScore}
                <button onclick="printGameLog(${idx})">🖨️ Print</button>
            </div>`;
        });
    }
    
    html += '</div>';
    document.getElementById('main').innerHTML = html;
}

function printGameLog(idx) {
    const game = S.gameHistory[idx];
    if (!game) return toast('No log');
    
    let html = '<html><head><title>Game Log</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>';
    html += `<h2>${game.away} vs ${game.home}</h2>`;
    html += `<p>Final Score: ${game.awayScore} - ${game.homeScore}</p>`;
    html += '<table><tr><th>Time</th><th>Team</th><th>Event</th></tr>';
    game.log.forEach(ev => {
        const timeStr = ev.time ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
        html += `<tr><td>${timeStr}</td><td>${ev.team === 'home' ? 'Home' : 'Away'}</td><td>${ev.type.toUpperCase()}</td></tr>`;
    });
    html += '</table></body></html>';
    
    const w = window.open();
    w.document.write(html);
    w.print();
}

function renderScript() {
    let html = '<div style="padding:20px;height:100%;display:flex;flex-direction:column;">';
    html += '<div style="display:flex;gap:10px;margin-bottom:10px;">';
    html += '<button onclick="document.execCommand(\'bold\')"><b>B</b></button>';
    html += '<button onclick="document.execCommand(\'italic\')"><i>I</i></button>';
    html += '<button onclick="document.execCommand(\'underline\')"><u>U</u></button>';
    html += '<button onclick="saveScript()">💾 Save</button>';
    html += '<button onclick="printScript()">🖨️ Print</button>';
    html += '</div>';
    html += '<div id="scriptEditor" contenteditable="true" style="flex:1;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:5px;overflow-y:auto;"></div>';
    html += '</div>';
    document.getElementById('main').innerHTML = html;
    document.getElementById('scriptEditor').innerHTML = S.script || '';
}

function saveScript() {
    S.script = document.getElementById('scriptEditor').innerHTML;
    saveState();
    toast('Script saved');
}

function printScript() {
    const w = window.open();
    w.document.write('<html><head><title>Script</title></head><body>' + S.script + '</body></html>');
    w.print();
}

// Initialize
loadState();
updateScorebug();
updateGameClockDisplay();
renderNav();
renderView();
</script>
