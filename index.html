<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Friday Night Live – Football PA Console</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#f0f2f5;color:#0a2540;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

        /* ── HEADER ── */
        header{background:#1a3a2a;padding:4px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;border-bottom:3px solid #d4af37;flex-shrink:0;min-height:42px;flex-wrap:wrap}
        .hdr-left{display:flex;align-items:center;gap:6px}
        .hdr-left a{color:#fff;font-size:10px;text-decoration:none;background:rgba(0,0,0,0.4);padding:2px 8px;border-radius:4px}
        .brand{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:6px}
        .brand h1{font-size:13px;color:#fff;font-weight:900}
        .brand span{font-size:8px;color:#d4af37;font-weight:700}
        .clock{font-size:12px;font-weight:700;color:#d4af37;background:rgba(0,0,0,0.4);padding:2px 10px;border-radius:6px;min-width:60px;text-align:center}
        .weather{font-size:10px;color:#fff;background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:12px}
        .hdr-right{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
        .hdr-right button{background:rgba(255,255,255,0.12);border:none;color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;cursor:pointer;min-height:26px;min-width:26px}
        .hdr-right button:hover{background:rgba(255,255,255,0.25)}
        .hdr-right .gold{background:#e6a817!important;color:#000!important;font-weight:700}
        .hdr-right .red{background:#dc2626!important;color:#fff!important}

        /* ── NAV ── */
        nav{background:#1a1a2e;display:flex;padding:0 8px;gap:2px;flex-shrink:0;min-height:28px;overflow-x:auto}
        .nav-link{padding:4px 12px;font-size:10px;font-weight:600;background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
        .nav-link.active{color:#fff;border-bottom-color:#d4af37}

        /* ── SCOREBUG ── */
        #scorebug-wrap{flex-shrink:0;display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#0a0a1a,#1a1a2e);border-radius:6px;padding:2px 8px;margin:0 0 2px 0;border:2px solid #d4af37;min-height:38px}
        .sb-side{display:flex;align-items:center;gap:3px;flex:1;justify-content:center}
        .sb-name{font-size:10px;font-weight:900;text-transform:uppercase;min-width:36px;text-align:center;color:#fff}
        .sb-score{font-size:18px;font-weight:900;min-width:28px;text-align:center;color:#fbbf24}
        .sb-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .sb-btn.plus{background:rgba(34,197,94,0.2);border-color:rgba(34,197,94,0.3)}
        .sb-center{display:flex;align-items:center;gap:3px;padding:0 6px;border-left:1px solid rgba(255,215,0,0.12);border-right:1px solid rgba(255,215,0,0.12)}
        .sb-clock{font-family:'Courier New',monospace;font-size:14px;font-weight:900;color:#fbbf24;min-width:44px;text-align:center}
        .sb-cbtn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:3px;padding:0 5px;font-size:8px;cursor:pointer;height:20px}
        .sb-cbtn.red{background:rgba(220,38,38,0.25);border-color:rgba(220,38,38,0.3)}
        .sb-qtr{font-size:10px;font-weight:700;color:#d4af37;min-width:18px;text-align:center}

        /* ── MAIN ── */
        main{flex:1;overflow:hidden;padding:3px;display:flex;gap:3px}

        /* ── GAME GRID ── */
        .game-grid{display:flex;gap:4px;width:100%;height:100%;background:#cbd5e1;border-radius:6px;padding:3px;overflow:hidden}
        .team-card{flex:1;min-width:200px;background:#fff;border-radius:6px;border:1px solid #cbd5e1;display:flex;flex-direction:column;overflow:hidden}

        /* ── CARD HEAD – SIMPLE FLEX ── */
        .card-head{
            display:flex !important;
            align-items:center !important;
            gap:6px !important;
            flex-wrap:wrap !important;
            padding:4px 8px;
            color:#fff;
            border-bottom:2px solid #d4af37;
            background:#1e3a5f;
            min-height:40px;
        }
        .card-head .label{
            font-weight:700;
            font-size:11px;
            text-transform:uppercase;
            flex-shrink:0;
        }
        .card-head select{
            flex: 1 1 120px !important;
            min-width: 120px !important;
            padding:4px 8px;
            border-radius:4px;
            border:2px solid #d4af37 !important;
            background:#ffffff !important;
            color:#000000 !important;
            font-weight:700;
            font-size:13px;
            min-height:30px;
            cursor:pointer;
        }
        .card-head select option{
            background:#ffffff !important;
            color:#000000 !important;
            padding:4px;
        }
        .card-head .poss-btn{
            background:rgba(255,255,255,0.15);
            border:1px solid rgba(255,255,255,0.2);
            color:#fff;
            border-radius:4px;
            padding:0 8px;
            font-size:11px;
            cursor:pointer;
            min-height:26px;
            flex-shrink:0;
        }

        .player-list-body{flex:1;overflow-y:auto;padding:4px 6px}
        .player-row{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #eee;font-size:12px;align-items:center}
        .player-row .num{font-weight:bold;width:30px}
        .player-row .name{flex:1}
        .player-row .pos{color:#666;width:40px}
        .player-row .starter{color:#d4af37;font-size:10px;font-weight:bold}

        .game-controls{display:flex;gap:2px;padding:2px 6px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid #cbd5e1;border-radius:4px;margin-bottom:2px;flex-shrink:0}
        .game-controls .btn-sm{font-size:8px;padding:0 6px;min-height:20px;border-radius:3px;border:none;cursor:pointer;font-weight:600}
        .game-controls .btn-sm.green{background:#22c55e;color:#000}
        .game-controls .btn-sm.red{background:#dc2626;color:#fff}
        .game-controls .btn-sm.gray{background:#666;color:#fff}
        .game-controls .btn-sm.gold{background:#f59e0b;color:#000}
        .game-controls span{font-size:9px;font-weight:600}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:4px 16px;border-radius:16px;font-size:12px;opacity:0;transition:opacity 0.25s;z-index:999;pointer-events:none}
        .toast.show{opacity:1}

        footer{background:#0a0a1a;padding:2px 10px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #d4af37;color:#94a3b8;font-size:8px;flex-shrink:0;min-height:20px}
        footer .saved{color:#d4af37}

        @media(max-width:900px){.game-grid{flex-direction:column}}
        @media(max-width:600px){.card-head select{font-size:11px;min-width:80px;min-height:24px}}
    </style>
</head>
<body>
<header>
    <div class="hdr-left">
        <a href="https://voiceofdfw.com">← VODFW</a>
        <div class="brand"><h1>🏈 FNL</h1><span>PA</span></div>
    </div>
    <div class="clock" id="wallClock">12:00</div>
    <div class="weather" id="weatherHeader">--°F</div>
    <div id="scorebug-wrap">
        <div class="sb-side">
            <span class="sb-name" id="sbAwayName">AWAY</span>
            <button class="sb-btn" onclick="chScore('away',-1)">−</button>
            <span class="sb-score" id="sbAwayScore">0</span>
            <button class="sb-btn plus" onclick="chScore('away',1)">+</button>
        </div>
        <div class="sb-center">
            <button class="sb-cbtn" onclick="chQuarter(-1)">◀</button>
            <span class="sb-qtr" id="sbQuarter">Q1</span>
            <button class="sb-cbtn" onclick="chQuarter(1)">▶</button>
            <span style="color:#666;margin:0 2px;">|</span>
            <span class="sb-clock" id="gameClockDisplay">25:00</span>
            <button class="sb-cbtn" onclick="setClockPreset()">⏳</button>
            <button class="sb-cbtn" onclick="startClock()">▶</button>
            <button class="sb-cbtn" onclick="pauseClock()">⏸</button>
            <button class="sb-cbtn red" onclick="resetClock()">↺</button>
        </div>
        <div class="sb-side">
            <button class="sb-btn plus" onclick="chScore('home',1)">+</button>
            <span class="sb-score" id="sbHomeScore">0</span>
            <button class="sb-btn" onclick="chScore('home',-1)">−</button>
            <span class="sb-name" id="sbHomeName">HOME</span>
        </div>
    </div>
    <div class="hdr-right">
        <button class="gold">💾</button>
        <button>📥</button>
        <button class="red" id="resetBtn">↺</button>
    </div>
</header>

<nav>
    <button class="nav-link active" data-view="game">🏈 GAME</button>
</nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<footer>
    <span>© Clayton Greenberg | VoiceofDFW.com</span>
    <span class="saved" id="ftSaved">Never saved</span>
</footer>

<script>
// ═══════════════════════════════════════════════
// SIMPLEST WORKING VERSION – NO ADDED FEATURES
// ═══════════════════════════════════════════════

const teams = [
    {
        id: "cowboys",
        name: "Dallas Cowboys",
        color: "#0033A0",
        players: [
            { num: "4", name: "Dak Prescott", pos: "QB", starter: true },
            { num: "88", name: "CeeDee Lamb", pos: "WR", starter: true },
            { num: "21", name: "Ezekiel Elliott", pos: "RB", starter: true },
            { num: "11", name: "Micah Parsons", pos: "LB", starter: true }
        ]
    },
    {
        id: "49ers",
        name: "San Francisco 49ers",
        color: "#AA0000",
        players: [
            { num: "13", name: "Brock Purdy", pos: "QB", starter: true },
            { num: "23", name: "Christian McCaffrey", pos: "RB", starter: true },
            { num: "19", name: "Deebo Samuel", pos: "WR", starter: true }
        ]
    },
    {
        id: "chiefs",
        name: "Kansas City Chiefs",
        color: "#E31837",
        players: [
            { num: "15", name: "Patrick Mahomes", pos: "QB", starter: true },
            { num: "87", name: "Travis Kelce", pos: "TE", starter: true }
        ]
    },
    {
        id: "eagles",
        name: "Philadelphia Eagles",
        color: "#004C54",
        players: [
            { num: "1", name: "Jalen Hurts", pos: "QB", starter: true }
        ]
    }
];

let state = {
    awayId: "49ers",
    homeId: "cowboys",
    awayScore: 0,
    homeScore: 0,
    quarter: 1,
    clockSeconds: 1500,
    clockRunning: false,
    possession: "home"
};

function getTeam(id) { return teams.find(t => t.id === id); }
function getTeamBySide(side) { return getTeam(side === 'away' ? state.awayId : state.homeId); }

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── CLOCK ──────────────────────────────────────────────────────
function displayClock() {
    const el = document.getElementById('gameClockDisplay');
    const s = state.clockSeconds;
    const m = Math.floor(s / 60);
    const sec = s % 60;
    el.textContent = String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function setClockPreset() {
    const input = prompt("Minutes (or 1=Q1, 2=Q2, 3=Half, 4=OT, 5=2min):");
    if (!input) return;
    const num = parseInt(input);
    if (!isNaN(num) && num > 0) { state.clockSeconds = num * 60; displayClock(); return; }
    const presets = { "1": 720, "2": 720, "3": 1440, "4": 600, "5": 120 };
    if (presets[input]) { state.clockSeconds = presets[input]; displayClock(); }
}
function startClock() { state.clockRunning = true; }
function pauseClock() { state.clockRunning = false; }
function resetClock() { state.clockRunning = false; state.clockSeconds = 0; displayClock(); }

setInterval(() => {
    if (state.clockRunning && state.clockSeconds > 0) {
        state.clockSeconds--;
        displayClock();
        if (state.clockSeconds === 0) {
            state.clockRunning = false;
            toast("⏰ Time expired!");
        }
    }
}, 1000);

// ─── SCORE ──────────────────────────────────────────────────────
function chScore(side, d) {
    if (side === 'away') state.awayScore = Math.max(0, state.awayScore + d);
    else state.homeScore = Math.max(0, state.homeScore + d);
    updateScorebug();
}

function chQuarter(d) {
    state.quarter = Math.min(4, Math.max(1, state.quarter + d));
    updateScorebug();
}

function updateScorebug() {
    const away = getTeam(state.awayId);
    const home = getTeam(state.homeId);
    document.getElementById('sbAwayName').textContent = away ? away.name.substring(0, 6).toUpperCase() : "AWAY";
    document.getElementById('sbHomeName').textContent = home ? home.name.substring(0, 6).toUpperCase() : "HOME";
    document.getElementById('sbAwayScore').textContent = state.awayScore;
    document.getElementById('sbHomeScore').textContent = state.homeScore;
    document.getElementById('sbQuarter').textContent = 'Q' + state.quarter;
    displayClock();
}

// ─── RENDER ──────────────────────────────────────────────────────
function renderGame() {
    const posOpts = ["QB","RB","WR","TE","OL","G","T","C","DE","DT","LB","CB","S","DB","K","P"];

    let html = `<div class="game-grid">`;

    // Controls
    html += `<div style="display:flex;flex-direction:column;width:100%;gap:2px;">`;
    html += `<div class="game-controls">`;
    html += `<span>🏈</span>`;
    html += `<button class="btn-sm green">Start</button>`;
    html += `<button class="btn-sm gold">2nd</button>`;
    html += `<button class="btn-sm red">Final</button>`;
    html += `<button class="btn-sm gray">↺</button>`;
    html += `<span>|</span>`;
    html += `<span>D:</span>`;
    html += `<button class="btn-sm">1</button>`;
    html += `<button class="btn-sm">2</button>`;
    html += `<button class="btn-sm">3</button>`;
    html += `<button class="btn-sm">4</button>`;
    html += `<span style="font-weight:900;min-width:16px;text-align:center;">1</span>`;
    html += `<span>📏</span><input type="number" value="10" style="width:24px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;text-align:center;">`;
    html += `<span>📍</span><input type="number" value="50" style="width:24px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;text-align:center;">`;
    html += `<span>🏈</span>`;
    html += `<button class="btn-sm green">H</button>`;
    html += `<button class="btn-sm">A</button>`;
    html += `</div>`;
    html += `<div class="game-controls" style="gap:1px;">`;
    html += `<span>⭐</span>`;
    html += `<button class="btn-sm green">TD+6</button>`;
    html += `<button class="btn-sm">TD+6</button>`;
    html += `<button class="btn-sm gold">FG+3</button>`;
    html += `<button class="btn-sm gold">FG+3</button>`;
    html += `<button class="btn-sm">+1</button>`;
    html += `<button class="btn-sm">+1</button>`;
    html += `<button class="btn-sm" style="background:#dc2626;color:#fff;">S+2</button>`;
    html += `<button class="btn-sm" style="background:#dc2626;color:#fff;">S+2</button>`;
    html += `<span>|</span>`;
    html += `<span>⚖️</span>`;
    html += `<button class="btn-sm gold">Hold</button>`;
    html += `<button class="btn-sm gold">Hold</button>`;
    html += `<button class="btn-sm">FS</button>`;
    html += `<button class="btn-sm">FS</button>`;
    html += `<button class="btn-sm red">PI</button>`;
    html += `<button class="btn-sm red">PI</button>`;
    html += `</div>`;
    html += `</div>`;

    // Team Cards
    ['away', 'home'].forEach(side => {
        const team = getTeamBySide(side);
        const color = team ? team.color : (side === 'away' ? '#1e3a5f' : '#7f1d1d');
        const teamName = team ? team.name : (side === 'away' ? 'Away' : 'Home');
        const players = team ? team.players : [];

        html += `<div class="team-card">`;
        html += `<div class="card-head" style="background:${color};">`;
        html += `<span class="label">${side.toUpperCase()}</span>`;
        html += `<select onchange="switchTeam('${side}', this.value)">`;
        teams.forEach(t => {
            const sel = t.id === (side === 'away' ? state.awayId : state.homeId) ? 'selected' : '';
            html += `<option value="${t.id}" ${sel}>${t.name}</option>`;
        });
        html += `</select>`;
        html += `<button class="poss-btn" style="${state.possession===side?'background:#d4af37;color:#000;':''}">🏈</button>`;
        html += `</div>`;
        html += `<div class="player-list-body">`;
        if (!players || !players.length) {
            html += `<div style="padding:10px;text-align:center;opacity:.4;">No players</div>`;
        } else {
            players.forEach(p => {
                html += `<div class="player-row">`;
                html += `<span class="num">${p.num}</span>`;
                html += `<span class="name">${p.name}</span>`;
                html += `<span class="pos">${p.pos}</span>`;
                if (p.starter) html += `<span class="starter">⭐</span>`;
                html += `</div>`;
            });
        }
        html += `</div>`;
        html += `</div>`;
    });

    html += `</div>`;
    document.getElementById('main').innerHTML = html;
    updateScorebug();
}

function switchTeam(side, tid) {
    if (side === 'away') state.awayId = tid;
    else state.homeId = tid;
    renderGame();
}

// ─── WALL CLOCK ──────────────────────────────────────────────────
function updateWallClock() {
    const n = new Date();
    document.getElementById('wallClock').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateWallClock, 10000);
updateWallClock();

// ─── WEATHER ─────────────────────────────────────────────────────
async function getWeather() {
    try {
        const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m&temperature_unit=fahrenheit');
        const d = await r.json();
        if (d.current) {
            document.getElementById('weatherHeader').textContent = Math.round(d.current.temperature_2m) + '°F';
        }
    } catch(e) {}
}
getWeather();

// ─── INIT ──────────────────────────────────────────────────────
document.getElementById('resetBtn').onclick = function() {
    state.awayScore = 0;
    state.homeScore = 0;
    state.quarter = 1;
    state.clockSeconds = 0;
    state.clockRunning = false;
    displayClock();
    renderGame();
    toast('Reset');
};

// Make functions global for onclick
window.chScore = chScore;
window.chQuarter = chQuarter;
window.startClock = startClock;
window.pauseClock = pauseClock;
window.resetClock = resetClock;
window.setClockPreset = setClockPreset;
window.switchTeam = switchTeam;

renderGame();
toast('🏈 Friday Night Live ready!');
</script>
</body>
</html>
