<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Live – PA Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #facc15;
            --bg: #f1f5f9;
            --surface: #e2e8f0;
            --text: #0f172a;
            --border: #94a3b8;
            --footer-bg: #1a1a1a;
            --footer-text: #f1f5f9;
        }
        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }
        header {
            background: linear-gradient(180deg, #2d6a1e, #1f4d14);
            padding: 6px 10px;
            border-bottom: 3px solid var(--accent);
            flex-shrink: 0;
        }
        .hdr-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hdr-top-left { display: flex; align-items: center; gap: 8px; }
        .brand-logo { height: 36px; width: auto; max-width: 80px; object-fit: contain; }
        .brand-text h1 { font-size: 1rem; color: #fff; }
        .brand-text p { font-size: 0.6rem; color: var(--accent); }
        .hdr-top-right { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .wall-clock, .weather-pill {
            color: var(--accent); font-weight: 700; font-size: 0.65rem;
            background: rgba(0,0,0,0.4); border: 1px solid var(--accent);
            border-radius: 5px; padding: 3px 6px; white-space: nowrap;
        }
        .hdr-btn {
            background: #334155; color: #fff; border: 1px solid #475569;
            border-radius: 16px; padding: 4px 8px; font-size: 0.6rem;
            cursor: pointer; white-space: nowrap;
        }
        .hdr-btn:hover { background: #475569; }
        .hdr-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .scorebug {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #0f172a;
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 8px 12px;
            flex-wrap: wrap;
            width: 100%;
            min-height: 90px;
        }
        .sb-block { display: flex; flex-direction: column; align-items: center; padding: 0 6px; flex: 1 1 auto; min-width: 80px; }
        .sb-abbr {
            font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 3px;
            max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .sb-logo-sm { width: 22px; height: 22px; object-fit: contain; }
        .sb-row { display: flex; align-items: center; gap: 4px; }
        .sb-val { font-size: 1.6rem; font-weight: 900; color: #fff; min-width: 28px; text-align: center; }
        .sb-qtr { font-size: 1rem; font-weight: 800; color: var(--accent); }
        .game-clock { font-family: monospace; font-size: 1rem; font-weight: 800; color: #fff; }
        .sb-btn {
            background: #334155; border: 1px solid #475569; color: #fff;
            width: 26px; height: 26px; border-radius: 50%; font-size: 11px;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
        }
        .sb-btn:hover { background: var(--accent); color: #000; }
        .sb-game-btns { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
        .sb-game-btns button {
            background: #334155; border: 1px solid #475569; color: #fff;
            border-radius: 12px; padding: 3px 7px; font-size: 0.6rem; cursor: pointer;
        }
        .sb-game-btns button:hover { background: var(--accent); color: #000; }
        .sb-toggle-btn {
            background: #334155; border: 1px solid #475569; color: #fff;
            width: 30px; height: 30px; border-radius: 50%; font-size: 14px;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        nav {
            background: #1a1a1a; display: flex; gap: 4px; padding: 0 10px;
            flex-shrink: 0; overflow-x: auto;
        }
        .nav-link {
            background: none; border: none; color: #ccc; padding: 8px 12px;
            font-weight: 700; cursor: pointer; font-size: 0.7rem; white-space: nowrap;
        }
        .nav-link.active { background: var(--accent); color: #000; border-radius: 6px 6px 0 0; }
        main { flex: 1; overflow: auto; padding: 8px; }
        .game-controls {
            display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 6px; margin-bottom: 6px;
        }
        .game-controls button {
            background: #334155; color: #fff; border: 1px solid #475569;
            border-radius: 14px; padding: 5px 8px; font-weight: 700; font-size: 0.65rem; cursor: pointer;
        }
        .game-controls button.active { background: var(--accent); color: #000; }
        .game-controls button.td { background: #dc2626; }
        .game-controls button.fg { background: #2563eb; }
        .game-controls button.pat { background: #16a34a; }
        .game-controls button.safety { background: #f59e0b; color: #000; }
        .game-controls button.flag-btn { background: var(--accent); color: #000; border-color: var(--accent); }
        .game-controls button.first-down { background: #22c55e; }
        .game-controls select, .game-controls input {
            padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text);
        }
        .team-cards { display: flex; gap: 6px; height: calc(100% - 45px); }
        .team-card {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
        }
        .card-head {
            padding: 6px; font-weight: 700; display: flex; align-items: center;
            gap: 5px; color: #fff; font-size: 0.75rem;
        }
        .card-head select {
            flex: 1; padding: 4px; border-radius: 4px; background: #fff; color: #000; font-size: 0.75rem;
        }
        .unit-tabs { display: flex; gap: 3px; padding: 3px 6px; border-bottom: 1px solid var(--border); }
        .unit-tab {
            background: none; border: none; color: var(--text); padding: 3px 6px;
            cursor: pointer; font-weight: 700; font-size: 0.6rem;
        }
        .unit-tab.active { background: var(--accent); color: #000; border-radius: 4px; }
        .player-list-body { flex: 1; overflow-y: auto; padding: 5px; }
        .player-row {
            display: grid; grid-template-columns: 28px 1fr 55px 25px 25px 22px;
            gap: 4px; align-items: center; padding: 4px; border-bottom: 1px solid var(--border);
        }
        .player-row input, .player-row select {
            background: transparent; border: 1px solid transparent; color: var(--text);
            padding: 2px; width: 100%; font-size: 0.7rem;
        }
        .player-row input:focus, .player-row select:focus { border-color: var(--accent); outline: none; }
        .player-row.starter { background: rgba(251,191,36,0.15); border-left: 3px solid var(--accent); }
        .st-toggle, .pin-btn {
            background: none; border: 1px solid var(--border); border-radius: 50%;
            width: 20px; height: 20px; cursor: pointer; font-size: 0.55rem;
        }
        .st-toggle.active { background: var(--accent); color: #000; }
        footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            padding: 4px 8px;
            text-align: center;
            font-size: 0.55rem;
            flex-shrink: 0;
            border-top: 1px solid var(--accent);
        }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 8px 16px; border-radius: 20px;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .tooltip-js {
            position: fixed; z-index: 10000; background: #1e293b; color: #fff;
            padding: 6px 12px; border-radius: 6px; font-size: 0.7rem;
            pointer-events: none; display: none; max-width: 200px; border: 1px solid #475569;
        }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .roster-layout { display: flex; gap: 10px; height: 100%; }
        .team-sidebar {
            width: 180px; flex-shrink: 0; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-y: auto;
        }
        .team-item {
            padding: 6px 8px; border-radius: 4px; margin-bottom: 3px; cursor: pointer;
            font-weight: 600; font-size: 0.7rem; color: var(--text);
        }
        .team-item.active { background: var(--accent); color: #000; }
        .roster-workspace {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px; overflow-y: auto;
        }
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
        .admin-tab {
            padding: 4px 10px; border-radius: 12px; font-size: 0.6rem; font-weight: 700;
            background: none; border: 1px solid var(--border); color: inherit; cursor: pointer;
        }
        .admin-tab.active { background: var(--accent); color: #000; }
        .possession-indicator {
            display: inline-block; width: 12px; height: 12px; border-radius: 50%;
            margin-left: 4px; border: 2px solid var(--accent);
        }
        .possession-indicator.home { background: #2563eb; }
        .possession-indicator.away { background: #dc2626; }
        .down-distance-display {
            color: #fff; font-size: 0.75rem; font-weight: 700;
            background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px;
        }
        @media (max-width: 768px) {
            .team-cards { flex-direction: column; height: auto; }
            .scorebug { gap: 5px; padding: 5px; }
            .sb-block { min-width: 50px; }
            .sb-val { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="tooltip-js" id="tooltip"></div>

<header>
    <div class="hdr-top">
        <div class="hdr-top-left">
            <img src="FNL.jpg" alt="FNL" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>🏈 FRIDAY NIGHT LIVE</h1>
                <p>PA CONSOLE</p>
            </div>
        </div>
        <div class="hdr-top-right">
            <span class="wall-clock" id="wallClock" data-tooltip="Current time">12:00 AM</span>
            <span class="weather-pill" id="weatherHeader" data-tooltip="Live weather">--°F</span>
            <button class="hdr-btn" onclick="fnlCloudSaveAll()" data-tooltip="Save to cloud">💾 SAVE</button>
            <button class="hdr-btn" onclick="fnlCloudLoadAll()" data-tooltip="Load from cloud">📥 LOAD</button>
            <button class="hdr-btn" id="themeBtn" onclick="toggleTheme()" data-tooltip="Toggle dark/light mode">🌙 Dark</button>
            <button class="hdr-btn" onclick="toggleOutdoor()" data-tooltip="Toggle outdoor mode (larger text)">🌤</button>
            <button class="hdr-btn" onclick="printLU()" data-tooltip="Print lineup">🖨️</button>
            <button class="hdr-btn" onclick="resetGame()" style="background:#dc2626;" data-tooltip="Reset entire game">RESET</button>
        </div>
    </div>
    <div class="hdr-bottom">
        <div class="scorebug" id="scorebug">
            <div class="sb-block">
                <span class="sb-abbr" id="sbAwayAbbr" data-tooltip="Away team">AWAY</span>
                <div class="sb-row">
                    <button class="sb-btn" onclick="chScore('away',-1)" data-tooltip="Subtract point">−</button>
                    <span class="sb-val" id="sbAwayScore" data-tooltip="Away score">0</span>
                    <button class="sb-btn" onclick="chScore('away',1)" data-tooltip="Add point">+</button>
                </div>
                <button class="sb-btn" onclick="uploadScorebugLogo('away')" data-tooltip="Upload away logo" style="width:20px;height:20px;font-size:9px;">📷</button>
            </div>
            <div class="sb-block">
                <span class="sb-abbr" data-tooltip="Current period">PERIOD</span>
                <span class="sb-qtr" id="sbQuarter" data-tooltip="Current quarter">Q1</span>
                <div class="sb-row">
                    <button class="sb-btn" onclick="chQuarter(-1)" data-tooltip="Previous quarter">◀</button>
                    <button class="sb-btn" onclick="chQuarter(1)" data-tooltip="Next quarter">▶</button>
                </div>
            </div>
            <div class="sb-block">
                <span class="sb-abbr" id="sbHomeAbbr" data-tooltip="Home team">HOME</span>
                <div class="sb-row">
                    <button class="sb-btn" onclick="chScore('home',-1)" data-tooltip="Subtract point">−</button>
                    <span class="sb-val" id="sbHomeScore" data-tooltip="Home score">0</span>
                    <button class="sb-btn" onclick="chScore('home',1)" data-tooltip="Add point">+</button>
                </div>
                <button class="sb-btn" onclick="uploadScorebugLogo('home')" data-tooltip="Upload home logo" style="width:20px;height:20px;font-size:9px;">📷</button>
            </div>
            <div class="sb-block">
                <span class="sb-abbr" data-tooltip="Game clock">CLOCK</span>
                <span class="game-clock" id="gameClockDisplay" data-tooltip="Time remaining">8:00</span>
                <div class="sb-row">
                    <button class="sb-btn" onclick="startGC()" data-tooltip="Start clock">▶</button>
                    <button class="sb-btn" onclick="pauseGC()" data-tooltip="Pause clock">⏸</button>
                    <button class="sb-btn" onclick="resetGC()" data-tooltip="Reset clock to 8:00">↺</button>
                </div>
            </div>
            <div class="sb-block">
                <span class="sb-abbr" data-tooltip="Game controls">GAME</span>
                <div class="sb-game-btns">
                    <button onclick="startGame()" data-tooltip="Start game (Q1)">▶ Start</button>
                    <button onclick="setHalftime()" data-tooltip="Go to halftime">⏸ Half</button>
                    <button onclick="startSecondHalf()" data-tooltip="Start 2nd half (Q3)">⏭ 2nd</button>
                    <button onclick="setOvertime()" data-tooltip="Overtime mode">⏱ OT</button>
                    <button onclick="endGame()" data-tooltip="End game">🏁 Final</button>
                </div>
            </div>
            <div class="sb-block">
                <span class="sb-abbr" data-tooltip="Possession & downs">🏈</span>
                <div class="sb-row">
                    <span id="sbPossession" style="color:#fff;font-weight:700;font-size:0.9rem;">HOME</span>
                </div>
                <div class="sb-row">
                    <span class="down-distance-display" id="sbDownDist" data-tooltip="Down and distance">1st & 10</span>
                </div>
            </div>
        </div>
        <button class="sb-toggle-btn" onclick="toggleScorebugDisplay()" data-tooltip="Toggle scoreboard visibility">👁️</button>
    </div>
</header>

<nav id="mainNav"></nav>
<main id="main"></main>
<footer id="footer">
    © 2026 Clayton E. Greenberg | VoiceofDFW.com | 🏈 Digital Pressbox Command Center 🏈
</footer>

<script>
// Full state - DEFAULT LIGHT MODE
let S = {
    v: 'sport', md: 'light', outdoor: false, at: 'theme',
    as: 0, hs: 0, q: 1, down: 1, dist: 10, poss: 'home',
    gameState: 'READY', gc: { rem: 480, run: false },
    md7: 'tackle', p7: ['QB','Center','WR','WR','WR','DB','DB'],
    cf: '12h', cs: true,
    teams: [
        { id: 'h', name: 'Texas Hawks', color: '#1e3a5f', logo: '', mascot: '', coach: '', players: [
            { id: 'h1', n: '7', na: 'Marcus Johnson', po: 'QB', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 'h2', n: '55', na: 'Chris Williams', po: 'Center', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 'h3', n: '11', na: 'Jalen Smith', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 'h4', n: '88', na: 'Ty Washington', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 'h5', n: '15', na: 'Jordan Davis', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false }
        ]},
        { id: 's', name: 'Dallas Cowboys', color: '#7f1d1d', logo: '', mascot: '', coach: '', players: [
            { id: 's1', n: '12', na: 'Caleb White', po: 'QB', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 's2', n: '72', na: 'Mason Lee', po: 'Center', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 's3', n: '1', na: 'Adrian Flores', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 's4', n: '5', na: 'Xavier Reed', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false },
            { id: 's5', n: '18', na: 'Karter Hill', po: 'WR', st: true, nt: '', pron: '', ph: '', pinned: false }
        ]}
    ],
    scoringLog: [], penaltyLog: [], gameHistory: [], script: '',
    cp: {}, ap: '', im: true, ua: 'all', uh: 'all',
    cid: 'h',
    colors: { scorebugBg: '#0f172a', scorebugText: '#ffffff', teamCardBgAway: '#e2e8f0', teamCardBgHome: '#e2e8f0', teamNameColorAway: '#0f172a', teamNameColorHome: '#0f172a' }
};

function g() { return S; }
function toast(m) { const x = document.getElementById('toast'); x.textContent = m; x.classList.add('show'); setTimeout(() => x.classList.remove('show'), 2000); }
function saveState() { localStorage.setItem('fnl_v22', JSON.stringify(S)); }
function loadState() { const raw = localStorage.getItem('fnl_v22'); if (raw) { try { const parsed = JSON.parse(raw); S = { ...S, ...parsed }; } catch(e) {} } }
function getTeam(side) { 
    if (side === 'away') return S.teams[0]; 
    if (side === 'home') return S.teams[1];
    return S.teams.find(t => t.id === side) || S.teams[0];
}
function getPositions() { return S.md7 === '7v7' ? S.p7 : ['QB','RB','FB','WR','TE','OL','C','G','T','DL','DE','DT','LB','OLB','ILB','CB','S','SS','FS','DB','K','P','LS','KR','PR']; }
function getPlayers(side, filter) {
    const t = getTeam(side); if (!t) return [];
    let list = [...t.players];
    if (S.md7 === 'tackle') {
        const off = ['QB','RB','FB','WR','TE','OL','C','G','T'];
        const def = ['DL','DE','DT','LB','OLB','ILB','CB','S','SS','FS','DB'];
        const st = ['K','P','LS','KR','PR'];
        if (filter === 'offense') list = list.filter(p => off.includes(p.po));
        else if (filter === 'defense') list = list.filter(p => def.includes(p.po));
        else if (filter === 'special') list = list.filter(p => st.includes(p.po));
    }
    list.sort((a, b) => (parseInt(a.n) || 999) - (parseInt(b.n) || 999));
    return list;
}

// Tooltips
const tooltipEl = document.getElementById('tooltip');
document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-tooltip]');
    if (t) { tooltipEl.textContent = t.getAttribute('data-tooltip'); tooltipEl.style.display = 'block'; positionTooltip(e.clientX, e.clientY); }
});
document.addEventListener('mousemove', e => { if (tooltipEl.style.display === 'block') positionTooltip(e.clientX, e.clientY); });
document.addEventListener('mouseout', e => { if (!e.target.closest('[data-tooltip]')) tooltipEl.style.display = 'none'; });
document.addEventListener('click', e => {
    const t = e.target.closest('[data-tooltip]');
    if (t) { tooltipEl.textContent = t.getAttribute('data-tooltip'); tooltipEl.style.display = 'block'; positionTooltip(e.clientX, e.clientY); setTimeout(() => tooltipEl.style.display = 'none', 2000); }
});
function positionTooltip(x, y) {
    let left = x + 15, top = y + 15;
    const rect = tooltipEl.getBoundingClientRect();
    if (left + rect.width > window.innerWidth) left = x - rect.width - 15;
    if (top + rect.height > window.innerHeight) top = y - rect.height - 15;
    tooltipEl.style.left = left + 'px'; tooltipEl.style.top = top + 'px';
}

// Theme
function toggleTheme() {
    S.md = S.md === 'dark' ? 'light' : 'dark';
    if (S.md === 'dark') { 
        document.documentElement.style.setProperty('--bg', '#0f172a'); 
        document.documentElement.style.setProperty('--surface', '#1e293b'); 
        document.documentElement.style.setProperty('--text', '#f1f5f9'); 
        document.documentElement.style.setProperty('--border', '#334155');
        document.documentElement.style.setProperty('--footer-bg', '#0f172a');
        document.documentElement.style.setProperty('--footer-text', '#f1f5f9');
    } else { 
        document.documentElement.style.setProperty('--bg', '#f1f5f9'); 
        document.documentElement.style.setProperty('--surface', '#e2e8f0'); 
        document.documentElement.style.setProperty('--text', '#0f172a'); 
        document.documentElement.style.setProperty('--border', '#94a3b8');
        document.documentElement.style.setProperty('--footer-bg', '#1a1a1a');
        document.documentElement.style.setProperty('--footer-text', '#f1f5f9');
    }
    document.getElementById('themeBtn').textContent = S.md === 'dark' ? '☀️ Light' : '🌙 Dark';
    saveState(); renderAll();
}
function toggleOutdoor() { S.outdoor = !S.outdoor; document.body.style.fontSize = S.outdoor ? '18px' : '14px'; toast(S.outdoor ? '🌤 Outdoor ON' : '🌤 Outdoor OFF'); saveState(); }

// Clock
function updateWallClock() {
    const n = new Date(); let h = n.getHours(); const m = String(n.getMinutes()).padStart(2, '0'); const s = String(n.getSeconds()).padStart(2, '0');
    let x = '';
    if (S.cf === '12h') { const a = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; x = `${h}:${m}${S.cs ? ':' + s : ''} ${a}`; }
    else { h = String(h).padStart(2, '0'); x = `${h}:${m}${S.cs ? ':' + s : ''}`; }
    document.getElementById('wallClock').textContent = x;
}
setInterval(updateWallClock, 1000); updateWallClock();

// Weather
function updateWeather() {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=32.7767&longitude=-96.7970&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph')
        .then(r => r.json()).then(d => { if (d.current) { document.getElementById('weatherHeader').textContent = `🌤 ${Math.round(d.current.temperature_2m)}°F | 💨 ${Math.round(d.current.wind_speed_10m)}mph`; } }).catch(() => {});
}
updateWeather();

// Scorebug
function chScore(side, delta) { if (side === 'away') S.as = Math.max(0, S.as + delta); else S.hs = Math.max(0, S.hs + delta); updateScorebug(); saveState(); }
function chQuarter(delta) {
    // Check if we're in overtime - allow Q5+
    const maxQ = S.gameState === 'OVERTIME' ? 8 : (S.md7 === '7v7' ? 2 : 4);
    S.q = Math.min(maxQ, Math.max(1, S.q + delta));
    if (S.q <= 2) S.gameState = 'FIRST_HALF';
    else if (S.q <= 4) S.gameState = 'SECOND_HALF';

// Quick scoring - FIXED: Non-blocking UI instead of prompt()
function quickScore(type) {
    if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
    let pts = 0; let label = '';
    if (type === 'td') { pts = 6; label = 'Touchdown'; }
    else if (type === 'fg') { pts = 3; label = 'Field Goal'; }
    else if (type === 'pat') { pts = 1; label = 'PAT'; }
    else if (type === 'safety') { pts = 2; label = 'Safety'; }
    const team = getTeam(S.poss);
    const side = S.poss;
    // Use a modal-like input without blocking the clock
    showPlayerInput(`Enter player # for ${label} (optional):`, (input) => {
        let playerName = team.name;
        if (input && input.trim()) { 
            const p = team.players.find(x => x.n === input.trim()); 
            if (p) playerName = p.na; 
            else playerName = input.trim(); 
        }
        if (side === 'home') S.hs += pts; else S.as += pts;
        S.scoringLog.push({ type, team: side, player: playerName, points: pts, time: S.gc.rem, quarter: S.q });
        updateScorebug(); saveState(); toast(`🏈 ${label} +${pts} - ${playerName}`);
    });
}
function quickPenalty() {
    if (S.gameState === 'FINAL') { toast('⛔ Game is final'); return; }
    const team = getTeam(S.poss);
    showPlayerInput(`Enter player # for penalty (optional):`, (input) => {
        let playerName = team.name;
        if (input && input.trim()) { 
            const p = team.players.find(x => x.n === input.trim()); 
            if (p) playerName = p.na; 
            else playerName = input.trim(); 
        }
        S.penaltyLog.push({ type: 'flag', team: S.poss, player: playerName, time: S.gc.rem, quarter: S.q });
        saveState(); toast(`🚩 Penalty on ${playerName}`);
    });
}

function showPlayerInput(message, callback) {

    if (existing) existing.remove();

    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:99999;display:flex;align-items:center;justify-content:center;';

    modal.style.cssText = 'background:#fff;padding:20px;border-radius:12px;min-width:300px;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.3);';
    modal.innerHTML = `

        </div>

}

// FIXED: Team switch now works properly
function switchTeam(side, idx) {
    const newTeam = S.teams[parseInt(idx)];
    if (!newTeam) return;
    const currentTeam = getTeam(side);
    const targetSide = side === 'away' ? 0 : 1;
    const oldId = currentTeam.id;
    const newId = newTeam.id;
    // Don't allow switching to the same team on both sides
    const otherSide = targetSide === 0 ? 1 : 0;
    if (S.teams[otherSide].id === newId) {
        toast('⚠️ Team already on the other side');
        renderGame();
        return;
    }
    // Swap teams
    S.teams[targetSide] = newTeam;
    // Find and remove duplicate
    const dupIndex = S.teams.findIndex((t, i) => i !== targetSide && t.id === newId);
    if (dupIndex !== -1) {
        S.teams.splice(dupIndex, 1);
        // If we removed the other side's team, fix the reference
        if (dupIndex < targetSide) {
            // The other side was before targetSide, so the targetSide index shifted
            // Rebuild: put the old team back where it was
            // This is complex; simpler: just use the team object directly
        }
    }
    // Ensure we have exactly 2 teams
    while (S.teams.length < 2) {
        S.teams.push({ id: 't' + Date.now(), name: 'New Team', color: '#1e3a5f', logo: '', mascot: '', coach: '', players: [] });
    }
    saveState(); renderGame(); updateScorebug(); toast(`✅ Switched ${side} to ${newTeam.name}`);
}
function updateGamePlayer(side, pid, field, val) {

    const team = S.teams.find(t => t.id === teamId);
    if (!team) { toast('Team not found'); return; }
    let html = `<html><head><title>${team.name} Roster</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>`;
    html += `<h2>${team.name} Roster</h2>`;
    html += '<table><tr><th>#</th><th>Name</th><th>Pos</th><th>Notes</th><th>Starter</th></tr>';
    team.players.forEach(p => {
        html += `<tr><td>${p.n}</td><td>${p.na}</td><td>${p.po}</td><td>${p.nt || ''}</td><td>${p.st ? 'Yes' : 'No'}</td></tr>`;
    });
    html += '</table></body></html>';
    const w = window.open();
    if (!w) { toast('⚠️ Popup blocked! Please allow popups.'); return; }
    w.document.write(html); w.print();
}
function exportTeamCSV(teamId) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    let csv = 'Number,Name,Position,Starter,Notes,Pronunciation\n';
    team.players.forEach(p => { csv += `"${p.n}","${p.na}","${p.po}","${p.st ? 'Yes' : 'No'}","${(p.nt || '').replace(/"/g, '""')}","${p.pron || ''}"\n`; });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = team.name + '.csv'; a.click();
}
function parseRosterText(teamId) {
    const tx = document.getElementById('parseArea').value.trim();
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    if (!tx) return toast('⚠️ Empty input');
    const positions = getPositions();
    const lines = tx.split('\n');
    const out = [];
    lines.forEach(l => {
        if (!l.trim()) return;
        let n = '', rest = l.trim();
        const m = rest.match(/^(\d{1,3})\s+/);
        if (m) { n = m[1]; rest = rest.slice(m[0].length).trim(); }
        let po = '', name = rest;
        const words = rest.split(/\s+/);
        if (words.length && positions.includes(words[words.length - 1].toUpperCase())) { po = words.pop().toUpperCase(); name = words.join(' '); }
        if (name) out.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 5), n, na: name, po: po || 'QB', st: false, nt: '', pron: '', ph: '', pinned: false });
    });
    if (out.length) { team.players = out; saveState(); renderRoster(); toast(`✅ ${out.length} players parsed`); }
    else toast('❌ No players found');
}
function uploadRosterFile(teamId, input) {
    const f = input.files[0]; if (!f) return;
    // Don't allow .docx - warn user
    if (f.name.endsWith('.docx')) { toast('⚠️ .docx not supported. Please use .txt or .csv'); return; }
    const r = new FileReader(); r.onload = ev => { document.getElementById('parseArea').value = ev.target.result; parseRosterText(teamId); };
    r.readAsText(f);
}

// Log view
function renderLog() {
    let html = '<div class="panel"><h3>📜 GAME LOG</h3>';
    const events = [...S.scoringLog.map(e => ({...e, type: 'score'})), ...S.penaltyLog.map(e => ({...e, type: 'penalty'}))];
    if (events.length === 0) { html += '<p>No events in current game.</p>'; }
    else {
        html += '<h4>Current Game</h4><table style="width:100%;border-collapse:collapse;font-size:0.75rem;">';
        html += '<tr><th>Time</th><th>Team</th><th>Event</th><th>Details</th></tr>';
        events.sort((a, b) => (b.time || 0) - (a.time || 0));
        events.forEach(ev => {
            const timeStr = ev.time !== undefined ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
            const teamLabel = ev.team === 'home' ? 'Home' : 'Away';
            let desc = ev.type === 'score' ? `${ev.player} +${ev.points}` : `${ev.player}`;
            html += `<tr><td>${timeStr}</td><td>${teamLabel}</td><td>${ev.type.toUpperCase()}</td><td>${desc}</td></tr>`;
        });
        html += '</table>';
    }
    if (S.gameHistory.length > 0) {
        html += '<hr><h4>Game History</h4>';
        S.gameHistory.slice().reverse().forEach((game, idx) => {
            const d = new Date(game.date).toLocaleDateString();
            const realIdx = S.gameHistory.length - 1 - idx;
            html += `<div style="padding:5px;border-bottom:1px solid var(--border);">${d} - ${game.away} vs ${game.home} - ${game.awayScore}-${game.homeScore} <button class="hdr-btn" onclick="printGameLog(${realIdx})" data-tooltip="Print game log">🖨️ Print</button></div>`;
        });
    }
    html += '</div>';
    document.getElementById('main').innerHTML = html;
}
function printGameLog(idx) {
    const game = S.gameHistory[idx]; if (!game) return;
    let html = `<html><head><title>Game Log</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>`;
    html += `<h2>${game.away} vs ${game.home}</h2><p>Final Score: ${game.awayScore} - ${game.homeScore}</p>`;
    html += '<table><tr><th>Time</th><th>Team</th><th>Event</th><th>Details</th></tr>';
    game.log.forEach(ev => {
        const timeStr = ev.time !== undefined ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
        html += `<tr><td>${timeStr}</td><td>${ev.team === 'home' ? 'Home' : 'Away'}</td><td>${ev.type.toUpperCase()}</td><td>${ev.player || ''}</td></tr>`;
    });
    html += '</table></body></html>';
    const w = window.open();
    if (!w) { toast('⚠️ Popup blocked! Please allow popups.'); return; }
    w.document.write(html); w.print();
}

// Cloud sync
async function fnlCloudSaveAll() {
    try { const snap = JSON.parse(JSON.stringify(S)); await fetch('https://lineup-api.claytongreenberg.workers.dev/api/lineup?id=fnl_full_sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(snap) }); toast('✅ Saved to cloud'); } catch(e) { toast('❌ Cloud save failed'); }
}
async function fnlCloudLoadAll() { if (!confirm('Load from cloud?')) return; try { const r = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/lineup?id=fnl_full_sync'); if (!r.ok) throw new Error('No data'); S = await r.json(); saveState(); renderAll(); toast('✅ Loaded from cloud'); } catch(e) { toast('❌ Cloud load failed'); } }

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    // Space = toggle clock
    if (e.key === ' ' && e.target === document.body) {
        e.preventDefault();
        if (S.gc.run) { pauseGC(); } else { startGC(); }
        toast(S.gc.run ? '▶️ Clock running' : '⏸️ Clock paused');
    }
    // Ctrl+S = save state
    if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (e.shiftKey) { fnlCloudSaveAll(); } else { saveState(); toast('💾 Saved locally'); }
    }
});
