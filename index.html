<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FNL – Minimal</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }
        /* ── HEADER ── */
        header { background:#1a3a2a; padding:4px 8px; display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid #d4af37; flex-shrink:0; min-height:42px; }
        .brand { color:#fff; font-weight:bold; }
        .clock { color:#d4af37; font-size:12px; }
        .hdr-right button { background:rgba(255,255,255,0.15); border:none; color:#fff; padding:2px 8px; border-radius:4px; cursor:pointer; }
        /* ── MAIN ── */
        main { flex:1; padding:4px; display:flex; gap:4px; overflow:hidden; }
        .game-grid { display:flex; gap:4px; width:100%; height:100%; background:#cbd5e1; border-radius:6px; padding:3px; }
        .team-card { flex:1; min-width:200px; background:#fff; border-radius:6px; border:1px solid #cbd5e1; display:flex; flex-direction:column; overflow:hidden; }
        /* ── CARD HEAD – GRID LAYOUT ── */
        .card-head {
            display:grid;
            grid-template-columns: auto 1fr auto auto;
            align-items:center;
            gap:6px;
            padding:4px 8px;
            color:#fff;
            border-bottom:2px solid #d4af37;
            background:#1e3a5f;
        }
        .card-head .label { font-weight:bold; font-size:11px; text-transform:uppercase; }
        .card-head select {
            width:100%;
            min-width:100px;
            padding:4px 6px;
            border-radius:4px;
            border:2px solid #d4af37;
            background:#fff;
            color:#000;
            font-weight:bold;
            font-size:13px;
            cursor:pointer;
        }
        .card-head input.coach {
            background:rgba(255,255,255,0.2);
            border:1px solid rgba(255,255,255,0.3);
            color:#fff;
            padding:2px 6px;
            border-radius:4px;
            width:80px;
            font-size:10px;
        }
        .card-head .poss-btn {
            background:rgba(255,255,255,0.2);
            border:1px solid rgba(255,255,255,0.3);
            color:#fff;
            padding:2px 8px;
            border-radius:4px;
            cursor:pointer;
            font-size:12px;
        }
        .unit-tabs { display:flex; gap:2px; padding:2px 6px; border-bottom:1px solid #cbd5e1; }
        .unit-tab { padding:1px 6px; font-size:8px; font-weight:700; background:rgba(0,0,0,0.04); border:none; cursor:pointer; border-radius:3px; }
        .unit-tab.active { background:#d4af37; color:#000; }
        .search-bar { padding:1px 6px; border-bottom:1px solid #cbd5e1; }
        .search-bar input { width:100%; border:1px solid #cbd5e1; border-radius:3px; padding:1px 4px; font-size:10px; }
        .player-list { flex:1; overflow-y:auto; padding:2px 6px; }
        .player-row { display:grid; grid-template-columns:20px 24px 1fr 50px 40px; gap:2px; align-items:center; padding:1px 0; font-size:11px; border-bottom:1px solid #eee; }
        .player-row .num { font-weight:bold; }
        .player-row .name { font-weight:600; }
        .player-row .pron { font-style:italic; font-size:9px; opacity:0.7; }
        .player-row .pos { font-size:9px; background:#e2e8f0; padding:0 4px; border-radius:4px; }
        .add-row { display:flex; gap:2px; padding:1px 6px; border-top:1px solid #cbd5e1; }
        .add-row input, .add-row select { font-size:9px; padding:0 4px; border:1px solid #cbd5e1; border-radius:3px; min-height:20px; }
        .add-row button { background:#d4af37; border:none; border-radius:3px; padding:0 8px; font-weight:bold; cursor:pointer; }
        .game-controls { display:flex; gap:2px; padding:1px 4px; flex-wrap:wrap; background:#fff; border:1px solid #cbd5e1; border-radius:4px; margin-bottom:1px; }
        .game-controls .btn-sm { font-size:8px; padding:0 5px; min-height:18px; border-radius:3px; border:none; cursor:pointer; font-weight:600; }
        .game-controls .btn-sm.green { background:#22c55e; color:#000; }
        .game-controls .btn-sm.red { background:#dc2626; color:#fff; }
        .game-controls .btn-sm.gray { background:#666; color:#fff; }
        .game-controls .btn-sm.gold { background:#f59e0b; color:#000; }
        .game-controls input { width:24px; font-size:9px; border:1px solid #cbd5e1; border-radius:3px; text-align:center; }
        .game-controls span { font-size:9px; font-weight:600; }
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:4px 16px; border-radius:16px; font-size:12px; opacity:0; transition:opacity 0.25s; z-index:999; pointer-events:none; }
        .toast.show { opacity:1; }
        footer { background:#0a0a1a; padding:2px 10px; display:flex; justify-content:space-between; align-items:center; border-top:2px solid #d4af37; color:#94a3b8; font-size:8px; flex-shrink:0; min-height:20px; }
    </style>
</head>
<body>

<header>
    <div class="brand">🏈 FNL PA</div>
    <div class="clock" id="wallClock">12:00</div>
    <div class="hdr-right">
        <button>💾</button><button>📥</button><button>☀️</button>
    </div>
</header>

<main>
    <div class="game-grid" id="gameGrid"></div>
</main>

<div class="toast" id="toast"></div>
<footer><span>© Clayton Greenberg | VoiceofDFW.com</span><span id="ftSaved">Never saved</span></footer>

<script>
    // ─── DATA ────────────────────────────────────────────────
    const teams = [
        {
            id: "cowboys",
            name: "Dallas Cowboys",
            color: "#0033A0",
            coach: "Mike McCarthy",
            players: [
                { num: "4", name: "Dak Prescott", pron: "Dak PRESS-kott", pos: "QB", starter: true, pinned: true },
                { num: "88", name: "CeeDee Lamb", pron: "SEE-dee LAMB", pos: "WR", starter: true, pinned: true },
                { num: "21", name: "Ezekiel Elliott", pron: "eh-ZEEK-ee-ul", pos: "RB", starter: true, pinned: false },
                { num: "11", name: "Micah Parsons", pron: "MY-kuh PAR-sons", pos: "LB", starter: true, pinned: false },
                { num: "70", name: "Zack Martin", pron: "ZAK MAR-tin", pos: "G", starter: true, pinned: false }
            ]
        },
        {
            id: "49ers",
            name: "San Francisco 49ers",
            color: "#AA0000",
            coach: "Kyle Shanahan",
            players: [
                { num: "13", name: "Brock Purdy", pron: "BRAHK PUR-dee", pos: "QB", starter: true, pinned: true },
                { num: "23", name: "Christian McCaffrey", pron: "KRIS-chun muh-KAF-ree", pos: "RB", starter: true, pinned: true },
                { num: "19", name: "Deebo Samuel", pron: "DEE-bo SAM-yoo-el", pos: "WR", starter: true, pinned: false }
            ]
        },
        {
            id: "chiefs",
            name: "Kansas City Chiefs",
            color: "#E31837",
            coach: "Andy Reid",
            players: [
                { num: "15", name: "Patrick Mahomes", pron: "PAT-rik muh-HOMEZ", pos: "QB", starter: true, pinned: true },
                { num: "87", name: "Travis Kelce", pron: "TRAV-is KEL-see", pos: "TE", starter: true, pinned: true }
            ]
        },
        {
            id: "eagles",
            name: "Philadelphia Eagles",
            color: "#004C54",
            coach: "Nick Sirianni",
            players: [
                { num: "1", name: "Jalen Hurts", pron: "JAY-len HERTS", pos: "QB", starter: true, pinned: true }
            ]
        }
    ];

    let state = {
        awayId: "49ers",
        homeId: "cowboys",
        awayScore: 0,
        homeScore: 0,
        quarter: 1,
        clockSeconds: 1500,
        clockRunning: false,
        down: 1,
        distance: 10,
        yardline: 50,
        possession: "home",
        awayFilter: "all",
        homeFilter: "all",
    };

    function getTeam(id) { return teams.find(t => t.id === id); }
    function getTeamBySide(side) { return getTeam(side === 'away' ? state.awayId : state.homeId); }

    function renderGame() {
        const grid = document.getElementById('gameGrid');
        const posOpts = ["QB","RB","WR","TE","OL","G","T","C","DE","DT","LB","CB","S","DB","K","P"];

        let html = `
            <div style="display:flex; flex-direction:column; width:100%; gap:2px;">
                <div class="game-controls">
                    <span>🏈</span>
                    <button class="btn-sm green">Start</button>
                    <button class="btn-sm gold">2nd</button>
                    <button class="btn-sm red">Final</button>
                    <button class="btn-sm gray">↺</button>
                    <span>|</span>
                    <span>D:</span>
                    <button class="btn-sm">1</button>
                    <button class="btn-sm">2</button>
                    <button class="btn-sm">3</button>
                    <button class="btn-sm">4</button>
                    <span style="min-width:14px;text-align:center;font-weight:900;">${state.down}</span>
                    <span>📏</span><input type="number" value="${state.distance}" style="width:24px;">
                    <span>📍</span><input type="number" value="${state.yardline}" style="width:24px;">
                    <span>🏈</span>
                    <button class="btn-sm green">H</button>
                    <button class="btn-sm">A</button>
                </div>
                <div class="game-controls" style="gap:1px;">
                    <span>⭐</span>
                    <button class="btn-sm green">TD+6</button>
                    <button class="btn-sm">TD+6</button>
                    <button class="btn-sm gold">FG+3</button>
                    <button class="btn-sm gold">FG+3</button>
                    <button class="btn-sm">+1</button>
                    <button class="btn-sm">+1</button>
                    <button class="btn-sm" style="background:#dc2626;color:#fff;">S+2</button>
                    <button class="btn-sm" style="background:#dc2626;color:#fff;">S+2</button>
                    <span>|</span>
                    <span>⚖️</span>
                    <button class="btn-sm gold">Hold</button>
                    <button class="btn-sm gold">Hold</button>
                    <button class="btn-sm">FS</button>
                    <button class="btn-sm">FS</button>
                    <button class="btn-sm red">PI</button>
                    <button class="btn-sm red">PI</button>
                </div>
            </div>
        `;

        // Team Cards
        ['away', 'home'].forEach(side => {
            const team = getTeamBySide(side);
            const filter = side === 'away' ? state.awayFilter : state.homeFilter;
            const color = team ? team.color : '#1e3a5f';
            const coach = team ? team.coach : '';

            // Filter players
            let players = team ? [...team.players] : [];
            if (filter === 'offense') players = players.filter(p => ['QB','RB','WR','TE','OL','G','T','C'].includes(p.pos));
            else if (filter === 'defense') players = players.filter(p => ['DE','DT','LB','CB','S','DB'].includes(p.pos));
            else if (filter === 'special') players = players.filter(p => ['K','P','LS','KR','PR'].includes(p.pos));

            html += `
                <div class="team-card">
                    <div class="card-head" style="background:${color};">
                        <span class="label">${side.toUpperCase()}</span>
                        <select onchange="switchTeam('${side}', this.value)">
                            ${teams.map(t => `<option value="${t.id}" ${t.id === (side==='away'?state.awayId:state.homeId) ? 'selected' : ''}>${t.name}</option>`).join('')}
                        </select>
                        <input class="coach" value="${coach}" placeholder="Coach" style="width:80px;">
                        <button class="poss-btn">🏈</button>
                    </div>
                    <div class="unit-tabs">
                        ${['all','offense','defense','special'].map(f => `<button class="unit-tab ${filter===f?'active':''}" onclick="setFilter('${side}','${f}')">${f.toUpperCase()}</button>`).join('')}
                    </div>
                    <div class="search-bar"><input placeholder="🔍 #"></div>
                    <div class="player-list">
                        ${players.length ? players.map(p => `
                            <div class="player-row">
                                <span class="num">${p.num}</span>
                                <span class="name">${p.name}</span>
                                <span class="pron">${p.pron}</span>
                                <span class="pos">${p.pos}</span>
                                <span>⭐</span>
                            </div>
                        `).join('') : '<div style="padding:6px;text-align:center;opacity:.4;">No players</div>'}
                    </div>
                    <div class="add-row">
                        <input placeholder="#" style="width:24px;">
                        <input placeholder="Name" style="flex:1;">
                        <select>${posOpts.map(o => `<option>${o}</option>`).join('')}</select>
                        <button>+</button>
                    </div>
                </div>
            `;
        });

        grid.innerHTML = html;
    }

    function switchTeam(side, tid) {
        if (side === 'away') state.awayId = tid;
        else state.homeId = tid;
        renderGame();
    }
    function setFilter(side, filter) {
        if (side === 'away') state.awayFilter = filter;
        else state.homeFilter = filter;
        renderGame();
    }

    // ─── INIT ─────────────────────────────────────────────────────
    renderGame();

    // Clock
    function updateWallClock() {
        const n = new Date();
        document.getElementById('wallClock').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
    setInterval(updateWallClock, 10000);
    updateWallClock();
</script>
</body>
</html>
