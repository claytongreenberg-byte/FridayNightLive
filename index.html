    function printGameLog(idx) {
        const game = S.gameHistory[idx];
        if (!game) return;
        let html = `<html><head><title>Game Log</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px}</style></head><body>`;
        html += `<h2>${game.away} vs ${game.home}</h2><p>Final Score: ${game.awayScore} - ${game.homeScore}</p>`;
        if (game.sessionId) html += `<p style="opacity:0.5;font-size:0.8rem;">Session ID: ${game.sessionId}</p>`;
        html += '<table><tr><th>Time</th><th>Team</th><th>Event</th><th>Details</th></tr>';
        game.log.forEach(ev => {
            const timeStr = ev.time !== undefined ? `${Math.floor(ev.time/60)}:${String(ev.time%60).padStart(2,'0')}` : '--:--';
            html += `<tr><td>${timeStr}</td><td>${ev.team === 'home' ? 'Home' : ev.team === 'away' ? 'Away' : ''}</td><td>${ev.type.toUpperCase()}</td><td>${ev.player || ''}</td></tr>`;

    function uploadScriptFile(input) {
        const f = input.files[0];
        if (!f) return;
        if (f.name.endsWith('.docx')) { toast('⚠️ .docx not supported. Use .txt or .md'); return; }
        const r = new FileReader();
        r.onload = ev => { const ed = document.getElementById('scriptEditor'); if (ed) ed.innerText = ev.target.result;

        r.readAsText(f);

    // ---- CLOUD SYNC ----
    async function fnlCloudSaveAll() {
        try {
            const snap = JSON.parse(JSON.stringify(S));
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(snap) });
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            toast('✅ All data saved to cloud');
            updateSaveStatus(true);
        } catch (e) {
            toast('❌ Cloud save failed: ' + e.message);
            updateSaveStatus(false);
            console.error('Save error:', e);
        }
    }

    async function fnlCloudLoadGameState() {
        if (!confirm('Load game state from cloud?')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.as !== undefined) S.as = data.as;
            if (data.hs !== undefined) S.hs = data.hs;
            if (data.q !== undefined) S.q = data.q;
            if (data.down !== undefined) S.down = data.down;
            if (data.dist !== undefined) S.dist = data.dist;
            if (data.poss !== undefined) S.poss = data.poss;
            if (data.gameState !== undefined) S.gameState = data.gameState;
            if (data.gc) { if (data.gc.rem !== undefined) S.gc.rem = data.gc.rem; if (data.gc.max !== undefined) S.gc.max = data.gc.max;
                S.gc.run = false; }
            if (data.timeouts) { if (data.timeouts.away !== undefined) S.timeouts.away = data.timeouts.away; if (data.timeouts.home !== undefined) S.timeouts.home = data.timeouts.home; }
            if (data.sessionId) S.sessionId = data.sessionId;
            saveState();
            renderAll();
            toast('✅ Game state loaded (clock paused)');
        } catch (e) {
            toast('❌ Load game state failed: ' + e.message);
            console.error('Load error:', e);
        }
    }

    async function fnlCloudLoadRostersOnly() {
        if (!confirm('Load rosters from cloud? (merges)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.teams) {
                data.teams.forEach(cloudTeam => {
                    const existing = S.teams.find(t => t.id === cloudTeam.id);
                    if (existing) {
                        existing.name = cloudTeam.name || existing.name;
                        existing.abbr = cloudTeam.abbr || existing.abbr;
                        existing.color = cloudTeam.color || existing.color;
                        existing.logo = cloudTeam.logo || existing.logo;
                        existing.mascot = cloudTeam.mascot || existing.mascot;
                        existing.coach = cloudTeam.coach || existing.coach;
                        if (cloudTeam.players) {
                            cloudTeam.players.forEach(player => {
                                const existingPlayer = existing.players.find(p => p.id === player.id);
                                if (existingPlayer) {
                                    existingPlayer.n = player.n || existingPlayer.n;
                                    existingPlayer.na = player.na || existingPlayer.na;
                                    existingPlayer.po = player.po || existingPlayer.po;
                                    existingPlayer.st = player.st !== undefined ? player.st : existingPlayer.st;
                                    existingPlayer.nt = player.nt || existingPlayer.nt;
                                    existingPlayer.pron = player.pron || existingPlayer.pron;
                                } else {
                                    existing.players.push({ ...player });
                                }
                            });
                        }
                    } else {
                        S.teams.push({ ...cloudTeam, players: cloudTeam.players ? cloudTeam.players.map(p => ({ ...p })) : [] });
                    }
                });
            }
            if (data.awayId && S.teams.find(t => t.id === data.awayId)) S.awayId = data.awayId;
            if (data.homeId && S.teams.find(t => t.id === data.homeId)) S.homeId = data.homeId;
            if (data.colors) {
                S.colors.scorebugBg = data.colors.scorebugBg || S.colors.scorebugBg;
                S.colors.scorebugText = data.colors.scorebugText || S.colors.scorebugText;
                S.colors.accent = data.colors.accent || S.colors.accent;
                S.colors.teamCardAway = data.colors.teamCardAway || S.colors.teamCardAway;
                S.colors.teamCardHome = data.colors.teamCardHome || S.colors.teamCardHome;
                S.colors.teamCardBorder = data.colors.teamCardBorder || S.colors.teamCardBorder;
            }
            normalizeState();
            saveState();
            renderAll();
            toast('✅ Rosters loaded (merged)');
        } catch (e) {
            toast('❌ Load rosters failed: ' + e.message);
            console.error('Load rosters error:', e);
        }
    }

    async function fnlCloudLoadLogsOnly() {
        if (!confirm('Load logs from cloud? (appends)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.scoringLog && Array.isArray(data.scoringLog)) {
                data.scoringLog.forEach(log => {
                    const exists = S.scoringLog.some(l => l.id === log.id);
                    if (!exists) S.scoringLog.push(log);
                });
            }
            if (data.penaltyLog && Array.isArray(data.penaltyLog)) {
                data.penaltyLog.forEach(log => {
                    const exists = S.penaltyLog.some(l => l.id === log.id);
                    if (!exists) S.penaltyLog.push(log);
                });
            }
            if (data.gameHistory && Array.isArray(data.gameHistory)) {
                data.gameHistory.forEach(cloudGame => {
                    const exists = S.gameHistory.some(localGame =>
                        localGame.date === cloudGame.date ||
                        (localGame.sessionId && localGame.sessionId === cloudGame.sessionId)
                    );
                    if (!exists) S.gameHistory.push(cloudGame);
                });
            }
            saveState();
            renderAll();
            toast('✅ Logs loaded (appended)');
        } catch (e) {
            toast('❌ Load logs failed: ' + e.message);
            console.error('Load logs error:', e);
        }
    }

    async function fnlCloudLoadScriptOnly() {
        if (!confirm('Load script from cloud? (replaces)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.script !== undefined) { S.script = data.script;
                saveState();
                renderAll();
                toast('✅ Script loaded'); } else { toast('ℹ️ No script found'); }
        } catch (e) {
            toast('❌ Load script failed: ' + e.message);
            console.error('Load script error:', e);
        }
    }

    async function fnlCloudLoadSettingsOnly() {
        if (!confirm('Load settings from cloud? (merges)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.colors) {
                S.colors.scorebugBg = data.colors.scorebugBg || S.colors.scorebugBg;
                S.colors.scorebugText = data.colors.scorebugText || S.colors.scorebugText;
                S.colors.accent = data.colors.accent || S.colors.accent;
                S.colors.teamCardAway = data.colors.teamCardAway || S.colors.teamCardAway;
                S.colors.teamCardHome = data.colors.teamCardHome || S.colors.teamCardHome;
                S.colors.teamCardBorder = data.colors.teamCardBorder || S.colors.teamCardBorder;
            }
            if (data.cf !== undefined) S.cf = data.cf;
            if (data.cs !== undefined) S.cs = data.cs;
            if (data.md7 !== undefined) S.md7 = data.md7;
            if (data.gc && data.gc.max !== undefined) S.gc.max = data.gc.max;
            if (data.timeoutConfig) {
                if (data.timeoutConfig.tackle) {
                    S.timeoutConfig.tackle.perHalf = data.timeoutConfig.tackle.perHalf || S.timeoutConfig.tackle.perHalf;
                    S.timeoutConfig.tackle.overtimePerPeriod = data.timeoutConfig.tackle.overtimePerPeriod || S.timeoutConfig.tackle.overtimePerPeriod;
                }
                if (data.timeoutConfig.sevens) {
                    S.timeoutConfig.sevens.perHalf = data.timeoutConfig.sevens.perHalf || S.timeoutConfig.sevens.perHalf;
                    S.timeoutConfig.sevens.overtimePerPeriod = data.timeoutConfig.sevens.overtimePerPeriod || S.timeoutConfig.sevens.overtimePerPeriod;
                }
            }
            saveState();
            renderAll();
            applyColors();
            toast('✅ Settings loaded (merged)');
        } catch (e) {
            toast('❌ Load settings failed: ' + e.message);
            console.error('Load settings error:', e);
        }
    }

    async function fnlCloudLoadClientsOnly() {
        if (!confirm('Load clients from cloud? (merges)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.cp) {
                Object.keys(data.cp).forEach(pin => {
                    if (!S.cp[pin]) { S.cp[pin] = data.cp[pin]; }
                });
            }
            saveState();
            renderAll();
            toast('✅ Clients loaded (merged)');
        } catch (e) {
            toast('❌ Load clients failed: ' + e.message);
            console.error('Load clients error:', e);
        }
    }

    // ---- Print lineups ----
    function printLU() {
        let html = '<html><head><title>Starting Lineups</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{border:1px solid #000;padding:4px}</style></head><body>';
        ['away', 'home'].forEach(side => {
            const t = getTeam(side);
            html += `<h2>${side === 'away' ? 'Away' : 'Home'}: ${t.name}</h2><table><tr><th>#</th><th>Name</th><th>Pos</th></tr>`;
            t.players.filter(p => p.st).forEach(p => { html += `<tr><td>${p.n}</td><td>${p.na}</td><td>${p.po}</td></tr>`; });
            html += '</table>';
        });
        html += '</body></html>';
        safePrint(html);
    }
