<script>

// ---- FIXED: parseRosterText with starter marking ----
function parseRosterText(teamId) {
    const tx = document.getElementById('parseArea').value.trim();
    const team = S.teams.find(t => t.id === teamId);
    if (!team) return;
    if (!tx) return toast('⚠️ Empty input');

    // Position mapping for non-standard positions
    const positionMap = {
        'Quick H': 'WR',
        'Quick': 'WR',
        'Big H': 'TE',
        'Q': 'QB',
        'TB': 'RB',
        'Y': 'TE',
        'Z': 'WR'
    };

    // DEFINITIVE STARTERS from depth chart - EXACT NAMES
    const starters = [
        'Cameron Hayes',
        'Cameron Howell',
        'Josh Dimsdale',
        'Viliami Finau',
        'Fili Mose',
        'Kava Afungia',
        'Brendon Cary',
        'Graven Mohetau',
        'Jonathan Simkins',
        'Mack Lineweaver',
        'Marcus Turner',
        'Abel Ditu'
    ];

    const lines = tx.split('\n');
    const out = [];
    const seenPlayers = new Set();
    
    lines.forEach(l => {
        if (!l.trim()) return;
        
        // Try tab first, then spaces
        let parts = l.split('\t').map(s => s.trim());
        
        // If not enough parts, try regex
        if (parts.length < 2) {
            let match = l.match(/^#?\s*(\d+)\s+(.+?)\s+([A-Za-z/ ]+)$/);
            if (match) {
                parts = [match[1], match[2], match[3]];
            } else {
                match = l.match(/^(.+?)\s+([A-Za-z/ ]+)$/);
                if (match) {
                    parts = ['', match[1], match[2]];
                } else {
                    parts = ['', l.trim(), ''];
                }
            }
        }
        
        const number = parts[0] || '';
        const name = parts[1] || 'Unknown Player';
        let positionStr = parts[2] || '';
        
        // Clean up position
        positionStr = positionStr.replace(/[^A-Za-z/ ]/g, '').trim();
        
        // Map non-standard positions
        let mappedPosition = positionMap[positionStr] || positionStr;
        
        // Check if this player is a starter (exact name match)
        const isStarter = starters.some(s => 
            name.toLowerCase().includes(s.toLowerCase()) || 
            s.toLowerCase().includes(name.toLowerCase())
        );
        
        const categories = getPositionCategories(mappedPosition);
        const primaryPos = mappedPosition.split('/')[0].trim() || 'QB';
        
        const key = (number + name).toLowerCase();
        if (seenPlayers.has(key)) return;
        seenPlayers.add(key);
        
        out.push({
            id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7),
            n: number,
            na: name,
            po: primaryPos,
            posFull: mappedPosition || positionStr,
            st: isStarter,
            nt: '',
            pron: '',
            ph: '',
            pinned: false,
            categories: categories
        });
    });
    
    // Sort by number
    out.sort((a, b) => {
        const numA = parseInt(a.n) || 999;
        const numB = parseInt(b.n) || 999;
        return numA - numB;
    });
    
    if (out.length) {
        team.players = out;
        saveState();
        renderRoster();
        toast(`✅ ${out.length} players parsed - ${out.filter(p => p.st).length} starters marked`);
    } else {
        toast('❌ No players found');
    }
}

// ---- FIXED: renderRoster with STARTER column ----
function renderRoster() {
    const sortedTeams = [...S.teams].sort((a, b) => a.name.localeCompare(b.name));
    let selectedTeam = S.teams.find(t => t.id === S.cid) || S.teams[0];
    if (!selectedTeam) { 
        S.teams.push({ id: 't' + Date.now(), name: 'New Team', abbr: '', color: '#1e3a5f', textColor: '#ffffff', logo: '', mascot: '', coach: '', players: [] });
        normalizeState();
        saveState();
        return renderRoster(); 
    }
    S.cid = selectedTeam.id;
    let html = '<div class="roster-layout">';
    html += '<div class="team-sidebar">';
    html += '<div class="panel-header" style="flex-direction:column;align-items:stretch;gap:4px;">';
    html += '<h4 style="margin-bottom:4px;font-size:0.8rem;">TEAMS</h4>';
    html += `<button class="hdr-btn" onclick="fnlCloudLoadRostersOnly()" data-tooltip="Load rosters from cloud (merges)">📥 LOAD ROSTERS</button>`;
    html += '</div>';
    sortedTeams.forEach(t => {
        const badge = (t.id === S.awayId ? ' ✈️' : '') + (t.id === S.homeId ? ' 🏠' : '');
        html += `<div class="team-item ${t.id === S.cid ? 'active' : ''}" onclick="selectTeam('${t.id}')" data-tooltip="${t.players.length} players">${t.name} (${t.players.length})${badge}</div>`;
    });
    html += '<button class="hdr-btn" style="margin-top:8px;width:100%;" onclick="newTeam()" data-tooltip="Create team">➕ New Team</button>';
    html += '<div style="margin-top:8px;font-size:0.5rem;opacity:0.6;text-align:center;">Teams sync via cloud — Save All then Load Rosters</div>';
    html += '</div>';
    html += '<div class="roster-workspace">';
    html += `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">`;
    html += `<input id="etn" value="${selectedTeam.name}" placeholder="Team Name" style="flex:1;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.7rem;">`;
    html += `<input id="eta" value="${selectedTeam.abbr || ''}" placeholder="ABBR" maxlength="4" style="width:55px;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);text-transform:uppercase;font-size:0.7rem;">`;
    html += `<input type="color" id="etc" value="${selectedTeam.color}" style="width:35px;height:28px;" onchange="syncTextColor()">`;
    html += `<input type="color" id="ettc" value="${selectedTeam.textColor || '#ffffff'}" style="width:35px;height:28px;" data-tooltip="Text color">`;
    html += `<label style="font-size:0.55rem;display:flex;align-items:center;gap:3px;cursor:pointer;">`;
    html += `<input type="checkbox" id="syncColors" ${selectedTeam.textColor === selectedTeam.color ? 'checked' : ''} onchange="toggleSyncColors()"> Sync Text Color`;
    html += `</label>`;
    html += `<input id="etm" value="${selectedTeam.mascot || ''}" placeholder="Mascot" style="width:80px;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.7rem;">`;
    html += `<input id="etco" value="${selectedTeam.coach || ''}" placeholder="Coach" style="width:80px;padding:5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.7rem;">`;
    html += `<img id="etl" src="${selectedTeam.logo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;${selectedTeam.logo ? '' : 'display:none'}">`;
    html += `<input type="file" id="etlf" accept="image/*" style="display:none;" onchange="previewTeamLogo(this)">`;
    html += `<button class="hdr-btn" onclick="document.getElementById('etlf').click()" data-tooltip="Upload logo">📷</button>`;
    html += `<button class="hdr-btn" onclick="saveTeam()" data-tooltip="Save team">💾 Save</button>`;
    html += `<button class="hdr-btn" onclick="printRoster('${selectedTeam.id}')" data-tooltip="Print">🖨️</button>`;
    html += `<button class="hdr-btn" onclick="exportTeamCSV('${selectedTeam.id}')" data-tooltip="CSV">📊</button>`;
    html += `<button class="hdr-btn" style="background:#dc2626;" onclick="deleteTeamById('${selectedTeam.id}')" data-tooltip="Delete">🗑️</button>`;
    html += `<button class="hdr-btn" style="background:#8b5cf6;" onclick="recategorizeTeam('${selectedTeam.id}')" data-tooltip="Recategorize all players">🔄 Recat</button>`;
    html += '</div>';
    html += `<div style="display:flex;gap:4px;margin-bottom:8px;">`;
    html += `<button class="hdr-btn ${selectedTeam.id === S.awayId ? 'active' : ''}" onclick="setSideTeam('away','${selectedTeam.id}')" data-tooltip="Set as away">✈️ Away</button>`;
    html += `<button class="hdr-btn ${selectedTeam.id === S.homeId ? 'active' : ''}" onclick="setSideTeam('home','${selectedTeam.id}')" data-tooltip="Set as home">🏠 Home</button>`;
    html += '</div>';
    
    html += `<div class="cat-legend">
        <span class="legend-item"><span class="cat-badge offense">O</span> Offense</span>
        <span class="legend-item"><span class="cat-badge defense">D</span> Defense</span>
        <span class="legend-item"><span class="cat-badge special">ST</span> Special Teams</span>
        <span class="legend-item"><span class="cat-badge both">O/D</span> Both</span>
        <span class="legend-item"><span class="cat-badge other">?</span> Unknown</span>
    </div>`;
    
    // STARTER COLUMN HEADER - FIXED
    html += '<div style="display:grid;grid-template-columns:32px 1fr 70px 50px 70px 70px 26px;gap:3px;font-size:0.5rem;font-weight:700;margin-bottom:3px;opacity:0.6;">';
    html += '<span>#</span><span>Name</span><span>Pos</span><span>⭐</span><span>Notes</span><span>Pron</span><span></span>';
    html += '</div>';
    
    const allPosOptions = getAllPositionOptionsWithLabels();
    
    selectedTeam.players.forEach((p, pidx) => {
        const cats = p.categories || ['all'];
        const catLabel = getCategoryLabel(cats);
        const badgeText = catLabel.replace(/\[|\]/g, '');
        const catClass = getCategoryClass(cats);
        const tooltipText = getCategoryTooltip(cats);
        
        html += `<div style="display:grid;grid-template-columns:32px 1fr 70px 50px 70px 70px 26px;gap:3px;margin-bottom:2px;align-items:center;${p.st ? 'border-left:3px solid #facc15;padding-left:2px;' : ''}">`;
        html += `<input value="${p.n}" onchange="updatePlayerField('${selectedTeam.id}',${pidx},'n',this.value)" style="padding:3px;border-radius:3px;border:1px solid var(--border);background:transparent;color:#0a0a0a;font-weight:700;font-size:0.6rem;">`;
        html += `<input value="${p.na}" onchange="updatePlayerField('${selectedTeam.id}',${pidx},'na',this.value)" style="padding:3px;border-radius:3px;border:1px solid var(--border);background:transparent;color:#0a0a0a;font-weight:700;font-size:0.6rem;">`;
        html += `<select onchange="updatePlayerField('${selectedTeam.id}',${pidx},'posFull',this.value)" style="padding:3px;border-radius:3px;border:1px solid var(--border);background:transparent;color:#0a0a0a;font-weight:700;font-size:0.6rem;">`;
        allPosOptions.forEach(o => {
            const selected = (p.posFull || p.po) === o.value ? 'selected' : '';
            html += `<option ${selected} value="${o.value}">${o.display}</option>`;
        });
        html += `</select>`;
        // STARTER TOGGLE BUTTON - FIXED
        html += `<button class="st-toggle ${p.st ? 'active' : ''}" onclick="toggleRosterStarter('${selectedTeam.id}',${pidx})" data-tooltip="Starter" style="background:none;border:2px solid ${p.st ? '#facc15' : 'var(--border)'};border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:0.7rem;display:flex;align-items:center;justify-content:center;">⭐</button>`;
        html += `<input value="${p.nt || ''}" onchange="updatePlayerField('${selectedTeam.id}',${pidx},'nt',this.value)" placeholder="Notes" style="padding:3px;border-radius:3px;border:1px solid var(--border);background:transparent;color:#0a0a0a;font-weight:700;font-size:0.6rem;">`;
        html += `<input value="${p.pron || ''}" onchange="updatePlayerField('${selectedTeam.id}',${pidx},'pron',this.value)" placeholder="Pron" style="padding:3px;border-radius:3px;border:1px solid var(--border);background:transparent;color:#0a0a0a;font-weight:700;font-size:0.6rem;">`;
        html += `<div><span class="cat-badge ${catClass}" data-tooltip="${tooltipText}" style="font-size:0.5rem;padding:1px 5px;">${badgeText}</span></div>`;
        html += `<button class="sb-btn" style="width:20px;height:20px;font-size:9px;" onclick="S.teams.find(t=>t.id==='${selectedTeam.id}').players.splice(${pidx},1);saveState();renderRoster();" data-tooltip="Delete">✕</button>`;
        html += '</div>';
    });
    html += `<button class="hdr-btn" onclick="addPlayerToTeam('${selectedTeam.id}')" data-tooltip="Add player">➕ Add Player</button>`;
    html += '<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;">';
    html += `<textarea id="parseArea" placeholder="Paste roster (Number\tName\tPosition(s))" style="flex:2;min-width:150px;height:40px;padding:4px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:0.6rem;"></textarea>`;
    html += `<button class="hdr-btn" onclick="parseRosterText('${selectedTeam.id}')" data-tooltip="Parse with smart categorization">📝 Parse</button>`;
    html += `<input type="file" accept=".txt,.csv" onchange="uploadRosterFile('${selectedTeam.id}',this)" data-tooltip="Upload file" style="font-size:0.6rem;">`;
    html += '</div>';
    html += `<div class="parser-help">
        <details>
            <summary>📝 How to format roster data</summary>
            <p>Use one player per line. Separate fields with Tab or space.</p>
            <pre>52    Cameron Hayes    LT
77    Ricoh Sanchez    LT
68    Cameron Howell    LG</pre>
            <p>Use "/" for multiple positions: <code>WR/CB</code> or <code>TE/DE</code></p>
        </details>
    </div>`;
    html += '</div>';
    html += '</div>';
    document.getElementById('main').innerHTML = html;
}

// ---- FIXED: toggleRosterStarter (for ROSTER view) ----
function toggleRosterStarter(teamId, pidx) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team || !team.players[pidx]) return;
    team.players[pidx].st = !team.players[pidx].st;
    saveState();
    renderRoster();
    toast(team.players[pidx].st ? '⭐ Starter' : 'Bench');
}

// ---- FIXED: toggleStarterOnly (for GAME view) ----
function toggleStarterOnly(side, pid) {
    const team = getTeam(side);
    if (!team) return;
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    p.st = !p.st;
    saveState();
    renderGame();
    toast(p.st ? `⭐ ${p.na} is now a starter` : `📋 ${p.na} is now on bench`);
}

// ---- FIXED: togglePinOnly ----
function togglePinOnly(side, pid) {
    const team = getTeam(side);
    if (!team) return;
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    p.pinned = !p.pinned;
    saveState();
    renderGame();
    toast(p.pinned ? `📌 ${p.na} pinned` : `📌 ${p.na} unpinned`);
}

// ---- FIXED: deletePlayerOnly ----
function deletePlayerOnly(side, pid) {
    const team = getTeam(side);
    if (!team) return;
    const p = team.players.find(x => x.id === pid);
    if (!p) return;
    if (!confirm(`Delete ${p.na} (#${p.n})?`)) return;
    team.players = team.players.filter(x => x.id !== pid);
    saveState();
    renderGame();
    toast(`🗑️ ${p.na} deleted`);
}

// ---- FIXED: updatePlayerField ----
function updatePlayerField(teamId, pidx, field, val) {
    const team = S.teams.find(t => t.id === teamId);
    if (!team || !team.players[pidx]) return;
    const p = team.players[pidx];
    p[field] = val;
    if (field === 'posFull') {
        p.po = val.split('/')[0].trim() || val;
        p.categories = getPositionCategories(val);
    }
    saveState();
    // Re-render both views to keep them in sync
    if (S.v === 'game' || S.v === 'sport') renderGame();
    else renderRoster();
}

</script>
