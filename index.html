    function updateGamePlayerFieldOnly(side, pid, field, val) {
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid);
        if (!p) return;
        p[field] = val;
        saveState();
        renderGame();
    }

    function updateGamePlayerPositionOnly(side, pid, val) {
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid);
        if (!p) return;
        
        p.posFull = val;
        const primaryPos = val.split('/')[0].trim() || val;
        p.po = primaryPos;
        p.categories = getPositionCategories(val);
        
        saveState();
        renderGame();
        toast(`✅ ${p.na} set to ${val}`);
    }

    function quickAddPositionOnly(side, pid) {
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid);
        if (!p) return;
        
        const newPos = prompt('Enter position to add (e.g., CB, DE, SS):', '');
        if (!newPos) return;
        
        const cleanPos = normalizePosition(newPos.trim());
        if (!cleanPos) return;
        
        const currentPos = p.posFull || p.po || '';
        let newPosFull = currentPos;
        
        const parts = currentPos.split('/').map(s => s.trim());
        const normParts = parts.map(s => normalizePosition(s));
        if (normParts.includes(cleanPos)) {
            const newParts = parts.filter((s, i) => normParts[i] !== cleanPos);
            newPosFull = newParts.join('/');
            toast(`❌ Removed ${cleanPos} from ${p.na}`);
        } else {
            if (currentPos) {
                newPosFull = currentPos + '/' + cleanPos;
            } else {
                newPosFull = cleanPos;
            }
            toast(`✅ Added ${cleanPos} to ${p.na}`);
        }
        
        p.posFull = newPosFull;
        p.po = newPosFull.split('/')[0].trim() || newPosFull;
        p.categories = getPositionCategories(newPosFull);
        
        saveState();
        renderGame();
    }

    function toggleStarterOnly(side, pid) { 
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid); 
        if (p) { 
            p.st = !p.st;
            saveState();
            renderGame(); 
        }
    }

    function togglePinOnly(side, pid) { 
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid); 
        if (p) { 
            p.pinned = !p.pinned;
            saveState();
            renderGame(); 
        }
    }

    function deletePlayerOnly(side, pid) { 
        const team = getTeam(side);
        const p = team.players.find(x => x.id === pid);
        if (!p) return;
        if (!confirm(`Delete ${p.na} (#${p.n})?`)) return;
        team.players = team.players.filter(x => x.id !== pid);
        saveState();
        renderGame();
        toast(`🗑️ ${p.na} deleted`);
    }

    function setFilter(side, f) { 
        if (side === 'away') S.ua = f;
        else S.uh = f;
        renderGame(); 
    }

    function setSideTeam(side, teamId) {
        if (S.awayId === teamId && S.homeId === teamId) {
            toast('⚠️ Teams must be different');
            return;
        }
        
        const otherSide = side === 'away' ? 'home' : 'away';
        const otherId = otherSide === 'away' ? S.awayId : S.homeId;
        
        if (teamId === otherId) {
            if (side === 'away') { 
                const oldAway = S.awayId;
                S.awayId = teamId;
                S.homeId = oldAway;
            } else { 
                const oldHome = S.homeId;
                S.homeId = teamId;
                S.awayId = oldHome;
            }
            toast('🔄 Teams swapped');
        } else {
            if (side === 'away') S.awayId = teamId;
            else S.homeId = teamId;
        }
        
        if (S.awayId === S.homeId) {
            const otherTeam = S.teams.find(t => t.id !== S.awayId);
            if (otherTeam) {
                if (side === 'away') S.homeId = otherTeam.id;
                else S.awayId = otherTeam.id;
                toast('⚠️ Fixed duplicate teams');
            }
        }
        
        saveState();
        renderGame();
        updateScorebug();
    }

    // ---- SMART PARSER ----
    function parseRosterText(teamId) {
        const tx = document.getElementById('parseArea').value.trim();
        const team = S.teams.find(t => t.id === teamId);
        if (!team) return;
        if (!tx) return toast('⚠️ Empty input');

        const lines = tx.split('\n');
        const out = [];
        const positionMap = {};
        
        lines.forEach(l => {
            if (!l.trim()) return;
            
            let parts = l.split('\t').map(s => s.trim());
            if (parts.length < 3) {
                const match = l.match(/^(\d+)\s+(.+?)\s+([A-Z/]+)$/);
                if (match) {
                    parts = [match[1], match[2], match[3]];
                } else {
                    const match2 = l.match(/^(\d+)\s+(.+)$/);
                    if (match2) {
                        parts = [match2[1], match2[2], ''];
                    } else {
                        const match3 = l.match(/^(.+?)\s+([A-Z/]+)$/);
                        if (match3) {
                            parts = ['', match3[1], match3[2]];
                        }
                    }
                }
            }
            
            const number = parts[0] || '';
            const name = parts[1] || 'Unknown Player';
            let positionStr = parts[2] || '';
            
            const categories = getPositionCategories(positionStr);
            const primaryPos = positionStr.split('/')[0].trim() || 'QB';
            
            const key = (number + name).toLowerCase();
            if (positionMap[key]) return;
            positionMap[key] = true;
            
            out.push({
                id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7),
                n: number,
                na: name,
                po: primaryPos,
                posFull: positionStr,
                st: false,
                nt: '',
                pron: '',
                ph: '',
                pinned: false,
                categories: categories
            });
        });
        
        out.sort((a, b) => {
            const numA = parseInt(a.n) || 999;
            const numB = parseInt(b.n) || 999;
            return numA - numB;
        });
        
        if (out.length) {
            team.players = out;
            saveState();
            renderRoster();
            toast(`✅ ${out.length} players parsed with smart categorization`);
        } else {
            toast('❌ No players found');
        }
    }

  async function fnlCloudSaveAll() {

        updateSyncStatus('saving');

            method: 'PUT',

}

    async function fnlCloudLoadGameState() {
        if (!confirm('Load game state from cloud?')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.as !== undefined) S.as = data.as;
            if (data.hs !== undefined) S.hs = data.hs;
            if (data.q !== undefined) S.q = data.q;
            if (data.down !== undefined) S.down = data.down;
            if (data.dist !== undefined) S.dist = data.dist;
            if (data.poss !== undefined) S.poss = data.poss;
            if (data.gameState !== undefined) S.gameState = data.gameState;
            if (data.gc) { if (data.gc.rem !== undefined) S.gc.rem = data.gc.rem; if (data.gc.max !== undefined) S.gc.max = data.gc.max;
                S.gc.run = false; }
            if (data.timeouts) { if (data.timeouts.away !== undefined) S.timeouts.away = data.timeouts.away; if (data.timeouts.home !== undefined) S.timeouts.home = data.timeouts.home; }
            if (data.sessionId) S.sessionId = data.sessionId;
            saveState();
            renderAll();
            toast('✅ Game state loaded (clock paused)');
        } catch (e) {
            toast('❌ Load game state failed: ' + e.message);
            console.error('Load error:', e);
        }
    }

    async function fnlCloudLoadRostersOnly() {
        if (!confirm('Load rosters from cloud? (merges)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.teams) {
                data.teams.forEach(cloudTeam => {
                    const existing = S.teams.find(t => t.id === cloudTeam.id);
                    if (existing) {
                        existing.name = cloudTeam.name || existing.name;
                        existing.abbr = cloudTeam.abbr || existing.abbr;
                        existing.color = cloudTeam.color || existing.color;
                        existing.textColor = cloudTeam.textColor || existing.textColor || '#ffffff';
                        existing.logo = cloudTeam.logo || existing.logo;
                        existing.mascot = cloudTeam.mascot || existing.mascot;
                        existing.coach = cloudTeam.coach || existing.coach;
                        if (cloudTeam.players) {
                            cloudTeam.players.forEach(player => {
                                const existingPlayer = existing.players.find(p => p.id === player.id);
                                if (existingPlayer) {
                                    existingPlayer.n = player.n || existingPlayer.n;
                                    existingPlayer.na = player.na || existingPlayer.na;
                                    existingPlayer.po = player.po || existingPlayer.po;
                                    existingPlayer.st = player.st !== undefined ? player.st : existingPlayer.st;
                                    existingPlayer.nt = player.nt || existingPlayer.nt;
                                    existingPlayer.pron = player.pron || existingPlayer.pron;
                                    existingPlayer.posFull = player.posFull || player.po || existingPlayer.posFull;
                                    if (player.categories) existingPlayer.categories = player.categories;
                                    else if (player.posFull || player.po) existingPlayer.categories = getPositionCategories(player.posFull || player.po);
                                } else {
                                    const newPlayer = { ...player };
                                    if (!newPlayer.categories && (newPlayer.posFull || newPlayer.po)) {
                                        newPlayer.categories = getPositionCategories(newPlayer.posFull || newPlayer.po);
                                    }
                                    if (!newPlayer.categories) newPlayer.categories = ['all'];
                                    existing.players.push(newPlayer);
                                }
                            });
                        }
                    } else {
                        const newTeam = { ...cloudTeam };
                        if (!newTeam.textColor) newTeam.textColor = '#ffffff';
                        newTeam.players = (cloudTeam.players || []).map(p => {
                            const player = { ...p };
                            if (!player.categories && (player.posFull || player.po)) {
                                player.categories = getPositionCategories(player.posFull || player.po);
                            }
                            if (!player.categories) player.categories = ['all'];
                            return player;
                        });
                        S.teams.push(newTeam);
                    }
                });
            }
            if (data.awayId && S.teams.find(t => t.id === data.awayId)) S.awayId = data.awayId;
            if (data.homeId && S.teams.find(t => t.id === data.homeId)) S.homeId = data.homeId;
            if (data.colors) {
                S.colors.scorebugBg = data.colors.scorebugBg || S.colors.scorebugBg;
                S.colors.scorebugText = data.colors.scorebugText || S.colors.scorebugText;
                S.colors.accent = data.colors.accent || S.colors.accent;
                S.colors.teamCardAway = data.colors.teamCardAway || S.colors.teamCardAway;
                S.colors.teamCardHome = data.colors.teamCardHome || S.colors.teamCardHome;
                S.colors.teamCardBorder = data.colors.teamCardBorder || S.colors.teamCardBorder;
            }
            normalizeState();
            saveState();
            renderAll();
            toast('✅ Rosters loaded (merged)');
        } catch (e) {
            toast('❌ Load rosters failed: ' + e.message);
            console.error('Load rosters error:', e);
        }
    }

    async function fnlCloudLoadLogsOnly() {
        if (!confirm('Load logs from cloud? (appends)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.scoringLog && Array.isArray(data.scoringLog)) {
                data.scoringLog.forEach(log => {
                    const exists = S.scoringLog.some(l => l.id === log.id);
                    if (!exists) S.scoringLog.push(log);
                });
            }
            if (data.penaltyLog && Array.isArray(data.penaltyLog)) {
                data.penaltyLog.forEach(log => {
                    const exists = S.penaltyLog.some(l => l.id === log.id);
                    if (!exists) S.penaltyLog.push(log);
                });
            }
            if (data.gameHistory && Array.isArray(data.gameHistory)) {
                data.gameHistory.forEach(cloudGame => {
                    const exists = S.gameHistory.some(localGame =>
                        localGame.date === cloudGame.date ||
                        (localGame.sessionId && localGame.sessionId === cloudGame.sessionId)
                    );
                    if (!exists) S.gameHistory.push(cloudGame);
                });
            }
            saveState();
            renderAll();
            toast('✅ Logs loaded (appended)');
        } catch (e) {
            toast('❌ Load logs failed: ' + e.message);
            console.error('Load logs error:', e);
        }
    }

            if (data.colors) {
                S.colors.scorebugBg = data.colors.scorebugBg || S.colors.scorebugBg;
                S.colors.scorebugText = data.colors.scorebugText || S.colors.scorebugText;
                S.colors.accent = data.colors.accent || S.colors.accent;
                S.colors.teamCardAway = data.colors.teamCardAway || S.colors.teamCardAway;
                S.colors.teamCardHome = data.colors.teamCardHome || S.colors.teamCardHome;
                S.colors.teamCardBorder = data.colors.teamCardBorder || S.colors.teamCardBorder;
            }
            if (data.cf !== undefined) S.cf = data.cf;
            if (data.cs !== undefined) S.cs = data.cs;
            if (data.md7 !== undefined) S.md7 = data.md7;
            if (data.gc && data.gc.max !== undefined) S.gc.max = data.gc.max;
            if (data.timeoutConfig) {
                if (data.timeoutConfig.tackle) {
                    S.timeoutConfig.tackle.perHalf = data.timeoutConfig.tackle.perHalf || S.timeoutConfig.tackle.perHalf;
                    S.timeoutConfig.tackle.overtimePerPeriod = data.timeoutConfig.tackle.overtimePerPeriod || S.timeoutConfig.tackle.overtimePerPeriod;
                }
                if (data.timeoutConfig.sevens) {
                    S.timeoutConfig.sevens.perHalf = data.timeoutConfig.sevens.perHalf || S.timeoutConfig.sevens.perHalf;
                    S.timeoutConfig.sevens.overtimePerPeriod = data.timeoutConfig.sevens.overtimePerPeriod || S.timeoutConfig.sevens.overtimePerPeriod;
                }
            }
            saveState();
            renderAll();
            applyColors();
            toast('✅ Settings loaded (merged)');
        } catch (e) {
            toast('❌ Load settings failed: ' + e.message);
            console.error('Load settings error:', e);
        }
    }

    async function fnlCloudLoadClientsOnly() {
        if (!confirm('Load clients from cloud? (merges)')) return;
        try {
            const resp = await fetch('https://lineup-api.claytongreenberg.workers.dev/api/sync/fnl_full_sync');
            if (!resp.ok) throw new Error(`Server responded with ${resp.status}`);
            const data = await resp.json();
            if (!data || typeof data !== 'object' || Object.keys(data).length === 0) throw new Error('No data');
            if (data.cp) {
                Object.keys(data.cp).forEach(pin => {
                    if (!S.cp[pin]) { S.cp[pin] = data.cp[pin]; }
                });
            }
            saveState();
            renderAll();
            toast('✅ Clients loaded (merged)');
        } catch (e) {
            toast('❌ Load clients failed: ' + e.message);
            console.error('Load clients error:', e);
        }
    }

    // ---- Print lineups ----
    function printLU() {
        let html = '<html><head><title>Starting Lineups</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{border:1px solid #000;padding:4px}</style></head><body>';
        ['away', 'home'].forEach(side => {
            const t = getTeam(side);
            html += `<h2>${side === 'away' ? 'Away' : 'Home'}: ${getTeamMascot(t)}</h2><table><tr><th>#</th><th>Name</th><th>Pos</th></tr>`;
            t.players.filter(p => p.st).forEach(p => { html += `<tr><td>${p.n}</td><td>${p.na}</td><td>${p.posFull || p.po}</td></tr>`; });
            html += '</table>';
        });
        html += '</body></html>';
        safePrint(html);
    }

function updateTeamColor(side, color) {
    const team = getTeam(side);

    team.color = color;
    saveState();
    updateScorebug();
    renderGame();
    toast(`✅ ${team.name} color updated`);
}
