<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Friday Night Live – Football PA Console</title>
    <style>
        /* ── RESET ── */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:#f0f2f5;color:#0a2540;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

        /* ── HEADER ── */
        header{background:#1a3a2a;padding:4px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;border-bottom:3px solid #d4af37;flex-shrink:0;min-height:42px;flex-wrap:wrap}
        .hdr-left{display:flex;align-items:center;gap:6px}
        .hdr-left a{color:#fff;font-size:10px;text-decoration:none;background:rgba(0,0,0,0.4);padding:2px 8px;border-radius:4px}
        .brand{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:6px}
        .brand h1{font-size:13px;color:#fff;font-weight:900}
        .brand span{font-size:8px;color:#d4af37;font-weight:700}
        .clock{font-size:12px;font-weight:700;color:#d4af37;background:rgba(0,0,0,0.4);padding:2px 10px;border-radius:6px;min-width:60px;text-align:center}
        .weather{font-size:10px;color:#fff;background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:12px;white-space:nowrap}
        .hdr-right{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
        .hdr-right button{background:rgba(255,255,255,0.12);border:none;color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;cursor:pointer;min-height:26px;min-width:26px}
        .hdr-right button:hover{background:rgba(255,255,255,0.25)}
        .hdr-right .gold{background:#e6a817!important;color:#000!important;font-weight:700}
        .hdr-right .red{background:#dc2626!important;color:#fff!important}

        /* ── NAV ── */
        nav{background:#1a1a2e;display:flex;padding:0 8px;gap:2px;flex-shrink:0;min-height:28px;overflow-x:auto}
        .nav-link{padding:4px 12px;font-size:10px;font-weight:600;background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
        .nav-link.active{color:#fff;border-bottom-color:#d4af37}

        /* ── SCOREBUG ── */
        #scorebug-wrap{flex-shrink:0;display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#0a0a1a,#1a1a2e);border-radius:6px;padding:2px 8px;margin:0 0 2px 0;border:2px solid #d4af37;min-height:38px}
        #scorebug-wrap.hidden{display:none}
        .sb-side{display:flex;align-items:center;gap:3px;flex:1;justify-content:center}
        .sb-name{font-size:10px;font-weight:900;text-transform:uppercase;min-width:36px;text-align:center;color:#fff}
        .sb-score{font-size:18px;font-weight:900;min-width:28px;text-align:center;color:#fbbf24}
        .sb-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .sb-btn.plus{background:rgba(34,197,94,0.2);border-color:rgba(34,197,94,0.3)}
        .sb-center{display:flex;align-items:center;gap:3px;padding:0 6px;border-left:1px solid rgba(255,215,0,0.12);border-right:1px solid rgba(255,215,0,0.12)}
        .sb-clock{font-family:'Courier New',monospace;font-size:14px;font-weight:900;color:#fbbf24;min-width:44px;text-align:center}
        .sb-cbtn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:3px;padding:0 5px;font-size:8px;cursor:pointer;height:20px}
        .sb-cbtn.red{background:rgba(220,38,38,0.25);border-color:rgba(220,38,38,0.3)}
        .sb-qtr{font-size:10px;font-weight:700;color:#d4af37;min-width:18px;text-align:center}
        #eyeToggle{background:rgba(0,0,0,0.4);border:1px solid #d4af37;color:#fff;border-radius:50%;width:26px;height:26px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:2px}
        #eyeToggle:hover{background:rgba(212,175,55,0.3)}

        /* ── MAIN ── */
        main{flex:1;overflow:hidden;padding:3px;display:flex;gap:3px}

        /* ── GAME GRID ── */
        .game-grid{display:flex;gap:4px;width:100%;height:100%;background:#cbd5e1;border-radius:6px;padding:3px;overflow:hidden}
        .team-card{flex:1;min-width:0;background:#fff;border-radius:6px;border:1px solid #cbd5e1;display:flex;flex-direction:column;overflow:hidden}

        /* ── CARD HEAD ── */
        .card-head{padding:2px 6px;display:flex;align-items:center;gap:4px;color:#fff;min-height:30px;flex-wrap:wrap;border-bottom:2px solid #d4af37}
        .card-head .side-label{font-size:9px;font-weight:700;text-transform:uppercase;opacity:0.8}

        /* ★★★ DROPDOWN VISIBILITY FIX ★★★ */
        .card-head select {
            flex: 1;
            min-width: 70px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.3);
            background: #ffffff !important;
            color: #000000 !important;
            font-weight: 700;
            font-size: 11px;
            min-height: 24px;
            cursor: pointer;
            appearance: auto;
            -webkit-appearance: auto;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            width: auto !important;
            height: auto !important;
            min-width: 70px !important;
            flex: 1 1 auto !important;
        }
        .card-head select option {
            background: #ffffff !important;
            color: #000000 !important;
            padding: 4px;
        }
        .card-head select:focus {
            outline: 2px solid #d4af37;
            outline-offset: 1px;
        }
        /* ──────────────── */

        .card-head .coach-input{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:4px;padding:0 6px;font-size:9px;width:50px;min-height:20px}
        .card-head .coach-input::placeholder{color:rgba(255,255,255,0.4)}
        .card-head .poss-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:4px;padding:0 6px;font-size:10px;cursor:pointer;min-height:22px}
        .card-head .poss-btn.active{background:#d4af37;color:#000;border-color:#d4af37}

        /* ── UNIT TABS ── */
        .unit-tabs{display:flex;gap:2px;padding:1px 4px;border-bottom:1px solid #cbd5e1;flex-shrink:0}
        .unit-tab{padding:1px 6px;font-size:8px;font-weight:700;background:rgba(0,0,0,0.04);border:none;color:inherit;cursor:pointer;border-radius:3px}
        .unit-tab.active{background:#d4af37;color:#000}

        /* ── SEARCH ── */
        .search-bar{display:flex;padding:1px 4px;border-bottom:1px solid #cbd5e1}
        .search-bar input{flex:1;border:1px solid #cbd5e1;border-radius:3px;padding:0 4px;font-size:9px;min-height:20px}

        /* ── PLAYER LIST ── */
        .player-list-header,.player-row{display:grid;grid-template-columns:16px 24px 1fr 44px 36px 22px 22px 18px;gap:1px;align-items:center;padding:1px 4px;font-size:11px}
        .player-list-header{font-size:7px;font-weight:700;text-transform:uppercase;opacity:0.35;border-bottom:1px solid #cbd5e1;min-height:16px}
        .player-list-body{flex:1;overflow-y:auto;padding:1px 0}
        .player-row{border-bottom:1px solid rgba(0,0,0,0.04);min-height:22px}
        .player-row.starter{background:rgba(212,175,55,0.07)}
        .player-row.pinned{background:rgba(255,215,0,0.05);border-left:2px solid #d4af37}
        .plyr-num{font-weight:700;font-size:12px;text-align:center}
        .plyr-name input,.plyr-pron input{background:transparent;border:none;padding:0 2px;font-size:11px;width:100%;color:inherit}
        .plyr-name input{font-weight:600}
        .plyr-pron input{font-style:italic;font-size:9px;opacity:0.7}
        .plyr-pos select{background:transparent;border:none;font-size:9px;font-weight:700;width:100%;cursor:pointer;color:inherit}
        .plyr-pos select option{background:#fff;color:#000}
        .st-toggle{background:none;border:2px solid #d4af37;border-radius:50%;width:16px;height:16px;font-size:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#d4af37}
        .st-toggle.off{border-color:#999;color:#999;opacity:0.4}
        .st-toggle:not(.off){background:#d4af37;color:#000}
        .pin-toggle{background:none;border:1px solid #999;border-radius:3px;width:16px;height:16px;font-size:7px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .pin-toggle.active{background:#d4af37;border-color:#d4af37;color:#000}
        .del-btn{background:none;border:none;color:#999;cursor:pointer;font-size:10px}
        .del-btn:hover{color:#dc2626}

        /* ── ADD ROW ── */
        .add-row{display:flex;gap:2px;padding:1px 4px;border-top:1px solid #cbd5e1;flex-shrink:0;flex-wrap:wrap;background:#fff}
        .add-row input,.add-row select{font-size:9px;padding:0 4px;border:1px solid #cbd5e1;border-radius:3px;min-height:20px}
        .add-row input{flex:1;min-width:28px}
        .add-row button{background:#d4af37;border:none;border-radius:3px;padding:0 8px;font-weight:700;font-size:11px;cursor:pointer;min-height:20px}

        /* ── GAME CONTROLS ── */
        .game-controls{display:flex;gap:2px;padding:1px 4px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:1px;flex-shrink:0}
        .game-controls .btn-sm{font-size:8px;padding:0 5px;min-height:18px;min-width:18px;border-radius:3px;border:none;cursor:pointer;font-weight:600}
        .game-controls .btn-sm.green{background:#22c55e;color:#000}
        .game-controls .btn-sm.red{background:#dc2626;color:#fff}
        .game-controls .btn-sm.gray{background:#666;color:#fff}
        .game-controls .btn-sm.gold{background:#f59e0b;color:#000}
        .game-controls input{width:24px;padding:0 2px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;text-align:center;min-height:18px}
        .game-controls span{font-size:9px;font-weight:600}

        /* ── PANELS ── */
        .panel{background:#fff;border-radius:6px;padding:8px;overflow-y:auto;width:100%;height:100%;border:1px solid #cbd5e1}
        .panel h3{font-size:14px;margin-bottom:6px}
        .roster-layout{display:grid;grid-template-columns:150px 1fr;gap:6px;height:100%}
        .team-sidebar{background:#fff;border-radius:6px;padding:6px;overflow-y:auto;border:1px solid #cbd5e1}
        .team-item{padding:3px 8px;border-radius:4px;margin-bottom:2px;cursor:pointer;font-size:11px;font-weight:600}
        .team-item.active{background:#d4af37;color:#000}
        .roster-workspace{background:#fff;border-radius:6px;padding:6px;overflow-y:auto;border:1px solid #cbd5e1}
        .player-edit-row{display:grid;grid-template-columns:28px 1fr 44px 36px 1fr 36px 24px;gap:2px;margin-bottom:2px;align-items:center}
        .player-edit-row input,.player-edit-row select{font-size:10px;padding:0 4px;border:1px solid #cbd5e1;border-radius:3px;min-height:20px}
        .player-edit-row button{background:#dc2626;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px;min-height:20px}
        .bulk-area{width:100%;min-height:50px;font-family:monospace;font-size:10px;padding:4px;border:1px solid #cbd5e1;border-radius:4px;resize:vertical;margin-top:4px}
        .script-area{width:100%;height:calc(100% - 60px);min-height:150px;font-family:monospace;font-size:13px;padding:8px;border:1px solid #cbd5e1;border-radius:4px;resize:none}

        /* ── GAME LOG TAB ── */
        .log-container{display:flex;flex-direction:column;height:100%;gap:6px}
        .log-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid #cbd5e1}
        .log-header input{flex:1;min-width:150px;padding:4px 8px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px;font-weight:700}
        .log-header .log-actions{display:flex;gap:4px;flex-wrap:wrap}
        .log-header .log-actions button{padding:3px 10px;border-radius:4px;border:none;font-weight:600;font-size:10px;cursor:pointer}
        .log-header .log-actions .save{background:#e6a817;color:#000}
        .log-header .log-actions .print{background:#3b82f6;color:#fff}
        .log-header .log-actions .export{background:#2e7d32;color:#fff}
        .log-body{flex:1;overflow-y:auto;border:1px solid #cbd5e1;border-radius:4px;padding:4px 8px;background:#fff;font-size:12px;font-family:'Courier New',monospace;line-height:1.6}
        .log-body .entry{padding:2px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
        .log-body .entry .time{color:#d4af37;font-weight:700;margin-right:8px}
        .log-body .empty{opacity:0.4;text-align:center;padding:20px;font-style:italic}
        .log-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 8px;background:rgba(0,0,0,0.03);border-radius:4px;border:1px solid #cbd5e1;font-size:11px}
        .log-summary .stat{display:flex;justify-content:space-between;padding:2px 0}
        .log-summary .stat .label{font-weight:600;opacity:0.6}
        .log-summary .stat .value{font-weight:700}

        /* ── ADMIN ── */
        .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .admin-card{border:1px solid #cbd5e1;border-radius:6px;padding:8px;background:#fff}
        .admin-card h4{font-size:11px;margin-bottom:4px}
        .admin-card button{padding:2px 10px;border-radius:4px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:10px;min-height:24px}
        .admin-card button:hover{background:rgba(0,0,0,0.04)}
        .admin-card .btn-gold{background:#e6a817;border-color:#e6a817;color:#000;font-weight:700}
        .admin-card .btn-success{background:#2e7d32;border-color:#2e7d32;color:#fff}
        .admin-card .btn-danger{background:#dc2626;border-color:#dc2626;color:#fff}
        .admin-card .theme-btns{display:flex;gap:4px;flex-wrap:wrap}

        /* ── TOAST ── */
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:4px 16px;border-radius:16px;font-size:12px;opacity:0;transition:opacity 0.25s;z-index:999;pointer-events:none}
        .toast.show{opacity:1}

        /* ── FOOTER ── */
        footer{background:#0a0a1a;padding:2px 10px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #d4af37;color:#94a3b8;font-size:8px;flex-shrink:0;min-height:20px}
        footer .saved{color:#d4af37}

        /* ── RESPONSIVE ── */
        @media(max-width:900px){.game-grid{flex-direction:column}.roster-layout{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.log-summary{grid-template-columns:1fr}}
        @media(max-width:600px){header{min-height:36px;padding:2px 4px}.brand h1{font-size:11px}.clock{font-size:10px;min-width:44px;padding:1px 6px}.weather{font-size:8px;padding:1px 6px}.hdr-right button{font-size:8px;min-height:22px;min-width:22px;padding:1px 5px}.player-list-header,.player-row{grid-template-columns:12px 18px 1fr 32px 28px 18px 18px 16px;font-size:9px;padding:0 3px}.card-head select{font-size:9px;min-width:50px;min-height:20px}#scorebug-wrap{padding:1px 4px;min-height:30px}.sb-name{font-size:8px;min-width:24px}.sb-score{font-size:14px;min-width:20px}.sb-clock{font-size:11px;min-width:34px}.sb-btn{width:16px;height:16px;font-size:9px}.sb-cbtn{font-size:7px;height:16px;padding:0 3px}#eyeToggle{width:20px;height:20px;font-size:10px}.game-controls .btn-sm{font-size:7px;padding:0 4px;min-height:16px;min-width:16px}.game-controls input{width:20px;font-size:8px;min-height:16px}.game-controls span{font-size:8px}.log-header input{font-size:11px}.log-body{font-size:10px}}
    </style>
</head>
<body>
    <!-- ═══════ HEADER ═══════ -->
    <header>
        <div class="hdr-left">
            <a href="https://voiceofdfw.com">← VODFW</a>
            <div class="brand"><h1>🏈 FNL</h1><span>PA</span></div>
        </div>
        <div class="clock" id="wallClock">12:00</div>
        <div class="weather" id="weatherHeader">--°F</div>
        <div id="scorebug-wrap">
            <div class="sb-side">
                <span class="sb-name" id="sbAwayName">AWAY</span>
                <button class="sb-btn" onclick="chScore('away',-1)">−</button>
                <span class="sb-score" id="sbAwayScore">0</span>
                <button class="sb-btn plus" onclick="chScore('away',1)">+</button>
            </div>
            <div class="sb-center">
                <button class="sb-cbtn" onclick="chQuarter(-1)">◀</button>
                <span class="sb-qtr" id="sbQuarter">Q1</span>
                <button class="sb-cbtn" onclick="chQuarter(1)">▶</button>
                <span style="color:#666;margin:0 2px;">|</span>
                <span class="sb-clock" id="gameClockDisplay">25:00</span>
                <button class="sb-cbtn" onclick="setClockPreset()">⏳</button>
                <button class="sb-cbtn" onclick="startClock()">▶</button>
                <button class="sb-cbtn" onclick="pauseClock()">⏸</button>
                <button class="sb-cbtn red" onclick="resetClock()">↺</button>
            </div>
            <div class="sb-side">
                <button class="sb-btn plus" onclick="chScore('home',1)">+</button>
                <span class="sb-score" id="sbHomeScore">0</span>
                <button class="sb-btn" onclick="chScore('home',-1)">−</button>
                <span class="sb-name" id="sbHomeName">HOME</span>
            </div>
            <button id="eyeToggle" onclick="toggleScorebug()" title="Toggle scorebug visibility">👁️</button>
        </div>
        <div class="hdr-right">
            <button class="gold" onclick="saveToCloud()" title="Save all to cloud">💾</button>
            <button onclick="loadFromCloud()" title="Load all from cloud">📥</button>
            <button onclick="toggleOutdoor()" title="Toggle outdoor mode">☀️</button>
            <button onclick="cycleTheme()" title="Cycle themes">🎨</button>
            <button onclick="printLineup()" title="Print lineups">🖨️</button>
            <button onclick="exportBoxScore()" title="Export box score CSV">📊</button>
            <button class="red" id="resetBtn" title="Reset game">↺</button>
        </div>
    </header>

    <!-- ═══════ NAV ═══════ -->
    <nav id="mainNav">
        <button class="nav-link active" data-view="game">🏈 GAME</button>
        <button class="nav-link" data-view="rosters">📋 ROSTERS</button>
        <button class="nav-link" data-view="script">🎙️ SCRIPT</button>
        <button class="nav-link" data-view="log">📋 GAME LOG</button>
        <button class="nav-link" data-view="admin">⚙️ ADMIN</button>
    </nav>

    <!-- ═══════ MAIN ═══════ -->
    <main id="main"></main>

    <!-- ═══════ TOAST ═══════ -->
    <div class="toast" id="toast"></div>

    <!-- ═══════ FOOTER ═══════ -->
    <footer>
        <span>© Clayton Greenberg | VoiceofDFW.com</span>
        <span class="saved" id="ftSaved">Never saved</span>
    </footer>

    <script>
        // ─── CONFIG ────────────────────────────────────────────────────
        const CLOUD_URL = "https://lineup-api.claytongreenberg.workers.dev/api/lineup";
        const NAMESPACE = "fnl_";

            }];
        }

        // ─── STATE ────────────────────────────────────────────────────
        let state = {
            awayId: "49ers",
            homeId: "cowboys",
            awayScore: 0,
            homeScore: 0,
            quarter: 1,
            clockSeconds: 1500,
            clockRunning: false,
            down: 1,
            distance: 10,
            yardline: 50,
            possession: "home",
            view: "game",
            theme: "light",
            outdoor: false,
            awayFilter: "all",
            homeFilter: "all",
            script: "",
            gameLogs: [],
            gameLogName: "",
            gameLogAutoName: true,
            scorebugVisible: true
        };
        let teams = [];
        let currentTeamId = "";
        let currentView = "game";
        let themeIndex = 0;
        const THEMES = ["light", "dark", "navy"];

        // ─── HELPERS ──────────────────────────────────────────────────
        function getTeam(id) { return teams.find(t => t.id === id); }
        function getTeamBySide(side) { return getTeam(side === "away" ? state.awayId : state.homeId); }
        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
        function esc(s) { if (!s) return ""; return String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m]); }
        function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(el._timeout); el._timeout = setTimeout(() => el.classList.remove("show"), 2000); }

        // ─── SAVE / LOAD LOCAL ──────────────────────────────────────
        function saveLocal() {
            try { const data = { state, teams }; localStorage.setItem("fnl_data", JSON.stringify(data)); document.getElementById("ftSaved").textContent = "Saved " + new Date().toLocaleTimeString(); } catch (e) { console.warn("Save error:", e); }
        }
        function loadLocal() {
            try { const raw = localStorage.getItem("fnl_data"); if (raw) { const data = JSON.parse(raw); state = { ...state, ...data.state }; teams = data.teams || []; } } catch (e) { console.warn("Load error:", e); }
            if (!teams || teams.length === 0) { teams = getDefaultTeams(); state.awayId = teams[0]?.id || ""; state.homeId = teams[1]?.id || ""; currentTeamId = teams[0]?.id || ""; }
            teams.forEach(t => { if (!t.players) t.players = []; t.players.forEach(p => { if (p.pinned === undefined) p.pinned = false; if (p.pron === undefined) p.pron = ''; if (p.starter === undefined) p.starter = false; }); if (!t.coach) t.coach = ''; if (!t.color) t.color = '#1e3a5f'; });
            if (!getTeam(state.awayId)) state.awayId = teams[0]?.id || "";
            if (!getTeam(state.homeId)) state.homeId = teams[1]?.id || teams[0]?.id || "";
            if (!state.gameLogs) state.gameLogs = [];
            if (!state.gameLogName) state.gameLogName = generateLogName();
            if (state.gameLogAutoName === undefined) state.gameLogAutoName = true;
            if (state.scorebugVisible === undefined) state.scorebugVisible = true;
        }

        function generateLogName() {
            const away = getTeam(state.awayId);
            const home = getTeam(state.homeId);
            const d = new Date();
            const date = String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + d.getFullYear();
            return date + "_" + (away ? away.name : "Away") + " vs " + (home ? home.name : "Home");
        }

        // ─── CLOUD SYNC ──────────────────────────────────────────────
        async function saveToCloud() {
            toast("☁️ Saving to cloud...");
            try {
                const data = { state, teams };
                const resp = await fetch(CLOUD_URL + "?id=" + NAMESPACE + "full_sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                toast("✅ Saved to cloud!");
            } catch (e) { toast("❌ Cloud save failed: " + e.message); console.error(e); }
        }
        async function loadFromCloud() {
            if (!confirm("Load all data from cloud? This will replace your current data.")) return;
            toast("☁️ Loading from cloud...");
            try {
                const resp = await fetch(CLOUD_URL + "?id=" + NAMESPACE + "full_sync");
                if (!resp.ok) throw new Error("No cloud data found. Save first.");
                const data = await resp.json();
                state = { ...state, ...data.state };
                teams = data.teams || teams;
                saveLocal();
                applyTheme(state.theme);
                if (state.outdoor) document.body.classList.add("outdoor");
                renderAll();
                toast("✅ Loaded from cloud!");
            } catch (e) { toast("❌ Cloud load failed: " + e.message); console.error(e); }
        }

        // ─── THEME ────────────────────────────────────────────────────
        function applyTheme(theme) { state.theme = theme; document.body.classList.remove("dark", "navy"); if (theme === "dark") document.body.classList.add("dark"); if (theme === "navy") document.body.classList.add("navy"); saveLocal(); }
        function cycleTheme() { themeIndex = (themeIndex + 1) % THEMES.length; applyTheme(THEMES[themeIndex]); }
        function toggleOutdoor() { state.outdoor = !state.outdoor; document.body.classList.toggle("outdoor", state.outdoor); saveLocal(); }

        // ─── CLOCK ────────────────────────────────────────────────────
        function updateWallClock() { const n = new Date(); document.getElementById("wallClock").textContent = n.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
        setInterval(updateWallClock, 10000);
        updateWallClock();
        function displayClock() { const el = document.getElementById("gameClockDisplay"); const s = state.clockSeconds; const m = Math.floor(s / 60); const sec = s % 60; el.textContent = String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0"); }
        function setClockPreset() {
            const input = prompt("Enter minutes (or preset: 1=Q1, 2=Q2, 3=Half, 4=OT, 5=2min):");
            if (!input) return;
            const num = parseInt(input);
            if (!isNaN(num) && num > 0) { state.clockSeconds = num * 60; displayClock(); saveLocal(); return; }
            const presets = { "1": 720, "2": 720, "3": 1440, "4": 600, "5": 120 };
            if (presets[input]) { state.clockSeconds = presets[input]; displayClock(); saveLocal(); }
        }
        function startClock() { state.clockRunning = true; saveLocal(); }
        function pauseClock() { state.clockRunning = false; saveLocal(); }
        function resetClock() { state.clockRunning = false; state.clockSeconds = 0; displayClock(); saveLocal(); }

        setInterval(() => {
            if (state.clockRunning && state.clockSeconds > 0) {
                state.clockSeconds--;
                displayClock();
                if (state.clockSeconds === 0) { state.clockRunning = false; toast("⏰ Time expired!"); addLogEntry("⏰ Time expired in Q" + state.quarter); }
            }
        }, 1000);

        // ─── SCORE ────────────────────────────────────────────────────
        function chScore(side, d) { if (side === "away") state.awayScore = Math.max(0, state.awayScore + d); else state.homeScore = Math.max(0, state.homeScore + d); updateScorebug(); saveLocal(); }
        function chQuarter(d) { const oldQ = state.quarter; state.quarter = Math.min(4, Math.max(1, state.quarter + d)); if (state.quarter !== oldQ) { addLogEntry("⏰ Q" + state.quarter + " started"); } updateScorebug(); saveLocal(); }
        function updateScorebug() {
            const away = getTeam(state.awayId);
            const home = getTeam(state.homeId);
            document.getElementById("sbAwayName").textContent = away ? away.name.substring(0, 6).toUpperCase() : "AWAY";
            document.getElementById("sbHomeName").textContent = home ? home.name.substring(0, 6).toUpperCase() : "HOME";
            document.getElementById("sbAwayScore").textContent = state.awayScore;
            document.getElementById("sbHomeScore").textContent = state.homeScore;
            document.getElementById("sbQuarter").textContent = "Q" + state.quarter;
            displayClock();
            if (state.gameLogAutoName) { state.gameLogName = generateLogName(); }
        }
        function toggleScorebug() { const wrap = document.getElementById("scorebug-wrap"); state.scorebugVisible = !state.scorebugVisible; wrap.classList.toggle("hidden", !state.scorebugVisible); saveLocal(); }

        // ─── GAME LOG ──────────────────────────────────────────────────
        function addLogEntry(text) { const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); state.gameLogs.push({ id: genId(), time: time, text: text, quarter: state.quarter, timestamp: Date.now() }); if (state.gameLogs.length > 500) state.gameLogs.shift(); saveLocal(); if (currentView === "log") renderLogTab(); }
        function clearLog() { if (!confirm("Clear the game log?")) return; state.gameLogs = []; saveLocal(); renderLogTab(); toast("Log cleared"); }
        function printLog() { const w = window.open("", "_blank"); const away = getTeam(state.awayId)?.name || "Away"; const home = getTeam(state.homeId)?.name || "Home"; let html = "<html><head><title>Game Log</title><style>body{font-family:monospace;padding:20px;font-size:12px}h1{font-size:18px}.entry{padding:2px 0;border-bottom:1px solid #eee}.time{color:#d4af37;font-weight:700;margin-right:10px}</style></head><body>"; html += "<h1>📋 " + esc(state.gameLogName) + "</h1>"; html += "<p>" + away + " " + state.awayScore + " - " + state.homeScore + " " + home + " | Q" + state.quarter + "</p><hr>"; state.gameLogs.forEach(e => { html += "<div class='entry'><span class='time'>" + esc(e.time) + " Q" + e.quarter + "</span>" + esc(e.text) + "</div>"; }); if (!state.gameLogs.length) html += "<p>No entries yet</p>"; html += "</body></html>"; w.document.write(html); w.document.close(); setTimeout(() => w.print(), 500); }
        function exportLogCSV() { let csv = "Time,Quarter,Event\n"; state.gameLogs.forEach(e => { csv += '"' + e.time + '","Q' + e.quarter + '","' + e.text.replace(/"/g, '""') + '"\n'; }); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = (state.gameLogName || "game_log") + ".csv"; a.click(); toast("📊 Log exported"); }
        async function saveLogToCloud() {
            if (!state.gameLogName.trim()) { toast("Please enter a game name"); return; }
            toast("☁️ Saving game log...");
            try {
                const logData = { name: state.gameLogName, entries: state.gameLogs, away: getTeam(state.awayId)?.name || "Away", home: getTeam(state.homeId)?.name || "Home", awayScore: state.awayScore, homeScore: state.homeScore, quarter: state.quarter, timestamp: new Date().toISOString() };
                const id = NAMESPACE + "log_" + encodeURIComponent(state.gameLogName);
                const resp = await fetch(CLOUD_URL + "?id=" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(logData) });
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                toast("✅ Game log saved to cloud!");
            } catch (e) { toast("❌ Log save failed: " + e.message); console.error(e); }
        }
        async function loadLogFromCloud() {
            const name = prompt("Enter the game log name to load:", state.gameLogName || "");
            if (!name) return;
            toast("☁️ Loading game log...");
            try {
                const id = NAMESPACE + "log_" + encodeURIComponent(name);
                const resp = await fetch(CLOUD_URL + "?id=" + id);
                if (!resp.ok) throw new Error("Not found");
                const data = await resp.json();
                state.gameLogName = data.name || name;
                state.gameLogs = data.entries || [];
                state.gameLogAutoName = false;
                saveLocal();
                renderLogTab();
                toast("✅ Game log loaded!");
            } catch (e) { toast("❌ Log load failed: " + e.message); console.error(e); }
        }
        async function listLogs() {
            try {
                const resp = await fetch(CLOUD_URL + "?list=true");
                if (!resp.ok) throw new Error("Failed to list");
                const data = await resp.json();
                const keys = (data.keys || []).filter(k => k.startsWith(NAMESPACE + "log_"));
                if (!keys.length) { toast("No saved game logs found"); return; }
                const names = keys.map(k => decodeURIComponent(k.replace(NAMESPACE + "log_", "")));
                alert("📋 Saved Game Logs:\n\n" + names.join("\n"));
            } catch (e) { toast("❌ Failed to list logs: " + e.message); console.error(e); }
        }

        // ─── QUICK ACTIONS ──────────────────────────────────────────
        function quickScore(team, type, pts) {
            const player = prompt("Scorer (or leave blank):") || "";
            chScore(team, pts);
            const teamName = team === "home" ? getTeam(state.homeId)?.name || "HOME" : getTeam(state.awayId)?.name || "AWAY";
            addLogEntry("🏈 " + teamName + " " + type + (player ? " by " + player : "") + " (" + pts + " pts)");
            saveLocal();
            renderAll();
        }
        function quickPenalty(team, type, yards) {
            const player = prompt("Player (or leave blank):") || "";
            const teamName = team === "home" ? getTeam(state.homeId)?.name || "HOME" : getTeam(state.awayId)?.name || "AWAY";
            addLogEntry("⚖️ Penalty: " + teamName + " " + type + (yards ? " " + yards + " yds" : "") + (player ? " on " + player : ""));
            saveLocal();
            renderAll();
        }

        // ─── GAME CONTROLS ──────────────────────────────────────────
        function startGame() { if (state.clockSeconds === 0) state.clockSeconds = 1440; state.clockRunning = true; addLogEntry("🏈 Game started!"); toast("🏈 Game started!"); saveLocal(); renderAll(); }
        function startSecondHalf() { state.clockSeconds = 1440; state.clockRunning = true; addLogEntry("🏈 Second half started!"); toast("🏈 Second half!"); saveLocal(); renderAll(); }
        function endGame() { if (!confirm("Mark game as final?")) return; state.clockRunning = false; addLogEntry("🏆 Game final! " + getTeam(state.awayId)?.name + " " + state.awayScore + " - " + state.homeScore + " " + getTeam(state.homeId)?.name); toast("🏆 Game final!"); saveLocal(); renderAll(); }
        function resetGame() {
            if (!confirm("Reset everything?")) return;
            state.awayScore = 0;
            state.homeScore = 0;
            state.quarter = 1;
            state.clockSeconds = 0;
            state.clockRunning = false;
            state.down = 1;
            state.distance = 10;
            state.yardline = 50;
            state.gameLogs = [];
            state.gameLogName = generateLogName();
            state.gameLogAutoName = true;
            teams.forEach(t => t.players.forEach(p => { p.starter = false;
                p.pinned = false; }));
            addLogEntry("🔄 Game reset");
            saveLocal();
            renderAll();
            toast("🔄 Reset");
        }
        function setDown(d) { state.down = d;
            saveLocal();
            renderAll(); }
        function setDistance(d) { state.distance = parseInt(d) || 10;
            saveLocal();
            renderAll(); }
        function setYardline(d) { state.yardline = parseInt(d) || 50;
            saveLocal();
            renderAll(); }
        function setPossession(side) { state.possession = side;
            saveLocal();
            renderAll(); }

        // ─── PLAYER FUNCTIONS ──────────────────────────────────────
        function togglePin(side, pid) {
            const team = getTeamBySide(side);
            if (!team) return;
            const p = team.players.find(x => x.id === pid);
            if (!p) return;
            const pinnedCount = team.players.filter(x => x.pinned).length;
            if (!p.pinned && pinnedCount >= 6) { toast("Max 6 pinned"); return; }
            p.pinned = !p.pinned;
            saveLocal();
            renderGame();
        }
        function toggleStarter(side, pid) {
            const team = getTeamBySide(side);
            if (!team) return;
            const p = team.players.find(x => x.id === pid);
            if (!p) return;
            p.starter = !p.starter;
            saveLocal();
            renderGame();
        }
        function deletePlayer(side, pid) {
            if (!confirm("Delete this player?")) return;
            const team = getTeamBySide(side);
            if (!team) return;
            team.players = team.players.filter(x => x.id !== pid);
            saveLocal();
            renderGame();
        }
        function addPlayer(side) {
            const team = getTeamBySide(side);
            if (!team) return;
            const num = document.getElementById("an-" + side)?.value || "";
            const name = document.getElementById("ana-" + side)?.value || "";
            const pos = document.getElementById("ap-" + side)?.value || "QB";
            if (!name) { toast("Enter name"); return; }
            team.players.push({ id: genId(), num: num, name: name, pos: pos, starter: false, pinned: false, pron: "" });
            document.getElementById("an-" + side).value = "";
            document.getElementById("ana-" + side).value = "";
            saveLocal();
            renderGame();
            toast(name + " added");
        }
        function updatePlayer(side, pid, field, value) {
            const team = getTeamBySide(side);
            if (!team) return;
            const p = team.players.find(x => x.id === pid);
            if (!p) return;
            p[field] = value;
            saveLocal();
        }
        function searchPlayers(side, q) {
            const rows = document.querySelectorAll(".player-row[data-side='" + side + "']");
            rows.forEach(r => r.style.background = "");
            const num = q.trim();
            if (!num) return;
            rows.forEach(r => { if (r.dataset.num === num) r.style.background = "rgba(212,175,55,0.2)"; });
        }

        // ─── SWITCH TEAM ────────────────────────────────────────────
        function switchTeam(side, tid) { if (side === "away") state.awayId = tid; else state.homeId = tid; if (state.gameLogAutoName) { state.gameLogName = generateLogName(); } saveLocal(); renderAll(); }
        function setFilter(side, filter) { if (side === "away") state.awayFilter = filter; else state.homeFilter = filter; renderGame(); }
        function updateCoach(side, name) { const team = getTeamBySide(side); if (team) { team.coach = name;
                saveLocal(); } }

        // ─── RENDER: GAME ──────────────────────────────────────────
        function renderGame() {
            const posOpts = ["QB", "RB", "WR", "TE", "OL", "G", "T", "C", "DE", "DT", "LB", "CB", "S", "DB", "K", "P"];
            let html = `<div class="game-grid">`;
            html += `<div style="display:flex;flex-direction:column;width:100%;gap:1px;">`;
            html += `<div class="game-controls"><span>🏈</span><button class="btn-sm green" onclick="startGame()">Start</button><button class="btn-sm gold" onclick="startSecondHalf()">2nd</button><button class="btn-sm red" onclick="endGame()">Final</button><button class="btn-sm gray" onclick="resetGame()">↺</button><span class="sep">|</span><span>D:</span><button class="btn-sm" onclick="setDown(1)" style="background:#e2e8f0;">1</button><button class="btn-sm" onclick="setDown(2)" style="background:#e2e8f0;">2</button><button class="btn-sm" onclick="setDown(3)" style="background:#e2e8f0;">3</button><button class="btn-sm" onclick="setDown(4)" style="background:#e2e8f0;">4</button><span style="min-width:14px;text-align:center;font-weight:900;">${state.down}</span><span>📏</span><input type="number" value="${state.distance}" onchange="setDistance(this.value)"><span>📍</span><input type="number" value="${state.yardline}" onchange="setYardline(this.value)"><span>🏈</span><button class="btn-sm ${state.possession==='home'?'green':''}" onclick="setPossession('home')" style="${state.possession==='home'?'background:#22c55e;color:#000;':''}">H</button><button class="btn-sm ${state.possession==='away'?'green':''}" onclick="setPossession('away')" style="${state.possession==='away'?'background:#22c55e;color:#000;':''}">A</button></div>`;
            html += `<div class="game-controls" style="gap:1px;"><span>⭐</span><button class="btn-sm green" onclick="quickScore('home','TD',6)" style="font-size:7px;">TD+6</button><button class="btn-sm blue" onclick="quickScore('away','TD',6)" style="font-size:7px;">TD+6</button><button class="btn-sm gold" onclick="quickScore('home','FG',3)" style="font-size:7px;">FG+3</button><button class="btn-sm gold" onclick="quickScore('away','FG',3)" style="font-size:7px;">FG+3</button><button class="btn-sm" onclick="quickScore('home','PAT',1)" style="font-size:7px;">+1</button><button class="btn-sm" onclick="quickScore('away','PAT',1)" style="font-size:7px;">+1</button><button class="btn-sm" onclick="quickScore('home','Safety',2)" style="background:#dc2626;color:#fff;font-size:7px;">S+2</button><button class="btn-sm" onclick="quickScore('away','Safety',2)" style="background:#dc2626;color:#fff;font-size:7px;">S+2</button><span class="sep">|</span><span>⚖️</span><button class="btn-sm gold" onclick="quickPenalty('home','Holding',10)" style="font-size:7px;">Hold</button><button class="btn-sm gold" onclick="quickPenalty('away','Holding',10)" style="font-size:7px;">Hold</button><button class="btn-sm" onclick="quickPenalty('home','False Start',5)" style="font-size:7px;">FS</button><button class="btn-sm" onclick="quickPenalty('away','False Start',5)" style="font-size:7px;">FS</button><button class="btn-sm red" onclick="quickPenalty('home','PI',15)" style="font-size:7px;">PI</button><button class="btn-sm red" onclick="quickPenalty('away','PI',15)" style="font-size:7px;">PI</button></div></div>`;

            ["away", "home"].forEach(side => {
                const team = getTeamBySide(side);

                let players = [];

                    players = [...team.players];
                    if (filter === "offense") players = players.filter(p => ["QB", "RB", "FB", "WR", "TE", "OL", "C", "G", "T"].includes(p.pos));
                    else if (filter === "defense") players = players.filter(p => ["DL", "DE", "DT", "LB", "OLB", "ILB", "CB", "S", "SS", "FS", "DB"].includes(p.pos));
                    else if (filter === "special") players = players.filter(p => ["K", "P", "LS", "KR", "PR"].includes(p.pos));
                    players.sort((a, b) => { if (a.pinned && !b.pinned) return -1; if (!a.pinned && b.pinned) return 1; return (parseInt(a.num) || 999) - (parseInt(b.num) || 999); });
                }
                const color = team ? team.color : (side === "away" ? "#1e3a5f" : "#7f1d1d");
                const coach = team ? team.coach : "";

                html += `<div class="team-card">`;
                html += `<div class="card-head" style="background:${color};"><span class="side-label">${side.toUpperCase()}</span>`;
                html += `<select onchange="switchTeam('${side}', this.value)">`;
                teams.forEach(t => { const sel = t.id === (side === "away" ? state.awayId : state.homeId) ? "selected" : ""; html += `<option value="${t.id}" ${sel}>${esc(t.name)}</option>`; });
                html += `</select>`;
                html += `<input class="coach-input" value="${esc(coach)}" placeholder="Coach" onchange="updateCoach('${side}', this.value)">`;
                html += `<button class="poss-btn ${state.possession===side?'active':''}" onclick="setPossession('${side}')">🏈</button></div>`;
                html += `<div class="unit-tabs">`;
                ["all", "offense", "defense", "special"].forEach(f => { const active = filter === f ? "active" : ""; html += `<button class="unit-tab ${active}" onclick="setFilter('${side}','${f}')">${f.toUpperCase()}</button>`; });
                html += `</div>`;
                html += `<div class="search-bar"><input placeholder="🔍 #" id="sch-${side}" oninput="searchPlayers('${side}', this.value)"></div>`;
                html += `<div class="player-list-header"><span></span><span>#</span><span>NAME</span><span>PRON</span><span>POS</span><span></span><span></span><span></span></div>`;
                html += `<div class="player-list-body">`;
                if (!players || !players.length) { html += `<div style="padding:6px;text-align:center;opacity:.4;font-size:10px;">No players</div>`; } else {
                    players.forEach(p => {
                        const starter = p.starter ? "starter" : "";
                        const pinned = p.pinned ? "pinned" : "";
                        html += `<div class="player-row ${starter} ${pinned}" data-side="${side}" data-num="${esc(p.num)}">`;
                        html += `<span></span><span class="plyr-num">${esc(p.num)}</span>`;
                        html += `<span class="plyr-name"><input value="${esc(p.name)}" onchange="updatePlayer('${side}','${p.id}','name',this.value)" placeholder="Name"></span>`;
                        html += `<span class="plyr-pron"><input value="${esc(p.pron||'')}" onchange="updatePlayer('${side}','${p.id}','pron',this.value)" placeholder="Pron"></span>`;
                        html += `<span class="plyr-pos"><select onchange="updatePlayer('${side}','${p.id}','pos',this.value)">`;
                        posOpts.forEach(o => html += `<option ${p.pos===o?'selected':''}>${o}</option>`);

        function bulkImport() {
            const text = document.getElementById("bulkImport").value.trim();
            if (!text) { toast("Paste players first"); return; }
            const ct = teams.find(t => t.id === currentTeamId);
            if (!ct) return;
            const lines = text.split("\n").filter(l => l.trim());
            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                let num = "",
                    name = "",
                    pos = "QB";
                if (parts.length >= 2 && /^\d+$/.test(parts[0])) {
                    num = parts[0];
                    const possiblePos = parts[parts.length - 1].toUpperCase();
                    if (["QB", "RB", "WR", "TE", "OL", "DL", "LB", "DB", "K", "P"].includes(possiblePos)) { pos = possiblePos;
                        name = parts.slice(1, -1).join(" "); } else { name = parts.slice(1).join(" "); }
                } else { name = parts.join(" "); }
                if (name) { ct.players.push({ id: genId(), num: num, name: name, pos: pos, starter: false, pinned: false, pron: "",
                        notes: "" }); }
            });
            saveLocal();
            renderRosters();
            toast("Imported " + lines.length + " players");

        // ─── EXPORT BOX SCORE ──────────────────────────────────────

            const away = getTeam(state.awayId);
            const home = getTeam(state.homeId);
            let csv = "Friday Night Live - Box Score\n";
            csv += `Date,${new Date().toLocaleDateString()}\n`;
            csv += `Away,${away?away.name:'Away'}\n`;
            csv += `Home,${home?home.name:'Home'}\n`;
            csv += `Score,${state.awayScore}-${state.homeScore}\n`;
            csv += `Quarter,${state.quarter}\n\n`;
            csv += "Team,Number,Name,Position,Starter\n";

                if (!team) return;
                team.players.forEach(p => { csv += `${side},${p.num},${p.name},${p.pos},${p.starter?'Yes':'No'}\n`; });

            const scores = state.gameLogs.filter(e => e.text.includes("TD") || e.text.includes("FG"));

                    el.style.alignItems = 'center';
                    el.style.gap = '4px';
                });
            }
            
            // Run immediately
            showDropdowns();
            
            // Run after DOM is ready
            if (document.readyState === 'complete') {
                setTimeout(showDropdowns, 50);
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(showDropdowns, 50);
                });
                window.addEventListener('load', function() {
                    setTimeout(showDropdowns, 100);
                });
            }
            
            // Run on any resize
            window.addEventListener('resize', showDropdowns);
            
            // Run after any potential re-render (watch for DOM changes)
            if (window.MutationObserver) {
                const observer = new MutationObserver(function() {
                    showDropdowns();
                });
                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: false
                });
            }
        })();
